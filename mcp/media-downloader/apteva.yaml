schema: apteva-app/v1

name: media-downloader
display_name: Media Downloader
version: 0.3.0
description: |
  Media download sidecar for public and authenticated sources supported by
  yt-dlp. Downloads use bounded concurrency and guarded public-network
  egress, stream completed files to storage, and keep sensitive YouTube,
  Patreon, and Instagram cookie profiles encrypted in the app database.
  Agents can search YouTube directly without a separate API key. v0.3.0
  adds complete source ingestion: normalized metadata, thumbnails, manual or
  automatic captions, typed Storage artifacts, and Media/Deepgram transcript
  fallback when source captions are unavailable.

author: Apteva
icon: /ui/icon.svg
icon_style: monochrome
tags: [media, video, audio, youtube, patreon, instagram, download, yt-dlp]
scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.apps.call
  apps:
    - { name: storage, optional: false }
    - { name: media, optional: false }
  binaries:
    - name: yt-dlp
      executables: [yt-dlp]
      required: true
    - name: ffmpeg
      executables: [ffmpeg, ffprobe]
      required: false
    - name: node
      executables: [node]
      required: false

provides:
  http_routes:
    - prefix: /
  ui_panels:
    - slot: project.page
      label: Downloads
      icon: download
      entry: /ui/MediaDownloaderPanel.mjs
  publishes:
    - name: download.created
      description: A media download job was queued.
      payload: { id: string, status: string, stage: string, progress: number }
    - name: download.started
      description: A queued media download acquired a worker and started.
      payload: { id: string, status: string, stage: string, progress: number }
    - name: download.stage
      description: A running download moved between download, processing, preparation, and upload stages.
      payload: { id: string, status: string, stage: string, progress: number }
    - name: download.progress
      description: Download progress changed.
      payload: { id: string, status: string, stage: string, progress: number }
    - name: download.cancel_requested
      description: Cancellation was requested for a running or queued download.
      payload: { id: string, status: string }
    - name: download.completed
      description: A download or ingestion completed and all outputs were stored.
      payload: { id: string, status: string, stage: string, storage_file_id: integer, storage_file_ids: array, storage_url: string, artifacts: array, metadata: object, warnings: array }
    - name: download.failed
      description: A download failed.
      payload: { id: string, status: string, stage: string, error: string }
    - name: download.canceled
      description: A download was canceled.
      payload: { id: string, status: string, stage: string, error: string }
    - name: profile.created
      description: An encrypted source profile was created.
      payload: { id: string, provider: string, status: string }
    - name: profile.validated
      description: A source profile validation finished.
      payload: { id: string, provider: string, status: string, last_error: string }
    - name: profile.deleted
      description: A source profile was deleted and its encrypted payload scrubbed.
      payload: { id: string }
  mcp_tools:
    - name: youtube_search
      description: Search YouTube without an API key and return normalized media candidates for probing or download.
    - name: download_probe_url
      description: Inspect a supported media URL with yt-dlp without downloading it.
    - name: download_media
      description: Start a yt-dlp download job and save the completed file into storage.
    - name: ingest_media
      description: Ingest one media URL with metadata, thumbnail, captions, media, and transcription fallback artifacts.
    - name: download_status
      description: Get current status, progress, typed artifacts, every Storage file ID, and recent logs for one download job.
    - name: download_list
      description: List recent download jobs.
    - name: download_cancel
      description: Cancel a running download job.
    - name: source_profile_create
      description: Store encrypted YouTube, Patreon, or Instagram cookies for authenticated downloads.
    - name: source_profile_list
      description: List source profiles without exposing their secret payloads.
    - name: source_profile_validate
      description: Validate a stored source profile against a URL using yt-dlp.
    - name: source_profile_delete
      description: Delete a source profile and prevent future use.

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/media-downloader
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/media-downloader.db
  migrations: migrations/

config_schema:
  - name: ytdlp_path
    type: text
    default: ""
    label: yt-dlp path
    description: Optional absolute path to yt-dlp. Leave blank to resolve it from PATH or bundled binary dependencies.
  - name: ffmpeg_path
    type: text
    default: ""
    label: ffmpeg path
    description: Optional absolute path to ffmpeg. yt-dlp uses this for format merges and audio extraction when available.
  - name: ytdlp_extra_args
    type: text
    default: ""
    label: yt-dlp extra args
    description: Optional whitespace-separated args passed to every yt-dlp call. Useful for YouTube challenge solving, for example --js-runtimes node:/opt/homebrew/bin/node.
  - name: youtube_player_client
    type: text
    default: "android"
    label: YouTube player client
    description: yt-dlp YouTube client selection for downloads without a source profile. android avoids current web-client SABR/403 failures for many public videos; authenticated cookie-profile downloads let yt-dlp choose a cookie-capable client.
  - name: max_download_mb
    type: text
    default: "512"
    label: Max download size MB
    description: yt-dlp rejects files over this limit and the output is checked again before upload.
  - name: max_concurrent_downloads
    type: text
    default: "2"
    label: Max concurrent downloads
    description: Number of yt-dlp jobs allowed to run at once. Additional jobs remain queued.
  - name: default_storage_folder
    type: text
    default: "/.downloads/media"
    label: Default storage folder
    description: Storage folder used when download_media does not pass folder.
  - name: default_visibility
    type: select
    options: [private, signed, public]
    default: private
    label: Default storage visibility
    description: Visibility applied to saved downloads unless overridden.
  - name: shared_secret
    type: secret
    default: ""
    label: Profile encryption secret
    description: Secret used to encrypt cookie profiles. MEDIA_DOWNLOADER_SECRET or APTEVA_SECRET may also provide it.
  - name: allow_plaintext_profiles
    type: boolean
    default: "false"
    label: Allow plaintext profiles
    description: Development escape hatch only. Keep false in production.
  - name: allowed_domains
    type: text
    default: ""
    label: Allowed domains
    description: Optional comma-separated host suffix allowlist. Empty allows any public HTTP(S) host.
  - name: blocked_domains
    type: text
    default: "localhost,127.0.0.1,::1"
    label: Blocked domains
    description: Comma-separated host suffix denylist applied before DNS/IP safety checks.
  - name: ingest_media_index_timeout_seconds
    type: number
    default: 90
    label: Media indexing timeout
    description: Seconds an ingestion waits for its fallback audio file to appear in Media before failing.
  - name: ingest_transcription_timeout_seconds
    type: number
    default: 900
    label: Ingestion transcription timeout
    description: Seconds an ingestion waits for Media/Deepgram transcription when source captions are unavailable.

upgrade_policy: auto-patch
