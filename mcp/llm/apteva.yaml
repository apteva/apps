schema: apteva-app/v1

name: llm
display_name: LLM Gateway
version: 0.6.0
description: |
  Managed AI API access for Apteva-hosted apps and agents. Provides an
  OpenAI-compatible tenant-safe gateway that routes text and image requests to configured
  model providers behind public model aliases, enforces project and subject policy
  including per-minute burst limits, streams provider responses live, and records raw
  token, request, upstream provider-cost, and customer-billed usage for orchestration
  and billing apps.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/llm
icon: /ui/icon.svg
icon_style: monochrome
tags: [llm, ai, gateway, openai-compatible, multimodal, vision, usage, billing, streaming]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.connections.read
    - platform.connections.read_credentials
    - platform.connections.execute
  integrations:
    - role: anthropic_provider
      kind: integration
      compatible_slugs: [anthropic-api]
      required: false
      label: "Anthropic provider"
    - role: fireworks_provider
      kind: integration
      compatible_slugs: [fireworks]
      required: false
      label: "Fireworks provider"
    - role: openai_provider
      kind: integration
      compatible_slugs: [openai-api]
      required: false
      label: "OpenAI provider"
    - role: openrouter_provider
      kind: integration
      compatible_slugs: [openrouter]
      required: false
      label: "OpenRouter provider"
    - role: opencode_go_provider
      kind: integration
      compatible_slugs: [opencode-go]
      required: false
      label: "OpenCode Go provider"
    - role: openai_codex_provider
      kind: integration
      compatible_slugs: [openai-codex]
      required: false
      label: "OpenAI Codex provider"
    - role: minimax_provider
      kind: integration
      compatible_slugs: [minimax-api]
      required: false
      label: "MiniMax provider"
    - role: z_ai_provider
      kind: integration
      compatible_slugs: [z-ai]
      required: false
      label: "Z.ai provider"
    - role: moonshot_ai_provider
      kind: integration
      compatible_slugs: [moonshot-ai]
      required: false
      label: "Moonshot AI provider"

provides:
  http_routes:
    - prefix: /
    - prefix: /v1/
      no_auth: true
  mcp_tools:
    - name: llm_chat_complete
      description: OpenAI-compatible text or image chat completion through the configured LLM gateway.
    - name: llm_models_list
      description: List models allowed by the current policy.
    - name: llm_models_sync
      description: Refresh discovered models from configured and bound providers.
    - name: llm_embeddings_create
      description: Create embeddings through an OpenAI-compatible configured provider.
    - name: llm_usage_get
      description: Return usage for a project, subject, or model in a monthly period.
    - name: llm_provider_configs_list
      description: List configured provider routes.
    - name: llm_provider_configs_upsert
      description: Create or update a provider route.
    - name: llm_provider_rates_list
      description: List provider-native model rates used for upstream cost calculation.
    - name: llm_provider_rates_upsert
      description: Create a manual provider rate override.
    - name: llm_provider_rates_delete
      description: Close an active provider rate while retaining history.
    - name: llm_provider_rates_refresh
      description: Refresh rates from provider model metadata and the built-in catalog.
    - name: llm_aliases_list
      description: List public model aliases and the backends they resolve to.
    - name: llm_aliases_upsert
      description: Create or update a public model alias and its ordered backend targets.
    - name: llm_aliases_delete
      description: Deprecate a public model alias while retaining usage history.
    - name: llm_prices_list
      description: List sell-side prices charged for public model aliases.
    - name: llm_prices_upsert
      description: Set the customer-facing price for a public model alias.
    - name: llm_prices_delete
      description: Close the active price for a public model alias.
    - name: llm_policy_get
      description: Return the project or subject policy.
    - name: llm_policy_set
      description: Replace the project or subject policy.
    - name: llm_tokens_create
      description: Issue an OpenAI-compatible bearer token for app, agent, project, or system access.
    - name: llm_tokens_list
      description: List issued LLM tokens without exposing token secrets.
    - name: llm_tokens_revoke
      description: Revoke an issued LLM token by token id, token value, or subject.
    - name: llm_subject_suspend
      description: Disable LLM access for a generic subject within a project.
    - name: llm_subject_resume
      description: Re-enable LLM access for a generic subject within a project.
  ui_panels:
    - slot: project.page
      label: LLM Gateway
      icon: brain-circuit
      entry: /ui/LLMPanel.mjs
  publishes:
    - name: llm.request.completed
      description: An LLM request completed and usage was recorded.
    - name: llm.request.failed
      description: An LLM request failed before or during provider execution.
    - name: llm.usage.recorded
      description: LLM usage was recorded.
    - name: llm.policy.limit_exceeded
      description: A request was denied because a project or subject usage limit was exceeded.
    - name: llm.provider.failed
      description: A provider route returned a retryable or terminal failure.

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/llm
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/llm.db
  migrations: migrations/

config_schema:
  - name: openai_api_key
    type: password
    label: OpenAI API key
  - name: anthropic_api_key
    type: password
    label: Anthropic API key
  - name: fireworks_api_key
    type: password
    label: Fireworks API key
  - name: openrouter_api_key
    type: password
    label: OpenRouter API key
  - name: minimax_api_key
    type: password
    label: MiniMax API key
  - name: z_ai_api_key
    type: password
    label: Z.ai API key
  - name: moonshot_ai_api_key
    type: password
    label: Moonshot AI API key

upgrade_policy: auto-patch
