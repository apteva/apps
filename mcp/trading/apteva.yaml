schema: apteva-app/v1

name: trading
display_name: Trading
version: 0.7.0
description: |
  Trading desk for Apteva agents. Multi-portfolio, multi-asset (equity,
  etf, crypto, polymarket prediction markets). Each portfolio runs in
  one of two modes:

    paper — deterministic in-process execution engine; no broker, no
            real money. The default. Useful for strategy work and dry
            runs.
    live  — orders route through a per-portfolio broker. The app supports
            Binance/Kraken/Coinbase/OKX/Bybit/Bitstamp (crypto), Alpaca (equity/etf/crypto),
            and Polymarket CLOB; each
            portfolio names its broker at creation via broker_slug.
            Bind a broker via Settings → Integrations to enable
            mode=live. Without any binding, every portfolio stays paper.

  Each portfolio has its own mandate, allowed asset classes, enforceable
  risk profile, high-water drawdown and daily-loss halts, and percentage
  performance objectives. Approval flow lives in the agent's directive (via
  channel-chat), not in this sidecar — keeps the trading surface
  focused on state, execution, market data, and audit log.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/trading
icon: /ui/icon.svg
icon_style: monochrome
tags: [trading, finance, agent, polymarket, crypto]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - platform.instances.read
    - net.egress                   # public market-data endpoints (Binance, Polymarket gamma-api)
    - platform.connections.execute # broker calls (live mode)
    - platform.connections.read    # discover bound brokers per slug — see brokers_list, brokerFor()
    - platform.connections.read_credentials # authenticated Alpaca market + trade WebSockets; credentials remain server-side/in-memory
    - platform.environments.read   # list/read backtest environments
    - platform.environments.call   # seed replay prices into an isolated trading app
    - platform.environments.manage # create/spawn/snapshot/destroy backtest environments
  integrations:
    # Optional. Bind one or more brokers to enable mode=live on new
    # portfolios. Each portfolio names its broker at creation via
    # broker_slug. Without any binding, every portfolio stays paper.
    #
    # Adding a new broker = drop a new adapter file in the sidecar
    # implementing brokerAdapter + a one-line addition to
    # compatible_slugs here.
    - role: broker
      kind: integration
      required: false
      compatible_slugs: [binance-trading, kraken, coinbase, okx, bybit, bitstamp, alpaca-trading, polymarket-clob]
      capabilities:
        - order.place
        - order.cancel
        - order.status
        - account.summary
        - positions.list
      tools:
        order.place:     create_order
        order.cancel:    cancel_order
        order.status:    get_order
        account.summary: get_account
        positions.list:  list_positions  # alpaca-only; crypto spot exchanges usually return holdings in account/balance; polymarket-clob has no positions endpoint
      label: "Broker (optional — enables live trading)"
      hint: "Bind Binance, Kraken, Coinbase, OKX, Bybit, or Bitstamp (crypto), Alpaca (equity/etf/crypto), or Polymarket-CLOB (prediction markets). Portfolios pick a broker at creation."
    # Optional market-data integration. Required to trade equity/etf live
    # with real-time prices (pre-trade cash check + position MTM). Same
    # API key as alpaca-trading; bind both for a fully-live equity
    # workflow. Without it, Yahoo Finance is used as the unauthenticated
    # real-data fallback. Provider failures never produce synthetic marks.
    - role: market_data_equity
      kind: integration
      required: false
      compatible_slugs: [alpaca-market-data, yahoo-finance]
      capabilities:
        - quotes.equity
        - bars.equity
        - latest_quotes.equity
      tools:
        quotes.equity: stock_snapshots
        bars.equity: stock_bars
        latest_quotes.equity: stock_latest_quotes
      label: "Market Data — Equity (optional — real prices for live equity portfolios)"
      hint: "Bind alpaca-market-data for paid-tier real-time. yahoo-finance works without auth as a free fallback — the trading sidecar already uses Yahoo automatically when nothing's bound here."
    - role: reference_actions
      kind: integration
      required: false
      compatible_slugs: [alpaca-market-data]
      capabilities: [reference.corporate_actions]
      tools:
        reference.corporate_actions: corporate_actions
      label: "Reference Data — Corporate Actions"
      hint: "Uses Alpaca's revisioned corporate-actions dataset for splits, dividends, mergers, spinoffs, symbol changes, removals, rights, and distributions."
    - role: reference_broker
      kind: integration
      required: false
      compatible_slugs: [alpaca-trading]
      capabilities: [reference.assets, reference.calendar, reference.account_activities]
      tools:
        reference.assets: list_assets
        reference.calendar: get_calendar
        reference.account_activities: list_activities
      label: "Reference Data — Assets, Sessions, and Account Effects"

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: portfolio_create
      description: "Create a new paper or live portfolio. Live portfolios pass broker_slug — use brokers_list to enumerate."
    - name: brokers_list
      description: "Enumerate registered broker adapters and their currently-bound connections."
    - name: portfolio_list
      description: "List portfolios visible to this agent."
    - name: portfolio_get
      description: "Snapshot of one portfolio (mandate, equity, cash, status, watchlist)."
    - name: risk_profiles_list
      description: "List built-in portfolio risk presets and enforced percentage limits."
    - name: portfolio_risk_get
      description: "Get a portfolio's resolved risk policy and current drawdown state."
    - name: portfolio_risk_update
      description: "Set an enforceable risk preset or custom percentage limits."
    - name: portfolio_objective_create
      description: "Create a native Trading percentage objective."
    - name: portfolio_objectives_list
      description: "List portfolio objectives with live progress."
    - name: portfolio_objective_update
      description: "Update or archive a Trading objective."
    - name: account_summary
      description: "Equity, cash, buying power, day and open P&L for one portfolio."
    - name: positions_list
      description: "Open positions for one portfolio."
    - name: orders_list
      description: "Working / filled / cancelled orders for one portfolio."
    - name: order_place
      description: "Place a paper order. Required rationale; subject to mandate + size cap + daily-loss halt."
    - name: order_cancel
      description: "Cancel a working order."
    - name: market_quote
      description: "Latest mark for a symbol — equity/crypto USD or polymarket YES/NO probabilities."
    - name: market_history
      description: "OHLCV bars or probability history for a symbol."
    - name: market_source
      description: "Report the live data source per asset class — provider name, errors_60s, staleness."
    - name: market_calendar
      description: "Return normalized exchange-calendar state and instrument metadata for a symbol."
    - name: reference_data_status
      description: "Report canonical reference-data coverage, checkpoints, and quality state."
    - name: security_resolve
      description: "Resolve symbols and names to stable security/listing identities at a point in time."
    - name: corporate_actions_list
      description: "List normalized latest-revision corporate actions."
    - name: exchange_sessions_list
      description: "List authoritative normalized exchange sessions."
    - name: watchlist_add
      description: "Track a symbol on a portfolio."
    - name: watchlist_remove
      description: "Stop tracking a symbol."
    - name: alert_create
      description: "Create a price/probability/PNL alert that wakes the agent on match."
    - name: journal_write
      description: "Append a thesis/rationale/note to a portfolio's journal."
    - name: journal_read
      description: "Read journal entries for a portfolio (recent or filtered by kind)."
    - name: portfolio_pause
      description: "Pause this portfolio (no new orders). Self-only — resume is human-only via REST."
    - name: portfolio_arm_live
      description: "Explicitly arm or disarm automated execution for a broker_live portfolio. Arming requires the exact LIVE MONEY confirmation."
    - name: strategy_create
      description: "Create a deterministic strategy definition with indicator/ranking/allocation rules."
    - name: strategy_update
      description: "Update a deterministic strategy; definition changes create a new version."
    - name: strategy_get
      description: "Fetch one saved deterministic strategy."
    - name: strategy_list
      description: "List saved deterministic strategies."
    - name: strategy_validate
      description: "Validate a deterministic strategy definition without saving it."
    - name: strategy_evaluate
      description: "Evaluate a saved strategy against current market data."
    - name: strategy_assign
      description: "Assign a saved strategy to a portfolio for strategy or hybrid control."
    - name: strategy_backtest_create
      description: "Create a deterministic strategy backtest using the existing backtest tables."
    - name: strategy_validate_backtest
      description: "Run fixed-parameter strategy validation with in-sample and out-of-sample backtests."
    - name: backtest_market_step
      description: "Internal backtest runner tool: load replay prices into an isolated environment."
  # Same shape as crm + storage: a panel mounted in the dashboard's
  # project page slot. The rich desk SPA at /ui/desk/dist/ is also
  # served through the platform proxy at
  # /api/apps/trading/ui/desk/dist/index.html — operators can link to
  # it directly; the SDK doesn't yet ship a `ui_pages` slot to surface
  # iframe-mounted top-level nav entries from `kind: source` apps.
  # When that lands the desk gets a one-line declaration here.
  ui_panels:
    - slot: project.page
      label: Trading
      icon: trending-up
      entry: /ui/TradingPanel.mjs
  # No prompt_fragments. Approval policy belongs in the operator's
  # per-instance directive; objective and numeric portfolio risk state are
  # native Trading domains. The MCP tool descriptions carry the
  # platform contract (rationale length, rejection codes, status
  # semantics); the agent learns the rest from structured rejections.

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/trading
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/trading.db
  migrations: migrations/

config_schema:
  - name: starting_cash
    type: text
    default: "100000"
    label: Starting paper cash (USD)
    description: Issued to every new portfolio at creation.
  - name: daily_loss_halt_pct
    type: text
    default: "5"
    label: Daily-loss halt %
    description: Portfolio is auto-paused when day P&L drops below −X%.
  - name: tick_seconds
    type: text
    default: "5"
    label: Mark refresh cadence (seconds)
    description: How often the paper engine re-marks open positions and tries to fill working orders.
  - name: alpaca_feed
    type: text
    default: "auto"
    label: Alpaca stock feed
    description: "auto negotiates the best entitlement; otherwise iex, sip, or delayed_sip. The active feed is always shown in the UI."
  - name: strict_broker_market_data
    type: text
    default: "true"
    label: Require broker-grade data for broker portfolios
    description: "When true, broker-backed equity execution never silently falls back to Yahoo marks."
  - name: backtest_max_market_rows
    type: text
    default: "500000"
    label: Backtest market-data row budget
    description: |
      Maximum captured OHLCV rows across all symbols in one backtest. The default supports
      a full year of 5-minute crypto data for four symbols, or decades of hourly data.
      Raise this only when the app has enough memory and disk for larger immutable replays.
  - name: reference_history_start
    type: text
    default: "2000-01-01"
    label: Reference-data history start
    description: Earliest process/session date requested during the Alpaca reference-data backfill.
  - name: pricing_provider
    type: text
    default: "live"
    label: Pricing provider
    description: |
      live — Binance public REST for crypto + Polymarket gamma-api for prediction markets.
             Equity/ETF use bound Alpaca market data, then Yahoo Finance. Live mode never uses synthetic data.
      mock — fully offline; deterministic walks for everything. Used by tests + air-gapped demos.
  - name: bootstrap_demo
    type: text
    default: "true"
    label: Auto-create a demo paper portfolio on first install
    description: |
      When true, on first boot of a project with zero portfolios, the app creates a "Demo Crypto"
      paper book with a starter watchlist + welcome journal entry. Set to "false" to keep the
      install empty (operator or agent creates everything by hand).
  - name: bootstrap_watchlist
    type: text
    default: "BTC-USD,ETH-USD,SOL-USD"
    label: Bootstrap watchlist (comma-separated)
    description: Symbols added to the demo book's watchlist when bootstrap_demo is on.

upgrade_policy: auto-patch
