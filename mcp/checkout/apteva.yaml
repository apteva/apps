schema: apteva-app/v1

name: checkout
display_name: Checkout
version: 0.3.1
description: |
  Cart + checkout flow. Customers add catalog prices to a cart, fill
  contact info, and convert into a billing invoice. v0.1.0 is the
  manual-payment path (creates a draft → open invoice in billing for
  wire / card-by-portal recording). v0.2.0 adds hosted and custom
  Stripe Checkout Sessions through Billing, with retry-safe invoice
  reuse and webhook-driven payment completion. v0.3.1 adds deferred
  Payment Element preparation before buyer identity is known, without
  prematurely creating customers, invoices, or PaymentIntents.

  Storefront blocks (add-to-cart, cart-summary, checkout-page) are
  added to the content app separately — checkout exposes the REST +
  MCP surface; content renders the buyer-facing HTML.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/checkout
icon: /ui/icon.svg
icon_style: monochrome
tags: [checkout, cart, commerce, ecommerce, storefront]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call         # calls catalog + billing
  apps:
    - name: catalog
      optional: false            # cart items reference catalog prices
    - name: billing
      optional: false            # checkout creates invoices for conversion
      version: ">=0.12.3"

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: cart_create
      description: Create or fetch an open cart for a session_token or customer_id. Returns cart_id and session_token.
    - name: cart_get
      description: Fetch a cart by id or session_token. Returns items + materialised totals.
    - name: cart_add_item
      description: Add a catalog price to a cart. Snapshots description/amount from the price.
    - name: cart_set_quantity
      description: Change an item's quantity. Setting 0 removes it.
    - name: cart_clear
      description: Remove all items from a cart.
    - name: checkout_start
      description: Lock a cart and create a checkout_session. Cart becomes immutable until session terminates.
    - name: checkout_update
      description: Capture or update email / name / addresses on a started session.
    - name: checkout_prepare
      description: Return browser-safe deferred Stripe Elements configuration without creating billing records.
    - name: checkout_bootstrap
      description: Restore durable checkout and cart state by session, cart, or recovery token.
    - name: checkout_advance
      description: Validate and persist transitions across information, shipping, and payment.
    - name: checkout_restart
      description: Replace an unfinished checkout with a fresh session for the same cart.
    - name: checkout_set_adjustments
      description: Replace frozen shipping, discount, tax, and adjustment metadata before payment.
    - name: checkout_pay
      description: |
        Submit the session for payment. Manual mode returns a finalized Billing
        invoice. Stripe mode returns either a hosted redirect URL or browser-safe
        Elements configuration, including deferred Payment Element confirmation,
        and reuses the same invoice on retries.
    - name: checkout_get
      description: Fetch a checkout_session by id, including the linked invoice_id when paid.
    - name: checkout_cancel
      description: Cancel a started or awaiting-payment session. Releases the cart back to open.
  ui_panels:
    - slot: project.page
      label: Checkout
      icon: shopping-cart
      entry: /ui/CheckoutPanel.mjs
  publishes:
    - name: checkout.step_changed
      description: A durable checkout moved to another step.
    - name: checkout.restarted
      description: An unfinished checkout was replaced with a fresh session.
    - name: checkout.expired
      description: A checkout session expired and its cart was released.
  workers:
    - name: checkout-expiration
      schedule: "@every 1m"
  skills:
    - name: how-to-use-checkout
      command: /checkout
      body_file: skills/how-to-use-checkout.md
      description: |
        Checkout's mental model — when to create a cart vs an invoice
        directly, what state transitions exist, how the catalog
        snapshot works. Triggers on: "cart", "checkout", "order",
        "buy", "convert".
      metadata:
        category: commerce

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: checkout/v0.3.1
    entry: mcp/checkout
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/checkout.db
  migrations: migrations/

config_schema:
  - name: cart_ttl_days
    type: text
    default: "30"
    label: Cart TTL (days)
    description: |
      Open guest carts older than this without activity get marked
      abandoned by the nightly worker. Logged-in carts (customer_id
      set) never expire.
  - name: session_ttl_minutes
    type: text
    default: "60"
    label: Checkout session TTL (minutes)
    description: |
      An awaiting-payment session that doesn't complete within this
      window is marked expired; the cart returns to 'open' so the
      buyer can try again.

upgrade_policy: auto-patch
