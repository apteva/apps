schema: apteva-app/v1
name: content-catalog
display_name: Content Catalog
version: 0.6.7
description: |
  Coordinate brands, production sessions, Storage assets, Media derivatives,
  optional Gigs, cloud hosting, and shared platform posts.
  Catalog assets can also carry generic purpose roles, output categories, favorites, tags, and one Patreon intent
  (unset, free, or paid) for filtering and coordination; labels never publish
  externally or modify Media.
  Storage owns bytes, Media owns processing, Gigs owns assignments, and Social
  owns posts. Hosting providers share one contract; Bunny Stream is the first.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/content-catalog
icon: /ui/icon.svg
icon_style: monochrome
tags: [media, production, publishing, catalog]
scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.connections.execute
  integrations:
    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.read]
      events: [file.checksum.ready]
      required: true
      label: Storage
    - role: media
      kind: app
      compatible_app_names: [media]
      capabilities: [media.read]
      events: [media.completed]
      required: false
      label: Media
    - role: gigs
      kind: app
      compatible_app_names: [gigs]
      capabilities: []
      required: false
      label: Gigs
    - role: video_host
      kind: integration
      mode: multiple
      compatible_slugs: [bunny-stream]
      capabilities: [video.fetch, video.get, collections.list, collections.create]
      required: false
      label: Video hosts
      hint: Bind one or more Bunny Stream connections. Each brand chooses a connection.

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: content_catalog_overview, description: "Counts of brands, sessions, assets, asset publications, and hosting work for the current project." }
    - { name: content_catalog_search, description: "Search linked sessions and assets with text including live Media descriptions, brand, purpose role, exact source asset and optional descendants, date, review, and per-platform availability filters. Follow next_cursor until empty. Read-only; no folder scan." }
    - { name: content_catalog_brands_create, description: "Create a brand and its Storage path policy. Optional Bunny connection and collection." }
    - { name: content_catalog_brands_list, description: "List brands in the current project." }
    - { name: content_catalog_brands_update, description: "Update a brand name, Storage root, or video host settings." }
    - { name: content_catalog_sessions_create, description: "Create a stable production session under an explicit brand." }
    - { name: content_catalog_sessions_list, description: "List sessions, optionally by brand." }
    - { name: content_catalog_sessions_get, description: "Get a session with linked assets and Gigs." }
    - { name: content_catalog_sessions_update, description: "Edit a session's title, notes, optional recording date, or session video-host collection override without moving Storage files." }
    - { name: content_catalog_sessions_link_gig, description: "Link an existing Gig to a session without changing the Gig." }
    - { name: content_catalog_assets_attach, description: "Attach an existing Storage file to a session after checking its file metadata. Never uploads or changes the file." }
    - { name: content_catalog_session_upload_target, description: "Get the session's exact Storage upload folder and bound Storage install ID. Does not scan or upload." }
    - { name: content_catalog_assets_attach_uploaded, description: "Attach an explicitly uploaded Storage file after verifying its exact session folder. Idempotent." }
    - { name: content_catalog_import_preview, description: "List reviewable Storage candidates under a brand root without changing any app data." }
    - { name: content_catalog_assets_list, description: "List session assets with current Media metadata and recorded source links, including parent names and session IDs." }
    - { name: content_catalog_assets_get, description: "Get an asset with source lineage, hosting, and publication records." }
    - { name: content_catalog_assets_link_source, description: "Record a derivative's source asset. Supports multiple source assets." }
    - { name: content_catalog_assets_review, description: "Set editorial review state on a Catalog asset." }
    - { name: content_catalog_assets_labels_update, description: "Set purpose role, generic output category, asset tags, Favorite, and Patreon intent (unset/free/paid) on up to 100 Catalog assets. Does not modify Media or publish externally." }
    - { name: content_catalog_asset_publications_list, description: "List the platform publication records on one asset." }
    - { name: content_catalog_asset_publications_record, description: "Create or update one asset's platform status with explicit evidence. Does not publish externally." }
    - { name: content_catalog_posts_list, description: "List posts shared by one or more assets, optionally filtered by session, asset, or brand." }
    - { name: content_catalog_posts_get, description: "Get a post and its member asset IDs." }
    - { name: content_catalog_posts_record, description: "Create or update a shared post and its asset membership with explicit publication evidence. Does not publish externally." }
    - { name: content_catalog_hosting_request, description: "REAL EXTERNAL HOSTING: persist an explicit upload request, wait for a verified checksum and resume after eligibility and destination checks. Supports an optional video title; otherwise uses Media title or session and filename. Creates/reuses a session collection if needed. Never publishes to Social or Patreon." }
    - { name: content_catalog_hosting_cancel, description: "Cancel a checksum-waiting hosting intent before upload. Cannot cancel a transfer already started." }
    - { name: content_catalog_hosting_check, description: "Read the video host's readiness for a hosting operation and update Catalog's observation." }
    - { name: content_catalog_hosting_link_existing, description: "Backfill a video asset with an already-hosted Bunny GUID using get_video only; verify library, collection, duration, and readiness without uploading." }
    - { name: content_catalog_hosting_list, description: "Read recorded progress and durable hosting intents for exactly one asset_id or session_id. Does not contact a provider or start an upload." }
    - { name: content_catalog_assets_archive, description: "Revision-checked reversible Catalog lifecycle operation; preserves files and IDs." }
    - { name: content_catalog_assets_move, description: "Revision-checked reversible Catalog lifecycle operation; preserves files and IDs." }
    - { name: content_catalog_assets_restore, description: "Revision-checked reversible Catalog lifecycle operation; preserves files and IDs." }
    - { name: content_catalog_sessions_archive, description: "Revision-checked reversible Catalog lifecycle operation; preserves files and IDs." }
    - { name: content_catalog_sessions_restore, description: "Revision-checked reversible Catalog lifecycle operation; preserves files and IDs." }
    - { name: content_catalog_assets_eligibility, description: "Read lifecycle eligibility for explicit asset or Storage file IDs; archived sessions block their assets." }
    - { name: content_catalog_lifecycle_history, description: "Read lifecycle eligibility/audit history." }
  workers:
    - { name: hosting-progress, schedule: "@every 15s" }
  ui_panels:
    - slot: project.page
      label: Content Catalog
      icon: gallery-vertical-end
      entry: /ui/ContentCatalogPanel.mjs
  publishes:
    - { name: content-catalog.lifecycle.changed, description: "Catalog archive, restore or session membership changed; queued agents must recheck eligibility." }
    - { name: content-catalog.session.created, description: "A production session was created." }
    - { name: content-catalog.asset.attached, description: "A Storage file was linked to a session." }
    - { name: content-catalog.hosting.updated, description: "A cloud hosting record changed state." }
    - { name: content-catalog.publication.observed, description: "A publication observation was recorded." }

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: content-catalog/v0.6.7
    entry: mcp/content-catalog
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/content-catalog.db
  migrations: migrations/

upgrade_policy: auto-patch
