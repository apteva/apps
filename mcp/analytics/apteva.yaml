schema: apteva-app/v1

name: analytics
display_name: Analytics
version: 0.8.5
description: |
  Generic event analytics for Apteva apps. Other apps call
  analytics_track to record typed events; analytics_query / count /
  top / topics surface aggregates over JSON props. Soft dependency:
  if analytics is uninstalled, callers' track calls fail silently and
  the rest of their flow continues.

  Each track emits an "event.recorded" event on the app bus
  (project-scoped), so live panels and other apps can react. The
  dashboard panel is real-time (subscribes via useAppEvents) with
  overview tiles, an events-per-day chart, top values for a props
  key, a live event feed, and filters by event type / app / props
  dimension.

  v0.4 adds static-site tracking, like a classic analytics snippet:
  mint a public write key from the panel's Tracking tab, drop the
  hosted tag.js <script> on any website, and page views + custom
  events flow into GET /collect (anonymous, key-gated, origin-
  allowlisted, rate-limited). The write key is write-only and bound to
  one project; the platform API key never touches the browser.

  v0.6 adds opt-in bus auto-capture: analytics subscribes to the
  platform's all-apps event firehose (GET /api/app-events/_all) and
  records what apps already emit via ctx.Emit — so no app needs a
  dependency on analytics to be measured. Off by default; toggle it,
  pick a mode (all / denylist / allowlist) + topic patterns + sample
  rate, in the panel's Capture tab.

  v0.7 adds saved live dashboards with stat, timeseries, top values,
  breakdown, and feed widgets. The first built-in template is Website
  Traffic for live page views, active sessions, top pages, devices,
  and recent activity.

  v0.8 adds an event catalog / tracking plan: event specs, typed
  property specs, validation modes, violation reporting, spec-driven
  auto upsert / rollup policies, and analytics_sum for summing numeric
  event properties.

  v0.8.1 fixes a Catalog load deadlock with the SDK's single SQLite
  connection runtime.

  v0.8.2 lets dashboard stat and timeseries widgets sum numeric event
  fields, so aggregate observations such as Patreon daily post views
  can chart total views per day instead of observation row counts.

  v0.8.3 adds dashboard-level filters, dynamic filter option discovery,
  filter-aware widget evaluation, and a Patreon Overview dashboard
  template with Page, Currency, and Window controls.

  v0.8.4 scopes agent MCP reads and writes to the platform-assigned
  current project, rejects mismatched project_id args, and adds
  current-project spec discovery / dry-run validation tools.

  v0.8.5 enforces the same project scope across HTTP APIs, makes
  policy upserts date-correct and transactional, rejects invalid
  numeric aggregates, batches dashboard refreshes, and improves
  responsive KPI/chart presentation with explicit errors and units.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/analytics
tags: [analytics, events, observability]

scopes: [global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app

provides:
  http_routes:
    - prefix: /
  permissions:
    - name: events.write
      description: Record events via analytics_track.
    - name: events.read
      description: Query events.
  mcp_tools:
    - name: analytics_track
      description: Record one event in the current project. Args event (required), props?, app?, user_id?, session_id?, ts? (unix ms — defaults to now). Project is assigned automatically from the calling agent; do not pass project_id. Returns the new event id or validation hints.
      requires: events.write
    - name: analytics_query
      description: Read current-project events with optional filters. Args app?, topic?, since?, until?, where? (map of "props.X" → value), group_by? (array of "props.X" keys), limit? (default 100, max 1000). Returns rows or aggregate buckets.
      requires: events.read
    - name: analytics_count
      description: Count current-project events matching filters. Args same as query minus group_by/limit. Returns {count}.
      requires: events.read
    - name: analytics_top
      description: Top-N values for a JSON props key in the current project. Args topic?, app?, by (required, e.g. "props.platform"), since?, until?, limit? (default 10). Returns [{value, count}].
      requires: events.read
    - name: analytics_topics
      description: List distinct (app, topic) pairs seen in the current project. Args app?. Returns [{app, topic, last_ts, count}].
      requires: events.read
    - name: analytics_sum
      description: Sum a numeric current-project event field/path. Args value (required, e.g. props.views), app?, topic?, since?, until?, where?, group_by?, limit?. Returns aggregate buckets with sum/count.
      requires: events.read
    - name: analytics_event_specs_list
      description: List current-project event specs with their property specs. Args app?, status?.
      requires: events.read
    - name: analytics_event_specs_for_app
      description: Show active current-project event specs for an app before tracking. Args app. Returns required properties, examples, and ingest/upsert policies.
      requires: events.read
    - name: analytics_event_spec_get
      description: Get one current-project event spec by id or by app/topic.
      requires: events.read
    - name: analytics_event_spec_upsert
      description: Create or update an event spec and optionally replace its properties and ingest policy.
      requires: events.write
    - name: analytics_event_spec_delete
      description: Delete an event spec by id.
      requires: events.write
    - name: analytics_event_property_upsert
      description: Add or update one property spec for an event spec.
      requires: events.write
    - name: analytics_event_property_delete
      description: Delete one property spec from an event spec.
      requires: events.write
    - name: analytics_event_validate
      description: Validate a sample current-project event against the event catalog without storing it.
      requires: events.read
    - name: analytics_validate_track
      description: Dry-run analytics_track in the current project without storing it. Returns validation status, required-property hints, example payload, and ingest preview.
      requires: events.read
    - name: analytics_event_violations
      description: List recent current-project event spec validation violations.
      requires: events.read
  ui_panels:
    - slot: project.page
      label: Analytics
      icon: trending-up
      entry: /ui/AnalyticsPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/analytics
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/analytics.db
  migrations: migrations/

upgrade_policy: auto-patch
