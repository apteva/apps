schema: apteva-app/v1

name: streaming
display_name: Streaming
version: 0.3.0
description: |
  Live ingest + HLS packaging for sibling Apteva apps. Owns RTMP ingest,
  ffmpeg-driven HLS segmentation, recording-to-mp4, viewer heartbeats,
  signed-URL playback gating, retention enforcement, and a built-in
  synthetic load generator for capacity planning. Has no opinion about
  *why* a stream exists — webinars, podcasts, demo days, hardware
  cameras all share one engine.

  Fully standalone: segments and recordings live on the sidecar's
  local data dir and are served directly from there. No storage/media
  dependency — keeps the replay path local-only and the deployment
  trivial. v0.4 adds optional storage upload + media derivatives.

  v0.3 closes the gaps v0.2's own hardening left open: every terminal
  transition (including restart and shutdown) now goes through one
  finalize path, signatures are bound to the URL kind they were minted
  for, rotate_key no longer overwrites the session it replaces, the
  heartbeat throttle reads a forwarded address it can trust and sizes
  for shared egress, and the VOD manifest carries real segment
  durations.

  BREAKING: signed URLs issued by v0.2 stop validating — the signature
  now covers the URL's scope. Streams left at the default
  require_signed_urls=0 are unaffected; for the rest, re-issue with
  streams_signed_url (or read playback_url again).

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/streaming
icon: /ui/icon.svg
icon_style: monochrome
tags: [streaming, video, live, hls, rtmp, infrastructure]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: streams_create
      description: "Allocate a stream — returns ingest_url (RTMP push target), playback_url (HLS), stream_key, playback_token. Idle until the first publisher push, then status flips to 'live'. Args: name, owner_app?, owner_tag?, record? (default true), visibility? (signed|public, default signed), retention_days? (default 30)."
    - name: streams_get
      description: "Full state: status (idle|live|ended|errored), current_bitrate, current_fps, resolution, viewer_count, peak_viewers, started_at, ended_at, error. Args: id."
    - name: streams_list
      description: "Filter by status, owner_app, owner_tag, limit. The webinars app calls list(owner_app='webinars', owner_tag='webinar:42') to find its stream. Args: status?, owner_app?, owner_tag?, limit? (default 50)."
    - name: streams_stop
      description: "Graceful stop. SIGINT the publisher's ffmpeg child, finalize recording, set status=ended, emit stream.ended. Idempotent. Args: id."
    - name: streams_delete
      description: "Tear down listener and delete segments + recording from disk. Idempotent. Args: id."
    - name: streams_rotate_key
      description: "Generate new stream_key (kills the active session if any). For when a key leaks. Returns the new ingest_url + stream_key. Only idle|live streams can have their ingest key rotated; rotate_playback_token=true additionally mints a new playback_token + URL signing secret — that works in any status and instantly invalidates every playback/replay URL outstanding for the stream. Args: id, rotate_playback_token? (default false)."
    - name: streams_get_metrics
      description: "Lightweight metrics read for the dashboard polling lane: current_bitrate, current_fps, viewer_count, peak_viewers, total_viewer_seconds, uptime_seconds, dropped_frames. Args: id."
    - name: streams_replay_url
      description: "Once status=ended: returns the playback URL for the recording (mp4) and/or the VOD segment manifest (replay.m3u8). Returns available=false when status != ended. URLs come back signed with a 1h expiry if the stream requires signed URLs. Args: id."
    - name: streams_signed_url
      description: "Expiring signed playback URL. Returns {url} fully formed — HMAC signature over <stream_id>:<exp>, plus project_id on a global-scoped install. This is how a consumer app hands out a replay link that actually stops working. kind=heartbeat signs the viewer-heartbeat endpoint instead, which a require_signed_urls stream needs so viewer counting keeps working. Args: id, expires_in_seconds, kind? (hls|mp4|heartbeat, default hls)."
    - name: streams_set_url_policy
      description: "Require expiring signed URLs for a stream. With require_signed_urls=true a bare ?t=<playback_token> is rejected — every playback and heartbeat request must also carry a valid exp+sig from streams_signed_url. Args: id, require_signed_urls."
    - name: streams_load_test
      description: "Synthetic load generator. Spawns N goroutine 'viewers' against the playback URL, fetches manifest + segments, discards bytes. Reports p50/p95/p99 first-byte latency, served bitrate, refusals, http_5xx, segments_late. The agent uses this to bisect for the box's viewer ceiling. Args: id, viewers (default 50), duration_seconds (default 30, max 300)."
  ui_panels: []

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/streaming
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/streaming.db
  migrations: migrations/

config_schema:
  - name: rtmp_port_range
    type: text
    default: "1935-1965"
    label: RTMP listener port range
    description: Inclusive range. Each active stream binds one port from this pool.
  - name: hls_segment_seconds
    type: number
    default: 4
    label: HLS segment duration (seconds)
    description: Lower = lower latency, higher request rate. 2-6 is sane.
  - name: hls_window_segments
    type: number
    default: 10
    label: Live window size (segments)
    description: >-
      Entries in the LIVE playlist. Segments themselves are never deleted by
      ffmpeg — replay is served from the VOD manifest (replay.m3u8) written at
      finalize, and disk is reclaimed by retention_days. 0 = unbounded live
      playlist (v0.1 behavior; grows for the whole stream and is re-fetched by
      every viewer every few seconds).
  - name: finalize_grace_seconds
    type: number
    default: 60
    label: Recording finalize grace (seconds)
    description: >-
      How long to wait for ffmpeg to close its outputs on stop before
      escalating to SIGKILL. `-movflags +faststart` rewrites the whole mp4 on
      close, so a long recording needs a generous window or it gets truncated.
      Streams with record=false always use a short grace.
  - name: viewer_idle_seconds
    type: number
    default: 30
    label: Viewer heartbeat timeout (seconds)
    description: A viewer stops being counted after this long without a heartbeat.
  - name: max_concurrent_streams
    type: number
    default: 4
    label: Max concurrent active publishers
    description: Hard cap on simultaneous live streams. Must be <= rtmp_port_range size.
  - name: ffmpeg_path
    type: text
    default: "ffmpeg"
    label: ffmpeg binary
    description: Resolved via $PATH when unset. Override for non-standard installs.
  - name: max_viewers_per_ip
    type: number
    default: 64
    label: Max counted viewers per source IP
    description: >-
      Heartbeat anti-inflation budget, applied per (source IP, stream). Beyond
      it, extra viewers from that address still get served but stop adding
      headcount. Raise it when your audience sits behind a large shared egress
      (a university, a corporate NAT) — v0.2's budget of 8 undercounted those
      badly. The per-window request ceiling scales with this value.
  - name: live_url_ttl_seconds
    type: number
    default: 43200
    label: Signed URL lifetime — live streams (seconds)
    description: >-
      Lifetime of the signed playback URL for a stream still in progress. Every
      segment inherits the manifest's signature, so this has to outlast the
      whole broadcast: when it expires, playback stops for every viewer at once.
      The expiry is reported as playback_url_expires_at so a consumer can
      refresh ahead of it.
  - name: replay_url_ttl_seconds
    type: number
    default: 3600
    label: Signed URL lifetime — replays (seconds)
    description: >-
      Lifetime of the signed URL for a finished stream. Short on purpose —
      expiring is the point of require_signed_urls. Callers that want an exact
      lifetime use streams_signed_url.

upgrade_policy: auto-patch
