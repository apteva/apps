schema: apteva-app/v1

name: messaging
display_name: Messaging
version: 0.16.0
description: |
  Multi-provider SMS through Twilio and Telnyx with account-pinned numbers,
  verified durable inbound webhooks, delivery tracking and receive-only mode.
  Legacy Twilio phone_provider bindings remain supported. Requires the
  Telnyx messaging tools from integrations 0.55.0 or newer.

  Reply to an existing message with send_message(reply_to_message_id): derives addressing and
  preserves RFC/Gmail threading, subject ticket tokens, tagged reply addresses,
  and validated X-Ticket-ID/X-Ticket-Number headers. Explicit reply-all excludes
  own mailboxes; Bcc and original attachments are never copied. Replies use
  existing send validation, suppression, provider restrictions and retries.
  The separate reply_message tool is removed; use send_message with
  reply_to_message_id instead.
  Unfiltered message lists walk a recency index instead of sorting a whole
  project per page.
  Automatic-response recovery runs in bounded, indexed batches on the read
  pool and no longer rescans historical bounces, keeping requests responsive.
  Template sends retain immutable content and variable snapshots; message_get
  and message_list expose template_snapshot with availability and provenance.
  Historical content is not reconstructed from current templates.
  Sender domain setup publishes DMARC without requesting report emails.
  Send and receive email through AWS SES or Gmail and SMS/WhatsApp through
  Twilio. Tracks
  delivery state, maintains a per-channel suppression list from
  bounces and complaints, and routes inbound mail/SMS/WhatsApp to
  other app tools via a small pattern table.

  Send with an explicit channel (email, sms, or whatsapp). Addresses
  accept plain mailbox/E.164 values and compatible URI prefixes.
  Omit from to use the configured default sender for that channel.
  Subject and HTML body apply only to email.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/messaging
icon: /ui/icon.svg
icon_style: monochrome
tags: [messaging, email, ses, gmail, sms, whatsapp, twilio, inbox]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.connections.read_credentials
    - platform.apps.call
    - platform.dns.read
    - platform.dns.write
  # Messaging routes inbound messages to whichever installed app the
  # operator configured in inbound_routes. Targets are data, not a
  # fixed install-time dependency, so use the official-app dynamic
  # call gate.
  dynamic_app_calls: true
  integrations:
    - role: email_provider
      kind: integration
      mode: multiple
      compatible_slugs: [aws-ses, gmail]
      capabilities: [email.send, email.read]
      tools:
        email.send: send_email
      required: false
      label: "Email providers (AWS SES or Gmail)"
      hint: "Select one or more email accounts and a default. Sender addresses determine the connection used for each message."
    - role: sms_provider
      kind: integration
      mode: multiple
      compatible_slugs: [twilio, telnyx]
      capabilities: [sms.send, sms.receive]
      tools:
        sms.send: send_sms
      required: false
      label: "SMS providers (Twilio or Telnyx)"
      hint: "Select one or more accounts. Each registered number owns its connection. Existing phone_provider setups continue working."
    - role: phone_provider
      kind: integration
      compatible_slugs: [twilio]
      capabilities: [sms.send, whatsapp.send]
      tools:
        sms.send: send_sms
        whatsapp.send: send_whatsapp
      required: false
      label: "Phone provider (SMS + WhatsApp via Twilio)"
      hint: "Required for channel=sms or channel=whatsapp sends. Without this binding, send_message returns a clear error on phone channels."
    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.read, files.write]
      required: false
      label: "Storage (optional)"
      hint: "Persists outbound attachments, resolves attachment bytes for email, and mints signed media URLs for SMS/WhatsApp. Without it, email can still send base64-inline attachments, but phone media from local files is unavailable."
    - role: domains
      kind: app
      compatible_app_names: [domains]
      capabilities: [dns.upsert_record]
      required: false
      label: "Domains (optional)"
      hint: "When bound, sender domain setup auto-publishes DKIM CNAMEs, SPF, DMARC, SES custom MAIL FROM, and inbound MX records via the domains app. Without it, the setup endpoint returns the records as JSON for manual paste into the registrar."
    - role: inbound_storage
      kind: integration
      compatible_slugs: [aws-s3]
      capabilities: [files.read, files.write]
      tools:
        files.read: get_object
        files.write: put_object
      required: false
      label: "Inbound storage (AWS S3)"
      hint: "Bucket where SES drops inbound .eml files. Required for /senders/bootstrap-inbound and for fetching attachments / large messages from SES inbound notifications."
    - role: inbound_notifications
      kind: integration
      compatible_slugs: [aws-sns]
      capabilities: [topic.manage, topic.subscribe]
      tools:
        topic.manage: set_topic_attributes
        topic.subscribe: subscribe
        topic.list_subscriptions: list_subscriptions_by_topic
        topic.unsubscribe: unsubscribe
      required: false
      label: "Inbound notifications (AWS SNS)"
      hint: "Topic SES publishes inbound notifications to. Required for /senders/bootstrap-inbound — without it, inbound setup is manual via the AWS console."

provides:
  http_routes:
    - prefix: /
    - { prefix: /webhooks/ses-bounces, method: POST, no_auth: true }
    - { prefix: /webhooks/ses-inbound, method: POST, no_auth: true }
    - { prefix: /webhooks/twilio-inbound, method: POST, no_auth: true }
    - { prefix: /webhooks/twilio-status, method: POST, no_auth: true }
    - { prefix: /webhooks/telnyx-inbound, method: POST, no_auth: true }
  mcp_tools:
    # outbound
    - { name: send_message,           description: "Send a new message with channel and to, or reply with reply_to_message_id and new content. Reply mode derives addressing, subject and RFC/Gmail threading from the project-owned original, preserves ticket tokens, tagged reply addresses and validated X-Ticket-ID/X-Ticket-Number, and rejects addressing/threading overrides. reply_all is explicit and email-only; Bcc and original attachments are never copied. Retry keys are scoped to the original. reply_to sets an email response address and is distinct from reply_to_message_id. Email routes through its registered SES/Gmail sender; SMS through its registered Twilio/Telnyx number. Optional connection_id must match. Existing legacy Twilio calls remain supported. Args: reply_to_message_id? (reply mode, omit channel/to/from/subject/threading), reply_all?, channel? (email|sms|whatsapp; required for new sends), to? (address or address[]; required for new sends), body?, subject?, body_html?, from?, reply_to?, in_reply_to?, references?, headers?, attachments? [{exactly one of storage_id|url|content_base64, filename?, content_type?, size_bytes?, disposition?, content_id?}], attachment_storage_ids?, media_url?, template_id?, vars?, prefer_channel?, idempotency_key?. Attachment-only messages are supported. WhatsApp accepts one media attachment; provider ContentSid templates cannot be combined with body or direct media. Returns provider_message_id (opaque provider ID) separately from message_id_header (RFC email Message-ID when known; use this for threading), plus normalized attachment metadata and never base64. Channel is explicit for new sends and derived for replies. Email addresses and E.164 numbers may be bare or use mailto:/tel:/whatsapp: prefixes; from defaults to the configured channel sender. Suppressed recipients return code=recipient_suppressed with address, matched address/domain, reason, source, and kind." }
    - { name: send_message_template,  description: "Render a saved template + send. Args: template_id, to, vars?, attachments?, attachment_storage_ids?, idempotency_key?. Convenience over send_message with template_id." }
    - { name: message_get,            description: "Fetch one message by id — headers, status, channel, direction, delivery events, and normalized attachment metadata without raw bytes." }
    - { name: message_list,           description: "List messages with normalized attachment metadata. Filters: q? (sender, recipients, subject, and body), direction? (in|out), channel?, status?, since?, address? (canonical URI), limit?, offset?. Returns total for pagination." }
    - { name: inbound_redispatch,     description: "Re-attempt routing for an inbound message that previously failed or had no_match, preserving normalized attachment IDs and metadata. Args: id." }
    # routing config
    - { name: inbound_route_set,      description: "Bind a recipient URI pattern to any target app tool. Routed payloads include normalized attachment metadata (storage_id, filename, content_type, size, disposition, status) and never raw bytes or provider credentials. Idempotent. Args: pattern (e.g. mailto:support+*@acme.com), target_app, target_route, priority?." }
    - { name: inbound_route_list,     description: "List configured inbound routes." }
    - { name: inbound_route_delete,   description: "Remove an inbound route. Args: id." }
    # templates
    - { name: template_create,        description: "Create a template. Args: name, channel (default 'email'), subject?, body_text?, body_html?, vars_schema?, provider_create?, language?, category?, submit_for_approval?. Phone templates can create an upstream provider template; WhatsApp submits for approval by default." }
    - { name: template_update,        description: "Update a template (partial). Args: id, fields…" }
    - { name: template_get,           description: "Fetch one template by id." }
    - { name: template_list,          description: "List templates. Args: channel?, limit?, offset?." }
    - { name: template_delete,        description: "Remove a template from this project. Args: id, delete_provider? (default false)." }
    # suppression
    - { name: suppression_list,       description: "List suppressed exact addresses and domains with stable pagination. Args: channel?, limit?, offset?. Returns count, total, limit, offset, and has_more." }
    - { name: suppression_add,        description: "Suppress an exact address or domain. direction=both (default) preserves legacy blocking; direction=outbound stops sending but keeps incoming replies. Existing both-direction blocks are never weakened. Args: address, channel?, kind?, direction?, reason?, source?, force?." }
    - { name: suppression_remove,     description: "Remove an address or domain from suppression. Args: address, channel?, kind?." }
    - { name: suppression_check,      description: "Directional suppression lookup. Args: address, channel?, direction? (outbound default or inbound). Checks exact address plus email domain and returns suppressed, check_direction, and matching block direction/metadata." }
    # senders (outbound identities — channel-agnostic list/get/delete; channel-specific onboarding)
    - { name: senders_list,           description: "List sending identities (verified emails, domains; later phones, push apps). Args: channel?, verified_only?. Returns [{address, kind, verified, dkim_status?}]." }
    - { name: senders_get,            description: "Get a single identity's status — verification, DKIM, feedback forwarding. Args: address (URI or bare)." }
    - { name: senders_delete,         description: "Remove a sending identity from the provider. Args: address." }
    - { name: senders_get_quota,      description: "Provider account stats — sandbox flag, 24h send quota, current usage. Powers the sandbox banner." }
    - { name: senders_create,         description: "Register a sender using a bound SES or Gmail connection (optional connection_id). SES supports mailbox/domain verification and inbound bootstrap; Gmail adopts only verified send-as aliases and syncs inbound mailbox history. SMS numbers adopt Twilio or Telnyx with pinned connection ownership; WhatsApp retains the legacy Twilio binding. receive_only keeps reception enabled and disables sending and automatic routing. Args: address (required), channel?, connection_id?, inbound?, receive_only?, messaging_profile_id?, allow_shared_profile?, display_name?, set_default?." }
    - { name: senders_refresh,        description: "Refresh verification/DKIM + sending status for locally-tracked senders by re-listing each bound provider. Does NOT import unknown upstream identities — use senders_create to add. Soft-deletes locals missing upstream. Returns {refreshed, count}." }
    - { name: senders_set_default,    description: "Flip the per-(project, channel) default sender. send_message uses the default when 'from' is omitted. Args: address, channel? (auto-detected if blank)." }
    - { name: senders_update,         description: "Patch local-mutable fields on a sender — display_name (used as friendly From: \"Name\" <addr>) and notes. No provider round-trip. For verification / DKIM / inbound state use senders_create or senders_refresh; for the default flag use senders_set_default. Args: address (req), channel?, display_name?, notes?. Empty values preserve existing." }
    - { name: identities_list,        description: "List authentication anchors (DKIM-verified domains, WhatsApp Business Accounts). NOT for compose/From dropdowns — use senders_list for that. Args: kind? (filter)." }
  ui_panels:
    - slot: project.page
      label: Messaging
      icon: mail
      entry: /ui/MessagingPanel.mjs
  ui_components:
    - name: messages
      label: Messages
      description: SMS and WhatsApp conversations in a compact phone-style inbox.
      entry: /ui/MessagingWidget.mjs
      slots: [dashboard.home]
      suggested: true
      visibility: project
      supported_sizes: [half, full]
      default_size: half
      refresh_topics: [message.sent, message.received, message.event]
      native:
        schema: apteva-native-surface/v1
        entry: /ui/surfaces/messages.json
      settings_schema:
        type: object
        properties:
          default_channel:
            type: string
            title: Default channel
            enum: [all, sms, whatsapp]
            enum_names: [All messages, SMS, WhatsApp]
            default: all
          max_conversations:
            type: integer
            title: Maximum conversations
            default: 10
            minimum: 4
            maximum: 20
  workers:
    - name: ses-inbound-subscriptions
      schedule: "@every 5m"
    - name: messaging-recovery
      schedule: "@every 30s"
    - name: gmail-mailbox-sync
      schedule: "@every 2m"
    - name: ses-verify-poller
      schedule: "@every 5m"

runtime:
  kind: source
  # Legacy databases rebuild the message-search index during their first
  # upgrade. Allow that one-time work to finish before declaring boot failed.
  startup_timeout_seconds: 600
  source:
    repo: github.com/apteva/apps
    ref: messaging/v0.16.0
    entry: mcp/messaging
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/messaging.db
  migrations: migrations/

config_schema:
  - name: webhook_public_url
    type: text
    label: Webhook public URL override
    description: Optional HTTPS origin used for provider callbacks instead of the Apteva instance Public URL, for example https://mail.example.com. Must route to this Apteva instance.
  - name: ses_bounce_topic_arn
    type: text
    label: SES bounce/complaint SNS topic ARN
    description: Optional. SNS topic that publishes Delivery/Bounce/Complaint notifications for outbound mail. Subscribe it to /webhooks/ses-bounces.
  - name: ses_inbound_topic_arn
    type: text
    label: SES inbound SNS topic ARN
    description: Optional. SNS topic that publishes Received notifications for inbound mail. Subscribe it to /webhooks/ses-inbound.
  - name: ses_inbound_bucket
    type: text
    label: SES inbound S3 bucket
    description: Bucket name where SES stores raw .eml for inbound mail. Required if ses_inbound_topic_arn is set.
  - name: webhook_signing_secret
    type: secret
    label: Webhook shared secret
    description: Optional HMAC-SHA256 secret for deployments that authenticate SNS through a trusted proxy. Direct AWS SNS callbacks use AWS certificate signatures.
  - name: twilio_auth_token
    type: secret
    label: Twilio Auth Token fallback
    description: Optional fallback for Twilio webhook signature verification. Normal installs read auth_token from the bound Twilio connection via platform.connections.read_credentials; set this only for older platform builds or emergency override.

upgrade_policy: auto-patch
