schema: apteva-app/v1

name: messaging
display_name: Messaging
version: 0.13.40
description: |
  Send and receive email through AWS SES and SMS/WhatsApp through
  Twilio. Tracks
  delivery state, maintains a per-channel suppression list from
  bounces and complaints, and routes inbound mail/SMS/WhatsApp to
  other app tools via a small pattern table.

  The shape is channel-agnostic: addresses are URIs (mailto:, tel:,
  apteva://contact/N) and a single `send_message` tool dispatches
  on the URI scheme. Per-channel fields (subject, body_html for
  email) are optional and ignored when the resolved channel is not
  email.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/messaging
icon: /ui/icon.svg
icon_style: monochrome
tags: [messaging, email, ses, sms, whatsapp, twilio, inbox]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.connections.read_credentials
    - platform.apps.call
    - platform.dns.read
    - platform.dns.write
  # Messaging routes inbound messages to whichever installed app the
  # operator configured in inbound_routes. Targets are data, not a
  # fixed install-time dependency, so use the official-app dynamic
  # call gate.
  dynamic_app_calls: true
  integrations:
    - role: email_provider
      kind: integration
      compatible_slugs: [aws-ses]
      capabilities: [email.send]
      tools:
        email.send: send_email
      required: false
      label: "Email provider (AWS SES)"
      hint: "Verifies the sender domain and delivers outbound mail. Bounce/complaint webhook target lives in app config."
    - role: phone_provider
      kind: integration
      compatible_slugs: [twilio]
      capabilities: [sms.send, whatsapp.send]
      tools:
        sms.send: send_sms
        whatsapp.send: send_whatsapp
      required: false
      label: "Phone provider (SMS + WhatsApp via Twilio)"
      hint: "Required for channel=sms or channel=whatsapp sends. Without this binding, send_message returns a clear error on phone channels."
    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.read, files.write]
      required: false
      label: "Storage (optional)"
      hint: "Persists outbound attachments, resolves attachment bytes for email, and mints signed media URLs for SMS/WhatsApp. Without it, email can still send base64-inline attachments, but phone media from local files is unavailable."
    - role: domains
      kind: app
      compatible_app_names: [domains]
      capabilities: [dns.upsert_record]
      required: false
      label: "Domains (optional)"
      hint: "When bound, sender domain setup auto-publishes DKIM CNAMEs, SPF, DMARC, SES custom MAIL FROM, and inbound MX records via the domains app. Without it, the setup endpoint returns the records as JSON for manual paste into the registrar."
    - role: inbound_storage
      kind: integration
      compatible_slugs: [aws-s3]
      capabilities: [files.read, files.write]
      tools:
        files.read: get_object
        files.write: put_object
      required: false
      label: "Inbound storage (AWS S3)"
      hint: "Bucket where SES drops inbound .eml files. Required for /senders/bootstrap-inbound and for fetching attachments / large messages from SES inbound notifications."
    - role: inbound_notifications
      kind: integration
      compatible_slugs: [aws-sns]
      capabilities: [topic.manage, topic.subscribe]
      tools:
        topic.manage: set_topic_attributes
        topic.subscribe: subscribe
        topic.list_subscriptions: list_subscriptions_by_topic
        topic.unsubscribe: unsubscribe
      required: false
      label: "Inbound notifications (AWS SNS)"
      hint: "Topic SES publishes inbound notifications to. Required for /senders/bootstrap-inbound — without it, inbound setup is manual via the AWS console."

provides:
  http_routes:
    - prefix: /
    - { prefix: /webhooks/ses-bounces, method: POST, no_auth: true }
    - { prefix: /webhooks/ses-inbound, method: POST, no_auth: true }
    - { prefix: /webhooks/twilio-inbound, method: POST, no_auth: true }
    - { prefix: /webhooks/twilio-status, method: POST, no_auth: true }
  mcp_tools:
    # outbound
    - { name: send_message,           description: "Send a message. Args: to (URI or URI[]), body, subject?, body_html?, from?, reply_to?, in_reply_to?, references?, headers?, attachments? [{storage_id|url|content_base64, filename?, content_type?, disposition?, content_id?}], attachment_storage_ids?, media_url?, template_id?, vars?, prefer_channel?, idempotency_key?. URI scheme picks the channel (mailto:, tel:, apteva://contact/N). Bare email strings are coerced to mailto:." }
    - { name: send_message_template,  description: "Render a saved template + send. Args: template_id, to, vars?, attachments?, attachment_storage_ids?, idempotency_key?. Convenience over send_message with template_id." }
    - { name: message_get,            description: "Fetch one message by id — headers, status, channel, direction, delivery events." }
    - { name: message_list,           description: "List messages. Filters: direction? (in|out), channel?, status?, since?, address? (canonical URI), limit?." }
    - { name: inbound_redispatch,     description: "Re-attempt routing for an inbound message that previously failed or had no_match. Args: id." }
    # routing config
    - { name: inbound_route_set,      description: "Bind a recipient URI pattern to a target app+route. Idempotent. Args: pattern (e.g. mailto:support+*@acme.com), target_app, target_route, priority?." }
    - { name: inbound_route_list,     description: "List configured inbound routes." }
    - { name: inbound_route_delete,   description: "Remove an inbound route. Args: id." }
    # templates
    - { name: template_create,        description: "Create a template. Args: name, channel (default 'email'), subject?, body_text?, body_html?, vars_schema?, provider_create?, language?, category?, submit_for_approval?. Phone templates can create Twilio Content; WhatsApp submits for approval by default." }
    - { name: template_update,        description: "Update a template (partial). Args: id, fields…" }
    - { name: template_get,           description: "Fetch one template by id." }
    - { name: template_list,          description: "List templates. Args: channel?, limit?." }
    - { name: template_delete,        description: "Delete a template. Args: id." }
    # suppression
    - { name: suppression_list,       description: "List suppressed exact addresses and domains. Args: channel?, limit?." }
    - { name: suppression_add,        description: "Suppress an exact address or email domain for outbound sends and inbound dispatch. Args: address, channel?, kind? (address|domain), reason?, source?, force?." }
    - { name: suppression_remove,     description: "Remove an address or domain from suppression. Args: address, channel?, kind?." }
    - { name: suppression_check,      description: "Suppression lookup. Args: address, channel?. Checks exact address plus email domain and returns {suppressed, kind?, reason?, source?, suppressed_at?}." }
    # senders (outbound identities — channel-agnostic list/get/delete; channel-specific onboarding)
    - { name: senders_list,           description: "List sending identities (verified emails, domains; later phones, push apps). Args: channel?, verified_only?. Returns [{address, kind, verified, dkim_status?}]." }
    - { name: senders_get,            description: "Get a single identity's status — verification, DKIM, feedback forwarding. Args: address (URI or bare)." }
    - { name: senders_delete,         description: "Remove a sending identity from the provider. Args: address." }
    - { name: senders_get_quota,      description: "Provider account stats — sandbox flag, 24h send quota, current usage. Powers the sandbox banner." }
    - { name: senders_create,         description: "Unified sender registration across email (SES) + SMS/WhatsApp (Twilio). Address shape dispatches: \"foo@x.com\" → SES verify_email; \"x.com\" → verify_domain + DKIM/SPF DNS + (auto when aws-s3+aws-sns bound) full inbound bootstrap (S3 bucket + SNS topic + receipt rule + MX + webhook subscribe); \"+15551234567\" → adopt Twilio phone for sms or an approved Twilio WhatsApp sender for whatsapp; SMS auto-wires SmsUrl, WhatsApp auto-wires sender callback_url. Writes a row to the local senders table. Args: address (req), channel?, inbound? (auto|true|false), publish_dns?, spf?, region?, bucket_name?, topic_name?, rule_set_name?, rule_name?, display_name?, set_default?. Idempotent." }
    - { name: senders_refresh,        description: "Refresh verification/DKIM + sending status for locally-tracked senders by re-listing each bound provider. Does NOT import unknown upstream identities — use senders_create to add. Soft-deletes locals missing upstream. Returns {refreshed, count}." }
    - { name: senders_set_default,    description: "Flip the per-(project, channel) default sender. send_message uses the default when 'from' is omitted. Args: address, channel? (auto-detected if blank)." }
    - { name: senders_update,         description: "Patch local-mutable fields on a sender — display_name (used as friendly From: \"Name\" <addr>) and notes. No provider round-trip. For verification / DKIM / inbound state use senders_create or senders_refresh; for the default flag use senders_set_default. Args: address (req), channel?, display_name?, notes?. Empty values preserve existing." }
    - { name: identities_list,        description: "List authentication anchors (DKIM-verified domains, WhatsApp Business Accounts). NOT for compose/From dropdowns — use senders_list for that. Args: kind? (filter)." }
  ui_panels:
    - slot: project.page
      label: Messaging
      icon: mail
      entry: /ui/MessagingPanel.mjs
  workers:
    - name: ses-verify-poller
      schedule: "@every 5m"

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/messaging
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/messaging.db
  migrations: migrations/

config_schema:
  - name: webhook_public_url
    type: text
    label: Webhook public URL override
    description: Optional HTTPS origin used for provider callbacks instead of the Apteva instance Public URL, for example https://mail.example.com. Must route to this Apteva instance.
  - name: ses_bounce_topic_arn
    type: text
    label: SES bounce/complaint SNS topic ARN
    description: Optional. SNS topic that publishes Delivery/Bounce/Complaint notifications for outbound mail. Subscribe it to /webhooks/ses-bounces.
  - name: ses_inbound_topic_arn
    type: text
    label: SES inbound SNS topic ARN
    description: Optional. SNS topic that publishes Received notifications for inbound mail. Subscribe it to /webhooks/ses-inbound.
  - name: ses_inbound_bucket
    type: text
    label: SES inbound S3 bucket
    description: Bucket name where SES stores raw .eml for inbound mail. Required if ses_inbound_topic_arn is set.
  - name: webhook_signing_secret
    type: secret
    label: Webhook shared secret
    description: Optional HMAC-SHA256 secret for deployments that authenticate SNS through a trusted proxy. Direct AWS SNS callbacks use AWS certificate signatures.
  - name: twilio_auth_token
    type: secret
    label: Twilio Auth Token fallback
    description: Optional fallback for Twilio webhook signature verification. Normal installs read auth_token from the bound Twilio connection via platform.connections.read_credentials; set this only for older platform builds or emergency override.

upgrade_policy: auto-patch
