schema: apteva-app/v1

name: social
display_name: Social
version: 0.14.81
description: |
  Schedule and publish posts to your social media accounts: X (Twitter),
  Facebook Pages, Instagram Business, LinkedIn, TikTok, YouTube, Reddit,
  Pinterest, and Threads. Connect accounts from inside the app — no
  separate integration setup. Posts can be triggered from the panel or
  by an agent via MCP tools; jobs handle scheduling + retry.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/social
icon: /ui/icon.svg
icon_style: monochrome
tags: [social-media, publishing, scheduling, productivity]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.connections.manage
    - platform.oauth.start
    - platform.apps.call
  # No required integrations — accounts are connected at runtime via
  # platform.oauth.start. Storage and jobs are bound by the operator at
  # install time so the app can persist media and schedule durable
  # publish jobs.
  integrations:
    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.write]
      required: false
      label: "Storage (optional)"
      hint: "Persist uploaded media so posts can reference stable URLs across restarts."
    - role: media
      kind: app
      compatible_app_names: [media]
      capabilities: [media.search]
      required: false
      label: "Media library (optional)"
      hint: "Use indexed media metadata, thumbnails, ratings, duration, and aspect-ratio filters when choosing post attachments."
    - role: jobs
      kind: app
      compatible_app_names: [jobs]
      capabilities: [jobs.schedule]
      required: false
      label: "Jobs (optional)"
      hint: "Without jobs, scheduled posts publish synchronously when the app's worker tick fires; with jobs, scheduling is durable + retried with exponential backoff."
    - role: social_provider
      kind: integration
      compatible_slugs: [zernio]
      required: false
      label: "Social provider (optional)"
      hint: "Import and publish through a unified social API for platforms that are hard to connect directly."

provides:
  http_routes:
    - prefix: /
  workers:
    - name: scheduled_publisher
      schedule: "@every 1m"
    - name: inbox_collector
      schedule: "@every 5m"
    - name: analytics_collector
      schedule: "@every 6h"
  mcp_tools:
    - { name: account_add,                 description: "Begin OAuth for a platform. Returns authorize_url + pending_account_id." }
    - { name: account_list_pending_pages,  description: "After OAuth completes, list selectable pages/channels (FB pages, IG business accounts, YouTube channels)." }
    - { name: account_finalize,            description: "Commit a pending account into the active account list. For multi-page platforms, supply page_id." }
    - { name: account_import_provider,     description: "Import provider-backed accounts such as Zernio into Social without changing Social's posting tools." }
    - { name: account_list,                description: "List connected social accounts in this project." }
    - { name: account_check,               description: "Check that one or more connected social accounts still work; refreshes Meta page credentials when possible." }
    - { name: account_disconnect,          description: "Disconnect an account while preserving history; explicit confirmed hard delete can remove local history." }
    - { name: post_create,                 description: "Create + publish (or schedule) a post across N social accounts. Scheduled creates are idempotent; retry failed scheduling via post_retry, do not create a duplicate. Args: body or targets[].body, social_account_ids[] or targets[], schedule_at?, media_storage_ids?." }
    - { name: post_list,                   description: "List recent posts with per-target status. Args: limit?, status?." }
    - { name: post_retry,                  description: "Re-attempt a failed post. Failed scheduled posts retry job creation on the same post; failed publish targets are re-published. Args: post_id." }
    - { name: post_publish_scheduled,      description: "Internal Jobs callback that publishes one scheduled post and reports the final downstream result. Args: post_id." }
    - { name: inbox_list,                  description: "List inbox items (comments, DMs, mentions, reviews) across connected social accounts. Filters: kinds, status, social_account_ids, since, limit." }
    - { name: inbox_get,                   description: "Fetch one inbox item by id; with_thread=true returns the surrounding conversation." }
    - { name: inbox_mark_read,             description: "Mark one or more inbox items as read (local-only state)." }
    - { name: inbox_mark_unread,           description: "Mark one or more inbox items as unread (local-only state)." }
    - { name: inbox_archive,               description: "Archive one or more inbox items (hides from default list view)." }
    - { name: inbox_reply,                 description: "Reply to a comment or DM. For comment items, pass mode=public|private|auto; private is supported where the platform exposes private comment replies. Returns the standard {status, reason?, error?, external_id?, permalink?} envelope." }
    - { name: inbox_private_reply,         description: "Compatibility alias for inbox_reply with mode=private." }
    - { name: inbox_hide,                  description: "Hide a comment on the platform side (Facebook, Instagram). Unsupported elsewhere." }
    - { name: inbox_unhide,                description: "Reverse inbox_hide." }
    - { name: inbox_like,                  description: "Like a comment on the platform side (Facebook, Instagram)." }
    - { name: inbox_delete,                description: "Delete a comment where the platform permits it." }
    - { name: inbox_sync,                  description: "Trigger an out-of-cycle inbox poll; the same project-scoped sync also runs automatically." }
  ui_panels:
    - slot: project.page
      label: Social
      icon: megaphone
      entry: /ui/SocialPanel.mjs
  ui_components:
    - name: calendar-card
      entry: /ui/SocialCalendarCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        properties:
          profile_id: { type: integer }
          social_account_id: { type: integer }
          view: { type: string, enum: [week, month] }
          status: { type: string, enum: [all, scheduled, published, failed, partial, draft] }
          anchor_date: { type: string }
      preview_props:
        preview: true
        view: week
    - name: post-card
      entry: /ui/SocialPostCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [post_id]
        properties:
          post_id: { type: integer }
      preview_props:
        preview: true
        post_id: 1

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/social
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/social.db
  migrations: migrations/

upgrade_policy: auto-patch
