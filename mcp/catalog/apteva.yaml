schema: apteva-app/v1

name: catalog
display_name: Catalog
version: 0.2.0
description: |
  Products, prices, and generic discounts — the source of truth for
  what your business sells. Modelled after Stripe's Product + Price
  split: one product, many prices (currencies, intervals, tiers).
  Discounts support one-time commerce purchases and recurring plans
  through immutable application snapshots. Lower-layer app: catalog
  calls nothing; downstream apps call catalog.

  Per-project partitioning matches billing — a project running
  multiple businesses keeps separate catalogs even in a global-scope
  install.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/catalog
tags: [catalog, products, pricing, discounts, commerce, ecommerce, saas]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: catalog_products_list
      description: List products. Filter by type, archived, q (search), limit.
    - name: catalog_products_create
      description: "Create a product. Args — name (req), type (req: one_time|recurring|service), slug, description, category, color, tax_category, metadata."
    - name: catalog_products_get
      description: Fetch one product by id or slug.
    - name: catalog_products_update
      description: "Partial-patch a product. Args — id, patch (any subset of editable fields)."
    - name: catalog_products_archive
      description: Soft-delete a product. Existing invoice/subscription references continue resolving; the picker hides it from new uses.
    - name: catalog_products_search
      description: Free-text search across product name + description + slug + category.
    - name: catalog_prices_list
      description: List prices. Filter by product_id, active, archived, limit.
    - name: catalog_prices_create
      description: "Create a price under a product. Args — product_id, unit_amount_cents, currency (req), nickname, interval, interval_count, trial_days, billing_scheme, meter_key, unit_label, unit_size, tax_inclusive, metadata."
    - name: catalog_prices_get
      description: Fetch one price.
    - name: catalog_prices_update
      description: "Patch a price — limited fields only (nickname, active, metadata, tax_inclusive). Amount/currency/interval/metering changes are rejected; create a new price and archive the old one."
    - name: catalog_prices_archive
      description: Soft-delete a price. Existing references keep resolving.
    - name: catalog_discounts_list
      description: List generic Catalog discounts.
    - name: catalog_discounts_create
      description: Create a percentage, fixed-amount, or price-override discount with Catalog scopes and duration terms.
    - name: catalog_discounts_get
      description: Fetch a discount with scopes, codes, and usage counts.
    - name: catalog_discounts_update
      description: Update a discount definition or replace its Catalog scopes.
    - name: catalog_discounts_archive
      description: Archive a discount while preserving historical reservations and redemptions.
    - name: catalog_discount_codes_create
      description: Create a case-insensitive redemption code for a discount.
    - name: catalog_discount_codes_list
      description: List a discount's codes and usage counts.
    - name: catalog_discount_codes_update
      description: Update a code's active state, redemption limit, or metadata.
    - name: catalog_discounts_quote
      description: Evaluate discount eligibility and return calculated amounts plus an immutable application snapshot.
    - name: catalog_discounts_reserve
      description: Atomically and idempotently reserve discount capacity for a checkout or subscription.
    - name: catalog_discounts_redeem
      description: Commit a reserved discount after its purchase or subscription is created.
    - name: catalog_discounts_release
      description: Release an unused discount reservation.
  publishes:
    - name: discount.created
      description: A Catalog discount was created.
    - name: discount.updated
      description: A Catalog discount definition or scope changed.
    - name: discount.archived
      description: A Catalog discount was archived.
    - name: discount.code_created
      description: A redemption code was created.
    - name: discount.code_updated
      description: A redemption code changed.
    - name: discount.reserved
      description: Discount capacity was reserved.
    - name: discount.redeemed
      description: A discount reservation was committed.
    - name: discount.released
      description: A discount reservation was released.
  ui_panels:
    - slot: project.page
      label: Catalog
      icon: tag
      entry: /ui/CatalogPanel.mjs
  ui_components:
    - name: product-card
      entry: /ui/ProductCard.mjs
      slots:
        - chat.message_attachment
      props_schema:
        type: object
        required: [product_id]
        properties:
          product_id:
            type: integer
      preview_props:
        preview: true
    - name: price-card
      entry: /ui/PriceCard.mjs
      slots:
        - chat.message_attachment
      props_schema:
        type: object
        required: [price_id]
        properties:
          price_id:
            type: integer
      preview_props:
        preview: true
  skills:
    - name: how-to-use-catalog
      command: /catalog
      body_file: skills/how-to-use-catalog.md
      description: |
        Catalog's mental model + conventions. Load when working with
        products, prices, and discounts. Triggers on: "product", "price",
        "plan", "coupon", "discount", "subscription tier", "catalog",
        or any catalog tool call.
      metadata:
        category: commerce

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/catalog
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/catalog.db
  migrations: migrations/

config_schema:
  - name: default_currency
    type: text
    default: "USD"
    label: Default currency
    description: ISO 4217 code used when creating prices without an explicit currency.
  - name: stripe_mirror_enabled
    type: select
    options: ["true", "false"]
    default: "false"
    label: Stripe mirror
    description: |
      When true (post-v0.1.0), catalog products and prices are mirrored
      to Stripe automatically. Requires billing's Stripe integration to
      be installed and connected. Today this is a forward-compat flag —
      v0.1.0 ignores it.

upgrade_policy: auto-patch
