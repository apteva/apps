schema: apteva-app/v1

name: backup
display_name: Backup
version: 0.3.2
description: |
  Periodic database backups of your Apteva instance: the platform DB
  plus app.db from running sidecars. Snapshots are captured online and
  shipped to local disk, AWS S3, or Cloudflare R2. Fleet can be bound
  to back up and restore individual local Fleet tenants.

  This is not a host image: app data outside app.db, stopped sidecars,
  external object storage, repositories, and host configuration are not
  included by the platform snapshot endpoint.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/backup
icon: /ui/icon.svg
icon_style: monochrome
tags: [backup, infrastructure, ops, snapshot, restore]

scopes: [global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.apps.call
    - platform.connections.read_credentials
  apps:
    - name: jobs
      version: ">=0.1.8"
      reason: Cron scheduling for periodic backup runs.
  integrations:
    - role: fleet_provider
      kind: app
      required: false
      compatible_app_names: [fleet]
      label: Fleet app
      hint: Bind Fleet to create, schedule, and restore per-tenant backups from this panel.
    - role: cloud_storage
      kind: integration
      compatible_slugs: [aws-s3, cloudflare-r2]
      capabilities: [object.put, object.get, object.list, object.delete]
      tools:
        object.put: put_object
        object.get: get_object
        object.list: list_objects
        object.delete: delete_object
      required: false
      label: Cloud storage (optional)
      hint: Bind AWS S3 or Cloudflare R2 to enable cloud destinations. Local destinations work without this.

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: backup_now
      description: Run a backup immediately against a chosen destination.
    - name: backup_schedule
      description: Create a scheduled backup policy for platform or Fleet tenant scope.
    - name: backup_list
      description: List past backup runs with size, destination, scope, and status.
    - name: backup_restore
      description: Verify and restore a past backup.
  ui_panels:
    - slot: project.page
      label: Backup
      icon: archive
      entry: /ui/BackupPanel.mjs
  workers: []

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: backup/v0.3.2
    entry: mcp/backup
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/backup.db
  migrations: migrations/

config_schema:
  - name: keep_last_n
    type: text
    default: "14"
    label: Default retention (last N runs)
    description: Default used by new policies. Retention is isolated per policy and scope. 0 disables pruning.
  - name: encryption_passphrase
    type: password
    default: ""
    label: Encryption passphrase (optional)
    description: When set, backups are age-encrypted before upload and verified before restore. Restore needs the same passphrase.

upgrade_policy: auto-patch
