schema: apteva-app/v1

name: functions
display_name: Functions
version: 1.13.0
description: |
  v1.13.0 Parallel execution and downstream calls without CPU-learning gates; default function concurrency follows resource capacity while explicit policies remain intact.

  v1.12.0 adds automatic CPU-aware execution and managed-call admission.
  Queued requests retain their existing deadlines and cancellation; learned
  lightweight operations retain protected headroom. API and themed panel expose
  automatic limits, queue time and worker CPU. Cross-app gateway coordination
  requires a separate platform update, not included in this release.

  v1.11.4 Distinguishes queue expiry from capacity rejection, returns HTTP 504 for deadline failures, and carries Gateway correlation IDs into invocation records and Tables calls.

  Lambda-style serverless functions in node or Go. Each function is
  an immutable, built version served by a pool of warm worker
  processes; handlers reach sibling Apteva apps via context.call and
  integration connections (Pushover, Slack, Resend, ...) via
  context.integration. Auto-routed HTTP endpoint at /fn/<name>; pair
  with the Jobs app for cron-fired schedules. Optional public Function
  URLs are available at /url/<name>/<token>.

  v1.11.3 adds independent soft protocol-buffer admission with a configurable
  target, hard ceiling and bounded waiting. Bursts require measured host
  headroom; API and themed panel expose settings, reservations and pressure.

  v1.11.2 removes history scans from startup recovery, tracks active work by
  process ownership, and adds startup diagnostics and a protected drain endpoint.
  Legacy recovery and retention run in bounded background batches. Platform
  upgrade handover requires a separate server update, not included in this release.

  v1.11.1 lets nested calls borrow unused shared protocol-buffer capacity
  instead of failing at the protected 16 MiB allowance. Preserves the hard
  total buffer limit and exposes nested borrowing in the API and themed panel.

  v1.11.0 defaults to soft memory admission using measured worker usage plus
  headroom, with full allowances for starting or unmeasured workers. Keeps hard
  worker limits and protected capacity; exposes soft/strict settings and memory
  admission accounting through the API and themed panel.

  v1.10.1 disables Go telemetry inside isolated build homes, preserves build
  cancellation and cgroup diagnostics before cleanup, and applies the same
  sandbox limits to standard-library cache preparation. Pair with Fleet 0.10.9
  for deployment calls that can exceed ten seconds.

  v1.10.0 adds separate app/integration deadlines, configurable worker capacity,
  protected interactive and nested budgets, and per-call memory telemetry through
  the API and themed panel. Long integrations no longer stop at 30 seconds.

  v1.9.0 prepares active functions in the background after startup, reports
  runtime readiness and preparation failures, and reuses compatible artifacts
  across restarts and restores. Includes safe handler-free preparation tools.

  v1.8.1 recovers interrupted 1.8.0 schema upgrades atomically and reports
  startup progress with an extended migration budget.

  v1.8.0 improves warm execution and app-call performance, validates
  deployments before activation, and hardens resource limits, isolation,
  cancellation and streaming. Linux requires delegated cgroup v2 and
  Landlock ABI 6 (Linux 6.12+); see the upgrade notes before installing.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/functions
icon: /ui/icon.svg
icon_style: monochrome
tags: [functions, faas, serverless, scripts, agent]

scopes: [project, global]
min_apteva_version: "0.50.2"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.connections.read
    - platform.connections.execute
  # functions is a generic FaaS — user-authored handlers call any
  # installed app or integration connection at runtime. These opt the
  # app into the platform's dynamic bypasses; honoured by apteva-server
  # only because functions is identified as official (apteva-org
  # source). dynamic_app_calls covers context.call;
  # dynamic_integration_access covers context.integration.
  dynamic_app_calls: true
  dynamic_integration_access: true

provides:
  http_routes:
    - prefix: /
    - prefix: /url/
      no_auth: true
  mcp_tools:
    - name: functions_capacity
      description: "Live per-call memory, function worker reservations, queues, settings and rejection reasons."
    - name: functions_prepare
      description: "Prepare active runtime artifacts without invoking the handler. Args: id or name, warm (default true) to start a worker, wait (default false). Initialization and build scripts can run."
    - name: functions_create
      description: "Create a function and deploy v1. Args: name, runtime (node|go), source (inline handler) OR (repo_id+repo_path), package_json?, env?, timeout_ms?, max_memory_mb?, function_url?."
    - name: functions_update
      description: "Update a function's metadata (env, timeout_ms, max_memory_mb, status, function_url). Source/runtime changes go through functions_deploy."
    - name: functions_delete
      description: "Delete a function and all its versions + invocation rows."
    - name: functions_list
      description: "List functions in the project. Optional filter by runtime, status."
    - name: functions_get
      description: "Fetch one function by id or name."
    - name: functions_invoke
      description: "Synchronously invoke a function's active version. Args: name (or id), event (any JSON). Returns {status, response, duration_ms, exit_code, invocation_id}."
    - name: functions_invocations
      description: "Recent invocations for a function. Args: id (or name), limit (default 50, max 200)."
    - name: functions_logs
      description: "Return value + console output of a single invocation. Args: invocation_id."
    - name: functions_deploy
      description: "Deploy a new immutable version and make it active. Args: id (or name), source OR (repo_id+repo_path), package_json?."
    - name: functions_rollback
      description: "Make an older, already-built version active again. Args: id (or name), version."
    - name: functions_versions
      description: "List a function's deploy history. Args: id (or name), limit."
  ui_panels:
    - slot: project.page
      label: Functions
      icon: code
      entry: /ui/FunctionsPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: functions/v1.12.0
    entry: mcp/functions
  port: 8080
  health_check: /health
  startup_timeout_seconds: 1800

db:
  driver: sqlite
  path: /data/functions.db
  migrations: migrations/

upgrade_policy: auto-patch
