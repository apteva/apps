db:
  driver: sqlite
  path: /data/turn.db
  migrations: migrations/
config_schema:
  - {name: tls_mode, type: select, default: "manual", options: [manual, managed], label: "TLS management"}
  - {name: dns_zone, type: text, label: "Managed DNS zone", description: "Zone in the bound Domains app. TURN creates only its relay subdomain and temporary validation records; existing conflicting records are rejected."}
  - {name: dns_project_id, type: text, label: "DNS project ID", description: "Required on global TURN installs; use the project that owns the DNS zone."}
  - {name: acme_email, type: text, label: "Certificate contact email (optional)"}
  - {name: acme_accept_terms, type: toggle, default: "false", label: "Accept Let's Encrypt subscriber agreement", description: "Required for automatic public certificate issuance."}
  - {name: tls_storage_key, type: password, label: "Managed certificate storage key", description: "Stable random key of at least 32 characters. The TURN panel generates this on first managed setup. Keep it when moving the app; losing it makes stored ACME keys unreadable."}
  - {name: public_ip, type: text, required: true, label: "Relay public IPv4", description: "Public address of the instance actually running TURN, not the Apteva management server. One-to-one NAT must preserve the declared relay ports."}
  - {name: public_host, type: text, label: "TURN hostname", description: "DNS hostname or public IPv4 for client connections. Defaults to public_ip. Must point directly to the relay instance."}
  - {name: shared_secret, type: password, required: true, label: "Credential signing secret", description: "At least 32 random characters. Stored in platform install configuration. Never sent to clients. Changing it invalidates credentials."}
  - {name: tls_certificate_pem, type: text, label: "TLS certificate chain", description: "PEM certificate chain or base64-encoded PEM, covering public_host. Configure using the TURN panel's multiline certificate editor. TLS stays unavailable until a valid certificate and key are supplied."}
  - {name: tls_private_key_pem, type: password, label: "TLS private key", description: "Matching unencrypted PEM private key or base64-encoded PEM. Stored in encrypted install configuration; never returned by TURN APIs."}
  - {name: realm, type: text, default: "apteva", label: "Authentication realm"}
  - {name: bind_ip, type: text, default: "0.0.0.0", label: "Relay bind IPv4"}
  - {name: credential_ttl_seconds, type: text, default: "3600", label: "Maximum credential lifetime", description: "60 to 86400 seconds. Clients must obtain new credentials before expiry."}
  - {name: max_allocations, type: text, default: "64", label: "Maximum active allocations", description: "1 to 64; bounded by this release's reserved UDP relay pool."}
  - {name: allocations_per_credential, type: text, default: "4", label: "Allocations per credential", description: "1 to 16. Each issued credential identifies one project/session."}
  - {name: bytes_per_second, type: text, default: "1048576", label: "Bytes per second per allocation", description: "Combined upload/download limit, 65536 to 104857600 bytes/s. Excess datagrams are dropped."}
  - {name: allowed_peer_cidrs, type: text, label: "Allowed peer networks", description: "Optional comma-separated IPv4 CIDRs narrowing public peers. Private, loopback, link-local, metadata and reserved destinations are always denied."}
upgrade_policy: manual
