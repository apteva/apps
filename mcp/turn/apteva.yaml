schema: apteva-app/v1
name: turn
display_name: TURN
version: 0.2.1
description: |
  Standalone authenticated STUN/TURN relay for WebRTC clients.
  Issues temporary project/session credentials and relays UDP media over UDP,
  TCP or TLS client connections. Includes a native management panel and runs
  independently of Telephony, including on a separate managed instance.
author: Apteva
icon: /ui/icon.svg
icon_style: monochrome
tags: [turn, stun, webrtc, networking]
scopes: [project, global]
min_apteva_version: "0.52.0"
requires:
  permissions: [net.egress, db.write.app, platform.apps.call]
  apps:
    - {name: domains, version: ">=1.2.0", optional: true, reason: "Safe DNS mutations for managed TURN TLS"}
provides:
  http_routes:
    - {prefix: /ready, method: GET, no_auth: true}
    - {prefix: /}
    - {prefix: /_apteva/runtime/app/}
  mcp_tools:
    - {name: turn_status, description: "Read relay readiness, endpoint configuration, capacity and aggregate traffic counters. No credentials."}
    - name: turn_credentials
      exposure: app_only
      description: "Issue temporary WebRTC ICE credentials for the authenticated calling project and a session. Consumers must authorize their end user before calling."
  ui_panels:
    - {slot: project.page, label: TURN, icon: network, entry: /ui/TurnPanel.mjs}
runtime:
  kind: source
  activation_strategy: exclusive
  startup_timeout_seconds: 30
  database_upgrade: backward_compatible
  package:
    app_capabilities:
      passive_start: true
      drain: true
      replica_safe: false
      worker_coordination: false
      routing: stateless
  source:
    repo: github.com/apteva/apps
    ref: turn/v0.2.1
    entry: mcp/turn
  port: 8080
  health_check: /ready
  ports:
    - {name: turn-udp, container_port: 3478, host_port: 3478, protocol: udp}
    - {name: turn-tcp, container_port: 3478, host_port: 3478, protocol: tcp}
    - {name: turn-tls, container_port: 5349, host_port: 5349, protocol: tcp}
    - {name: relay-49160, container_port: 49160, host_port: 49160, protocol: udp}
