schema: apteva-app/v1
name: sportsbook
display_name: Sportsbook
version: 0.3.0
description: Dedicated sports research and paper betting desk with normalized providers, experimental predictions, bet proposals and bankroll risk controls.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/sportsbook
icon: /ui/icon.svg
icon_style: monochrome
tags: [sports, betting, predictions, odds, research]
scopes: [project]
min_apteva_version: "0.11.0"
requires:
  permissions: [db.write.app, platform.connections.read, platform.connections.execute, platform.apps.call]
  integrations:
    - role: sports_data
      kind: integration
      mode: multiple
      required: false
      label: "Sports data"
      compatible_slugs: [the-sports-db, api-sports, api-tennis, the-odds-api]
    - role: odds
      kind: integration
      mode: multiple
      required: false
      label: "Odds"
      compatible_slugs: [the-odds-api, api-tennis]
    - role: sports_scraper
      kind: app
      mode: multiple
      required: false
      label: "Read-only scrape sources"
      compatible_app_names: [actors]
      hint: Actors runs are read-only from Sportsbook and require a canonical field map before import.
    - role: llm
      kind: integration
      mode: multiple
      required: false
      label: "LLM"
      compatible_slugs: [openai-api, anthropic-api]
    - role: execution
      kind: app
      mode: multiple
      required: false
      label: Execution
      compatible_app_names: [sportsbook-executor]
      hint: Paper execution is built in. Connected wagering requires a compatible execution app and a later release.
provides:
  http_routes: [{ prefix: / }]
  permissions:
    - { name: sportsbook.read, description: "Read the sports research workspace." }
    - { name: sportsbook.configure, description: "Manage routes, examples and paper bankrolls." }
    - { name: sportsbook.sync, description: "Fetch data using bound providers." }
    - { name: sportsbook.propose, description: "Run predictions and create bet proposals." }
    - { name: sportsbook.paper_execute, description: "Accept paper bets and reserve virtual funds." }
    - { name: sportsbook.paper_settle, description: "Settle virtual bets." }
    - { name: sportsbook.live_execute, description: "Reserved for connected execution; unavailable in v0.2." }
  mcp_tools:
    - { name: catalog_get, requires: sportsbook.read, description: "List project sports, competitions, market configurations and provider mappings." }
    - { name: sport_upsert, requires: sportsbook.configure, description: "Create or update a sport's name and enabled status." }
    - { name: competition_upsert, requires: sportsbook.configure, description: "Create or update a competition within a sport." }
    - { name: sport_market_set, requires: sportsbook.configure, description: "Configure match-winner outcomes, rules, model and history scope for new markets." }
    - { name: provider_sport_mapping_set, requires: sportsbook.configure, description: "Map a provider's sport or competition key to the project catalog." }
    - { name: provider_sports_list, requires: sportsbook.sync, description: "Discover sport and competition keys from a bound The Odds API connection." }
    - { name: workspace_get, requires: sportsbook.read, description: "Browse events, markets, predictions, proposals and paper bankrolls." }
    - { name: integrations_list, requires: sportsbook.read, description: "Inspect selected providers, defaults, capabilities and routes." }
    - { name: sports_sources_list, requires: sportsbook.read, description: "List configured read-only Actors scrape sources and their canonical field maps." }
    - { name: sports_scrape_source_set, requires: sportsbook.configure, description: "Configure a read-only Actors scrape source with an explicit field map." }
    - { name: sports_scrape_sync, requires: sportsbook.sync, description: "Run a bound Actors source, read its dataset and import normalized events without writing back to Actors." }
    - { name: provider_route_set, requires: sportsbook.configure, description: "Choose a bound default provider for a role and sport." }
    - { name: sports_sync, requires: sportsbook.sync, description: "Import normalized events or completed results from selected sports data providers." }
    - { name: odds_sync, requires: sportsbook.sync, description: "Import pre-match match-winner quotes from selected odds providers." }
    - { name: demo_load, requires: sportsbook.configure, description: "Explicitly load fictional example events and history; no live data is changed." }
    - { name: prediction_run, requires: sportsbook.propose, description: "Create an immutable experimental Elo prediction, or a clearly labeled bookmaker baseline when history is insufficient." }
    - { name: prediction_explain, requires: sportsbook.propose, description: "Generate a supplemental explanation through a selected LLM; never change probabilities or stakes." }
    - { name: bet_propose, requires: sportsbook.propose, description: "Create a single-bet paper proposal pinned to a fresh quote and prediction." }
    - { name: proposal_accept, requires: sportsbook.paper_execute, description: "Accept a proposal into a paper bankroll with atomic stake and exposure checks." }
    - { name: bet_settle, requires: sportsbook.paper_settle, description: "Record an auditable manual paper settlement: won, lost, or void." }
    - { name: odds_history, requires: sportsbook.read, description: "Read timestamped price observations for an event." }
    - { name: bankroll_create, requires: sportsbook.configure, description: "Create a paper bankroll and its risk policy." }
    - { name: bet_submit, requires: sportsbook.live_execute, description: "Live execution is unavailable in v0.2; never sends a wager." }
  ui_panels:
    - { slot: project.page, label: Sportsbook, icon: trophy, entry: /ui/SportsbookPanel.mjs }
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: sportsbook/v0.3.0, entry: mcp/sportsbook }
  port: 8080
  health_check: /health
db:
  driver: sqlite
  path: /data/sportsbook.db
  migrations: migrations/
upgrade_policy: auto-patch
