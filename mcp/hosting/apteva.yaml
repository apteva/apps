schema: apteva-app/v1

name: hosting
display_name: Hosting
version: 1.10.0
description: |
  Managed container-backed hosting control plane. Hosting provisions and
  operates hosted Apteva tenants on top of the generic Containers app,
  tracks plan limits and usage, exposes tenants through server-native
  ingress, fulfills generic Orders records for paid hosting products,
  and reacts to Billing/Subscriptions events declared in this manifest.
  Free plans are first-class and do not require Billing, Orders, or
  Subscriptions. v1.10.0 wires tenant add-on metering into generic
  Subscriptions items/usage so overage billing is reusable across
  future SaaS apps.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/hosting
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/hosting/icon.svg
tags: [hosting, tenants, containers, apteva, infrastructure]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.ingress.write
  apps:
    - name: catalog
      optional: false
    - name: containers
      optional: false
    - name: billing
      optional: true
      events:
        - invoice.paid
    - name: orders
      optional: true
    - name: subscriptions
      optional: true
      events:
        - subscription.active
        - subscription.trialing
        - subscription.past_due
        - subscription.cancelled
        - subscription.paused
        - subscription.ended
    - name: entitlements
      optional: true
    - name: auth
      optional: true
    - name: llm
      optional: true
      events:
        - llm.usage.recorded

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: hosting_product_list
      description: List hosting products/templates and their available plans.
    - name: hosting_plan_list
      description: List hosting plans, including free plans.
    - name: hosting_customer_create
      description: Find or create a hosting customer by email.
    - name: hosting_checkout_create
      description: Create a Hosting-owned sale/checkout from a Catalog price or free hosting plan. Paid plans create Billing and Subscription records; free plans provision immediately.
    - name: hosting_tenant_create
      description: Provision a hosted tenant container and expose its default hostname. If order_id/fulfillment_id are provided, reports fulfillment status back to Orders.
    - name: hosting_paid_invoice_provision
      description: Hosting-owned sale flow. Given a paid Billing invoice for a hosting product, create/claim the generic Orders record and provision the tenant.
    - name: hosting_fulfillment_provision
      description: Provision a tenant for an Orders hosting_tenant_provision fulfillment and report the tenant id back to Orders.
    - name: hosting_tenant_get
      description: Fetch one hosted tenant.
    - name: hosting_tenant_list
      description: List hosted tenants by customer, status, or plan.
    - name: hosting_tenant_suspend
      description: Stop a tenant container and mark it suspended.
    - name: hosting_tenant_resume
      description: Start a suspended or stopped tenant container.
    - name: hosting_tenant_restart
      description: Restart a hosted tenant container.
    - name: hosting_tenant_delete
      description: Destroy a hosted tenant container and remove its ingress route.
    - name: hosting_tenant_logs
      description: Tail logs for a hosted tenant.
    - name: hosting_tenant_health
      description: Probe and fetch hosted tenant health.
    - name: hosting_usage_get
      description: Return usage totals for a tenant or customer.
    - name: hosting_usage_record
      description: Record generic tenant usage and mirror it to Entitlements when installed.
    - name: hosting_usage_sync
      description: Sync generic runtime usage gauges from dependent apps and enforce hosting plan limits.
    - name: hosting_subscription_sync
      description: Apply a subscription status to a tenant lifecycle state.
    - name: hosting_addon_enable
      description: Enable a generic tenant add-on and orchestrate external app access when needed.
    - name: hosting_addon_list
      description: List tenant add-ons.
    - name: hosting_addon_suspend
      description: Suspend a tenant add-on and its external subject where supported.
    - name: hosting_addon_resume
      description: Resume a tenant add-on and its external subject where supported.
    - name: hosting_metered_invoice_create
      description: Aggregate metered overage and create a generic Billing invoice.
  ui_panels:
    - slot: project.page
      label: Hosting
      icon: server
      entry: /ui/HostingPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/hosting
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/hosting.db
  migrations: migrations/

config_schema:
  - name: default_base_domain
    type: text
    default: "hosted.apteva.local"
    label: Default base domain
    description: Base domain used for generated tenant hostnames, e.g. tenant.hosted.example.com.
  - name: default_image
    type: text
    default: "ghcr.io/apteva/apteva:latest"
    label: Default Apteva image
    description: Container image used when the selected plan does not override one.

upgrade_policy: auto-patch
