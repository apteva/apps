schema: apteva-app/v1

name: hosting
display_name: Hosting
version: 2.4.1
description: |
  Tenants on containers and machines. Hosting gives each customer a
  container or a whole machine and runs its lifecycle: set up, grant SSH
  access, suspend, resume, clean and release. A runtime profile says where
  a tenant runs (container, a fixed machine pool, or a machine created on
  demand through Instances) and what runs on it (Apteva, a Docker image,
  WordPress, or SSH access to the bare machine).
  Hosting sells nothing and listens to no payment events: SaaS plan actions,
  storefronts or operators call its tools, keyed by an external_ref, and
  every call is safe to repeat. Pool machines are reserved and assigned in
  one transaction, run one operation at a time with leases, are wiped and
  verified clean before reuse, and are quarantined for operator review when
  anything fails.
  v2.0.0 removes the 1.x checkout, Billing, Subscriptions, Orders,
  Entitlements, Auth and LLM add-on flows; callers own selling and billing.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/hosting
icon: /ui/icon.svg
icon_style: monochrome
tags: [hosting, tenants, containers, machines, instances, infrastructure]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.ingress.write
  apps:
    - name: containers
      optional: true
      reason: container tenants, and Docker products on machines
    - name: instances
      optional: true
      reason: pool machines and on-demand machines

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: hosting_tenant_create
      description: "Create a tenant on a runtime profile, keyed by external_ref (repeat calls return the same tenant). Machine profiles finish in the background; with no free machine the tenant waits, within the profile's presale_limit when set."
    - name: hosting_tenant_get
      description: "Fetch one tenant by tenant_id or external_ref, with its SSH access details, current run and recent events."
    - name: hosting_tenant_update
      description: "Update a tenant's external_ref, owner_email or metadata. Links a tenant migrated from 1.x to the caller's account id; changing an external_ref already set needs confirm equal to the tenant id."
    - name: hosting_tenant_resolve
      description: "Settle a machine tenant left by a failure: resume, release, or force_clean a validated macOS machine. Needs reviewed=true and confirm equal to the tenant id."
    - name: hosting_tenant_list
      description: "List tenants. Filters: status, profile_key, backend, owner_email, external_ref, include_released."
    - name: hosting_tenant_suspend
      description: "Suspend a tenant: stop its container, or remove SSH access to its machine. Never wipes. Repeating it is a no-op."
    - name: hosting_tenant_resume
      description: "Resume a suspended tenant: start its container, or restore SSH access. Repeating it is a no-op."
    - name: hosting_tenant_release
      description: "End a tenant now: destroy its container, wipe and recycle its pool machine, or destroy its on-demand machine. Needs confirm equal to the tenant id. Repeat calls are no-ops."
    - name: hosting_tenant_restart
      description: "Restart a tenant's container or reboot its machine."
    - name: hosting_tenant_reinstall
      description: "Erase and reinstall a macOS pool machine for the same tenant, then restore access. Destroys the customer's data. Needs confirm equal to the tenant id."
    - name: hosting_tenant_access_keys_set
      description: "Replace a machine tenant's SSH public keys. An empty list removes access."
    - name: hosting_tenant_logs
      description: "Container logs, or a machine tenant's run log and events."
    - name: hosting_tenant_health
      description: "Container health, or a machine's Instances status."
    - name: hosting_tenant_usage
      description: "Runtime usage for a tenant: container usage gauges, or machine metrics from Instances. Suitable as a SaaS usage source."
    - name: hosting_availability
      description: "Whether a profile can take a new tenant now. For pool profiles: available = machines (free now, not promised to customers already waiting) + presale (orders still taken ahead of hardware under presale_limit), with presale_note."
    - name: hosting_reservation_create
      description: "Hold a pool machine during checkout. Holds a free machine when one is not already promised to a waiting customer; otherwise a presale hold (presale: true, no machine) while the profile's presale_limit has room. Repeating the call for the same profile and external_ref returns the same hold. Holds expire after reservation_ttl_minutes."
    - name: hosting_reservation_release
      description: "Release a held pool machine early."
    - name: hosting_product_list
      description: "List what can run on a tenant: Apteva, Docker images, WordPress, dedicated machines."
    - name: hosting_profile_list
      description: "List runtime profiles (where a tenant runs and what runs on it)."
    - name: hosting_profile_upsert
      description: "Create or update a runtime profile: backend (container, machine_pool, machine_on_demand), product, pool or provider settings, and presale_limit / presale_note / presale_ready_days for pool profiles."
    - name: hosting_pool_list
      description: "List machine pools with machine counts per state."
    - name: hosting_pool_upsert
      description: "Create or update a machine pool. platform: macos or linux. New pools start with execution switched off."
    - name: hosting_pool_set_execution
      description: "Switch command execution on or off for a pool. While off, no command runs on its machines and nothing from it is for sale."
    - name: hosting_machine_add
      description: "Add an Instances host to a pool. It starts quarantined; run inspect, then validate it. The customer endpoint comes from Instances (reverse-tunnel machines use their public SSH port; enable_public_ssh turns it on) unless public_host is given."
    - name: hosting_machine_list
      description: "List pool machines with state, online status, tenant and current run."
    - name: hosting_machine_get
      description: "Fetch one pool machine with its recent runs."
    - name: hosting_machine_update
      description: "Update a machine's serial, management user, expected OS, name or customer endpoint (public_host/public_port win over Instances; an empty public_host hands it back). Setting validated needs confirm equal to the machine id."
    - name: hosting_machine_inspect
      description: "Check a machine without a tenant: install Hosting's SSH profile and reset helpers, run preflight, and confirm no customer account survives."
    - name: hosting_machine_clean
      description: "Erase a macOS machine without a tenant, verify it is clean and put it back on sale. Needs confirm equal to the machine id."
    - name: hosting_machine_set_maintenance
      description: "Take an available machine off sale (maintenance=true) or put it back (false) without re-inspecting."
    - name: hosting_machine_quarantine
      description: "Stop assigning a machine and stop every unfinished run on it."
    - name: hosting_machine_remove
      description: "Remove a machine without a tenant from its pool. The Instances host is not touched. Needs confirm equal to the machine id."
    - name: hosting_operation_get
      description: "Fetch one run with its steps and log."
    - name: hosting_operation_list
      description: "List runs. Filters: tenant_id, machine_id, status."
    - name: hosting_operation_retry
      description: "Retry a failed run after reviewing the machine and the log. Needs reviewed=true."
  ui_panels:
    - slot: project.page
      label: Hosting
      icon: server
      entry: /ui/HostingPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/hosting
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/hosting.db
  migrations: migrations/

config_schema:
  - name: default_base_domain
    type: text
    default: "hosted.apteva.local"
    label: Default base domain
    description: Base domain used for container tenant hostnames, e.g. tenant.hosted.example.com.
  - name: default_image
    type: text
    default: "ghcr.io/apteva/apteva:latest"
    label: Default Apteva image
    description: Container image for the Apteva product when a profile does not set one.
  - name: reservation_ttl_minutes
    type: text
    default: "30"
    label: Reservation hold (minutes)
    description: How long a pool machine stays held for a checkout before it goes back on sale.
  - name: stuck_after_minutes
    type: text
    default: "180"
    label: Stuck tenant alert (minutes)
    description: How long a tenant may stay provisioning, suspending, resuming or releasing before hosting.tenant.stuck is emitted.

upgrade_policy: auto-patch
