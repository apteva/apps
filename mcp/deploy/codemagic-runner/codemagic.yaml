workflows:
  apteva-ios-runner:
    name: Apteva iOS Runner
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Apteva source capsule
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/runner.py"
    artifacts:
      - /tmp/apteva-output/**/*

