schema: apteva-app/v1

name: deploy
display_name: Deploy
version: 0.17.2
description: |
  Build and release services, Android apps, and iOS apps.
  Takes a code repo (from the Code app, a local path, or a git URL),
  builds it with the framework's toolchain, and runs the result as
  a supervised child process bound to a local port. The Apteva
  server proxies traffic to live deployments under /_deploy/<slug>/.

  v0.1 supports source kinds {code, local} and frameworks {go, node, static}.
  Future runtimes (Docker, SSH-to-VPS) plug in behind the same
  Runtime interface — no schema or surface changes required.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/deploy
icon: /ui/icon.svg
icon_style: monochrome
tags: [deploy, build, runtime, android, ios, app-store, google-play, agent]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.ingress.write
    - platform.connections.execute
    - platform.connections.read_credentials
  integrations:
    - role: code
      kind: app
      required: true
      compatible_app_names: [code]
      label: Code app
      hint: Install the Code app to host repositories the Deploy app builds.
    - role: domains
      kind: app
      required: false
      compatible_app_names: [domains]
      label: Domains app
      hint: Install the Domains app to attach a custom domain to a deployment. Without it, the `domain` field on a deployment is free-text and no DNS is written.
    - role: play_store
      kind: integration
      required: false
      compatible_slugs: [google-play-developer]
      capabilities: []
      label: Google Play Developer
      hint: Required to publish signed Android App Bundles to Google Play tracks.
    - role: android_signing
      kind: integration
      required: false
      compatible_slugs: [android-upload-signing]
      capabilities: []
      label: Android Upload Signing
      hint: Required only when Deploy must sign an Android App Bundle that the project did not sign during its Gradle build.
    - role: app_store
      kind: integration
      required: false
      compatible_slugs: [app-store-connect]
      capabilities: []
      label: App Store Connect
      hint: Required to sign, upload, publish, and monitor iOS releases.
    - role: cloud_build
      kind: integration
      mode: multiple
      required: false
      compatible_slugs: [codemagic, github]
      capabilities: [build.submit, build.status, build.cancel, build.artifacts]
      label: Cloud build providers
      hint: Optional Codemagic or GitHub connections. Git-independent capsule runners do not require an integration.

provides:
  http_routes:
    - prefix: /source-capsules/
      method: GET
      no_auth: true
    - prefix: /
  mcp_tools:
    - name: deploy_init
      description: Bind a source to a service, Android, or iOS deployment.
    - name: deploy_list
      description: List deployments in this project with current build/release status.
    - name: deploy_get
      description: Full detail for one deployment — last builds, current release, URL.
    - name: deploy_env_list
      description: List environments for a deployment.
    - name: deploy_env_create
      description: Create a staging/dev environment for a deployment.
    - name: deploy_env_update
      description: Update an environment's source, variables, or build configuration.
    - name: deploy_env_destroy
      description: Archive a non-production environment.
    - name: deploy_build
      description: Build a service artifact, Android AAB, or iOS IPA.
    - name: deploy_build_cancel
      description: Cancel a pending or running cloud build.
    - name: deploy_release
      description: Start a service release or publish a mobile build to a store channel.
    - name: deploy_promote
      description: Promote a service build between environments or a mobile release between store channels.
    - name: deploy_rollout
      description: Change a Google Play production rollout fraction.
    - name: deploy_halt
      description: Halt a Google Play rollout or expire a TestFlight build.
    - name: deploy_status
      description: Current build + release state, URL, last 10 builds.
    - name: deploy_logs
      description: Tail build logs (build_id) or runtime logs (release_id).
    - name: deploy_stop
      description: Stop the live release (process killed, port freed).
    - name: deploy_destroy
      description: Stop, drop deployment, delete builds and artifacts on disk.
    - name: deploy_attach_domain
      description: "Attach an FQDN to a deployment. Validates ownership against the Domains app and upserts a DNS record pointing at the deployment. Target resolves: explicit target, then public_host config, then the box's auto-derived IP. Type is inferred from the target (IP -> A, hostname -> CNAME) unless given. Args: name (deployment) OR id, fqdn, target?, type? (CNAME|A), ttl?."
    - name: deploy_detach_domain
      description: "Clear a deployment's domain. Deletes the DNS record via the Domains app (if known) and clears the link. Args: name OR id."
    - name: deploy_list_routes
      description: "Server-side: live deployments as a route table {slug, port, domain, status} for the host-based proxy. Polled by apteva-server's host-router on a 5s tick — not intended for agent calls."
    - name: deploy_health
      description: Deployment health and artifact retention status.
    - name: deploy_update
      description: Update deployment or environment configuration.
    - name: deploy_restart
      description: Restart a service release without rebuilding.
    - name: deploy_set_env
      description: Merge environment variables into a deployment environment.
  ui_panels:
    - slot: project.page
      label: Deploy
      icon: rocket
      entry: /ui/DeployPanel.mjs
  workers:
    - name: mobile_release_sync
      schedule: "@every 1m"
    - name: cloud_build_sync
      schedule: "@every 15s"

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/deploy
  port: 8080
  health_check: /health
  storage:
    - name: deploy
      mount_path: /data

db:
  driver: sqlite
  path: /data/deploy.db
  migrations: migrations/

config_schema:
  - name: port_range_start
    type: text
    default: "7100"
    label: Port range start
    description: First port the runtime supervisor may assign to a release. Defaults to 7100 to skip macOS AirPlay (5000) and AirPlay Receiver (7000), which silently coexist with 127.0.0.1-only binds and cause EADDRINUSE at process start. Env DEPLOY_RELEASE_PORT_RANGE_START overrides this — set disjoint ranges per apteva-server when running multiple instances on one host.
  - name: port_range_end
    type: text
    default: "7999"
    label: Port range end
    description: Last port the runtime supervisor may assign to a release. Env DEPLOY_RELEASE_PORT_RANGE_END overrides this.
  - name: max_build_concurrency
    type: text
    default: "2"
    label: Max concurrent builds
    description: Hard cap on simultaneous build processes per host.
  - name: retain_rollback_builds
    type: text
    default: "3"
    label: Retained rollback builds
    description: Number of most recent successful builds to keep per deployment in addition to any build referenced by the current/live release. Older unreferenced build artifacts are pruned automatically. Env DEPLOY_RETAIN_ROLLBACK_BUILDS overrides this.
  - name: runner_token
    type: secret
    default: ""
    label: Capsule runner token
    description: Shared bearer token used to authenticate Git-independent capsule runner jobs. APTEVA_RUNNER_TOKEN overrides this value. Use at least 32 random characters.
  - name: public_host
    type: text
    default: ""
    label: Public host
    description: Host this deploy is reachable at from the public internet (e.g. "edge.acme.com" or an IP). Used as the default record target when attaching a domain. Leave empty to auto-derive the box's own IP from APTEVA_PUBLIC_URL on each attach, or pass `target` explicitly.

upgrade_policy: auto-patch
