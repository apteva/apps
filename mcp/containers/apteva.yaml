schema: apteva-app/v1

name: containers
display_name: Containers
version: 0.4.0
description: |
  Generic Docker workload runtime for Apteva. Runs container images on
  the local host or remote Instances hosts, bootstraps Docker when
  needed, manages isolated networks, Docker volumes, ports, health
  checks, bounded logs, pre-start files and secrets, pull policies,
  lifecycle actions, safe volume archive transfer, and owned asynchronous
  command executions.
  v0.4.0 adds named persistent PTY shell sessions, preserving shell state such
  as the current directory and exported variables between commands. Installed
  packages, files, services, cancellation, bounded logs, and audit events remain
  part of the same owned workload lifecycle.
  Routes, backups, and multi-container blueprints build on the same surface.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/containers
icon: /ui/icon.svg
icon_style: monochrome
tags: [containers, docker, runtime, workloads, infrastructure]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.apps.call
  integrations:
    - role: hosts
      kind: app
      required: false
      compatible_app_names: [instances]
      label: Instances app
      hint: Install Instances to run containers on remote VPS hosts. Without it, Containers manages only the local Docker host.
    - role: routes
      kind: app
      required: false
      compatible_app_names: [routes]
      label: Routes app
      hint: Install Routes to publish container workloads at hostnames.
    - role: domains
      kind: app
      required: false
      compatible_app_names: [domains]
      label: Domains app
      hint: Install Domains to write DNS records when exposing workloads.
    - role: certs
      kind: app
      required: false
      compatible_app_names: [certs]
      label: Certs app
      hint: Install Certs to issue TLS certificates for workload hostnames.
    - role: backup
      kind: app
      required: false
      compatible_app_names: [backup]
      label: Backup app
      hint: Install Backup to schedule and retain container volume snapshots.

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: containers_run
      description: "Run a Docker image as a managed workload on the local Docker host or an Instances host. Args: name, image, host_id?/instance_id?, use_local?, ports?, env?, volumes?, files?, pull_policy?, health_path?, resources?, restart_policy?, command?, working_directory?, user?. files may write up to 32 pre-start files under declared volume mount paths (1 MiB each, 4 MiB total). Secret file contents and environment values are not persisted. pull_policy controls Docker image pulls: missing, always, or never. App-created workloads are isolated to their authenticated owner install."
    - name: containers_create
      description: Alias of containers_run.
    - name: containers_get
      description: "Fetch one managed workload. Args: workload_id or id."
    - name: containers_list
      description: "List managed workloads. Args: status? optional."
    - name: containers_start
      description: "Start a stopped workload container. Args: workload_id or id."
    - name: containers_stop
      description: "Stop a running workload container. Args: workload_id or id."
    - name: containers_restart
      description: "Restart a workload container. Args: workload_id or id."
    - name: containers_destroy
      description: "Stop and remove a workload container and network. Volumes are preserved unless delete_volumes=true. Args: workload_id or id, delete_volumes?."
    - name: containers_logs
      description: "Tail workload logs. Args: workload_id or id, tail?."
    - name: containers_health
      description: "Probe a workload health URL and update health_status. Args: workload_id or id."
    - name: containers_usage_get
      description: "Measure generic workload usage metrics such as storage bytes for attached volumes. Args: workload_id or id."
    - name: containers_blueprints_list
      description: List built-in and custom container blueprints.
    - name: containers_exec_start
      description: "Start an asynchronous command inside an owned local workload container. Set session_key to reuse a stateful PTY shell so current directory and exported variables persist across commands. Writable-layer files, installed packages, named volumes, and background processes persist for the workload lifetime. Args: workload_id, argv? or shell_command?, working_directory?, env?, timeout_s?, idempotency_key?, session_key?."
      exposure: app_only
    - name: containers_exec_get
      description: "Fetch one caller-owned execution. Args: execution_id."
      exposure: app_only
    - name: containers_exec_logs
      description: "Tail bounded logs for one caller-owned execution. Args: execution_id, tail?."
      exposure: app_only
    - name: containers_exec_cancel
      description: "Cancel one caller-owned queued or running execution. Args: execution_id."
      exposure: app_only
    - name: containers_volume_import
      description: "Import a bounded tar.gz archive into a relative path of an attached named volume on a caller-owned local workload. Args: workload_id, volume, path?, archive_base64."
      exposure: app_only
    - name: containers_volume_export
      description: "Export a bounded tar.gz archive from a relative path of an attached named volume on a caller-owned local workload. Args: workload_id, volume, path?."
      exposure: app_only
  publishes:
    - name: containers.exec.started
      description: An owned container execution started.
    - name: containers.exec.completed
      description: An owned container execution exited successfully.
    - name: containers.exec.failed
      description: An owned container execution failed or timed out.
    - name: containers.exec.cancelled
      description: An owned container execution was cancelled.
  workers:
    - name: health-poll
      schedule: "@every 30s"
    - name: execution-retention
      schedule: "@every 1h"
  ui_panels:
    - slot: project.page
      label: Containers
      icon: boxes
      entry: /ui/ContainersPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/containers
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/containers.db
  migrations: migrations/

config_schema:
  - name: default_host_id
    type: select_from_app
    app: instances
    discovery:
      route: /api/instances
      response_path: instances
      value_field: id
      label_field: name
    fallback: text
    default: "0"
    label: Default container host
    description: |
      Pick the default Docker host for new Containers workloads.
      Local host (id 0) runs containers on the machine where this
      app is installed. Remote hosts come from the Instances app; when
      selected, Containers connects through Instances and bootstraps
      Docker on first use.
  - name: default_execution_timeout_seconds
    type: text
    default: "1800"
    label: Default execution timeout
    description: Default timeout in seconds for asynchronous commands.
  - name: max_execution_output_bytes
    type: text
    default: "1048576"
    label: Maximum retained execution output
    description: Maximum combined stdout/stderr bytes retained per execution.
  - name: execution_retention_hours
    type: text
    default: "24"
    label: Execution log retention
    description: Hours to retain captured execution output and runtime metadata after completion.
  - name: max_archive_bytes
    type: text
    default: "8388608"
    label: Maximum archive size
    description: Maximum compressed tar.gz bytes accepted or returned by volume transfer.
  - name: max_archive_expanded_bytes
    type: text
    default: "134217728"
    label: Maximum expanded archive size
    description: Maximum total regular-file bytes allowed after archive expansion.
  - name: max_archive_files
    type: text
    default: "20000"
    label: Maximum archive entries
    description: Maximum files, directories, and safe links allowed in one archive.

upgrade_policy: auto-patch
