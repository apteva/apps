schema: apteva-app/v1

name: web
display_name: Web
version: 0.2.5
description: |
  Browser-native web intelligence and reusable Apify-style extractors for
  agents. Provides JSON-first search, extraction, crawl, map, research,
  snapshots, durable extractor runs, and Jobs-backed schedules.

  v0.2.5 makes Computer backend selection explicit across every browser-backed
  tool. Agents are instructed to omit backend for the configured default, tool
  schemas enumerate the five valid overrides, and invalid names fail with an
  actionable error before opening a Computer session.

  v0.2.4 adds explicit private, signed, and public visibility control for
  stored viewport and smart screenshots, including snapshots produced by
  extraction and research workflows. Snapshot storage remains private by
  default, and visibility is isolated in cache identity and run output.

  v0.2.3 adds Computer browser-environment profiles to extractors and
  deterministic scheduled rotation across coherent preset pools, with resolved
  profile metadata in run output and UI auditing.

  v0.2.2 integrates Jobs v0.1.13 deterministic random daily schedules and
  stable occurrence metadata for scheduled extractor runs.

  v0.2.1 sends selector locators directly to Computer, adds redirect URL
  assertions, adopts Computer's provider-neutral proxy modes and profiles with
  fail-closed country validation, and fixes zero-retry and Browserbase timeout
  handling.

  v0.2.0 adds revisioned extractor definitions, immutable run snapshots, a
  durable worker queue, cancellation and retry, JSONL/CSV datasets, bounded
  traces, semantic browser steps, Jobs scheduling wrappers, and Extractors,
  Runs, and Schedules UI views.

  v0.1.17 hardens outbound URL handling, fixes snapshot persistence opt-outs,
  bounds research and cache growth, reconciles interrupted runs, improves
  smart snapshot positioning, and expands the Web activity UI.

  v0.1.16 adds Web's adaptive themed icon and updates the app to the current
  Apteva app SDK.

  v0.1.15 hardens cache and storage semantics, bounds SQLite payloads, honors
  visit_top and configured crawl limits, improves crawl dedupe and Unicode
  smart matching, and upgrades run/result UI states and URL safety.

  v0.1.14 dedupes near-identical nested smart snapshot regions with the same
  heading and very high visual overlap.
  v0.1.13 excludes small standalone text nodes from smart visual crops unless
  they contain contact emails for contact-style queries.
  v0.1.12 improves smart snapshot ranking by deduping exact duplicate DOM
  regions and downranking narrow leaf text nodes so full sections/cards are
  preferred over standalone headings.
  v0.1.11 verifies SoM-based cookie dismissal against the post-click visible
  controls instead of broad page text, avoiding false negatives from footer
  cookie-policy links.
  v0.1.10 uses Computer's opt-in structured Set-of-Mark targets to dismiss
  generic cookie accept banners that are visible but not exposed as DOM regions.
  v0.1.9 prevents footer/navigation containers from outranking content sections in smart snapshots.
  v0.1.8 improves smart snapshot ranking by suppressing giant container regions,
  deduping nested parent regions, and auto-dismissing common cookie banners before smart captures.
  v0.1.7 accepts JPEG browser screenshots when producing smart PNG crops.
  v0.1.6 adds smart query-matched snapshot crops using rendered DOM regions
  from Computer. v0.1.5 adds Google search and makes it the default engine. v0.1.4 makes
  search parse the live browser DOM and report blocked search
  challenge pages instead of empty results. v0.1.3 adds response caching
  controls. v0.1.2 opens real browser sessions for search, extraction, crawl, map,
  research source visits, and snapshots. Text extraction prefers rendered
  browser DOM and returns cleaner text, markdown, metadata, structured data,
  links, and images, falling back to HTTP retrieval when the lower-level
  browser capability is unavailable.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/web
icon: /ui/icon.svg
icon_style: monochrome
tags: [browser, search, research, crawl, observability]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.apps.call
  apps:
    - name: computer
      version: ">=0.7.66"
      reason: "Browser session lifecycle, rendered navigation, screenshots, and browser environments."
    - name: storage
      reason: "Persists screenshots, extracted pages, crawl maps, and research JSON."
    - name: jobs
      version: ">=0.1.13"
      reason: "Owns extractor schedules, trigger delivery, retries, and delivery history."

provides:
  http_routes:
    - prefix: /

  mcp_tools:
    - name: web_search
      description: |
        Browser-backed web search. Args: query, limit?, engine? (google|duckduckgo, default google),
        backend?, viewport?, visit_top? bool, cache?, max_age?, cache_ttl?.
        Omit backend to use Web's configured default. Valid explicit overrides
        are local, browserbase, steel, browser-engine, and service.
        Returns normalized JSON results with cache metadata.
    - name: web_extract
      description: |
        Open a URL in a browser session, extract readable text, markdown,
        metadata, structured data, links, images, and optionally store the
        artifact. Args: url, formats?, backend?, viewport?, max_chars?,
        store? bool, snapshot? bool, visibility? (private|signed|public;
        defaults to private for snapshots), cache?, max_age?, cache_ttl?.
        Omit backend to use Web's configured default; explicit overrides are
        limited to local, browserbase, steel, browser-engine, and service.
    - name: web_crawl
      description: |
        Browser-backed bounded crawl from one or more seed URLs. Args: url or
        urls, max_pages?, max_depth?, same_host?, backend?, store? bool,
        cache?, max_age?, cache_ttl?.
        Omit backend to use Web's configured default; explicit overrides are
        limited to local, browserbase, steel, browser-engine, and service.
    - name: web_map
      description: |
        Fast site map discovery from one or more seed URLs. Args: url or urls,
        max_pages?, max_depth?, same_host?, backend?, store? bool, cache?,
        max_age?, cache_ttl?.
        Omit backend to use Web's configured default; explicit overrides are
        limited to local, browserbase, steel, browser-engine, and service.
    - name: web_research
      description: |
        Multi-step browser-backed research. Args: question, queries?,
        max_results?, max_sources?, backend?, snapshots? bool, store? bool,
        visibility? (private|signed|public; defaults to private for snapshots),
        cache?, max_age?, cache_ttl?.
        Omit backend to use Web's configured default; explicit overrides are
        limited to local, browserbase, steel, browser-engine, and service.
        Returns an extractive report JSON with citations, sources, gaps, and
        artifacts.
    - name: web_snapshot
      description: |
        Capture visual evidence for a URL or existing computer session.
        Args: url? or session_id?, backend?, viewport?, label?, mode?
        (viewport|smart), query?, max_shots?, crop?, cookie_handling?
        (auto|off), store? bool, visibility? (private|signed|public; default
        private), cache?, max_age?, cache_ttl?. Smart mode ranks rendered DOM regions against the
        query, auto-dismisses common cookie banners, and returns cropped shots. Snapshot cache is disabled unless
        max_age is set. Returns screenshot metadata, storage_id/url when stored,
        effective visibility, shots for smart mode, and session metadata.
        Omit backend to use Web's configured default; explicit overrides are
        limited to local, browserbase, steel, browser-engine, and service.
    - name: web_extractor_save
      description: Create or update a reusable extractor definition and revision.
    - name: web_extractor_get
      description: Get an extractor by id or name.
    - name: web_extractor_list
      description: List extractor definitions.
    - name: web_extractor_delete
      description: Delete a definition while preserving historical run snapshots.
    - name: web_extractor_run
      description: Queue an extractor run and return immediately, with deterministic scheduled preset-pool selection.
    - name: web_run_get
      description: Get a run with bounded output, immutable definition snapshot, and artifacts.
    - name: web_run_cancel
      description: Cancel a queued or running extractor run.
    - name: web_run_retry
      description: Retry an extractor run from its immutable snapshot.
    - name: web_extractor_schedule
      description: Create or replace a Jobs-owned extractor schedule, including deterministic random daily schedules and preset-pool rotation.
    - name: web_extractor_schedules
      description: List Web extractor schedules or one schedule's delivery runs.
    - name: web_extractor_unschedule
      description: Cancel a Jobs-owned extractor schedule.

  ui_panels:
    - slot: project.page
      label: Web
      icon: globe
      entry: /ui/WebPanel.mjs

  ui_components:
    - name: web-result-card
      entry: /ui/WebResultCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [title, url]
        properties:
          title: { type: string }
          url: { type: string }
          snippet: { type: string }
          source: { type: string }
      preview_props:
        preview: true
        title: "Example result"
        url: "https://example.com"
        snippet: "A browser-backed search result."
        source: "duckduckgo"

  skills:
    - name: how-to-use-web
      command: /web
      body_file: skills/how-to-use-web.md
      description: |
        Teaches the agent when to use browser-backed search, extract, crawl,
        map, research, and snapshot tools.
      metadata:
        category: browsing

  workers:
    - name: extractor-runner
      schedule: "@every 2s"

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: web/v0.2.5
    entry: mcp/web
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/web.db
  migrations: migrations/

config_schema:
  - name: default_search_engine
    type: text
    default: google
    label: Default search engine
  - name: default_backend
    type: text
    label: Default browser backend
    description: "Optional computer backend override: local, browserbase, steel, browser-engine, or service."
  - name: max_pages
    type: number
    default: 25
    label: Default and maximum crawl pages
  - name: store_artifacts_by_default
    type: bool
    default: true
    label: Store artifacts by default
  - name: allow_private_networks
    type: bool
    default: false
    label: Allow private network URLs
    description: "Permit localhost, private, link-local, and other non-public destinations. Keep disabled for untrusted agent inputs."
  - name: history_retention_days
    type: number
    default: 90
    label: Activity history retention
    description: "Days to retain Web run and artifact metadata. Set to 0 to keep metadata indefinitely. Stored files are not deleted."

upgrade_policy: auto-patch
