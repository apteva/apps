{{ define "footer" }}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <strong>{{ .SiteTitle }}</strong>
      {{ if .SiteTagline }}<p class="site-tagline">{{ .SiteTagline }}</p>{{ end }}
    </div>
    <p class="site-footer__copy">
      &copy; {{ formatDate .Now "2006" }} {{ .SiteTitle }} &middot;
      Powered by <a href="https://github.com/apteva">Apteva</a>
    </p>
  </div>
</footer>
{{ end }}
