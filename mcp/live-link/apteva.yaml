schema: apteva-app/v1

name: live-link
display_name: Live Link
version: 0.6.1
description: |
  Publish a locally-installed Apteva instance through one of four HTTPS
  tunnel providers selected explicitly in the Live Link panel:

  - quick (default): Cloudflare Quick Tunnel. Anonymous, free, fresh
    *.trycloudflare.com URL on every start. Zero config — install the
    app, click "Go live", copy the URL.

  - cloudflare-named: a stable URL on a Cloudflare zone you own (e.g.
    https://tunnel.example.com). Bind the cloudflare integration at
    install time (one API token), then pick a zone from the dropdown
    and a subdomain in the panel. The app calls the integration's
    cfd_tunnel + DNS tools through the platform proxy — your account API
    token never leaves the platform. Restarts reuse the same URL;
    expose_destroy reverses everything (CNAME + tunnel) on Cloudflare.

  - ngrok: a random ngrok URL or an optional reserved/custom domain. Bind
    an ngrok connection once; credentials are injected only into the child
    process environment and are never stored in the app database.

  - zrok: a stable, free public URL backed by a reserved zrok v2 name.
    Bind a zrok connection using its one-time environment enable token,
    reserve a name in the panel, then go live. The token is never placed
    in process arguments or the app database; zrok's private native
    environment files are isolated inside this app install.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/live-link
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/live-link/icon.svg
tags: [tunnel, expose, public-url, cloudflared, ngrok, zrok, infrastructure, dev]

scopes: [global]
min_apteva_version: "0.18.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute            # cloudflare-named: call cfd_tunnel + DNS tools via integration runner
    - platform.connections.read_credentials   # ngrok/zrok: read bound agent credentials just in time
  integrations:
    # Cloudflare integration — used in named mode to list zones, manage
    # cfd_tunnels, and upsert/delete the CNAME. Optional at install
    # time so quick mode works without setup; named-mode start fails
    # with a clear error if the operator picks named without binding
    # this first.
    - role: cloudflare
      kind: integration
      compatible_slugs: [cloudflare]
      capabilities: [dns.write, tunnel.manage]
      tools:
        # Logical capability → upstream tool name mapping. Capability
        # strings are app-internal; the upstream names match what the
        # integration catalog declares.
        zones.list:               list_zones
        tunnels.list:             list_tunnels
        tunnels.create:           create_tunnel
        tunnels.token:            get_tunnel_token
        tunnels.update_config:    update_tunnel_configuration
        tunnels.delete:           delete_tunnel
        dns.list:                 list_dns_records
        dns.create:               create_dns_record
        dns.update:               update_dns_record
        dns.delete:               delete_dns_record
      required: false
      label: "Cloudflare (named mode)"
      hint: "Required for named mode (stable URL on your own domain). Quick mode works without this."
    # ngrok integration — alternative tunnel provider. Bind it and
    # live-link uses the ngrok agent instead of cloudflared. The
    # catalog's tools[] is empty (we drive the local ngrok binary
    # directly with the authtoken — no REST calls needed for v1) but
    # the binding gives us access to the authtoken via
    # PlatformAPI().GetConnectionCredentials.
    - role: ngrok
      kind: integration
      compatible_slugs: [ngrok]
      capabilities: []
      tools: {}
      required: false
      label: "ngrok (alternative provider)"
      hint: "Bind your ngrok authtoken, then select ngrok in the Live Link panel. Binding alone does not silently switch providers."
    # zrok integration — stores the one-time environment enable token.
    # Live Link enables an isolated zrok2 environment in-process over HTTPS,
    # reserves/deletes names through the zrok API, and runs the local zrok2
    # agent without ever putting the token in argv.
    - role: zrok
      kind: integration
      compatible_slugs: [zrok]
      capabilities: []
      tools: {}
      required: false
      label: "zrok (stable free URL)"
      hint: "Create a zrok connection with an environment enable token, bind it here, then reserve a stable public name in the Live Link panel."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: expose_start
      description: Start the explicitly selected public tunnel provider and return its URL.
    - name: expose_stop
      description: Stop the running tunnel, if any. Named tunnels persist on Cloudflare — use expose_destroy to remove them.
    - name: expose_status
      description: Report whether a tunnel is currently running, its public URL, and which mode is configured.
    - name: expose_destroy
      description: Destroy a provider's persistent resource (Cloudflare named tunnel or zrok reserved name). Refuses while running.
  ui_panels:
    - slot: project.page
      label: Live Link
      icon: globe
      entry: /ui/LiveLinkPanel.mjs
  workers: []

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/live-link
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/live-link.db
  migrations: migrations/

config_schema:
  - name: target_url
    type: text
    default: ""
    label: Target URL (optional)
    description: |
      The local URL the tunnel should forward to. Leave empty to use
      APTEVA_GATEWAY_URL (the platform's own URL), which is the right
      answer for almost every install. Override only if you want to
      tunnel a different local service running on the same host.
  - name: cloudflared_path
    type: text
    default: ""
    label: cloudflared binary (override)
    description: |
      Optional path to a cloudflared binary you already manage. Leave empty
      to let the app handle it: it will look on $PATH first, fall back to a
      previously auto-installed copy in the install's data dir, and as a
      last resort download the pinned, SHA-256-verified cloudflared 2026.7.1
      release (~40MB, one-time, on the first "Go live" click).
  - name: ngrok_path
    type: text
    default: ""
    label: ngrok binary (override)
    description: |
      Optional path to an ngrok agent you already manage. Same fallback
      shape as cloudflared_path: $PATH → previously auto-installed copy
      → download the pinned, SHA-256-verified ngrok 3.39.9 build (~20MB). Only
      relevant when the ngrok integration is bound.
  - name: ngrok_domain
    type: text
    default: ""
    label: ngrok reserved domain (paid plans)
    description: |
      Optional. Paid ngrok plans can reserve a hostname (e.g.
      yourname.ngrok.app) that survives agent restarts. Set this to
      pin the public URL across "Go live" cycles; leave empty to let
      ngrok assign a fresh random *.ngrok-free.app per start (free
      tier default).
  - name: zrok2_path
    type: text
    default: ""
    label: zrok2 binary (override)
    description: |
      Optional path to a zrok2 binary you already manage. Leave empty to use
      $PATH, a previously installed app-local copy, or a pinned,
      SHA-256-verified zrok 2.0.4 download. Only used by the zrok provider.
  - name: auto_restart_on_boot
    type: toggle
    default: "true"
    label: Auto-restart on boot
    description: |
      Persist the operator's live/off intent separately from subprocess
      state. When live, bring the selected provider back after clean server
      restarts, crashes, or redeploys. Off requires a manual start.

upgrade_policy: auto-patch
