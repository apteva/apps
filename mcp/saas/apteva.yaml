schema: apteva-app/v1

name: saas
display_name: SaaS
version: 0.6.0
description: |
  Shared SaaS access control for Apteva apps. SaaS packages installed
  apps into sellable plans, creates customer accounts backed by Auth
  organizations, grants Entitlements, stores live usage gauges from
  existing app tools, orchestrates Catalog discounts, and applies
  subscription lifecycle state, and orchestrates same-product plan changes
  with durable proration and payment continuation. It does not install apps,
  run containers, or own catalog eligibility, subscriptions, invoices, or
  payments directly.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/saas
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/saas/icon.svg
tags: [saas, access, subscriptions, entitlements, usage]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  dynamic_app_calls: true
  permissions:
    - db.write.app
    - platform.apps.call
  apps:
    - name: catalog
      version: ">=0.2.0"
      reason: price resolution plus generic discount reservation and redemption
      optional: false
    - name: billing
      version: ">=0.8.17"
      reason: durable invoices, Stripe payment links, reusable payment methods, and payment lifecycle events
      optional: false
      events:
        - invoice.paid
        - invoice.voided
        - invoice.refunded
        - payment_method.attached
    - name: subscriptions
      version: ">=0.6.0"
      reason: durable trial expiration, cycle-aware discounts, invoice preparation, and cycle-safe subscription item changes
      optional: false
      events:
        - subscription.active
        - subscription.trialing
        - subscription.past_due
        - subscription.paused
        - subscription.cancelled
        - subscription.ended
        - subscription.cycle_due
        - subscription.change.applied
    - name: entitlements
      version: ">=0.2.0"
      optional: false
    - name: auth
      optional: false
    - name: messaging
      optional: true
    - name: analytics
      optional: true

provides:
  http_routes:
    - prefix: /
  permissions:
    - name: saas.read
      description: Read SaaS plans, accounts, checkouts, usage, and access status.
    - name: saas.checkout
      description: Start customer checkouts using configured SaaS plans.
    - name: saas.admin
      description: Configure plans and fulfillment, manage accounts, and record administrative payments.
  publishes:
    - name: saas.quota.approaching
      description: Account usage entered the configured warning range below a plan quota.
      payload: &quota_event_payload
        account_id: string
        customer_id: integer
        auth_org_id: integer
        auth_user_id: integer
        plan_key: string
        feature_key: string
        quantity: integer
        limit: integer
        percentage: number
        threshold_percent: integer
        previous_state: string
        state: string
    - name: saas.quota.reached
      description: Account usage reached a plan quota exactly.
      payload: *quota_event_payload
    - name: saas.quota.exceeded
      description: Account usage exceeded a plan quota.
      payload: *quota_event_payload
    - name: saas.quota.recovered
      description: Account usage moved down from its previous quota state.
      payload: *quota_event_payload
    - name: saas.account.plan_changed
      description: A durable same-product upgrade, downgrade, or lateral plan change completed.
      payload:
        plan_change_id: string
        account_id: string
        customer_id: integer
        from_plan_key: string
        target_plan_key: string
        change_kind: string
  mcp_tools:
    - name: saas_plan_list
      description: List SaaS plans and their features, limits, and usage sources.
      requires: saas.read
    - name: saas_plan_get
      description: Fetch one SaaS plan.
      requires: saas.read
    - name: saas_plan_upsert
      description: Create or update a SaaS plan linked to Catalog pricing and an optional automatic Catalog discount.
      requires: saas.admin
    - name: saas_plan_feature_add
      description: Add a feature grant to a SaaS plan.
      requires: saas.admin
    - name: saas_plan_limit_set
      description: Set a live usage limit for a SaaS plan.
      requires: saas.admin
    - name: saas_plan_usage_source_add
      description: Register an app/tool plus response extraction config for live usage.
      requires: saas.admin
    - name: saas_plan_action_add
      description: Register a generic fulfillment action that calls another app/tool on a SaaS lifecycle event.
      requires: saas.admin
    - name: saas_plan_action_update
      description: Update an existing generic fulfillment action by id.
      requires: saas.admin
    - name: saas_plan_action_list
      description: List generic fulfillment actions for a plan.
      requires: saas.read
    - name: saas_customer_create
      description: Find or create a SaaS customer by email.
      requires: saas.admin
    - name: saas_fulfillment_run
      description: Run or retry configured fulfillment actions for a SaaS account lifecycle event.
      requires: saas.admin
    - name: saas_checkout_create
      description: Orchestrate free activation, Catalog discounts, no-card trials, or paid Billing/Subscription checkout for a SaaS account.
      requires: saas.checkout
    - name: saas_checkout_get
      description: Fetch durable checkout status and any payment or setup URL.
      requires: saas.checkout
    - name: saas_checkout_mark_paid
      description: Administratively record a manual checkout payment through Billing.
      requires: saas.admin
    - name: saas_account_create
      description: Create a SaaS account, Auth organization, Entitlement grants, and plan limits.
      requires: saas.admin
    - name: saas_account_get
      description: Fetch one SaaS account.
      requires: saas.read
    - name: saas_account_reconcile
      description: Repair Subscription metadata and Entitlements projections from the account's authoritative SaaS plan.
      requires: saas.admin
    - name: saas_account_change_plan
      description: Upgrade or downgrade an active account within one Catalog product, including proration and payment orchestration.
      requires: saas.admin
    - name: saas_plan_change_get
      description: Fetch durable plan-change state and any payment URL.
      requires: saas.read
    - name: saas_account_list
      description: List SaaS accounts with customer and Billing summaries; filter by account age and payment dates.
      requires: saas.read
    - name: saas_billing_sync
      description: Refresh SaaS Billing projections from linked Billing invoices for backfill or repair.
      requires: saas.admin
    - name: saas_account_suspend
      description: Suspend a SaaS account and record lifecycle state.
      requires: saas.admin
    - name: saas_account_resume
      description: Resume a suspended, past-due, or cancelled SaaS account.
      requires: saas.admin
    - name: saas_account_cancel
      description: Cancel a SaaS account.
      requires: saas.admin
    - name: saas_subscription_sync
      description: Apply a subscription lifecycle status to a SaaS account.
      requires: saas.admin
    - name: saas_usage_sync
      description: Pull live usage gauges from configured app usage sources.
      requires: saas.admin
    - name: saas_usage_record
      description: Upsert one live usage gauge for a SaaS account.
      requires: saas.admin
    - name: saas_usage_get
      description: Return current live usage totals and plan limits.
      requires: saas.read
    - name: saas_access_check
      description: Check whether a SaaS account is active and within limit for a feature.
      requires: saas.read
  ui_panels:
    - slot: project.page
      label: SaaS
      icon: badge-dollar-sign
      entry: /ui/SaaSPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/saas
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/saas.db
  migrations: migrations/

config_schema:
  - name: usage_sync_concurrency
    type: number
    default: 8
    label: Usage sync concurrency
    description: Maximum number of SaaS accounts synchronized concurrently.
  - name: usage_sync_timeout_seconds
    type: number
    default: 30
    label: Usage source timeout
    description: Maximum time to wait for one live usage source call.
  - name: usage_freshness_seconds
    type: number
    default: 300
    label: Usage freshness
    description: Age after which live usage is reported as unknown.
  - name: refund_behavior
    type: string
    default: past_due
    label: Refund behavior
    description: Account transition after an invoice refund. Supported values are past_due, cancel, or ignore.

upgrade_policy: auto-patch
