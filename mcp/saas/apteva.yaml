schema: apteva-app/v1

name: saas
display_name: SaaS
version: 0.14.1
description: |
  Shared SaaS access control for Apteva apps. SaaS packages installed
  apps into sellable plans, creates customer accounts backed by Auth
  organizations, grants Entitlements, stores live usage gauges from
  existing app tools, orchestrates Catalog discounts, and applies
  subscription lifecycle state, and orchestrates same-product plan changes
  with durable proration and payment continuation. Catalog products remain
  the explicit boundary between independently sold SaaS products. It does not install apps,
  run containers, or own catalog eligibility, subscriptions, invoices, or
  payments directly.
  v0.8.0 adds provider-independent recurring collection policy: SaaS chooses
  automatic collection or invoice links while Billing owns payment execution.
  v0.8.1 makes automatic collection the default for new paid plans while
  preserving the invoice behavior of plans created before the upgrade.
  v0.9.0 adds transactional email through the optional messaging app:
  payment-link delivery, payment receipts, failed-payment notices, and a
  trial-ending reminder sweep. All sends are best-effort — installs
  without messaging keep collecting payments unchanged.
  v0.9.1 adds optional CRM customer synchronization. SaaS customers are
  upserted by email as CRM contacts, the contact link is stored durably,
  and failed or unavailable CRM calls retry without blocking checkout.
  v0.10.0 adds integration-backed fulfillment and secure, app-owned managed
  connections so SaaS can push idempotent desired state to customer Apteva
  instances without storing provider or instance credentials in SaaS data.
  v0.10.1 fixes managed grant revocation, fulfillment idempotency, delayed
  payment events, billing recovery, plan-change scheduling, usage freshness,
  account pagination, and fulfillment history cleanup performance.
  v0.11.0 adds durable one-time credit-pack checkout orchestration. Catalog
  defines metered one-time prices, Checkout preserves their metadata, Billing
  emits payment/refund events, and Entitlements owns the append-only credit
  ledger and reservations.
  v0.12.0 adds prepaid plans (billing_mode: prepaid): accounts run on a
  Credits wallet instead of a subscription, with optional signup credit and
  a low-balance threshold. Plan meters link usage (e.g. llm model:text-fast)
  to Catalog metered prices, saas_usage_authorize / saas_usage_settle act as
  the per-request admission hook (hold, then commit or release), account API
  keys are issued through the plan's credential provider (llm by default),
  and low-balance and top-up receipt emails go out through messaging.
  v0.12.1 cancels the linked subscription when an account is cancelled
  (at period end when the plan sets cancel_at_period_end), retries failed
  cancels from reconcile and the subscription-cancel-sync worker, and never
  bills a renewal for a cancelled account.
  v0.12.2 returns the priced output limit (max_output_tokens) from
  saas_usage_authorize so llm caps the provider request and settle cannot
  overrun the hold.
  v0.12.3 pads the input-token estimate when pricing a hold
  (input_estimate_margin_pct plan metadata, default 20, 0 turns it off).
  v0.13.0 adds plan metadata auth_org (per_account default, or none for
  products with a shared Auth org), keeps access until the paid period
  ends when cancelling on a cancel_at_period_end plan (immediate: true cuts
  it now), validates saas_checkout_mark_paid methods up front, and emits
  saas.checkout.paid once per paid checkout for conversion tracking.
  v0.13.1 fixes account emails (channel email, plan email_from /
  email_from_name sender, messaging status failed recorded as
  notification.failed, retried from an outbox by the email-outbox worker)
  and stops account_past_due actions from running during the initial paid
  checkout.
  v0.13.2 passes idempotency_key to an app action only when the target
  tool declares it, so tools that reject unknown fields (containers_run)
  no longer fail every fulfillment call.
  v0.14.0 adds recurring included usage: plan metadata included_usage
  (e.g. 60 minutes a month per meter) is granted each period as an
  expiring Credits lot in its own wallet, spent before paid credit by
  saas_usage_authorize / saas_usage_settle (new estimated_quantity /
  quantity and per-unit meter prices), and reported by
  saas_account_included_usage, saas_access_check and saas_usage_get.
  v0.14.1 makes included usage safe to bill with: usage past the estimate
  is taken from the allowance and then charged at the unit price (no
  shortfall), quantity meters always get a hold (1 unit if no estimate)
  that lasts 24 hours (hold_seconds) and expired holds are still billed,
  authorize returns max_quantity, plan changes between monthly and
  billing-cycle periods no longer stack allowances, raising an amount
  grants the extra, the first request of a period grants it on the spot,
  and the worker backs off lapsed cycles and drains every due account.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/saas
icon: /ui/icon.svg
icon_style: monochrome
tags: [saas, access, subscriptions, entitlements, usage]

scopes: [project, global]
min_apteva_version: "0.41.1"

requires:
  dynamic_app_calls: true
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.connections.execute
    - platform.connections.manage_owned_credentials
    - platform.managed_tenants.manage
  apps:
    - name: catalog
      version: ">=0.2.0"
      reason: price resolution plus generic discount reservation and redemption
      optional: false
    - name: billing
      version: ">=0.10.0"
      reason: durable invoices, payment links, reusable payment methods, idempotent automatic collection, and payment lifecycle events
      optional: false
      events:
        - invoice.paid
        - invoice.voided
        - invoice.refunded
        - invoice.payment_failed
        - invoice.payment_action_required
        - payment_method.attached
    - name: subscriptions
      version: ">=0.7.0"
      reason: durable trial and renewal scheduling, cycle-aware discounts, invoice preparation, and cycle-safe subscription item changes
      optional: false
      events:
        - subscription.active
        - subscription.trialing
        - subscription.past_due
        - subscription.paused
        - subscription.cancelled
        - subscription.ended
        - subscription.cycle_due
        - subscription.change.applied
    - name: entitlements
      version: ">=0.2.0"
      optional: false
    - name: auth
      optional: false
    - name: crm
      reason: Optionally sync SaaS customers as duplicate-safe CRM contacts without coupling Auth identities to CRM.
      optional: true
    - name: credits
      version: ">=0.1.0"
      reason: prepaid plans — account wallets, per-request holds and commits, spending caps, top-ups; only needed for billing_mode prepaid
      optional: true
      events:
        - credits.balance.low
        - credits.topup.paid
    - name: llm
      version: ">=0.6.0"
      reason: default credential provider for prepaid account API keys, with SaaS as the token's admission hook
      optional: true
    - name: messaging
      reason: transactional email — payment links, receipts, failed-payment notices, and trial-ending reminders; sends are best-effort and never block collection
      optional: true
    - name: analytics
      optional: true

provides:
  http_routes:
    - prefix: /
  permissions:
    - name: saas.read
      description: Read SaaS plans, accounts, checkouts, usage, and access status.
    - name: saas.checkout
      description: Start customer checkouts using configured SaaS plans.
    - name: saas.admin
      description: Configure plans and fulfillment, manage accounts, and record administrative payments.
    - name: saas.usage
      description: Authorize and settle metered usage against prepaid account credit (the admission hook other apps call).
  publishes:
    - name: saas.quota.approaching
      description: Account usage entered the configured warning range below a plan quota.
      payload: &quota_event_payload
        account_id: string
        customer_id: integer
        auth_org_id: integer
        auth_user_id: integer
        plan_key: string
        feature_key: string
        quantity: integer
        limit: integer
        percentage: number
        threshold_percent: integer
        previous_state: string
        state: string
    - name: saas.quota.reached
      description: Account usage reached a plan quota exactly.
      payload: *quota_event_payload
    - name: saas.quota.exceeded
      description: Account usage exceeded a plan quota.
      payload: *quota_event_payload
    - name: saas.quota.recovered
      description: Account usage moved down from its previous quota state.
      payload: *quota_event_payload
    - name: saas.account.plan_changed
      description: A durable same-product upgrade, downgrade, or lateral plan change completed.
      payload:
        plan_change_id: string
        account_id: string
        customer_id: integer
        from_plan_key: string
        target_plan_key: string
        change_kind: string
    - name: saas.checkout.paid
      description: A checkout's first invoice was paid. Emitted once per checkout (not for free, zero-total or trial activations); dedupe on idempotency_key.
      payload:
        checkout_id: string
        account_id: string
        plan_key: string
        invoice_id: integer
        subscription_id: integer
        amount_cents: integer
        currency: string
        paid_at: string
        idempotency_key: string
  mcp_tools:
    - name: saas_plan_list
      description: List SaaS plans with their Catalog product identity, features, limits, and usage sources.
      requires: saas.read
    - name: saas_plan_get
      description: Fetch one SaaS plan with its Catalog product identity.
      requires: saas.read
    - name: saas_plan_upsert
      description: Create or update a SaaS plan linked to Catalog pricing and an optional automatic Catalog discount.
      requires: saas.admin
    - name: saas_plan_feature_add
      description: Add a feature grant to a SaaS plan.
      requires: saas.admin
    - name: saas_plan_limit_set
      description: Set a live usage limit for a SaaS plan.
      requires: saas.admin
    - name: saas_plan_usage_source_add
      description: Register an app/tool plus response extraction config for live usage.
      requires: saas.admin
    - name: saas_plan_action_add
      description: Register a generic fulfillment action with durable, configurable redaction that calls another app/tool on a SaaS lifecycle event.
      requires: saas.admin
    - name: saas_plan_action_update
      description: Update an existing generic fulfillment action and its persistence policy by id.
      requires: saas.admin
    - name: saas_plan_action_list
      description: List generic fulfillment actions for a plan.
      requires: saas.read
    - name: saas_connection_ensure
      description: Securely create or rotate an app-owned integration connection, optionally attaching only its numeric reference to a SaaS account.
      requires: saas.admin
    - name: saas_customer_create
      description: Find or create a SaaS customer by email.
      requires: saas.admin
    - name: saas_fulfillment_run
      description: Run or retry configured fulfillment actions for a SaaS account lifecycle event.
      requires: saas.admin
    - name: saas_checkout_create
      description: Orchestrate free activation, Catalog discounts, no-card trials, or paid Billing/Subscription checkout for a SaaS account.
      requires: saas.checkout
    - name: saas_checkout_get
      description: Fetch durable checkout status and any payment or setup URL.
      requires: saas.checkout
    - name: saas_checkout_mark_paid
      description: Administratively record a manual checkout payment through Billing. method is wire (default), cash, check, other or stripe; manual is accepted as other.
      requires: saas.admin
    - name: saas_account_create
      description: Create a SaaS account, Auth organization, Entitlement grants, and plan limits.
      requires: saas.admin
    - name: saas_account_get
      description: Fetch one SaaS account.
      requires: saas.read
    - name: saas_account_reconcile
      description: Repair Subscription metadata and Entitlements projections from the account's authoritative SaaS plan. For a cancelled account, make sure its subscription is cancelled instead.
      requires: saas.admin
    - name: saas_account_change_plan
      description: Upgrade or downgrade an active account within one Catalog product, including proration and payment orchestration.
      requires: saas.admin
    - name: saas_plan_change_get
      description: Fetch durable plan-change state and any payment URL.
      requires: saas.read
    - name: saas_account_list
      description: List SaaS accounts with Catalog product, customer, account age, payment date, and Billing filters and summaries.
      requires: saas.read
    - name: saas_billing_sync
      description: Refresh SaaS Billing projections from linked Billing invoices for backfill or repair.
      requires: saas.admin
    - name: saas_account_suspend
      description: Suspend a SaaS account and record lifecycle state.
      requires: saas.admin
    - name: saas_account_resume
      description: Resume a suspended, past-due, or cancelled SaaS account.
      requires: saas.admin
    - name: saas_account_cancel
      description: Cancel a SaaS account and its subscription. On a cancel_at_period_end plan the account keeps access until the paid period ends and is cancelled, with its cancel actions, when Subscriptions reports the subscription ended; immediate true cuts access now. A failed subscription cancel is recorded on the account and retried.
      requires: saas.admin
    - name: saas_subscription_sync
      description: Apply a subscription lifecycle status to a SaaS account.
      requires: saas.admin
    - name: saas_usage_sync
      description: Pull live usage gauges from configured app usage sources.
      requires: saas.admin
    - name: saas_usage_record
      description: Upsert one live usage gauge for a SaaS account.
      requires: saas.admin
    - name: saas_usage_get
      description: Return current live usage totals and plan limits.
      requires: saas.read
    - name: saas_access_check
      description: Check whether a SaaS account is active and within limit for a feature.
      requires: saas.read
    - name: saas_account_included_usage
      description: Show an account's included usage this period (included, used, remaining, reset date) and its paid balance.
      requires: saas.read
    - name: saas_credit_pack_checkout_create
      description: Create a one-time Catalog credit-pack checkout; grant credits only after invoice.paid.
      requires: saas.checkout
    - name: saas_credit_balance
      description: Return prepaid credit balance for a SaaS account and feature.
      requires: saas.read
    - name: saas_credit_transactions
      description: List prepaid credit ledger transactions for a SaaS account.
      requires: saas.read
    - name: saas_plan_meter_set
      description: Link a prepaid plan's usage meter to Catalog metered prices for input, output, cached input, per request and per unit.
      requires: saas.admin
    - name: saas_plan_meters_list
      description: List a plan's usage meters and their Catalog price links.
      requires: saas.read
    - name: saas_usage_authorize
      description: Admission hook — price a request's worst case and hold that much of the account's credit, or refuse it.
      requires: saas.usage
    - name: saas_usage_settle
      description: Admission hook settlement — commit the actual price of a finished request, or release the hold if it failed.
      requires: saas.usage
    - name: saas_account_keys_create
      description: Issue an account API key through the plan's credential provider; the secret is returned once.
      requires: saas.admin
    - name: saas_account_keys_list
      description: List an account's API keys without secrets.
      requires: saas.read
    - name: saas_account_keys_revoke
      description: Revoke one of an account's API keys.
      requires: saas.admin
  ui_panels:
    - slot: project.page
      label: SaaS
      icon: badge-dollar-sign
      entry: /ui/SaaSPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/saas
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/saas.db
  migrations: migrations/

config_schema:
  - name: usage_sync_concurrency
    type: number
    default: 8
    label: Usage sync concurrency
    description: Maximum number of SaaS accounts synchronized concurrently.
  - name: usage_sync_timeout_seconds
    type: number
    default: 30
    label: Usage source timeout
    description: Maximum time to wait for one live usage source call.
  - name: usage_freshness_seconds
    type: number
    default: 300
    label: Usage freshness
    description: Age after which live usage is reported as unknown.
  - name: refund_behavior
    type: string
    default: past_due
    label: Refund behavior
    description: Account transition after an invoice refund. Supported values are past_due, cancel, or ignore.

upgrade_policy: auto-patch
