schema: apteva-app/v1

name: simulator
display_name: Apteva Simulator
version: 0.1.19
description: |
  iOS and Android simulators on demand. Boot a device, build a repo's
  source into a .apk or .app, install + launch on a headless emulator
  or Simulator, stream the screen back to the browser, relay touch +
  key input. The Code app calls into this sidecar when it detects an
  iOS or Android repo on repos_dev_start; usable standalone for any
  flow that produces a mobile artifact (CI, manual sideload).

  v0.1.19 hardens untrusted builds and archive extraction, enforces simulator
  capacity, keeps Android streams alive across screenrecord rotations, and
  bounds authenticated stream/input/log resources. iOS live view uses idb's
  raw BGRA framebuffer stream when available and falls back to simctl JPEGs.

  Per-platform capability gating — Android works on Linux/macOS hosts
  with the Android SDK; iOS boot/view requires macOS with Xcode.
  sims_capabilities reports availability with hints when something's
  missing.

author: Apteva
tags: [mobile, simulator, emulator, ios, android, dev]

scopes: [project]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
  binaries:
    - name: adb
      executables: [adb]
      required: false
      hint: "Required for Android boot, install, live view, and input. Install Android Platform Tools with sdkmanager `platform-tools` or `brew install --cask android-platform-tools`."
      sources: {}
    - name: android-emulator
      executables: [emulator]
      required: false
      hint: "Required for Android boot. Install with sdkmanager `emulator`."
      sources: {}
    - name: android-command-line-tools
      executables: [avdmanager]
      required: false
      hint: "Required for Android AVD creation. Install Android Command-line Tools with sdkmanager `cmdline-tools;latest`."
      sources: {}
    - name: android-build-tools
      executables: [aapt]
      required: false
      hint: "Required to read APK package ids after build. Install Android Build Tools with sdkmanager `build-tools;35.0.0` and add build-tools to PATH."
      sources: {}
    - name: java
      executables: [java]
      required: false
      hint: "Required for Android Gradle builds. Install a JDK 17 or newer."
      sources: {}
    - name: gradle
      executables: [gradle]
      required: false
      hint: "Optional when the Android repo includes ./gradlew; otherwise required for Android builds."
      sources: {}
    - name: idb
      version: "1.1.7"
      executables: [idb]
      required: false
      hint: "Optional for iOS clicks, swipes, keyboard input, and high-FPS streaming. Install with `pipx install fb-idb`; native simctl screenshot streaming works without it."
      sources: {}
    - name: idb-companion
      version: "1.1.8"
      executables: [idb_companion]
      required: false
      hint: "Optional companion for idb input and high-FPS streaming. Install with `brew install idb-companion`; native simctl screenshot streaming works without it."
      sources: {}

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: sims_capabilities
      description: Report host-level support for android + ios (tools on PATH, hints when missing).
    - name: sims_list
      description: List sims known to this project (booted + shutdown).
    - name: sims_boot
      description: Boot an emulator (android) or Simulator (ios). Auto-creates the device if none matches.
    - name: sims_shutdown
      description: Shut down a sim. Idempotent.
    - name: sims_build
      description: Build a repo source archive into an APK (android) or .app (ios).
    - name: sims_install
      description: Install a previously-built artifact onto a booted sim.
    - name: sims_launch
      description: Launch an installed bundle on a booted sim.
    - name: sims_run
      description: Composite — boot-if-needed, build, install, launch, mint stream URL. The entry point Code calls.
    - name: sims_input
      description: Forward a tap/swipe/key/text event to a booted sim.
    - name: sims_logs
      description: Tail device console (logcat / idb log).
    - name: sims_screenshot
      description: One-off PNG capture from a booted sim.
    - name: sims_stream_url
      description: Mint a short-lived WebSocket URL for live screen streaming + input.
  ui_panels:
    - slot: project.page
      label: Simulator
      icon: smartphone
      entry: /ui/SimulatorPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/simulator
  port: 8090
  health_check: /health
  storage:
    - name: artifacts
      mount_path: /data

db:
  driver: sqlite
  path: /data/simulator.db
  migrations: migrations/

config_schema:
  - name: android_image
    type: text
    label: Android system image
    description: SDK Manager-style identifier for the system image used by auto-created AVDs.
    default: "system-images;android-34;google_apis;x86_64"
  - name: android_device_type
    type: text
    label: Android device profile
    description: "`avdmanager` device profile name (e.g. pixel_6, Nexus 5X)."
    default: "pixel_6"
  - name: emulator_extra_args
    type: text
    label: Extra emulator args
    description: Appended verbatim to every emulator boot. Default keeps emulators headless.
    default: "-no-window -no-audio -no-snapshot-save"
  - name: gradle_extra_args
    type: text
    label: Extra gradle args
    description: Appended to every gradle build invocation.
    default: ""
  - name: ios_runtime
    type: text
    label: Default iOS runtime
    description: simctl runtime id, e.g. "iOS-17-5". Empty = pick the newest installed runtime.
    default: ""
  - name: ios_device_type
    type: text
    label: Default iOS device type
    description: simctl device-type id (e.g. "iPhone-15-Pro").
    default: "iPhone-15-Pro"
  - name: xcodebuild_extra_args
    type: text
    label: Extra xcodebuild args
    description: Appended to every xcodebuild invocation.
    default: ""
  - name: build_env_allowlist
    type: text
    label: Build secret env allowlist
    description: "Comma-separated sensitive environment variable names explicitly allowed in project build processes. APTEVA_* variables are always blocked."
    default: ""
  - name: idb_companion_path
    type: text
    label: idb_companion binary path
    description: Override the autoresolved PATH lookup. Empty = use PATH.
    default: ""
  - name: max_concurrent_sims
    type: text
    label: Max simultaneous booted sims
    description: Global cap across android + ios. Sims and Simulator processes are RAM-hungry.
    default: "2"
  - name: stream_codec
    type: text
    label: Stream codec
    description: h264 is the only supported value in v0.1; placeholder for future codec switching.
    default: "h264"

upgrade_policy: auto-patch
