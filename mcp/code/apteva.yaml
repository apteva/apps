schema: apteva-app/v1

name: code
display_name: Apteva Code
version: 0.6.1
description: |
  Repositories — named, framework-tagged code workspaces scoped under
  Apteva projects. First-class editing tools modelled on Claude Code:
  partial reads with line numbers, exact-match string edits with
  uniqueness checks, atomic multi-edit, repo-wide grep + glob, and
  ZIP import for repository initialization or overlay updates. Native
  repo issues track bugs, feature requests, tasks, comments, and code
  links for agents and humans.
  v0.6.1 adds theme-aware syntax highlighting, sticky line numbers,
  language and line metadata, copy feedback, and clearer editor typography.
  v0.6.0 adds provider-neutral Git clone, connect, status, fetch,
  fast-forward pull, commit, diff, history, branches, and push using
  credentials from bound GitHub, GitLab, or Bitbucket connections.
  v0.5.24 adds live repository, source-file, and issue cards that
  agents can attach to chat messages and deep-link back into Code.
  v0.5.23 isolates global repository storage by repository id,
  hardens command execution and imports, protects static previews,
  and bounds generated-tree searches, logs, and process concurrency.
  v0.5.22 adds repos_run_command for finite build/test/lint/generator
  commands with exit-code semantics separate from dev preview servers.
  v0.5.21 bootstraps JS/Bun/Node dependencies before Code dev/test
  commands when node_modules is missing or dependency files changed.
  v0.5.20 makes coding tools more agent-efficient with compact grep
  modes, smaller paged reads, file outlines/excerpts, and dry-run
  unified patch previews that can be applied by patch_id.
  v0.5.20 also relocates stale patch hunks and tolerates already-refactored context when removal anchors still match.
  v0.5.17 unifies project navigation with a single top tab bar and
  renames the global code view to Repositories.
  v0.5.16 gives the project-wide Issues inbox the full panel width
  and makes issue titles the primary row text with repo metadata below.
  v0.5.15 adds a project-wide Issues inbox in the UI so operators can
  scan and create issues across all repositories without selecting a repo first.
  v0.5.14 adds project-wide issue search for agents, defaults the
  issue UI to all states, and batches field edits in the edit modal.
  v0.5.13 moves issue metadata editing into a modal and keeps the
  issue detail page focused on title, body, links, and comments.
  v0.5.12 simplifies the issue UI with quieter issue rows, fewer
  visible filters, and compact metadata chips in the detail sidebar.
  v0.5.11 separates issue lifecycle state from workflow status:
  state=open|closed, reason=completed|not_planned, and status for
  board workflow such as todo, in_progress, blocked, or done.
  v0.5.10 promotes Code and Issues to top-level repository tabs, with
  the file tree scoped to the Code tab like a GitHub-style repo view.
  v0.5.9 adds native repo issues so agents can see, work, comment on,
  link, and close bugs or feature requests directly inside Code.
  v0.1 backs files on local disk; v0.2 delegates to the Storage app
  via the cross-app RPC the SDK is gaining. Dev runs can be published
  through server-native ingress.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/code
icon: /ui/icon.svg
icon_style: monochrome
tags: [code, editor, repositories, agent]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - platform.connections.execute
    - platform.connections.read_credentials
    - platform.apps.call
    - platform.ingress.write
  binaries:
    - name: git
      executables: [git]
      required: true
      hint: Git 2.23 or newer is required for provider-neutral repository synchronization.
      sources: {}
  integrations:
    - role: git
      kind: integration
      mode: multiple
      required: false
      compatible_slugs: [github, gitlab, bitbucket]
      label: Git provider
      hint: Connect a Git provider to clone and synchronize private repositories. Public HTTPS remotes work without one.
      capabilities: [git.clone, git.fetch, git.push]
    - role: github
      kind: integration
      required: false
      compatible_slugs: [github]
      label: GitHub
      hint: Connect GitHub to import repositories. Optional — local templates work without it.
      capabilities: [repo.import]
      tools:
        list_repos: list_repos
        get_archive: get_archive
        get_repo: get_repo
    - role: simulator
      kind: app
      required: false
      compatible_app_names: [simulator]
      label: Simulator app
      hint: Install the Simulator app to run iOS/Android repos. repos_dev_start delegates mobile frameworks to it automatically.
      capabilities: [sim.run]

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: repos_list
      description: List repositories in this Apteva project.
    - name: repos_create
      description: Create a repository from a template (blank | nextjs | static | go | python).
    - name: repos_get
      description: Repository metadata and tree summary.
    - name: repos_archive
      description: Archive a repository (files retained on disk).
    - name: repos_set_deploy_hints
      description: Set build_cmd / start_cmd / port / env_json on a repository.
    - name: repos_export
      description: Export a repo as a zip archive — base64-encoded bytes for cross-app calls (used by deploy).
    - name: repos_import_github
      description: Import a GitHub repository as a local repo (gzip tarball snapshot via the bound github connection).
    - name: repos_git_import
      description: Clone a standard HTTPS Git remote into a new Code repository with history and upstream tracking.
    - name: repos_git_connect
      description: Safely connect an existing Code repository to a Git remote without overwriting differing local files.
    - name: repos_git_status
      description: Get branch, HEAD, upstream, ahead/behind, and working-tree changes.
    - name: repos_git_fetch
      description: Fetch and prune origin tracking refs without changing checked-out files.
    - name: repos_git_pull
      description: Fetch and fast-forward the current clean branch.
    - name: repos_git_commit
      description: Commit selected or all visible Code changes locally.
    - name: repos_git_push
      description: Push the current branch without force.
    - name: repos_git_diff
      description: Return a bounded unified diff.
    - name: repos_git_log
      description: List recent Git commits.
    - name: repos_git_branches
      description: List local and origin-tracking branches.
    - name: repos_git_branch_create
      description: Create a local branch without switching to it.
    - name: repos_git_switch
      description: Switch to an existing clean local branch.
    - name: repos_dev_start
      description: Start a dev/test preview process for a repo; production deploys belong in the Deploy app. Auto-installs JS dependencies when needed, auto-detects nextjs / node / go / static, and accepts run_cmd override.
    - name: repos_run_command
      description: Run a finite repo command such as build, test, lint, typecheck, or generator and return exit-code semantics.
    - name: repos_dev_stop
      description: Stop the dev process for a repo. Idempotent.
    - name: repos_dev_status
      description: Current dev run state (port, pid, status, framework, last error).
    - name: repos_dev_logs
      description: Tail the dev run's stdout/stderr log file.
    - name: issues_list
      description: List native Code issues for a repository.
    - name: issues_search
      description: Search native Code issues across all repositories in a project.
    - name: issues_get
      description: Get a native Code issue with comments, links, and activity.
    - name: issues_create
      description: Create a native Code issue for bugs, feature requests, tasks, or chores.
    - name: issues_update
      description: Update native Code issue fields such as status, priority, type, assignee, title, or body.
    - name: issues_comment
      description: Add a comment to a native Code issue.
    - name: issues_close
      description: Close a native Code issue and optionally add a resolution comment.
    - name: issues_reopen
      description: Reopen a native Code issue.
    - name: issues_link_path
      description: Link a native Code issue to a repository path or line range.
    - name: code_list_files
      description: List files in a repository, optionally recursive.
    - name: code_glob
      description: Find files in a repository by glob pattern (e.g. "**/*.tsx").
    - name: code_grep
      description: Search file contents compactly. Defaults to file paths; request content or counts when needed.
    - name: code_read_file
      description: Read a small paged slice with line numbers prefixed (cat -n format). Supports offset+limit and next_offset.
    - name: code_read_excerpt
      description: Read a targeted first/tail/range/around-line excerpt with line numbers.
    - name: code_file_outline
      description: Return a compact outline of Markdown headings and common code declarations with line numbers.
    - name: code_write_file
      description: Write or overwrite a file with full content; prefer code_apply_patch for large existing-file rewrites.
    - name: code_apply_patch
      description: Apply a unified diff across files, with dry_run preview support.
    - name: code_edit_file
      description: Exact-string replacement. Fails if old_string is not unique unless replace_all is true.
    - name: code_multi_edit
      description: Apply multiple edits to one file atomically. Each edit applies to the state after the previous one.
    - name: code_rename_path
      description: Move or rename a file or folder.
    - name: code_delete_file
      description: Delete a file or folder.
  ui_panels:
    - slot: project.page
      label: Code
      icon: code
      entry: /ui/CodePanel.mjs
  ui_components:
    - name: repository-card
      entry: /ui/RepositoryCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [repo]
        properties:
          repo: { type: string }
      preview_props: { preview: true, repo: apteva-site }
    - name: source-file-card
      entry: /ui/SourceFileCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [repo, path]
        properties:
          repo: { type: string }
          path: { type: string }
          line_start: { type: integer, minimum: 1 }
          line_end: { type: integer, minimum: 1 }
          expected_sha256: { type: string }
      preview_props: { preview: true, repo: apteva-site, path: src/App.tsx, line_start: 12, line_end: 14 }
    - name: issue-card
      entry: /ui/IssueCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [repo, issue_number]
        properties:
          repo: { type: string }
          issue_number: { type: integer, minimum: 1 }
      preview_props: { preview: true, repo: apteva-site, issue_number: 42 }

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/code
  port: 8080
  health_check: /health
  storage:
    - name: repos
      mount_path: /data

db:
  driver: sqlite
  path: /data/code.db
  migrations: migrations/

config_schema:
  - name: max_file_size_mb
    type: text
    default: "10"
    label: Max file size (MB)
    description: Per-file ceiling for writes and uploads.
  - name: max_repo_size_mb
    type: text
    default: "1024"
    label: Max repository size (MB)
    description: Soft ceiling per repository, enforced on write.

upgrade_policy: auto-patch
