name: workspace-round-trip
description: |
  A real LLM creates Code source, runs a generator in an isolated Workspaces
  environment, reviews the resulting source revision, and applies that exact
  revision back to Code. This proves the complete Code → Workspaces → Code
  round trip through real app bindings and a real Containers workload.

timeout: 180s
max_iterations: 14

setup:
  mode: autonomous
  app:
    path: ./
    bindings:
      workspaces: app
  cleanup_mcp_calls:
    - app: code
      tool: repos_workspace_destroy
      thread_id: tier3-cleanup
      args:
        slug: tier3-workspace-round-trip
        confirm: true

directive: |
  Prove that Code can safely round-trip generated source through an isolated
  workspace.

  1. Create a blank repository named "Tier 3 Workspace Round Trip" with the
     exact slug "tier3-workspace-round-trip".
  2. Write seed.txt with exactly "original\n" and remove-me.txt with exactly
     "remove this\n".
  3. Call repos_run_command once with runtime="workspace", profile="bun", and
     this command:

       printf 'generated by workspace\n' > generated.txt && printf 'workspace edit\n' >> seed.txt && rm remove-me.txt

  4. Call repos_workspace_changes. Confirm it reports generated.txt as added,
     seed.txt as modified, and remove-me.txt as deleted, with no conflict.
  5. Pass the exact workspace_digest returned by that preview to
     repos_workspace_apply.
  6. Read seed.txt and generated.txt from Code and list the repository files to
     confirm the applied contents and that remove-me.txt is gone. Then stop.

assert:
  - tool_called: repos_create
  - tool_called: code_write_file
  - tool_called_with:
      tool: repos_run_command
      args:
        runtime: workspace
        profile: bun
      count: 1
  - tool_called_with:
      tool: repos_workspace_changes
      before: repos_workspace_apply
  - tool_called_with:
      tool: repos_workspace_apply
      count: 1
  - tool_called: code_read_file
  - tool_called: code_list_files
  - http: GET /api/apps/code/api/repos/tier3-workspace-round-trip/files/seed.txt?annotated=1
    expect_field_at: content
    expect_field_contains: workspace edit
  - http: GET /api/apps/code/api/repos/tier3-workspace-round-trip/files/generated.txt?annotated=1
    expect_field_at: content
    expect_field_contains: generated by workspace
  - http: GET /api/apps/code/api/repos/tier3-workspace-round-trip/files/remove-me.txt
    expect_status: 404
  - http: GET /api/apps/code/api/repos/tier3-workspace-round-trip/tree
    expect_item_at: files
    expect_item:
      path: generated.txt
  - iterations_at_most: 14

budget:
  total_tokens: 100000
  cost_usd: 0.50
