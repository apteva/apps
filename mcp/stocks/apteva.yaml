schema: apteva-app/v1

name: stocks
display_name: Stocks
version: 0.1.0
description: |
  Explore stocks, backed by Yahoo Finance. List and filter a universe of
  tickers, open one stock to see its quote and key data, price chart, and
  dividend history. Read-only — research only, never places orders.

  v0.1 uses Yahoo's free, no-auth public endpoint directly (no binding
  needed). v0.2 adds an optional equity-data integration (yahoo-finance /
  finnhub) for richer fundamentals, and is designed to be registered as
  the equity source behind market-intel's gateway.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/stocks
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/stocks/icon.png
tags: [finance, stocks, equities, dividends, research]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app   # seeded universe + cached quotes/charts/dividends
    - net.egress     # Yahoo Finance public chart endpoint

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: search,    description: "Find stocks by symbol or name. Unknown-but-valid tickers are auto-added to the universe. Args: query, limit?." }
    - { name: list,      description: "List/filter the universe with live price, day change, and dividend yield. Args: sector?, min_yield?, sort? (name|price|change|yield), limit?." }
    - { name: get,       description: "One stock's data — name, exchange, price, day + 52-week range, volume, dividend yield + frequency, last dividend. Args: symbol." }
    - { name: chart,     description: "OHLCV price history for a stock. Args: symbol, range? (1mo|6mo|1y|5y|max), interval? (1d|1wk|1mo)." }
    - { name: dividends, description: "Dividend history + summary (trailing-12mo total, yield, frequency, growth) for a stock. Args: symbol." }
  ui_panels:
    - slot: project.page
      label: Stocks
      icon: line-chart
      entry: /ui/StocksPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/stocks
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/stocks.db
  migrations: migrations/

config_schema:
  - name: cache_ttl_seconds
    type: text
    default: "3600"
    label: Source cache TTL (seconds)
    description: How long a fetched quote/chart/dividend response is reused before re-fetching from Yahoo. Protects Yahoo's unofficial rate limit.

upgrade_policy: auto-patch
