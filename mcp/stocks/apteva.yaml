schema: apteva-app/v1

name: stocks
display_name: Stocks
version: 0.4.0
description: |
  Explore and screen stocks, backed by Yahoo Finance. Filter the S&P 1500
  universe (every Dividend Aristocrat and King included) by dividend
  yield, payout ratio, P/E, and 5-year dividend growth; open one stock to
  see its quote, price chart, dividend payout chart, and full payment
  history. Read-only — research only, never places orders.

  All data is Yahoo's free public endpoints (no API key): /chart for
  prices + dividends, and the cookie+crumb quoteSummary handshake for P/E
  and payout ratio. A rate-limited background worker keeps the universe
  snapshot warm. Designed to be registered as the equity source behind
  market-intel's gateway.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/stocks
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/stocks/icon.png
tags: [finance, stocks, equities, dividends, research]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app   # seeded universe + cached quotes/charts/dividends
    - net.egress     # Yahoo Finance public chart endpoint

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: search,    description: "Find stocks by symbol or name. Unknown-but-valid tickers are auto-added to the universe. Args: query, limit?." }
    - { name: list,      description: "List/screen the S&P 1500 by yield, payout ratio, P/E, and 5yr dividend growth. Args: sector?, min_yield?, max_payout?, max_pe?, min_growth?, sort? (name|price|change|yield|pe|payout|growth), limit?." }
    - { name: get,       description: "One stock's data — name, exchange, price, day + 52-week range, volume, P/E, payout, dividend yield + 5yr growth + frequency, last dividend. Args: symbol." }
    - { name: chart,     description: "OHLCV price history for a stock. Args: symbol, range? (1mo|6mo|1y|5y|max), interval? (1d|1wk|1mo)." }
    - { name: dividends, description: "Dividend history + summary (trailing-12mo total, yield, frequency, growth) for a stock. Args: symbol." }
    - { name: sync_status, description: "Background-warming progress (universe coverage of prices/yield/P-E) and fundamentals feed health." }
  ui_panels:
    - slot: project.page
      label: Stocks
      icon: line-chart
      entry: /ui/StocksPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/stocks
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/stocks.db
  migrations: migrations/

config_schema:
  - name: cache_ttl_seconds
    type: text
    default: "3600"
    label: Source cache TTL (seconds)
    description: How long a fetched quote/chart/dividend response is reused before re-fetching from Yahoo. Protects Yahoo's unofficial rate limit.

upgrade_policy: auto-patch
