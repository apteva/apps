schema: apteva-app/v1

name: docs
display_name: Documents
version: 0.3.0
description: |
  Generate client-facing documents (PDFs from markdown templates) and
  store them in storage. Templates live in this app's DB; agents call
  docs_render(template, data) to produce a finished PDF that lands in
  storage as a real file with all the URL/visibility/permissions
  machinery storage already provides. Pure-Go render pipeline (no
  Chromium): markdown body + Go template syntax for placeholders,
  rendered via maroto. Supports headings, lists, GFM tables, and
  images/logo (referenced as storage:<id> or inline data: URIs).

  Project-isolated templates, resource-scoped agent permissions, strict
  input validation, and an audit trail on every render — who rendered
  what template with which data — for compliance use cases. Past
  renders keep working even if the template is later edited or
  deleted, because the output is a stable storage file_id, not a
  derivation pointer.

author: Apteva
tags: [documents, pdf, templates, invoices, contracts]

scopes: [project]

requires:
  permissions:
    - db.write.app
    - platform.apps.call
  apps:
    - name: storage
      version: ">=0.10.0"
      reason: rendered PDFs are uploaded to storage; the file's URL/visibility/sharing all flow through storage's surface.

provides:
  http_routes:
    - prefix: /

  resources:
    - name: template
      label: "Document template"
      list_endpoint: /templates
      matcher: id_set
      picker: list

  permissions:
    - name: docs.read
      resource: template
      description: List + read templates.
    - name: docs.write
      resource: template
      description: Create / update / delete templates.
    - name: docs.render
      resource: template
      description: Render a document from a template.

  mcp_tools:
    # Resource authorization is resolved after slug/id lookup in HandlerCtx,
    # because resource_from cannot express "id OR slug" safely.
    - { name: docs_list_templates,  description: "List templates visible to the caller. Returns summary metadata; fetch one template for its body." }
    - { name: docs_get_template,    description: "Fetch one authorized template's full body + metadata. Args - id (int) OR slug (string)." }
    - { name: docs_create_template, description: "Create a template. Requires broad docs.write permission. Args - slug, name, body, description?, default_folder?." }
    - { name: docs_update_template, description: "Update an authorized template. Args - id, plus any of name/description/body/default_folder." }
    - { name: docs_delete_template, description: "Remove an authorized template. Past renders keep working. Args - id." }

    - { name: docs_render,          description: "Render an authorized template into Storage. Args - template_id OR template_slug, data, output_name?, output_folder?, page_size? (A4|letter|legal). Returns file metadata, render_id, and warnings." }
    - { name: docs_preview,         description: "Preview an authorized template without persisting. Inline body previews require broad docs.render permission. Args - template_id/template_slug or body, data, page_size?." }

    - { name: docs_list_renders,    description: "List authorized audit summaries. Filter by template_id, since (RFC3339), limit, offset. Data snapshots are returned only by docs_get_render." }
    - { name: docs_get_render,      description: "Fetch one authorized render including its data snapshot. Args - render_id." }

  ui_panels:
    - slot: project.page
      label: Documents
      icon: file-text
      entry: /ui/DocsPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/docs
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/docs.db
  migrations: migrations/

config_schema:
  - name: default_output_folder
    type: text
    default: "/docs/"
    label: Default output folder
    description: Where rendered PDFs land in storage when a template doesn't specify its own. Must end with a trailing slash.

  - name: page_size
    type: select
    default: "A4"
    options: ["A4", "letter", "legal"]
    label: Page size
    description: Default page size for rendered PDFs. The page_size render argument overrides it.

  - name: max_template_bytes
    type: text
    default: "524288"
    label: Maximum template size
    description: Maximum UTF-8 bytes accepted for a template body.

  - name: max_render_data_bytes
    type: text
    default: "262144"
    label: Maximum render data size
    description: Maximum JSON bytes accepted for one render data object.

  - name: max_image_bytes
    type: text
    default: "10485760"
    label: Maximum image size
    description: Maximum decoded bytes accepted for each embedded image.

  - name: max_pdf_bytes
    type: text
    default: "20971520"
    label: Maximum PDF size
    description: Maximum generated PDF size before upload.

  - name: prune_renders_older_than_days
    type: text
    default: "365"
    label: Audit retention (days)
    description: |
      The renders audit table keeps the data snapshot of every render
      for this many days, then auto-prunes. 0 = keep forever. The
      output files in storage are not affected — they're stable
      regardless of audit retention.

upgrade_policy: auto-patch
