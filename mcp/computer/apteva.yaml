schema: apteva-app/v1

name: computer
display_name: Computer
version: 0.7.22
description: |
  Watch and steer browser sessions. v0.7.22 improves date/time input.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/computer
tags: [browser, observability, ui]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.read_credentials
  integrations:
    - role: browserbase
      kind: integration
      required: false
      compatible_slugs: [browserbase]
    - role: steel
      kind: integration
      required: false
      compatible_slugs: [steel]
    - role: browser-engine
      kind: integration
      required: false
      compatible_slugs: [browser-engine]

provides:
  http_routes:
    - prefix: /

  mcp_tools:
    - name: browser_session
      description: |
        Open, resume, list, inspect, or close app-owned browser sessions.
        Args: action, session_id?, backend?, backend_session_id?, url?,
        context_id?, context_name?, auto_create_context?, persist?, timeout?,
        keep_alive?, proxy?, proxy_country?, viewport?. Browserbase honors
        timeout as max session lifetime and keep_alive=true to allow reconnect
        after disconnect. Prefer context_id returned by computer_context_list
        to reopen saved browser state; context_name works across providers
        when unique. For a reusable saved context, pass context_name with
        auto_create_context=true; omitted names are only a fallback and are
        auto-generated.
    - name: computer_use
      description: |
        Drive an app-owned browser session. Default workflow: call
        action=screenshot first; screenshots contain Set-of-Mark numeric
        badges on interactive elements. To click, use action=click with
        label=N from the latest screenshot. Prefer label over coordinate;
        use coordinate only for targets with no badge such as canvas or
        custom rendered widgets. Use action=key for browser/editor commands
        such as Tab, Backspace, Control+A, Control+Z; use action=type only
        for literal text and full date/time values such as 2026-06-05 or
        08:00 PM. After scrolling or navigation, take a
        fresh screenshot because labels are re-enumerated. Args:
        session_id, action, coordinate?, label?, text?, key?, direction?,
        amount?, duration?, annotate? (screenshot only, default true).
        Returns screenshot bytes for visual actions.
    - name: computer_context_create
      description: |
        Create or import an app-managed browser context. Args: name,
        backend?, provider_context_id?, persist_default?, metadata?,
        auto_create_provider?.
    - name: computer_context_list
      description: |
        List app-managed browser contexts. Omit backend, or pass backend=all,
        to see every saved context across providers. Use backend=default/auto
        for the Computer app default provider. Only pass a concrete backend
        when the user explicitly wants that provider.
    - name: computer_context_get
      description: |
        Fetch one browser context by id, by backend+name, or by unique name
        across all backends when backend is omitted.
    - name: computer_context_update
      description: |
        Update browser context metadata/defaults. Args: id, name?,
        provider_context_id?, persist_default?, metadata?.
    - name: computer_context_delete
      description: |
        Delete or unlink an app-managed browser context. Args: id,
        delete_provider?.
    - name: browser_open
      description: |
        Compatibility alias for browser_session(action=open). Browserbase
        honors timeout as max session lifetime and keep_alive=true to allow
        reconnect after disconnect.
    - name: browser_list
      description: |
        Compatibility alias for browser_session(action=list).
    - name: browser_screenshot
      description: |
        Capture a clean PNG of the session viewport. Args: session_id,
        annotate? (default false; set true for Set-of-Mark labels).
    - name: browser_close
      description: |
        Compatibility alias for browser_session(action=close).

  ui_panels:
    - slot: project.page
      label: Browsers
      icon: monitor
      entry: /ui/ComputerPanel.mjs

  ui_components:
    # Inline browser-session card — agent attaches after a successful
    # browser_session(open). Carries enough context (backend, URL,
    # status) to identify the session at a glance + a deep-link to
    # the operator panel for live watching.
    - name: browser-card
      entry: /ui/BrowserCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [instance_id, backend, url]
        properties:
          instance_id: { type: string }
          backend:     { type: string, enum: [local, browserbase, steel, browser-engine, service] }
          url:         { type: string }
          status:      { type: string }
      preview_props:
        preview: true
        instance_id: "demo-instance"
        backend: "local"
        url: "https://example.com"
        status: "active"

    # Annotated screenshot — agent attaches after computer_use(screenshot).
    # Renders the image with SoM badges as an SVG
    # overlay so the operator sees what the agent sees AND what it's
    # about to act on.
    - name: screenshot-with-som
      entry: /ui/ScreenshotCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [screenshot_url]
        properties:
          screenshot_url: { type: string }
          som:
            type: array
            items:
              type: object
              properties:
                label: { type: integer }
                x:     { type: number }
                y:     { type: number }
                w:     { type: number }
                h:     { type: number }
                kind:  { type: string }
          caption: { type: string }
      preview_props:
        preview: true

    # Live screencast — defaults to a polled thumbnail (cheap on
    # long transcripts), upgrades to full CDP screencast canvas when
    # the operator clicks expand or the agent passes mode:"live".
    - name: live-view
      entry: /ui/LiveCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [instance_id]
        properties:
          instance_id: { type: string }
          height:      { type: integer, default: 360 }
          mode:
            type: string
            enum: [thumb, live]
            default: thumb
      preview_props:
        preview: true
        instance_id: "demo-instance"

    # Multi-step browse summary — horizontal strip of recently visited
    # pages with thumbnails and titles. Saves the agent from listing
    # eight URLs in prose.
    - name: navigation-timeline
      entry: /ui/TimelineCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [steps]
        properties:
          steps:
            type: array
            items:
              type: object
              properties:
                url:       { type: string }
                title:     { type: string }
                thumbnail: { type: string }
                ts:        { type: string }
      preview_props:
        preview: true

  publishes:
    - name: session.opened
      description: A browser session was opened or resumed by the Computer app.
      payload:
        session_id: string
        backend: string
        backend_session_id: string
        app_context_id: string
        context_name: string
        context_id: string
        persist: boolean
        current_url: string
    - name: session.closed
      description: A browser session was explicitly closed.
      payload:
        session_id: string
        backend: string
        app_context_id: string
        context_name: string
        persist: boolean
    - name: session.reaped
      description: A browser session was closed by the idle reaper.
      payload:
        session_id: string
        backend: string
        idle_seconds: integer
        app_context_id: string
        context_name: string
        persist: boolean
    - name: session.action
      description: A computer_use action completed successfully in a browser session.
      payload:
        session_id: string
        backend: string
        action: string
        label: integer
        coordinate: string
        text_length: integer
        key: string
        current_url: string
    - name: context.created
      description: An app-managed browser context was created or imported.
      payload:
        id: string
        name: string
        backend: string
        provider_context_id: string
        persist_default: boolean
        auto_created: boolean
    - name: context.updated
      description: An app-managed browser context was updated.
      payload:
        id: string
        name: string
        backend: string
        provider_context_id: string
        persist_default: boolean
        auto_created: boolean
    - name: context.deleted
      description: An app-managed browser context was deleted or unlinked.
      payload:
        id: string
        name: string
        backend: string
        provider_context_id: string
        provider_deleted: boolean
    - name: settings.updated
      description: Computer app provider settings were updated.
      payload:
        default_backend: string
        lock_backend: boolean

  skills:
    - name: how-to-use-computer
      command: /computer
      body_file: skills/how-to-use-computer.md
      description: |
        Teaches the agent which chat component to attach for which
        browser action. Loads on browser_session and computer_use
        tool calls. Render-only attachments — for human-in-the-loop
        questions, use the existing pace() + console-injection
        pattern instead.
      metadata:
        category: browsing
        icon: 🖥️

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/computer
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/computer.db
  migrations: migrations/

upgrade_policy: auto-patch
