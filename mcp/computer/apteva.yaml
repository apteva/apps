schema: apteva-app/v1

name: computer
display_name: Computer
version: 0.7.70
description: |
  Watch, steer, and replay hosted browser sessions. v0.7.70 adds semantic
  scroll regions, observed movement feedback, stable target revision guards,
  corrected risk metadata, and verified rich-text paragraph entry.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/computer
icon: /ui/icon.svg
icon_style: monochrome
tags: [browser, observability, ui]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.read_credentials
    - platform.connections.execute
  integrations:
    - role: browserbase
      kind: integration
      required: false
      compatible_slugs: [browserbase]
    - role: steel
      kind: integration
      required: false
      compatible_slugs: [steel]
    - role: browser-engine
      kind: integration
      required: false
      compatible_slugs: [browser-engine]
    - role: proxy-provider
      kind: integration
      mode: multiple
      required: false
      compatible_slugs: [dataimpulse, iproyal, proxy-cheap]

provides:
  http_routes:
    - prefix: /

  mcp_tools:
    - name: browser_session
      description: |
        Open a fresh app-owned browser session, inspect it, close it, or switch
        its tabs. Args: action, session_id?, tab_id?, backend?, url?,
        context_id?, context_name?, auto_create_context?, persist?, timeout?,
        proxy? (legacy), proxy_mode?, proxy_profile?, proxy_country?,
        proxy_sticky?, viewport?, environment?, presentation_mode?. environment
        is opt-in for newly-created sessions and can set user agent,
        locale/languages, timezone, geolocation, device scale, mobile, and
        touch. Omit it to preserve normal agent defaults. Use
        presentation_mode=demo for a visible cursor, click feedback, human-paced
        typing, non-interactive cues for structured control changes, and longer
        holds in user-facing walkthroughs; fast is the default and preserves
        normal automation behavior. Presentation overlays never receive pointer
        events or replace the agent's underlying action. session_id is the app-owned live br_* handle for
        status/close/computer_use only. Usually omit viewport to use Computer's
        default desktop viewport, 1600x800. Pass viewport when a specific
        resolution is needed, for example mobile/tablet testing or a
        site-specific requirement. Always use action=open for new browsing
        work. To continue saved login and browser state, open a new session
        with context_id or context_name; do not reuse a prior
        session_id. For tab control, call
        browser_session(action=tabs) to list
        open tabs, then browser_session(action=switch_tab, tab_id=...) or
        browser_session(action=close_tab, tab_id=...). Do not use keyboard
        shortcuts such as Ctrl+Tab, Ctrl+PageDown, or Ctrl+1-9 to switch
        browser tabs. Browserbase honors timeout as max session lifetime. Prefer context_id returned by computer_context_list
        to reopen saved browser state; context_name works across providers when
        unique. For a reusable saved context, pass context_name with
        auto_create_context=true; omitted names are only a fallback and are
        auto-generated. Sessions consume local or cloud resources. When the
        browser work is complete and the user did not explicitly ask to keep
        the browser open, close it with browser_session(action=close,
        session_id=...). Closing is especially important for Browserbase/Steel
        sessions and persisted contexts because it releases provider resources
        and lets context state flush cleanly. Open, status, and close results
        include view, a copyable browser-view component reference containing
        only session_id.
        Proxy routing is provider-neutral: use proxy_mode=managed for the
        selected browser backend's proxy, proxy_mode=profile with a profile
        returned by computer_proxy_profile_list for an external provider, or
        proxy_mode=direct to explicitly disable proxies.
    - name: computer_use
      description: |
        Drive an app-owned browser session. Default workflow: call
        action=screenshot first; screenshots contain Set-of-Mark numeric
        badges on interactive elements. To click, use action=click with
        label=N from the latest screenshot. label must be >= 1; do not
        pass 0. Prefer label over coordinate;
        use coordinate only for targets with no badge such as canvas or
        custom rendered widgets. Do not pass both; when both are present,
        coordinate wins. selector is accepted for deterministic compatibility
        flows, but agents should continue using fresh screenshot labels when
        available. Structured SoM includes a stable target id, accessible_name,
        role, disabled, loading, dangerous, and destructive_effect. Prefer
        target_id plus som_revision when a workflow spans changing screenshots;
        stale revisions and name/role mismatches are rejected. Computer resolves the live element
        again immediately before dispatch and rejects loading or disabled
        targets. A coordinate that lands on a consequential control requires
        expected_text exactly matching its current accessible name. When
        autosave, a spinner, aria-busy, or another loading state is visible,
        use action=wait_for_stable with quiet_ms (default 1500) and timeout_ms
        (default 10000), then take a fresh screenshot. Stability includes DOM,
        navigation, loading-frame, and finite network activity. If the page asks to Browse, choose, attach,
        upload, or drop a file, use action=upload_file with selector or label
        plus source_url/base64/file_path; do not operate the native OS file
        picker. For any native select, dropdown, combobox, listbox, or
        multiselect, use action=select_option first with label/selector plus
        text/value or texts/values and optional
        mode=replace|add|remove|toggle; do not click options one by one or use
        keyboard navigation unless select_option fails. For
        checkboxes, radio buttons, and ARIA switches, use action=set_checked
        with label/selector plus checked=true|false instead of blind clicking.
        For long text fields, textareas, contenteditable editors, or message/post
        composers, use action=set_text with label/selector plus text instead of
        click + Control+A + type. set_text returns normalized rendered text,
        paragraph boundaries, and verification. Use newline_mode=compact for
        public messages when blank paragraph gaps are not desired.
        For native date/time/datetime-local fields or text-like scheduler fields,
        use action=set_temporal with label/selector plus value such as
        2026-07-01 or 11:00 AM. If the UI shows separate date and time fields,
        call set_temporal separately on each field; do not put a combined
        date-time string into the date field. If a click opens exactly one new tab,
        Computer automatically follows it and reports switched_tab=true.
        For explicit tab control, call browser_session(action=tabs) to list
        tabs, then browser_session(action=switch_tab, tab_id=...) or
        browser_session(action=close_tab, tab_id=...). Do not use Ctrl+Tab,
        Ctrl+PageDown, or Ctrl+1-9 for browser tab switching. Use action=key for page/editor commands
        such as Tab, Backspace, Control+A, Control+Z; use action=type only
        for short literal text and full date/time values such as 2026-06-05 or
        08:00 PM. Screenshots expose independently scrollable semantic
        scroll_regions. For action=scroll, use a region target_id whenever
        multiple regions can scroll and optionally guard its name and role.
        Results report the requested and actual region, before/after offsets,
        no movement, wrong movement, boundaries, and newly revealed controls.
        amount is CSS pixels; use 200-500 for a small viewport move and omit
        amount for the 300px default.
        Use action=navigate with url for direct navigation, action=back for
        browser history, and action=reload to refresh the current page. Do not
        emulate these with Control+L, Alt+ArrowLeft, or F5. Use action=batch
        with ordered click/double_click/scroll/wait/wait_for_stable steps for an
        abort-on-error guarded sequence and one final screenshot. After scrolling,
        tab switching, selection, upload, checked-state changes, text changes,
        temporal-field changes, or navigation, take a fresh screenshot because
        labels are re-enumerated. Args:
        session_id, action, url? (navigate only), tab_id?, coordinate?, label?,
        target_id?, som_revision?, selector?, expected_text?, expected_name?,
        expected_role?, quiet_ms?, timeout_ms?,
        checked?, source_url?, base64?, filename?, mime_type?, file_path?,
        text?, value?, texts?, values?, mode?, newline_mode?, key?, direction?, amount?,
        duration?, steps? (batch only), annotate? (screenshot/batch, default true), include_som?
        (screenshot/batch, default false). Ordinary actions return a compact
        summary and screenshot_url without embedding duplicate image bytes.
        Explicit screenshot and batch return one binary frame plus som_delta.
        They also include compact safety_targets for loading, disabled, or
        consequential controls; full structured som is returned with include_som=true.
    - name: computer_context_create
      description: |
        Create or import an app-managed browser context. Args: name,
        backend?, provider_context_id?, persist_default?, metadata?,
        auto_create_provider?.
    - name: computer_context_list
      description: |
        List app-managed browser contexts. Omit backend, or pass backend=all,
        to see every saved context across providers. Use backend=default/auto
        for the Computer app default provider. Only pass a concrete backend
        when the user explicitly wants that provider.
    - name: computer_context_get
      description: |
        Fetch one browser context by id, by backend+name, or by unique name
        across all backends when backend is omitted.
    - name: computer_context_update
      description: |
        Update browser context metadata/defaults. Args: id, name?,
        provider_context_id?, persist_default?, metadata?.
    - name: computer_context_delete
      description: |
        Delete or unlink an app-managed browser context. Args: id,
        delete_provider?.
    - name: computer_proxy_profile_list
      description: |
        List enabled proxy profiles available for agent-selected browser
        sessions. Returns only safe routing metadata and never proxy URLs or
        credentials.
    - name: browser_open
      description: |
        Compatibility alias for browser_session(action=open). Supports the
        same optional environment object for newly-created sessions; omit it
        to preserve agent defaults. Browserbase honors timeout as max session
        lifetime. Pass presentation_mode=demo for visible, human-paced actions
        in live views and recordings.
    - name: browser_screenshot
      description: |
        Capture a clean PNG of the session viewport. Args: session_id,
        annotate? (default false; set true for Set-of-Mark labels),
        include_som? (default false; returns structured SoM targets only when
        true). Returns screenshot_url, a stable app-owned URL that continues
        serving the clean final frame after the browser closes.
    - name: browser_extract
      exposure: app_only
      description: |
        Extract structured rendered DOM content from an app-owned browser
        session. Intended for bound apps such as Web; never agent-visible.
        Args: session_id, formats?, max_chars?, readability?, wait_ms?.
    - name: browser_recording
      description: |
        Retrieve provider-neutral playback metadata for an active or historical
        app-owned browser session. Browserbase and Steel recordings become
        playable after the session closes; recently closed sessions may return
        status=processing. Returns app-owned playlist URLs and never provider
        credentials or provider API URLs. Args: session_id.
    - name: browser_close
      description: |
        Close a session opened by this app and release browser/provider
        resources. Use this when finished unless the user explicitly wants the
        session left open. Returns view, a browser-view component reference
        containing only session_id. Compatibility alias for
        browser_session(action=close).

  ui_panels:
    - slot: project.page
      label: Browsers
      icon: monitor
      entry: /ui/ComputerPanel.mjs

  ui_components:
    # Canonical components. The agent chooses whether and which card to attach;
    # opening or driving a browser never creates chat attachments automatically.
    - name: browser-session
      entry: /ui/BrowserCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [session_id]
        properties:
          session_id: { type: string }
      preview_props:
        preview: true
        session_id: "br_example"

    - name: browser-view
      entry: /ui/BrowserViewCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [session_id]
        properties:
          session_id: { type: string }
          caption: { type: string }
          height: { type: integer, default: 360 }
      preview_props:
        preview: true
        session_id: "br_example"
        caption: "Example Domain"

    - name: browser-timeline
      entry: /ui/TimelineCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [session_id]
        properties:
          session_id: { type: string }
      preview_props:
        preview: true
        session_id: "br_example"

    # Compatibility aliases. They resolve onto canonical renderers so old
    # messages and stale agent output remain visual without duplicate viewers.
    - name: browser-card
      entry: /ui/BrowserViewCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [instance_id]
        properties:
          instance_id: { type: string }
          caption:     { type: string }
          height:      { type: integer, default: 360 }
      preview_props:
        preview: true
        instance_id: "demo-instance"
        caption: "Example Domain"

    # Annotated screenshot — agent attaches after computer_use(screenshot).
    # Renders the image with SoM badges as an SVG
    # overlay so the operator sees what the agent sees AND what it's
    # about to act on.
    - name: screenshot-with-som
      entry: /ui/ScreenshotCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [screenshot_url]
        properties:
          screenshot_url: { type: string }
          som:
            type: array
            items:
              type: object
              properties:
                label: { type: integer }
                x:     { type: number }
                y:     { type: number }
                w:     { type: number }
                h:     { type: number }
                kind:  { type: string }
          caption: { type: string }
      preview_props:
        preview: true

    # Live screencast — defaults to a polled thumbnail (cheap on
    # long transcripts), upgrades to full CDP screencast canvas when
    # the operator clicks expand or the agent passes mode:"live".
    - name: live-view
      entry: /ui/LiveCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [instance_id]
        properties:
          instance_id: { type: string }
          height:      { type: integer, default: 360 }
          mode:
            type: string
            enum: [thumb, live]
            default: thumb
      preview_props:
        preview: true
        instance_id: "demo-instance"

    # Multi-step browse summary — horizontal strip of recently visited
    # pages with thumbnails and titles. Saves the agent from listing
    # eight URLs in prose.
    - name: navigation-timeline
      entry: /ui/TimelineCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [steps]
        properties:
          steps:
            type: array
            items:
              type: object
              properties:
                url:       { type: string }
                title:     { type: string }
                thumbnail: { type: string }
                ts:        { type: string }
      preview_props:
        preview: true

  publishes:
    - name: session.opened
      description: A browser session was opened or resumed by the Computer app.
      payload:
        session_id: string
        backend: string
        backend_session_id: string
        app_context_id: string
        context_name: string
        context_id: string
        persist: boolean
        current_url: string
    - name: session.closed
      description: A browser session was explicitly closed.
      payload:
        session_id: string
        backend: string
        backend_session_id: string
        recording_status: string
        close_reason: string
        app_context_id: string
        context_name: string
        persist: boolean
    - name: session.reaped
      description: A browser session was closed by the idle reaper.
      payload:
        session_id: string
        backend: string
        backend_session_id: string
        recording_status: string
        close_reason: string
        idle_seconds: integer
        app_context_id: string
        context_name: string
        persist: boolean
    - name: session.action
      description: A computer_use action completed successfully in a browser session.
      payload:
        session_id: string
        backend: string
        action: string
        label: integer
        coordinate: string
        text_length: integer
        key: string
        current_url: string
    - name: recording.ready
      description: A hosted browser session recording became playable.
      payload:
        session_id: string
        backend: string
        backend_session_id: string
        recording_status: string
    - name: recording.failed
      description: Hosted browser session recording retrieval failed.
      payload:
        session_id: string
        backend: string
        backend_session_id: string
        recording_status: string
        error: string
    - name: context.created
      description: An app-managed browser context was created or imported.
      payload:
        id: string
        name: string
        backend: string
        provider_context_id: string
        persist_default: boolean
        auto_created: boolean
    - name: context.updated
      description: An app-managed browser context was updated.
      payload:
        id: string
        name: string
        backend: string
        provider_context_id: string
        persist_default: boolean
        auto_created: boolean
    - name: context.deleted
      description: An app-managed browser context was deleted or unlinked.
      payload:
        id: string
        name: string
        backend: string
        provider_context_id: string
        provider_deleted: boolean
    - name: settings.updated
      description: Computer app provider settings were updated.
      payload:
        default_backend: string
        lock_backend: boolean
        default_proxy_mode: string
        default_proxy_profile_id: string
        lock_proxy_policy: boolean

  skills:
    - name: how-to-use-computer
      command: /computer
      body_file: skills/how-to-use-computer.md
      description: |
        Teaches the agent to attach the session-following browser-view for
        direct webpage requests and when to choose session or timeline cards.
        Loads on browser_session and computer_use tool calls. Browser actions
        never attach cards automatically.
      metadata:
        category: browsing
        icon: 🖥️

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/computer
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/computer.db
  migrations: migrations/

upgrade_policy: auto-patch
