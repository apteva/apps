schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.4.0
description: Live visual scenes for Apteva agents on the main server, isolated environments, and a configured remote server.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project, global]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.observe
    - platform.runtimes.observe
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.4.0, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0/agent-worlds-v0.4.0-darwin-arm64.tar.gz
      sha256: a27c456760a11bc4f0b69d2962d499f246e1ca52798b915eddafb9260bf13261
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0/agent-worlds-v0.4.0-darwin-amd64.tar.gz
      sha256: ba5513e0eb3a7e0eb71832c7c8bdbf5c7197534a54ec17e6780b2d08289a111a
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0/agent-worlds-v0.4.0-linux-amd64.tar.gz
      sha256: e155a9cdc5d982570938e41a11fc82356b27abaa869dc8a31410cb3d025ac981
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0/agent-worlds-v0.4.0-linux-arm64.tar.gz
      sha256: 2026c1261a97f9bee9594d6e52e9e56cf37d5cd2a0807d94de92215e79203bce
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional project filter for remote agent, runtime, and activity discovery.
upgrade_policy: auto-patch
