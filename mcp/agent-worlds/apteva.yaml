schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.1.4
description: Live visual scenes for Apteva agents on the main server, isolated environments, and a configured remote server.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.read
    - platform.runtimes.read
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.1.4, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.4/agent-worlds-v0.1.4-darwin-arm64.tar.gz
      sha256: 82b10693d65b7e75a7fb569012a4d82456c194e313d44ccb4d66b4ecf354e6d6
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.4/agent-worlds-v0.1.4-darwin-amd64.tar.gz
      sha256: 73da9dcc1ab3207e75fe975761a74ac1403ee3d93a97bb42c65a6ae9066a862f
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.4/agent-worlds-v0.1.4-linux-amd64.tar.gz
      sha256: 7f7f1d54245e707e79821ec1d27dcbcea14b9d9b30d5e94ff93ba0c6f6aef7da
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.4/agent-worlds-v0.1.4-linux-arm64.tar.gz
      sha256: 1fb88d29ad8e1c20b0035b7403cdf80a0d59dff3507a9d7f3cb642105caab158
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional remote project filter, also used to find that project's Environments installation.
  - name: remote_environments_install_id
    type: text
    default: ""
    label: Remote Environments install ID
    description: Optional install ID when the remote server has several Environments installations.
upgrade_policy: auto-patch
