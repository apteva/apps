schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.1.6
description: Live agent scenes with real app and integration destinations on the main server, isolated environments, and a configured remote server.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.read
    - platform.runtimes.read
    - platform.runtime_catalog.read
    - platform.connections.read
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.1.6, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.6/agent-worlds-v0.1.6-darwin-arm64.tar.gz
      sha256: 340781c6c3508ddaf0cd5c10148624bb51ff9b64d1ed9a4ecbdb71ac4e985df9
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.6/agent-worlds-v0.1.6-darwin-amd64.tar.gz
      sha256: b221d4a0aceb4c4ec1443f65682dc9871053ea89945c1ff7fb4d657eb4dc5aa7
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.6/agent-worlds-v0.1.6-linux-amd64.tar.gz
      sha256: 84afef4d97878d565e16c26b9d527b4467a15e301a70d48f57db2cf58f11b873
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.6/agent-worlds-v0.1.6-linux-arm64.tar.gz
      sha256: d39678e2e65a025b0be90e4f8b6438f754b19f4b197a1e786c1a399d514271b6
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional remote project filter, also used to find that project's Environments installation.
  - name: remote_environments_install_id
    type: text
    default: ""
    label: Remote Environments install ID
    description: Optional install ID when the remote server has several Environments installations.
upgrade_policy: auto-patch
