schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.7.0
description: "Live, themeable maps of Apteva agents and the apps they use: system graph, operations board, isometric pixel village, and space station, across the main server, isolated environments, and a remote server."
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project, global]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.observe
    - platform.runtimes.observe
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
  ui_components:
    - name: world-view
      label: Agent world
      description: A live view of the project's agents at work, drawn in any Agent Worlds view. Opens the full page on the same view.
      entry: /ui/AgentWorldsWidget.mjs
      slots: [dashboard.home]
      suggested: true
      visibility: project
      supported_sizes: [half, full]
      default_size: full
      settings_schema:
        type: object
        properties:
          view:
            type: string
            title: View
            enum: [village, station, graph, operations]
            enum_names: [Pixel village, Space station, System graph, Operations]
            default: village
          source:
            type: string
            title: Source
            description: Which agents to show. Main is this installation; remote sources come from the app's settings.
            default: main
          height:
            type: string
            title: Height
            enum: [compact, standard, tall]
            enum_names: [Compact, Standard, Tall]
            default: standard
      settings_ui:
        order: [view, source, height]
        advanced: [source]
        fields:
          source:
            discovery:
              route: /api/sources
              value_field: id
              label_field: label
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.7.0, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.7.0/agent-worlds-v0.7.0-darwin-arm64.tar.gz
      sha256: 540b8a817d6fa506b2fd1e63227c4debe702b7015bc306a7e3bfd864789953b3
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.7.0/agent-worlds-v0.7.0-darwin-amd64.tar.gz
      sha256: 355074005cbb6fa571d4cfe6cf67cc1182a47ca235291c33408a74aacddca73f
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.7.0/agent-worlds-v0.7.0-linux-amd64.tar.gz
      sha256: 1873ec4ae236ee21381bf7d2f8dd5c23edbb2b7374a2c852b40ac9d5fae686c4
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.7.0/agent-worlds-v0.7.0-linux-arm64.tar.gz
      sha256: 40132426267fc4dda9488f5b48e2a55eccc6dbb770a50b7a5fb519112ea1863c
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional project filter for remote agent, runtime, and activity discovery.
upgrade_policy: auto-patch
