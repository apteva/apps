schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.5.0
description: "Live, themeable maps of Apteva agents and the apps they use: system graph, operations board, pixel village, and space station, across the main server, isolated environments, and a remote server."
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project, global]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.observe
    - platform.runtimes.observe
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.5.0, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.5.0/agent-worlds-v0.5.0-darwin-arm64.tar.gz
      sha256: e6db5c05d26cac3ca846846241bd2f2f58f2cd4b100ff3a97495bf0f1d4ad155
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.5.0/agent-worlds-v0.5.0-darwin-amd64.tar.gz
      sha256: 5c76e772b57ee8ea850c9a7a6ad46e7fc2c2a2a793dbe29add617508d2e8253c
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.5.0/agent-worlds-v0.5.0-linux-amd64.tar.gz
      sha256: 6e071803dc839d1f662e395bc4c882868d77d1419843cd3d3136d0d80304f824
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.5.0/agent-worlds-v0.5.0-linux-arm64.tar.gz
      sha256: 40402730f47cf5cd9307d37d75c31205b40cf00397b4379ed4660e0598665fb2
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional project filter for remote agent, runtime, and activity discovery.
upgrade_policy: auto-patch
