schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.6.0
description: "Live, themeable maps of Apteva agents and the apps they use: system graph, operations board, isometric pixel village, and space station, across the main server, isolated environments, and a remote server."
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project, global]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.observe
    - platform.runtimes.observe
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.6.0, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.0/agent-worlds-v0.6.0-darwin-arm64.tar.gz
      sha256: 113ef400dcd33162c2dfef7e022e7f5c6944d0556ebe62b70ba57da7c76ca198
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.0/agent-worlds-v0.6.0-darwin-amd64.tar.gz
      sha256: a448ca8b2dd87286bcbc39ec3ebde55a34481ffa7c896148880ef9cf4a3f6258
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.0/agent-worlds-v0.6.0-linux-amd64.tar.gz
      sha256: 98d4bbcf388d093aa22fa63dc6912e2f973bbfac57c9712f20d931aa52509fd5
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.0/agent-worlds-v0.6.0-linux-arm64.tar.gz
      sha256: 256b0960402598983c89be4a9f8b8eecf71b4e1cdaff5e26eeda29054666a9b7
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional project filter for remote agent, runtime, and activity discovery.
upgrade_policy: auto-patch
