schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.6.1
description: "Live, themeable maps of Apteva agents and the apps they use: system graph, operations board, isometric pixel village, and space station, across the main server, isolated environments, and a remote server."
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project, global]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.observe
    - platform.runtimes.observe
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.6.1, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.1/agent-worlds-v0.6.1-darwin-arm64.tar.gz
      sha256: f708c4a29489e6b6d434d8301bae3ebf60d10bb58058be1886c0202a0c64524e
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.1/agent-worlds-v0.6.1-darwin-amd64.tar.gz
      sha256: a4822769f80be5512fe3f2f1331aa84d0de2d66454cdb4532ecf8bc4ce6e4aea
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.1/agent-worlds-v0.6.1-linux-amd64.tar.gz
      sha256: d80a008c6c5673b08dfac0e738bc6cc77056089d99688d074e54be7f3a3adc18
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.6.1/agent-worlds-v0.6.1-linux-arm64.tar.gz
      sha256: 2f4f71d7a2b5291eca2af08e0462fc33e3d0870d1c1f85d4527631f5b4cd85a6
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional project filter for remote agent, runtime, and activity discovery.
upgrade_policy: auto-patch
