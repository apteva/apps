schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.1.7
description: Live agent scenes with real app and integration destinations on the main server, isolated environments, and a configured remote server.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.read
    - platform.runtimes.read
    - platform.runtime_catalog.read
    - platform.connections.read
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.1.7, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.7/agent-worlds-v0.1.7-darwin-arm64.tar.gz
      sha256: 1b802158046ca055b74895da6f66b22247c498126802be979b8da14140ccc443
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.7/agent-worlds-v0.1.7-darwin-amd64.tar.gz
      sha256: f9a0332ed26916065164ea4a834a7e6f71a77a205499cc2e600b1fb51650a3f7
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.7/agent-worlds-v0.1.7-linux-amd64.tar.gz
      sha256: 382441778c6b988e6ff5fb96551eff8f7279d304b6ff382cc603015aac8a62a6
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.1.7/agent-worlds-v0.1.7-linux-arm64.tar.gz
      sha256: 44846f5ab110967324353d2463b5ba28be2b88e07be6c655cb679ae836d9c2b0
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional remote project filter, also used to find that project's Environments installation.
  - name: remote_environments_install_id
    type: text
    default: ""
    label: Remote Environments install ID
    description: Optional install ID when the remote server has several Environments installations.
upgrade_policy: auto-patch
