schema: apteva-app/v1
name: agent-worlds
display_name: Agent Worlds
version: 0.4.0-preview.1
description: Live visual scenes for Apteva agents on the main server, isolated environments, and a configured remote server.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/agent-worlds
icon: /ui/icon.svg
icon_style: monochrome
tags: [agents, visualization, observability, environments]
scopes: [project, global]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - platform.instances.read
    - platform.telemetry.observe
    - platform.runtimes.observe
    - net.egress
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: worlds_sources, description: "List live main, environment, and configured remote sources." }
    - { name: worlds_scene, description: "Read a sanitized agent scene for one source. Args: source." }
  ui_panels:
    - slot: project.page
      label: Agent Worlds
      icon: network
      entry: /ui/AgentWorldsPanel.mjs
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: agent-worlds/v0.4.0-preview.1, entry: mcp/agent-worlds }
  artifacts:
    darwin-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0-preview.1/agent-worlds-v0.4.0-preview.1-darwin-arm64.tar.gz
      sha256: 17ddde892aba931cde27a35edb6754e7bbac964810407e9114bbe4e0e9b0d82b
    darwin-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0-preview.1/agent-worlds-v0.4.0-preview.1-darwin-amd64.tar.gz
      sha256: 2ad7cd5ccbd94437632f5ed7db152e0d6477b17de3a86c3d29e0142399da1088
    linux-amd64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0-preview.1/agent-worlds-v0.4.0-preview.1-linux-amd64.tar.gz
      sha256: 5bac28cae099c3cb4a699a4309f9f8ae0593fcbb1c68aee64e32de4df22d5d43
    linux-arm64:
      url: https://github.com/apteva/apps/releases/download/agent-worlds%2Fv0.4.0-preview.1/agent-worlds-v0.4.0-preview.1-linux-arm64.tar.gz
      sha256: 6786091a0f5553255b5ff89ad04a421b76847d8c4a10c392dd0a8c3cad883acb
  port: 8080
  health_check: /health
config_schema:
  - name: remote_url
    type: text
    default: ""
    label: Remote Apteva server URL
    description: Optional HTTPS URL of another Apteva server. Loopback HTTP is allowed for local development.
  - name: remote_api_key
    type: secret
    default: ""
    label: Remote API key
    description: Optional API key for the remote server. It remains on the app backend and is never returned to the panel.
  - name: remote_label
    type: text
    default: "Remote server"
    label: Remote server label
  - name: remote_project_id
    type: text
    default: ""
    label: Remote project ID
    description: Optional project filter for remote agent, runtime, and activity discovery.
upgrade_policy: auto-patch
