name: durable-lifecycle
description: |
  A real agent creates exactly one durable task for one outcome, records a
  meaningful milestone, and completes it. The task app—not the server—owns the
  lifecycle and event history.

timeout: 90s
max_iterations: 10

setup:
  mode: autonomous
  app:
    path: ./

directive: |
  Track one durable task named "Prepare the weekly client briefing". Record
  that work has started at 25% with the current step "Collecting source
  material", then complete that same task with the result "Briefing ready".
  Do not create a second task. List the task inventory to verify the outcome,
  then stop.

assert:
  - tool_called: tasks_create
  - tool_called: tasks_update
  - tool_called: tasks_complete
  - tool_called: tasks_list
  - http: GET /api/apps/tasks/tasks?states=completed
    expect_status: 200
    expect_count_at: tasks
    expect_count: 1
  - iterations_at_most: 10

budget:
  total_tokens: 12000
  cost_usd: 0.20
