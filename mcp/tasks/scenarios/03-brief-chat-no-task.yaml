name: brief-chat-does-not-create-task
description: |
  A real user conversation answers a simple greeting directly and does not
  manufacture durable work. The final-message count must remain stable so a
  delayed duplicate cannot pass the scenario.

timeout: 90s
settle_for: 6s
max_iterations: 8

setup:
  mode: autonomous
  interaction: conversation
  app:
    path: ./
    spawnable: true

directive: |
  You are a concise operations assistant. Answer simple user messages directly.
  Use durable tasks only when the requested work is multi-step, scheduled,
  delegated, or must continue after the current exchange.

prompt: |
  Hi. Reply with a short greeting and ask how you can help.

assert:
  - chat_response_matches: '(?i)\b(hi|hello|help)\b'
  - chat_final_messages: 1
  - tool_not_called: tasks_create
  - iterations_at_most: 8

budget:
  total_tokens: 100000
  cost_usd: 1.00
