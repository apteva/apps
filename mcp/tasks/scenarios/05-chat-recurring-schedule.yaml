name: conversation-creates-recurring-schedule
description: |
  A recurring request from chat creates one authoritative recurring task. It is
  assigned away from the disposable conversation and remains waiting for its
  first occurrence instead of being run during setup.

timeout: 2m
settle_for: 8s
max_iterations: 10

setup:
  mode: autonomous
  interaction: conversation
  app:
    path: ./

directive: |
  You help the operator schedule operational reviews. Represent one recurring
  outcome as one recurring task and do not execute a future occurrence during
  schedule creation.

prompt: |
  Every 15 minutes, review newly active leads. Name the recurring work "New lead review".

assert:
  - tool_called_with:
      tool: tasks_create
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
      count: 1
  - tool_not_called: tasks_update | tasks_complete | spawn
  - tool_not_called_with:
      tool: send
      exact: true
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_status: 200
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.title
    expect_field_contains: New lead review
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.created_by_thread_id
    expect_field_eq: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.assigned_thread_id
    expect_field_eq: ${APTEVA_TEST_DEFAULT_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.schedule_kind
    expect_field_eq: interval
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.schedule_expression
    expect_field_eq: 15m0s
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.state
    expect_field_eq: waiting
  - chat_response_contains: New lead review
  - chat_final_messages: 1
  - iterations_at_most: 10

budget:
  total_tokens: 150000
  cost_usd: 1.50
