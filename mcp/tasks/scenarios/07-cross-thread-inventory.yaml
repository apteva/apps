name: request-thread-lists-agent-task-inventory
description: |
  A named Core thread lists the agent-wide Tasks inventory directly. Two tasks
  created by different opaque threads remain visible without asking main or
  treating thread provenance as an inventory boundary.

timeout: 90s
settle_for: 6s
max_iterations: 10

setup:
  mode: autonomous
  interaction: thread
  thread:
    id: inventory-reader
    mcp: [tasks]
    directive: |
      Task inventory is agent-wide. Call tasks_list exactly once, then report
      both seeded task titles from its authoritative result. Do not create,
      update, or complete a task and do not ask another thread for status.
  app:
    path: ./
  seed_mcp_calls:
    - app: tasks
      tool: create
      thread_id: seed-origin-alpha
      args:
        title: Seeded Alpha inventory task
        assigned_thread_id: main
        idempotency_key: inventory-alpha-${APTEVA_TEST_AGENT_ID}
    - app: tasks
      tool: create
      thread_id: seed-origin-beta
      args:
        title: Seeded Beta inventory task
        assigned_thread_id: main
        idempotency_key: inventory-beta-${APTEVA_TEST_AGENT_ID}

directive: |
  Wait for task.ready events addressed to main. Do not answer or take ownership
  of another thread's inventory request.

prompt: |
  List the complete authoritative task inventory for this agent.

assert:
  - tool_called_with:
      tool: tasks_list
      thread_id: inventory-reader
      count: 1
  - tool_not_called: tasks_create | tasks_set_progress | tasks_edit | tasks_fail | tasks_update | tasks_complete
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_status: 200
    expect_count_at: tasks
    expect_count: 2
  - iterations_at_most: 10

budget:
  total_tokens: 150000
  cost_usd: 1.25
