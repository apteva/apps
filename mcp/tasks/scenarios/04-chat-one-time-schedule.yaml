name: conversation-creates-one-time-schedule
description: |
  A natural future request from a saved conversation creates one logical
  scheduled task owned by the durable default thread. The conversation records
  the request but does not execute or complete the future work early.

timeout: 2m
settle_for: 8s
max_iterations: 10

setup:
  mode: autonomous
  interaction: conversation
  app:
    path: ./
    spawnable: true

directive: |
  You help the operator manage follow-ups. Do not initiate a follow-up from
  main without an incoming user request. The conversation thread that receives
  the request owns schedule creation and is the only thread that may create its
  task. Future work must be represented by one durable scheduled task. Never
  perform future work before it is due.

prompt: |
  In 10 minutes, remind me to follow up with the launch team. Name it "Launch team follow-up".

assert:
  - tool_called_with:
      tool: tasks_create
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
      count: 1
  - tool_not_called: tasks_update | tasks_complete
  - tool_not_called_with:
      tool: send
      exact: true
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - tool_not_called_with:
      tool: evolve
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_status: 200
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.title
    expect_field_contains: Launch team follow-up
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.created_by_thread_id
    expect_field_eq: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.assigned_thread_id
    expect_field_eq: ${APTEVA_TEST_DEFAULT_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.schedule_kind
    expect_field_eq: once
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.state
    expect_field_eq: waiting
  - chat_response_contains: Launch team follow-up
  - chat_final_messages: 1
  - iterations_at_most: 10

budget:
  total_tokens: 150000
  cost_usd: 1.50
