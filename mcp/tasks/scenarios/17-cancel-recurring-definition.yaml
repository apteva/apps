name: cancel-recurring-definition
description: A terminal recurring definition stays disabled and cannot create new occurrences.
timeout: 2m
settle_for: 5s
max_iterations: 14
setup:
  mode: autonomous
  app:
    path: ./
directive: |
  Create one task named "Cancelled schedule regression" scheduled every 1 hour.
  Cancel it with reason "No longer needed". Fetch its record and verify that
  it is cancelled and schedule_enabled is false. Never execute its work.
  List the inventory including runs to verify that there is only one record.
  Stop after verification.
assert:
  - tool_called: tasks_create
  - tool_called: tasks_cancel
  - tool_called: tasks_get
  - tool_called: tasks_list
  - tool_not_called: tasks_run_now | tasks_complete | send
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}&include_runs=1
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.state
    expect_field_eq: cancelled
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.schedule_enabled
    expect_field_eq: false
budget:
  total_tokens: 200000
  cost_usd: 1.50
