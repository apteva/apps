name: request-thread-creates-one-time-schedule
description: |
  A named Core request thread creates one future task. Tasks records that
  opaque creator while assigning scheduled execution to the durable default
  thread, and no execution occurs before the schedule is due.

timeout: 2m
settle_for: 8s
max_iterations: 10

setup:
  mode: autonomous
  interaction: thread
  thread:
    id: request-once
    mcp: [tasks]
    directive: |
      Convert the request into exactly one durable one-time task. Call
      tasks_create directly from this thread. Do not delegate creation and do
      not update or complete future work before it is due. After creation,
      confirm the saved title in your response and stop. In the single
      tasks_create call, set assigned_thread_id exactly to "main" so future
      execution belongs to the durable default executor rather than this
      request thread.
  app:
    path: ./

directive: |
  You are only the durable default executor for scheduled Tasks events. Before
  a task.ready event addressed to main, immediately pace: do not inspect,
  message, or kill request threads, and do not create follow-up work. The
  request thread owns schedule creation.

prompt: |
  In 10 minutes, remind me to follow up with the launch team. Name it "Launch team follow-up".

assert:
  - tool_called_with:
      tool: tasks_create
      thread_id: request-once
      count: 1
  - tool_not_called: tasks_set_progress | tasks_edit | tasks_fail | tasks_update | tasks_complete
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_status: 200
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.title
    expect_field_contains: Launch team follow-up
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.created_by_thread_id
    expect_field_eq: request-once
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.assigned_thread_id
    expect_field_eq: main
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.schedule_kind
    expect_field_eq: once
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.state
    expect_field_eq: waiting
  - iterations_at_most: 10

budget:
  total_tokens: 150000
  cost_usd: 1.50
