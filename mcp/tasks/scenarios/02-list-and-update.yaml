name: schedule-list-and-pause
description: |
  The agent creates one recurring schedule, queries the Tasks app directly,
  and pauses that same logical task. This guards against setup-task duplicates
  and thread-to-thread status queries.

timeout: 90s
max_iterations: 10

setup:
  mode: autonomous
  app:
    path: ./

directive: |
  Create one recurring task named "Review new CRM leads" that runs every 15
  minutes. List the authoritative task inventory directly, identify that same
  schedule, and pause it. Do not ask another thread to inspect schedules and do
  not create a second setup task. Then stop.

assert:
  - tool_called: tasks_create
  - tool_called: tasks_list
  - tool_called: tasks_pause
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_status: 200
    expect_count_at: tasks
    expect_count: 1
  - iterations_at_most: 10

budget:
  total_tokens: 150000
  cost_usd: 1.50
