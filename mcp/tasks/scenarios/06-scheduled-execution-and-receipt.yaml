name: scheduled-main-execution-returns-to-conversation
description: |
  A conversation schedules work one minute ahead. When due, the agent's durable
  default thread—not the conversation—updates and completes the same logical
  task. The terminal receipt wakes the creator conversation, which publishes the
  requested result exactly once.

timeout: 4m
settle_for: 10s
max_iterations: 16

setup:
  mode: autonomous
  interaction: conversation
  app:
    path: ./
    spawnable: true

directive: |
  You help the operator run readiness checks. For scheduled work, wait until the
  Tasks event says it is ready, read the task, record meaningful progress, and
  complete it with a concrete result. If the creator requested the result, use
  the terminal receipt to report it back to that conversation. When a saved
  conversation requests a schedule, that conversation must call tasks_create
  itself; do not hand schedule creation to main. Tasks automatically assigns
  scheduled execution to the default durable thread. Only the due execution,
  not creation, belongs on that default thread.

prompt: |
  In one minute, run a readiness check. Track it as one task named "Scheduled readiness check". When it runs, record that the check started, complete it with exactly "READINESS CHECK PASSED", and report the result here.

assert:
  - tool_called_with:
      tool: tasks_create
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
      count: 1
  - tool_called_with:
      tool: tasks_update
      thread_id: ${APTEVA_TEST_DEFAULT_THREAD_ID}
      min_count: 1
  - tool_called_with:
      tool: tasks_complete
      thread_id: ${APTEVA_TEST_DEFAULT_THREAD_ID}
      count: 1
  - tool_not_called_with:
      tool: tasks_update | tasks_complete
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - tool_not_called_with:
      tool: send
      exact: true
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_status: 200
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.created_by_thread_id
    expect_field_eq: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.assigned_thread_id
    expect_field_eq: ${APTEVA_TEST_DEFAULT_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.state
    expect_field_eq: completed
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.result
    expect_field_contains: READINESS CHECK PASSED
  - chat_response_contains: READINESS CHECK PASSED
  - tool_called_with:
      tool: channels_send
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
      args:
        phase: final
        text: READINESS CHECK PASSED
      count: 1
  - iterations_at_most: 16

budget:
  total_tokens: 350000
  cost_usd: 2.50
