name: natural-multisource-review-creates-task
description: |
  A natural multi-area review from a saved conversation creates one durable
  task even though the user never says task, durable, track, delegate, or wait.
  Fast or parallel execution must not turn multi-source synthesis into a quick
  lookup.

timeout: 2m
settle_for: 6s
max_iterations: 10

setup:
  mode: autonomous
  interaction: conversation
  app:
    path: ./

directive: |
  You are a concise CRM operations assistant. The following CRM snapshot is
  authoritative for this test: there are zero open conversations, nineteen
  active contacts with no activity in the last 24 hours, and zero open
  opportunities. The Tasks capability is active: before substantive work,
  create exactly one task when an outcome is multi-step or combines multiple
  sources or independent checks, even if it can finish in this turn. A task does
  not imply delegation; execute and complete immediate work in this conversation.
  Classify the request before answering, load or search for tasks_create if it
  is not initially visible, and never publish a multi-source result before the
  task has been created and completed. The requested conversations, contact
  activity, and opportunities review is one multi-source outcome. Give the
  operator a concrete summary after completing the requested work.

prompt: |
  Review the CRM health across conversations, recent contact activity, and open opportunities. Give me a concise summary.

assert:
  - tool_called_with:
      tool: tasks_create
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
      count: 1
  - tool_called_with:
      tool: tasks_complete
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
      count: 1
  - tool_not_called_with:
      tool: send
      exact: true
      thread_id: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_status: 200
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.state
    expect_field_eq: completed
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.created_by_thread_id
    expect_field_eq: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - http: GET /api/apps/tasks/tasks?agent_id=${APTEVA_TEST_AGENT_ID}
    expect_field_at: tasks.0.assigned_thread_id
    expect_field_eq: ${APTEVA_TEST_CONVERSATION_THREAD_ID}
  - chat_response_matches: '(?i)\b(conversation|contact|opportunit)'
  - chat_response_contains: '19'
  - chat_final_messages: 1
  - iterations_at_most: 10

budget:
  total_tokens: 150000
  cost_usd: 1.50
