schema: apteva-app/v1

name: persona-studio
display_name: Persona Studio
version: 0.1.19
description: |
  Virtual influencer and reusable persona workspace. Persona Studio owns
  consistent identities, reference sets, reusable items/products, style
  profiles, campaigns, generated assets, and Composer handoffs while Media
  Studio remains the provider-neutral generator.

  v0.1.18 previews persona composition renders inline in the
  Compositions panel, with audio, video, and image viewers selected
  from the composition output format.
  v0.1.19 sends persona and item visual references as source_images for
  image, video, and avatar generation, including persona-owned Composer
  composition AI clips.

  v0.1.17 keeps Composer audio_tts and avatar AI prompts as literal
  scripts while still injecting persona voice/avatar defaults and
  resolving visual AI prompts with persona context.

  v0.1.16 adds generic persona-owned Composer compositions with source
  JSON, persona-resolved AI JSON, list/get/render/duplicate tools, a
  Compositions UI panel, and project-scoped Media Studio model, voice,
  and avatar catalog lookups.

  v0.1.14 adds a Media Identity UI for persona voice and avatar
  defaults, loads available voice/avatar catalogs from Media Studio when
  present, previews linked voice/avatar references, and keeps
  voice/avatar references out of image source_images while visual
  references and selected item images continue through Media Studio's
  multi-reference path.

  v0.1.13 sends all linked persona/item image references through Media
  Studio's source_images path by default, asks Media Studio for
  provider-specific image.edit model lists when references exist, requires
  Media Studio v0.10.8+ for output folder support, previews ready
  generated Storage outputs directly in Recent Assets, exposes
  Storage-backed output folder selection during generation, and lets the
  UI unlink persona references, item files, and items.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/persona-studio
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/persona-studio/icon.svg
tags: [ai, persona, virtual-influencer, ugc, media, content]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
  apps:
    - name: storage
      version: ">=0.10.0"
      reason: Store persona references, item packshots, generated assets, and final exports.
    - name: media-studio
      version: ">=0.10.8"
      reason: Generate images, videos, audio, music, and avatar clips through bound providers.
    - name: composer
      version: ">=0.3.0"
      optional: true
      reason: Assemble generated or uploaded assets into timeline compositions and renders.

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: persona_create
      description: Create a virtual persona with identity, audience, tone, visual style, and provider defaults.
    - name: persona_update
      description: Update a persona's identity, style, voice/avatar ids, provider defaults, or brand rules.
    - name: persona_get
      description: Fetch one persona with style profiles, references, items, campaigns, and recent assets.
    - name: persona_list
      description: List personas in this project.
    - name: persona_style_profile_upsert
      description: Create or update an asset-type-specific style profile for consistent generation.
    - name: persona_reference_add
      description: Link a Storage file as a persona reference such as face, pose, outfit, voice, avatar, product, or style.
    - name: persona_reference_list
      description: List references for a persona.
    - name: persona_item_create
      description: Create a reusable item/product/prop/location/brand asset the persona can use in media.
    - name: persona_item_update
      description: Update an item, usage rules, visual rules, active flag, or linked Storage references.
    - name: persona_item_list
      description: List reusable items for a persona.
    - name: persona_generate_asset
      description: Generate one persona-consistent asset through Media Studio, using style profiles, references, items, cache, source_images, and optional provider settings.
    - name: persona_generate_pack
      description: Generate a small starter pack of persona assets using Media Studio.
    - name: persona_campaign_create
      description: Create a campaign brief for a persona.
    - name: persona_create_clip_plan
      description: Create a structured clip plan from a campaign or brief.
    - name: persona_create_composition
      description: Create a persona-owned Composer composition from generic tracks, selected assets, or a clip plan, resolving visual AI clips with persona source_images.
    - name: persona_composition_list
      description: List Composer compositions owned by a persona.
    - name: persona_composition_get
      description: Fetch one persona-owned composition with source and persona-resolved Composer JSON.
    - name: persona_render_composition
      description: Render a persona-owned Composer composition.
    - name: persona_duplicate_composition
      description: Duplicate a persona-owned composition for the same or another persona.
  ui_panels:
    - slot: project.page
      label: Personas
      icon: sparkle
      entry: /ui/PersonaPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/persona-studio
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/persona-studio.db
  migrations: migrations/

upgrade_policy: auto-patch
