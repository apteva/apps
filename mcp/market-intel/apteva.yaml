schema: apteva-app/v1

name: market-intel
display_name: Market Intelligence
version: 0.3.10
description: |
  Generic temporal intelligence platform with market and trading domain packs.
  It records source-attributed evidence, supports date-aware and point-in-time
  search, and exposes reproducible analysis and backtesting primitives.

  Cross-source market intelligence for trading agents. Two faces:

    Gateway   — a unified, normalized query layer over every bound data
                source. The agent asks in domain language ("Alcaraz clay
                H2H", "current Fed-cut probability", "enrich this
                Polymarket market") and market-intel fans out to the
                right underlying integrations, normalizes, and returns
                one consistent shape. The agent never has to know which
                of 20 integration slugs answers what.

    Signal    — scheduled provider scanners compute reproducible features,
                apply liquidity/confidence/net-cost gates, persist an audited
                lifecycle, and push signal.created events. Binance public spot
                data works without setup; paid feeds use the same provider API.

  Read-only. market-intel never places orders — that authority lives in
  the trading app. It reads prices, depth, stats, and history; the agent
  decides; the trading app executes.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/market-intel
icon: /ui/icon.svg
icon_style: monochrome
tags: [trading, intelligence, prediction-markets, polymarket, sports, macro, signals]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - platform.instances.read
    - net.egress                   # some sources hit directly (public, no-auth)
    - platform.connections.execute # data integration calls
    - platform.connections.read    # discover bound data sources by slug
  integrations:
    # Every data source is OPTIONAL. The gateway degrades gracefully:
    # an unbound source is simply absent from the enrichment blob, and
    # query types that depend only on it return empty. Bind what you
    # want the agents to see.
    - role: prediction_market_polymarket
      kind: integration
      required: false
      compatible_slugs: [polymarket, polymarket-data, polymarket-clob]
      label: "Polymarket (gamma + data + CLOB read)"
      hint: "Anchor venue. gamma (prices/metadata) + data-api (holders/OI) are PUBLIC — market-intel reads them directly, no key or binding needed. Bind only if you want order-book depth via the signed CLOB."
    - role: prediction_market_other
      kind: integration
      required: false
      compatible_slugs: [kalshi, manifold-markets]
      label: "Other prediction markets (cross-venue comparison)"
    - role: sports_data
      kind: integration
      required: false
      compatible_slugs: [the-odds-api, the-sports-db, api-sports, tennis-abstract]
      label: "Sports odds + stats + history"
    - role: macro_data
      kind: integration
      required: false
      compatible_slugs: [fred, bls, eia, finnhub]
      label: "Macro indicators + economic calendar"
    - role: news_data
      kind: integration
      required: false
      compatible_slugs: [tavily, perplexity, exa, newsapi, gnews, gdelt, sec-edgar, wikipedia]
      label: "News + events + sentiment"
    - role: crypto_data
      kind: integration
      required: false
      compatible_slugs: [coingecko, etherscan, polygonscan, whale-alert, defillama]
      label: "Crypto prices + on-chain"
    - role: market_data_paid
      kind: integration
      required: false
      compatible_slugs: [alpaca-market-data, finnhub, alpha-vantage, yahoo-finance]
      label: "Paid or premium normalized market data"
      hint: "Optional. Configure the provider slug and normalized universe/bars tool names below."
    - role: llm
      kind: integration
      required: false
      compatible_slugs: [anthropic-api, openai-api]
      label: "LLM for entity resolution + market matching"
  apps:
    # Optional dep — Phase 3 position-aware signals read the trading
    # portfolios so market-intel can say "you hold this, it resolved".
    # Absent = signals are venue-only, no portfolio context.
    - name: trading
      optional: true

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: search
      description: "Generic bitemporal search across recorded evidence with event, publication, and as-of date filters."
    - name: evidence_record
      description: "Record immutable source-attributed evidence for later search, timelines, monitoring, and replay."
    - name: timeline
      description: "Chronological evidence timeline for a topic or entity."
    - name: replay
      description: "Deterministic point-in-time evidence snapshot for analysis and backtesting."
    - name: markets
      description: "Live volume-ranked markets across the public prediction venues (Polymarket, Kalshi, Manifold). No setup — all public."
    - name: enrich
      description: "Everything relevant to a prediction market in one normalized blob — cross-venue prices, ground-truth probability, entities, their stats + H2H, news, computed edge."
    - name: stats
      description: "Normalized profile for an entity (player, team, ticker, crypto) fanned across the right sources."
    - name: history
      description: "Historical record — head-to-head between two entities, or one entity's time series."
    - name: context
      description: "Deduped news + sentiment + event-volume for a topic or entity."
    - name: probability
      description: "Best ground-truth probability for an event from whichever method fits (odds de-vig, macro-implied, cross-venue median)."
    - name: resolve_entity
      description: "Resolve a name to a canonical entity id across sources (disambiguation)."
    - name: sources_status
      description: "Which data sources are bound + healthy right now, by domain."
    - name: signals_list
      description: "List normalized, cost-adjusted signals with provenance, expiry, and measured outcomes."
    - name: signal_feeds
      description: "List sellable signal feeds and their quality/access gates."
    - name: signal_metrics
      description: "Audited hit rate and realized-return metrics for matured signals."
    - name: signal_scan_now
      description: "Run provider discovery and signal generation now."
    - name: signal_backtest
      description: "Walk-forward historical replay with no look-ahead and explicit cost assumptions."
  ui_panels:
    - slot: project.page
      label: Market Intel
      icon: activity
      entry: /ui/MarketIntelPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: market-intel/v0.3.10
    entry: mcp/market-intel
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/market-intel.db
  migrations: migrations/

config_schema:
  - name: llm_matching
    type: text
    default: "true"
    label: Use LLM for entity resolution + market matching
    description: |
      true — discovery uses a bound LLM integration to semantically match
             markets + resolve entity ids. Falls back to heuristic keyword
             matching when no LLM is bound.
      false — heuristic matching only.
  - name: cache_ttl_seconds
    type: text
    default: "60"
    label: Source cache TTL (seconds)
    description: How long to cache a source response before re-fetching. Protects tight free tiers.
  - name: scan_universe_limit
    type: text
    default: "20"
    label: Instruments per scan
    description: Highest-liquidity Binance USDT spot pairs scanned every five minutes.
  - name: min_quote_volume_24h
    type: text
    default: "2000000"
    label: Minimum 24h quote volume
    description: Reject illiquid instruments below this quote-volume threshold.
  - name: max_spread_bps
    type: text
    default: "35"
    label: Maximum spread (bps)
    description: Reject signals whose live executable spread exceeds this value.
  - name: round_trip_fee_bps
    type: text
    default: "20"
    label: Estimated round-trip fees (bps)
    description: Included in every published signal's net-edge calculation.
  - name: slippage_bps
    type: text
    default: "5"
    label: Base slippage estimate (bps)
    description: Added to spread and fees before a signal can pass its net-edge gate.
  - name: paid_provider_slug
    type: text
    default: ""
    label: Paid market-data integration slug
    description: Optional normalized provider integration; credentials remain in the bound connection.
  - name: paid_provider_venue
    type: text
    default: ""
    label: Paid provider venue
  - name: paid_provider_universe_tool
    type: text
    default: "list_instruments"
    label: Paid provider universe tool
  - name: paid_provider_bars_tool
    type: text
    default: "get_bars"
    label: Paid provider bars tool

upgrade_policy: auto-patch
