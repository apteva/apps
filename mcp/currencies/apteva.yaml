schema: apteva-app/v1

name: currencies
display_name: Currencies
version: 0.1.0
description: |
  Provider-neutral ISO currency metadata, current and historical exchange
  rates, and deterministic minor-unit conversion. Rates retain source,
  effective time, staleness, inversion, and triangulation provenance. Works
  with manual rates alone; optional provider connections add live/history data.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/currencies
icon: /ui/icon.svg
icon_style: monochrome
tags: [finance, currencies, exchange-rates, fx, accounting]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.connections.read
    - platform.connections.execute
  integrations:
    - role: fx_primary
      kind: integration
      required: false
      compatible_slugs: [alpaca-market-data, saltedge, alpha-vantage]
      label: "Primary FX-rate provider"
      hint: "Optional. Currencies also works with manual rates and previously cached observations."
    - role: fx_fallback
      kind: integration
      required: false
      compatible_slugs: [alpaca-market-data, saltedge, alpha-vantage]
      label: "Fallback FX-rate provider"
      hint: "Optional fallback when the primary provider is unavailable or has no eligible observation."

provides:
  http_routes:
    - prefix: /
  workers:
    - name: currencies-refresh
      schedule: "@every 15m"
  mcp_tools:
    - name: currencies_list
      description: "List seeded ISO 4217 currency definitions. Args: q?, kind?, active?, limit?."
    - name: currencies_get
      description: "Get one ISO 4217 currency definition and its minor-unit exponent. Args: code."
    - name: currencies_rate_get
      description: "Get a current or historical direct, inverse, or triangulated rate with provenance. Args: base, quote, as_of?, selection?, rate_kinds?, providers?, max_age_seconds?, allow_inverse?, allow_triangulation?, allow_stale?, fetch?."
    - name: currencies_convert
      description: "Convert a signed integer minor-unit amount with exact arithmetic and provenance. Args: amount_minor, from, to, as_of?, rounding?, plus rate-selection options."
    - name: currencies_rates_history
      description: "List immutable normalized observations for a pair. Args: base, quote, from?, to?, providers?, rate_kinds?, limit?."
    - name: currencies_rate_set_manual
      description: "Append an auditable manual rate. Args: base, quote, rate (decimal string preferred), effective_at?, reason, source_ref?, supersedes_rate_id?."
    - name: currencies_sources_status
      description: "List bound FX providers, last sync state, tracked pairs, and newest observations."
    - name: currencies_sync_now
      description: "Fetch and ingest provider observations for one pair or all tracked pairs. Args: base?, quote?, as_of?, provider?."
  ui_panels:
    - slot: project.page
      label: Currencies
      icon: badge-dollar-sign
      entry: /ui/CurrenciesPanel.mjs
  skills:
    - name: how-to-use-currencies
      command: /currencies
      body_file: skills/how-to-use-currencies.md
      description: |
        Current and historical exchange rates, exact currency conversion,
        provider provenance, manual rates, and FX-source health.
      metadata:
        category: finance
        icon: badge-dollar-sign
  publishes:
    - name: currencies.sync.completed
      description: "A provider sync completed with at least one ingested observation."
    - name: currencies.sync.failed
      description: "A provider sync attempt failed."
    - name: currencies.source.degraded
      description: "A bound FX provider has repeated failures or stale data."
    - name: currencies.manual_rate.created
      description: "A manual exchange-rate observation was appended."

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/currencies
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/currencies.db
  migrations: migrations/

config_schema:
  - name: provider_priority
    type: text
    default: "alpaca-market-data,saltedge,alpha-vantage,manual"
    label: Provider priority
    description: "Comma-separated provider slugs. Manual rates are last unless explicitly moved."
  - name: pivot_currencies
    type: text
    default: "EUR,USD"
    label: Cross-rate pivots
    description: "Comma-separated currencies allowed for two-edge triangulation."
  - name: default_max_age_seconds
    type: number
    default: 259200
    label: Default maximum rate age
    description: "Default freshness window in seconds (3 days accommodates weekends)."

upgrade_policy: auto-patch
