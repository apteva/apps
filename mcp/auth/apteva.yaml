schema: apteva-app/v1
name: auth
display_name: Auth
version: 0.11.0
description: |
  Organization-scoped first-party authentication with EdDSA access tokens,
  atomic refresh rotation, revocation, email verification and password reset,
  RBAC and trusted sibling-app identity login. Browser origins synchronize
  with platform CORS. OAuth/OIDC, magic-link login and MFA challenges are not
  implemented; accounts requiring MFA fail closed. v0.11.0 invalidates old
  sessions and recovery links and requires login after recovery.
author: Apteva
scopes: [project]
min_apteva_version: "0.14.1"
requires:
  permissions:
    - db.write.app
    - platform.instances.read
    - platform.apps.call
    - net.egress
  apps:
    - name: messaging
      optional: true
      reason: Required for email delivery. Recovery credentials never enter audit logs.
provides:
  http_routes:
    - prefix: /signup
      method: POST
      no_auth: true
    - prefix: /login
      method: POST
      no_auth: true
    - prefix: /password/reset/request
      method: POST
      no_auth: true
    - prefix: /password/reset/confirm
      method: POST
      no_auth: true
    - prefix: /email/verify
      method: POST
      no_auth: true
    - prefix: /email/verification/resend
      method: POST
      no_auth: true
    - prefix: /logout
      method: POST
      no_auth: true
    - prefix: /refresh
      method: POST
      no_auth: true
    - prefix: /me
      method: GET
      no_auth: true
    - prefix: /me/metadata
      method: PATCH
      no_auth: true
    - prefix: /.well-known/jwks.json
      method: GET
      no_auth: true
    - prefix: /.well-known/openid-configuration
      method: GET
      no_auth: true
    - prefix: /orgs/
      method: GET
      no_auth: true
    - prefix: /admin/
  mcp_tools:
    - name: auth_orgs_list
      description: List organizations in the project.
    - name: auth_orgs_create
      description: Create a new organization.
    - name: auth_orgs_update
      description: Rename / recolor / set policy overrides.
    - name: auth_orgs_archive
      description: Archive (soft-disable) an organization.
    - name: auth_users_search
      description: Filtered user search; org-scoped or project-wide.
    - name: auth_users_create
      description: ADMIN — provision a user (requires org). send_password_reset defaults false. No session minted. Supports metadata JSON. For visitor signup use auth_public_signup.
    - name: auth_users_update
      description: ADMIN — update display_name, email_verified, or metadata JSON for one user.
    - name: auth_public_signup
      description: Visitor-facing signup, equivalent to POST /signup. Resolves org from client_id, mints tokens or sends verify email.
    - name: auth_users_get
      description: Snapshot of one user (requires org).
    - name: auth_users_get_context
      description: Snapshot + sessions + MFA + audit events (requires org).
    - name: auth_users_disable
      description: Disable + revoke sessions (requires org).
    - name: auth_users_enable
      description: Re-enable a disabled user (requires org).
    - name: auth_users_revoke_sessions
      description: Force-logout one user (requires org).
    - name: auth_users_set_password
      description: Set a new password for one user (requires org).
    - name: auth_roles_list
      description: List roles and their effective permissions (requires org).
    - name: auth_roles_create
      description: Create an organization-scoped role.
    - name: auth_roles_update
      description: Update a role's display data.
    - name: auth_roles_delete
      description: Delete a role and remove its user assignments.
    - name: auth_permissions_list
      description: List the organization's permission catalog.
    - name: auth_permissions_create
      description: Create a namespaced permission.
    - name: auth_permissions_update
      description: Update a permission's display data.
    - name: auth_permissions_delete
      description: Delete a permission and remove it from roles.
    - name: auth_role_permissions_set
      description: Replace a role's permission set atomically.
    - name: auth_user_roles_set
      description: Replace a user's role assignments atomically.
    - name: auth_audit_search
      description: Filter the audit log; org-scoped or project-wide.
    - name: auth_stats
      description: User counts; org-scoped or project-wide.
    - name: auth_clients_list
      description: List OAuth clients; org-scoped or project-wide.
    - name: auth_clients_create
      description: Register a first-party client; omit the organization only for an intentional multi-organization client.
    - name: auth_clients_update
      description: Add or remove allowed browser origins without replacing the client.
    - name: auth_clients_rotate_secret
      description: Rotate a client secret (org derived from client).
    - name: auth_clients_disable
      description: Disable a client (org derived from client).
    - name: auth_public_login_identity
      description: APP-TO-APP ONLY. Log a player or visitor in by an external identity the calling app has already verified (device possession, Steam ticket, Apple identity token) and mint a session. Unknown identities create a guest user unless create_if_missing=false; creation is rate-limited per client. Returns {user, created, access_token, refresh_token, expires_in, authorization}.
      exposure: app_only
    - name: auth_identities_link
      description: Bind a verified external identity (provider + provider_user_id) to an existing user (requires org). Idempotent for the same user; errors when the subject belongs to another user.
    - name: auth_identities_unlink
      description: Remove an external identity from a user (requires org). Refuses to strand a guest's last identity unless force=true.
    - name: auth_identities_list
      description: List a user's external identities, or resolve one provider subject to its user (requires org). Read-only.
    - name: auth_guest_upgrade
      description: Convert a guest user into a full account with an email and password (requires org). Revokes guest sessions and removes linked identities; sends a verification email when required.
    - name: auth_jwks_get
      description: Return the organization's public signing keys (JWKS) and issuer so sibling apps can verify auth-issued JWTs locally.
  ui_panels:
    - slot: project.page
      label: Auth
      icon: key
      entry: /ui/AuthPanel.mjs
runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/auth
  port: 8080
  health_check: /health
db:
  driver: sqlite
  path: /data/auth.db
  migrations: migrations/
config_schema:
  - name: app_url
    type: text
    label: Public app URL (override)
    description: Optional canonical public Auth URL, including this install's route path. Used for JWT issuer, recovery links, and discovery. Leave blank to derive it from the platform public URL and install route; set it for a custom public Auth endpoint.
  - name: from_email
    type: text
    label: Outbound from-address
    description: Sender address for verification and password-reset email. Requires Messaging and a verified sender address. Missing configuration reports a delivery error; recovery secrets are never written to audit logs.
  - name: jwt_access_ttl_seconds
    type: text
    default: "900"
    label: Access token TTL (seconds)
    description: Default 15 minutes. Per-client overrides supported.
  - name: jwt_refresh_ttl_days
    type: text
    default: "30"
    label: Refresh token TTL (days)
    description: Default 30. Per-client overrides supported.
  - name: password_min_length
    type: text
    default: "8"
    label: Password minimum length
    description: Minimum character count for new passwords. Default 8.
  - name: password_classes_required
    type: text
    default: "0"
    label: Password classes required
    description: Of [lower, upper, digit, symbol], how many must appear. 0–4. Default 0 (no character-class requirement).
  - name: lockout_threshold
    type: text
    default: "5"
    label: Failed-login lockout threshold
    description: Consecutive failures before the account locks. 0 disables lockout.
  - name: lockout_initial_minutes
    type: text
    default: "15"
    label: Initial lockout duration (minutes)
    description: Doubles on each subsequent lockout while the failure streak persists.
  - name: email_verification_required
    type: text
    default: "true"
    label: Require verified email to log in
    description: When true, /login refuses unverified accounts. true | false.
  - name: audit_retention_days
    type: text
    default: "90"
    label: Audit retention (days)
    description: Hourly cleanup removes audit events older than this many days (7 to 3650).
  - name: identity_signups_per_client_per_hour
    type: text
    default: "600"
    label: Identity signups per client per hour
    description: Maximum new guest or external-identity users one OAuth client may create per hour through auth_public_login_identity. Returning logins are not counted. 0 disables the limit.
upgrade_policy: auto-patch
