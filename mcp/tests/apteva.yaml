schema: apteva-app/v1
name: tests
display_name: Tests
version: 0.4.0
description: Browser and backend scenarios, isolated runtime tests, owned failure evidence, and candidate-specific release verdicts.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/tests
icon: /ui/icon.svg
icon_style: monochrome
tags: [tests, checks, quality, browser, functions]
scopes: [project, global]
min_apteva_version: "0.27.6"
requires:
  permissions: [db.write.app, platform.apps.call, net.egress]
  apps:
    - { name: functions, optional: true, reason: "Select Functions to enable function checks; omit for HTTP-only suites." }
    - { name: environments, version: ">=0.9.0", optional: true, reason: "Bind Environments v0.9.0 or newer for isolated release scenarios." }
    - { name: computer, version: ">=0.9.3", optional: true, reason: "Bind Computer v0.9.3 or newer for isolated Chromium steps and explicit empty selections." }
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: tests_suites_list, description: List project test suites. }
    - { name: tests_suite_get, description: Read one suite and its complete release configuration. }
    - { name: tests_suite_save, description: Create or update a suite. }
    - { name: tests_suite_archive, description: Archive a suite while retaining its history. }
    - { name: tests_checks_list, description: List a suite's checks. }
    - { name: tests_check_save, description: "Create or replace an HTTP, Function, scenario or browser check." }
    - { name: tests_check_delete, description: Delete a check while retaining historical run snapshots. }
    - { name: tests_run, description: Queue a suite run and return its id immediately. }
    - { name: tests_runs_list, description: List recent suite runs. }
    - { name: tests_run_cancel, description: Cancel a queued or running test. }
    - { name: tests_release_spec, description: Resolve pinned suite and fixture digests. }
    - { name: tests_release_verdict, description: Verify a verdict for an exact release candidate. }
    - { name: tests_run_get, description: Get a run and its per-check results and assertions. }
  ui_panels:
    - { slot: project.page, label: Tests, icon: circle-check, entry: /ui/TestsPanel.mjs }
  ui_components:
    - name: tests-overview
      label: Tests overview
      description: Test-run statistics, pass rate, active runs, recent results and a daily trend.
      entry: /ui/TestsOverviewWidget.mjs
      suggested: true
      slots: [dashboard.home]
      visibility: project
      supported_sizes: [half, full]
      default_size: half
      refresh_topics: [tests.run.queued, tests.run.completed, tests.suite.saved, tests.suite.archived, tests.check.saved, tests.check.deleted]
      settings_schema:
        type: object
        properties:
          window: {type: string, title: Time window, enum: [24h, 7d], enum_names: [Last 24 hours, Last 7 days], default: 24h}
          suite_id: {type: integer, title: Starting suite ID, description: "Zero opens all suites. Suites can also be selected in the widget.", minimum: 0, default: 0}
          environment: {type: string, title: Starting environment, description: "Empty opens all environments.", default: ""}
          max_results: {type: integer, title: Maximum results at full width, minimum: 3, maximum: 10, default: 8}
    - name: tests-failures
      label: Recent test failures
      description: Recent failed checks, repeated failures, failed steps and links to saved evidence.
      entry: /ui/TestsFailuresWidget.mjs
      slots: [dashboard.home]
      visibility: project
      supported_sizes: [half, full]
      default_size: half
      refresh_topics: [tests.run.queued, tests.run.completed, tests.suite.saved, tests.suite.archived, tests.check.saved, tests.check.deleted]
      settings_schema:
        type: object
        properties:
          window: {type: string, title: Time window, enum: [24h, 7d], enum_names: [Last 24 hours, Last 7 days], default: 24h}
          suite_id: {type: integer, title: Starting suite ID, description: "Zero opens all suites. Suites can also be selected in the widget.", minimum: 0, default: 0}
          environment: {type: string, title: Starting environment, description: "Empty opens all environments.", default: ""}
          max_results: {type: integer, title: Maximum results at full width, minimum: 3, maximum: 10, default: 8}
          group_repeated: {type: boolean, title: Group repeated failures, default: true}
  workers:
    - { name: runner, schedule: "@every 1s" }
    - { name: events, schedule: "@every 2s" }
    - { name: cleanup, schedule: "@every 20s" }
  publishes:
    - { name: tests.suite.saved, description: A suite was created or updated. }
    - { name: tests.suite.archived, description: A suite was archived. }
    - { name: tests.check.saved, description: A check was created or updated. }
    - { name: tests.check.deleted, description: A check was deleted. }
    - { name: tests.run.queued, description: A suite run was queued. }
    - { name: tests.run.completed, description: A run finished with passed or failed status and result counts. }
runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: tests/v0.4.0, entry: mcp/tests }
  port: 8080
  health_check: /health
db:
  driver: sqlite
  path: /data/tests.db
  migrations: migrations/
config_schema:
  - { name: artifact_retention_days, type: text, label: Screenshot retention days, default: "7", required: false }
upgrade_policy: auto-patch
