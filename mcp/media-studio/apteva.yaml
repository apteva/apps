schema: apteva-app/v1

name: media-studio
display_name: Media Studio
version: 0.10.47
description: |
  Generate images, video, audio, music, and avatars via compatible
  providers. ElevenLabs and Fish Audio can power TTS and reusable
  voices; ElevenLabs also powers sound effects and music.
  Optionally saves outputs to the Storage app for permanent, shareable
  references. v0.10.47 keeps historical failed jobs out of the active gallery
  feed and makes current UI errors dismissible and temporary.

  v0.10.46 omits aspect_ratio for Venice video models whose live
  constraints do not support it, including WAN image-to-video variants.

  v0.10.45 adds newest-first cursor pagination to media_history
  and the gallery, a history index, functional since filtering, and 24-item
  incremental UI pages for fast projects with large generation histories.

  v0.10.44 moves generation into a focused responsive dialog
  with a large prompt editor, grouped settings, mobile sheet layout, sticky
  actions, keyboard focus handling, and automatic reference-edit opening.

  v0.10.43 fixes multi-provider image options, stale panel
  responses, required video references, project-scoped previews, upload
  validation, and responsive/accessibility behavior.

  v0.10.42 includes project_id in panel generation and avatar
  creation URLs so project-scoped installs resolve through the app proxy.

  v0.10.41 rebuilds the panel with the production JSX runtime
  and guards the committed artifact against development-only jsxDEV imports.

  v0.10.40 adds multiple audio-provider bindings, Fish Audio
  TTS and voice catalogs, and provider-neutral voice cloning from an
  upload, Storage reference, URL, data URL, or base64 audio.

  v0.10.39 filters unsupported ElevenLabs request-stitching
  fields for Eleven v3 and zero-retention requests while retaining text
  continuity where supported, and forwards current language-normalization
  voice options.

  v0.10.38 makes image output_format an enforced final-file
  contract: mismatched provider bytes are converted before Storage, with
  transparent images flattened onto white for JPEG output.

  v0.10.37 hardens project isolation, async job recovery,
  Storage fallback, provider prompt limits, and oversized downloads.
  Queued jobs now retain their original provider connection and can
  resume finalization safely after a restart or binding change.

  v0.10.36 sniffs generated image bytes before saving so
  provider responses that declare one format but return another are
  stored with matching MIME metadata and filename extensions.

  v0.10.35 restores default image model discovery for
  bound providers by treating an omitted image model capability as
  image.generate, so Venice and other image providers appear in the
  panel and media_models without requiring an explicit capability.

  v0.10.34 adds media_models for agent-side model
  discovery, prepares image generation for multiple bound image
  providers without explicit provider selection in tool calls, and
  loads Venice edit models from the inpaint model catalog with
  edit-only resolution filtering for current model ids such as
  Nano Banana, Qwen, Flux, and GPT Image edit.

  v0.10.33 filters Venice image-edit options per model so
  Flux and Qwen edits no longer receive unsupported resolution tiers.

  v0.10.32 forwards provider consent objects for
  face-bearing video reference jobs such as Seedance.

  v0.10.31 adds multiple reference image support for
  Venice reference-to-video models.

  v0.10.30 lets voice creation choose the ElevenLabs
  Voice Design model, defaulting to eleven_ttv_v3.

  v0.10.29 adds UI controls for ElevenLabs Voice Design
  voice creation on the Audio/TTS tab.

  v0.10.28 also accepts common ElevenLabs request-id
  response header variants for TTS continuity.

  v0.10.27 exposes ElevenLabs request-id continuity
  fields and returns provider request IDs for generated TTS clips.

  v0.10.26 adds generic reusable media identities for voices and
  avatars, including ElevenLabs Voice Design creation.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/media-studio
tags: [ai, image-generation, video-generation, audio, music, productivity]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.apps.call
  integrations:
    - role: image_provider
      kind: integration
      mode: multiple
      compatible_slugs: [openai-api, openai-codex, venice-ai, gemini]
      capabilities: [image.generate, image.edit]
      tools:
        image.generate: generate_image
        image.edit: edit_image
      required: false
      label: "Image provider"
      hint: "Bind any compatible integration (OpenAI API, OpenAI Codex, Venice AI, Gemini; Replicate / Stability soon) to enable image generation. Newer Apteva builds can bind multiple image providers and Media Studio exposes one merged model list."

    - role: video_provider
      kind: integration
      compatible_slugs: [venice-ai, replicate, runway, pika]
      capabilities: [video.generate]
      tools:
        video.generate: queue_video
      required: false
      label: "Video provider"
      hint: "Bind a video model (Venice AI today; Replicate, Runway, Pika as integrations land) to enable video generation. Video generation is asynchronous — media_generate returns a queued job and the worker delivers the result via the media.generated event when it lands."

    - role: audio_provider
      kind: integration
      mode: multiple
      compatible_slugs: [elevenlabs, fish-audio]
      capabilities: [audio.tts, audio.sfx, voice.create]
      tools:
        audio.tts: text_to_speech
        audio.sfx: generate_sfx
        voice.create: design_voice
      required: false
      label: "Audio provider"
      hint: "Bind ElevenLabs and/or Fish Audio for text-to-speech and reusable voices. Sound effects and prompt-based Voice Design remain ElevenLabs-specific; Fish Audio supports instant cloning from consented audio."

    - role: music_provider
      kind: integration
      compatible_slugs: [elevenlabs]
      capabilities: [music.generate]
      tools:
        music.generate: generate_music
      required: false
      label: "Music provider"
      hint: "Bind ElevenLabs to enable music generation."

    - role: avatar_provider
      kind: integration
      compatible_slugs: [tavus, heygen]
      capabilities: [avatar.generate]
      tools:
        avatar.generate: create_video
      required: false
      label: "Avatar / talking-head provider"
      hint: "Bind Tavus (or HeyGen) to generate talking-head videos from a replica/avatar + script, and create reusable avatars where the provider supports it. Async — generation and avatar creation jobs queue and update when ready."

    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.write, files.delete]
      required: false
      label: "Storage (optional)"
      hint: "Save generated media permanently and share across instances. Without this, results are returned inline (when small enough) or as expiring upstream URLs."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: media_models, description: "List available media models for a kind. Args: kind? (default image). Use returned model ids in media_generate; image and audio ids may include a provider prefix when multiple providers are bound." }
    - { name: media_generate, description: "Generate media (image / video / audio / music / avatar). Args: kind (required: image|video|audio_tts|audio_sfx|music|avatar), prompt (required — for avatar this is the spoken script), provider?, model? (use a model id returned by media_models), size?, duration?, voice?, aspect?, avatar? (replica/avatar id, avatar kind), source_image?, source_images? (image edit and video references; Venice *reference-to-video supports multiple refs), n?, options? (provider extras; video supports consents.seedance when required), cache_key?, cache_policy? ('reuse'|'refresh'). Video + avatar are async (queued; delivered via media.generated). Returns thumbnail + storage URL when storage is bound, else inline (small media) or expiring upstream URL." }
    - { name: media_estimate, description: "Estimate generation cost without creating media. Args match media_generate. Returns cost_usd when the bound provider exposes pricing or Media Studio can derive it." }
    - { name: media_delete, description: "Delete one generation for this project. Args: id, delete_storage? (default true). Also removes linked Storage files, async job rows, and local cache files when enabled." }
    - { name: media_identity_create, description: "Create a reusable provider-side identity such as a voice or avatar. Voice creation is provider-neutral: source_type=prompt designs an ElevenLabs voice; source_type=audio clones through Fish Audio or ElevenLabs from source_audio/source_audios. Args also include provider?, name, transcripts?, source_image?, source_video?, labels?, options?." }
    - { name: media_identity_list, description: "List Media Studio tracked reusable identities. Args: kind? (voice|avatar), limit?." }
    - { name: media_identity_get, description: "Fetch one tracked reusable identity by id." }
    - { name: media_voice_create, description: "Alias for media_identity_create with kind=voice. Use source_type=prompt for ElevenLabs Voice Design or source_type=audio plus source_audio/source_audios for provider-neutral Fish Audio or ElevenLabs cloning." }
    - { name: media_voice_list, description: "List tracked voice identities and, when bound, provider voice catalog entries." }
    - { name: media_avatar_create, description: "Create/train a reusable avatar through the bound avatar provider. Generic args: name, source_type (photo|prompt|video), source_image?, source_video?, consent_video?, prompt?, options?. Returns an avatar_create job." }
    - { name: media_avatar_list, description: "List tracked avatar identities and provider avatar catalog entries." }
    - { name: media_history,  description: "List generations for this project newest-first. Args: kind?, limit?, cursor? (next_cursor from the previous page), since? (RFC3339). Returns generations, next_cursor, and has_more." }
    - { name: media_get,      description: "Fetch one generation for this project. Args: id." }
  ui_panels:
    - slot: project.page
      label: Studio
      icon: image
      entry: /ui/MediaPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/media-studio
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/media-studio.db
  migrations: migrations/

upgrade_policy: auto-patch
