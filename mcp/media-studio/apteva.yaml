schema: apteva-app/v1

name: media-studio
display_name: Media Studio
version: 0.10.23
description: |
  Generate images, video, audio, music, and avatars via compatible
  providers. ElevenLabs powers audio TTS, sound effects, and music.
  Optionally saves outputs to the Storage app for permanent, shareable
  references. v0.10.19 adds media_delete plus a panel Delete action that
  removes generation rows, related async job rows, local cache files, and
  linked Storage files by default. v0.10.23 exposes provider image
  constraints to the UI and agents, and robustly normalizes generic
  size/aspect/resolution intent for Venice image models.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/media-studio
tags: [ai, image-generation, video-generation, audio, music, productivity]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.apps.call
  integrations:
    - role: image_provider
      kind: integration
      compatible_slugs: [openai-api, openai-codex, venice-ai, gemini]
      capabilities: [image.generate, image.edit]
      tools:
        image.generate: generate_image
        image.edit: edit_image
      required: false
      label: "Image provider"
      hint: "Bind any compatible integration (OpenAI API, OpenAI Codex, Venice AI, Gemini; Replicate / Stability soon) to enable image generation. Reference-image edits use each provider's image.edit support where available."

    - role: video_provider
      kind: integration
      compatible_slugs: [venice-ai, replicate, runway, pika]
      capabilities: [video.generate]
      tools:
        video.generate: queue_video
      required: false
      label: "Video provider"
      hint: "Bind a video model (Venice AI today; Replicate, Runway, Pika as integrations land) to enable video generation. Video generation is asynchronous — media_generate returns a queued job and the worker delivers the result via the media.generated event when it lands."

    - role: audio_provider
      kind: integration
      compatible_slugs: [elevenlabs]
      capabilities: [audio.tts, audio.sfx]
      tools:
        audio.tts: text_to_speech
        audio.sfx: generate_sfx
      required: false
      label: "Audio provider"
      hint: "Bind ElevenLabs to enable text-to-speech and sound-effect generation."

    - role: music_provider
      kind: integration
      compatible_slugs: [elevenlabs]
      capabilities: [music.generate]
      tools:
        music.generate: generate_music
      required: false
      label: "Music provider"
      hint: "Bind ElevenLabs to enable music generation."

    - role: avatar_provider
      kind: integration
      compatible_slugs: [tavus, heygen]
      capabilities: [avatar.generate]
      tools:
        avatar.generate: create_video
      required: false
      label: "Avatar / talking-head provider"
      hint: "Bind Tavus (or HeyGen) to generate talking-head videos from a replica/avatar + script, and create reusable avatars where the provider supports it. Async — generation and avatar creation jobs queue and update when ready."

    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.write, files.delete]
      required: false
      label: "Storage (optional)"
      hint: "Save generated media permanently and share across instances. Without this, results are returned inline (when small enough) or as expiring upstream URLs."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: media_generate, description: "Generate media (image / video / audio / music / avatar). Args: kind (required: image|video|audio_tts|audio_sfx|music|avatar), prompt (required — for avatar this is the spoken script), model?, size?, duration?, voice?, aspect?, avatar? (replica/avatar id, avatar kind), source_image?, source_images?, n?, options?, cache_key?, cache_policy? ('reuse'|'refresh'). Video + avatar are async (queued; delivered via media.generated). Returns thumbnail + storage URL when storage is bound, else inline (small media) or expiring upstream URL." }
    - { name: media_estimate, description: "Estimate generation cost without creating media. Args match media_generate. Returns cost_usd when the bound provider exposes pricing or Media Studio can derive it." }
    - { name: media_delete, description: "Delete one generation for this project. Args: id, delete_storage? (default true). Also removes linked Storage files, async job rows, and local cache files when enabled." }
    - { name: media_avatar_create, description: "Create/train a reusable avatar through the bound avatar provider. Generic args: name, source_type (photo|prompt|video), source_image?, source_video?, consent_video?, prompt?, options?. Returns an avatar_create job." }
    - { name: media_history,  description: "List recent generations for this project. Args: kind?, limit?, since?." }
    - { name: media_get,      description: "Fetch one generation for this project. Args: id." }
  ui_panels:
    - slot: project.page
      label: Studio
      icon: image
      entry: /ui/MediaPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/media-studio
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/media-studio.db
  migrations: migrations/

upgrade_policy: auto-patch
