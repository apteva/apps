schema: apteva-app/v1

name: devices
display_name: Devices
version: 0.3.0
description: |
  Manage scoped device resources, arbitrary structured data, capability-described
  operations, recoverable enrollment, asynchronous commands, durable events and
  usage measurements. Native GPIO clients remain supported through a protocol
  adapter. MQTT owns transport and credentials; SaaS supplies commercial policy.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/devices
icon: /ui/icon.svg
icon_style: monochrome
tags: [devices, iot, mqtt, arduino, esp32, raspberry-pi, gpio]

scopes: [project]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
  apps:
    - name: mqtt
      version: ">=0.6.0"
      reason: "Provides the project-scoped MQTT broker, per-device credentials and ACLs, retained state, and device event bridge."
      events:
        - mqtt.client.connected
        - mqtt.client.disconnected

provides:
  http_routes:
    - { method: POST, prefix: /ingest/, no_auth: true }
    - prefix: /
  mcp_tools:
    - { name: devices_list, description: "List managed devices. Args: status?, q?, limit?." }
    - { name: devices_get, description: "Get one device with capabilities and current state. Args: device_id." }
    - { name: devices_provision, description: "Provision a device and return its recoverable MQTT password, endpoint, ACL topics, and setup details. Args: name, device_id?, protocol?, model?, manufacturer?, metadata?, capabilities?." }
    - { name: devices_update, description: "Update device name, model, description, or metadata. Args: device_id, patch." }
    - { name: devices_enable, description: "Enable a device credential. Args: device_id." }
    - { name: devices_disable, description: "Disable and disconnect a device credential. Args: device_id." }
    - { name: devices_rotate_secret, description: "Rotate a device MQTT password, disconnecting the old session. The chosen password is recoverable for a bounded window. Args: device_id." }
    - { name: devices_delete, description: "Delete a managed device and its MQTT credential. Args: device_id, confirm=true." }
    - { name: devices_state_get, description: "Get current state values for a device. Args: device_id, key?." }
    - { name: devices_capabilities_set, description: "Set the allowlisted variables, functions, and pins for a device. Required for GPIO pins that firmware cannot self-advertise. Args: device_id, manifest." }
    - { name: devices_capabilities_refresh, description: "Ask a device to report its variables, functions, pins, and identity. Args: device_id, wait?, timeout_ms?." }
    - { name: devices_variable_get, description: "Read an exposed device variable. Args: device_id, name, wait?, timeout_ms?." }
    - { name: devices_function_call, description: "Call an exposed firmware function. Args: device_id, name, arguments?, wait?, timeout_ms?, idempotency_key?." }
    - { name: devices_pin_read, description: "Read an allowlisted digital or analog pin. Args: device_id, pin, kind?, wait?, timeout_ms?." }
    - { name: devices_pin_write, description: "Write an allowlisted digital or PWM pin. Args: device_id, pin, value, kind?, wait?, timeout_ms?, idempotency_key?." }
    - { name: devices_pin_mode, description: "Change an allowlisted pin mode on native Apteva device clients. Args: device_id, pin, mode (input|input_pullup|output), wait?, timeout_ms?." }
    - name: devices_command_send
      description: "Send a correlated structured command. Prefer the variable/function/pin helpers for standard operations. Args: device_id, operation, target?, arguments?, wait?, timeout_ms?, idempotency_key?."
      async_result:
        id_field: command_id
        notify:
          target: caller
          mode: once
          events: [devices.command.completed, devices.command.failed, devices.command.timed_out]
          match: { command_id: "$result.command_id" }
          expires_after: 24h
    - { name: devices_command_get, description: "Get one command and its response. Args: command_id." }
    - { name: devices_commands_list, description: "List recent commands. Args: device_id?, status?, limit?." }
    - { name: devices_data_list, description: "Query scoped device data history with cursor pagination." }
    - { name: devices_events_list, description: "Read durable scoped events with cursor pagination." }
    - { name: devices_usage_list, description: "Read durable scoped usage measurements with cursor pagination." }
    - { name: devices_state_query, description: "Query generic current state with cursor pagination." }
    - { name: devices_operation_get, description: "Get lifecycle operation status and recover credentials within the recovery window." }
    - { name: devices_limits_get, description: "Get configured operational limits." }
    - { name: devices_responses_list, description: "Query accepted and late command responses with cursor pagination." }
    - { name: devices_ingest_credential_create, description: "Issue a scoped device-only HTTP write credential." }
    - { name: devices_ingest_credentials_list, description: "List device HTTP credential metadata." }
    - { name: devices_ingest_credential_revoke, description: "Revoke one device HTTP credential." }
    - { name: devices_usage_summary, description: "Exact usage totals in a time window and current resources." }
    - { name: devices_policy_get, description: "Get effective policy and revision." }
    - { name: devices_policy_set, description: "Controller-authorized revision-checked live policy update." }
  ui_panels:
    - slot: project.page
      label: Devices
      icon: cpu
      entry: /ui/DevicesPanel.mjs
  publishes:
    - { name: devices.device.created, description: "A device was provisioned." }
    - { name: devices.device.updated, description: "Device metadata or capabilities changed." }
    - { name: devices.device.deleted, description: "A device and its broker credential were deleted." }
    - { name: devices.device.connected, description: "A managed device authenticated to MQTT." }
    - { name: devices.device.disconnected, description: "A managed device disconnected from MQTT." }
    - { name: devices.device.status_changed, description: "A device availability status changed." }
    - { name: devices.state.changed, description: "One or more current device state values changed." }
    - { name: devices.telemetry.received, description: "A bounded device telemetry sample was accepted." }
    - { name: devices.command.completed, description: "A correlated device command succeeded." }
    - { name: devices.command.failed, description: "A correlated device command failed." }
    - { name: devices.command.timed_out, description: "A device command passed its response deadline." }
    - { name: devices.data.received, description: "Device data was durably accepted." }
    - { name: devices.command.submitted, description: "A command was durably accepted for dispatch." }
    - { name: devices.command.cancelled, description: "A command was cancelled by device disable or deletion; execution may be unconfirmed." }
    - { name: devices.command.late_response, description: "A response arrived after its deadline." }
    - { name: devices.policy.updated, description: "A live operational policy was committed." }
    - { name: devices.credential.created, description: "A device HTTP write credential was issued; no secret is included." }
    - { name: devices.credential.revoked, description: "A device HTTP write credential was revoked." }
    - { name: devices.data.rejected, description: "A durable MQTT message was quarantined after terminal validation failure." }

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/devices
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/devices.db
  migrations: migrations/

config_schema:
  - name: command_timeout_ms
    type: text
    default: "10000"
    label: Default command timeout (ms)
    description: How long commands wait for a correlated device response. Must be between 500 and 86400000 milliseconds.
  - name: telemetry_retention_hours
    type: text
    default: "168"
    label: Telemetry retention (hours)
    description: Recent raw telemetry retention. Current state is stored separately and is not pruned.
  - name: telemetry_max_rows_per_device
    type: text
    default: "10000"
    label: Telemetry rows per device
    description: Per-device safety ceiling for raw telemetry rows.
  - name: command_retention_days
    type: text
    default: "90"
    label: Command history retention (days)
    description: Completed commands and lifecycle audit events older than this are pruned. Active commands are never pruned.

  - name: max_devices
    type: text
    default: "10000"
    label: Max devices

  - name: max_device_payload_bytes
    type: text
    default: "131072"
    label: Max device payload bytes

  - name: max_state_keys_per_device
    type: text
    default: "1024"
    label: Max state keys per device

  - name: max_pending_commands
    type: text
    default: "10000"
    label: Max pending commands

  - name: max_pending_commands_per_device
    type: text
    default: "100"
    label: Max pending commands per device

  - name: max_concurrent_commands
    type: text
    default: "100"
    label: Max concurrent commands

  - name: max_concurrent_commands_per_device
    type: text
    default: "1"
    label: Max concurrent commands per device

  - name: max_history_bytes_per_device
    type: text
    default: "67108864"
    label: Max history bytes per device

  - name: event_retention_days
    type: text
    default: "90"
    label: Event retention days

  - name: usage_retention_days
    type: text
    default: "365"
    label: Usage retention days

  - name: secret_recovery_hours
    type: text
    default: "24"
    label: Secret recovery hours

  - name: max_clock_skew_seconds
    type: text
    default: "300"
    label: Max clock skew seconds

  - name: max_pending_events
    type: text
    default: "50000"
    label: Maximum pending data events

  - name: max_state_bytes_per_device
    type: text
    default: "1048576"
    label: Maximum current-state bytes per device
  - name: operation_retention_days
    type: text
    default: "90"
    label: Completed operation and idempotency retention (days)

  - name: policy_controller_app
    type: text
    default: "saas"
    label: Trusted live policy controller app
  - name: policy_admin_user_ids
    type: text
    default: ""
    label: Platform operator IDs allowed to update live policy
    description: Comma-separated IDs supplied by the trusted installer. Empty disables HTTP policy writes. Device and ordinary agent credentials cannot update policy.
  - name: max_http_credentials_per_device
    type: text
    default: "5"
    label: Maximum active HTTP credentials per device
  - name: max_http_credential_ttl_seconds
    type: text
    default: "31536000"
    label: Maximum HTTP credential lifetime (seconds)

  - name: max_transport_receipts
    type: text
    default: "1000000"
    label: Maximum durable transport receipts
  - name: max_ingest_rejections
    type: text
    default: "10000"
    label: Maximum acknowledged rejection diagnostics
  - name: transport_receipt_retention_hours
    type: text
    default: "168"
    label: Acknowledged transport receipt retention (hours)

upgrade_policy: auto-patch
