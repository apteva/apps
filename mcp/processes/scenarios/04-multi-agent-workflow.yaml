name: processes-multi-agent-workflow
description: Three real agents execute five steps with parallel inputs, a join, an approval, and a simulated publication receipt.
timeout: 10m
settle_for: 5s
max_iterations: 80
setup:
  mode: autonomous
  app:
    path: ./
    spawnable: true
  topology:
    nodes:
      - id: main
        primary: true
        agents:
          - id: writer
            name: Process Writer
            directive: |
              Your agent ID is ${AGENT_writer_ID}. Main coordinates your assigned
              Processes steps using the Processes skill and delivery contract.
              Do not create procedures or runs, or execute other agents' steps.
              Processes provisions an isolated worker for each independent step,
              inheriting this agent's spawnable MCP servers and the Processes
              coordination tools. Do not spawn a worker or call step_assign.
              Workers read the authoritative record and its dependencies,
              complete their own step, then report once. Main may read the
              record for visibility but must not complete the step itself.
              Use known ownership rather than listing threads for every new step.
              Wait for Processes events; do not manually forward downstream work.
          - id: reviewer
            name: Process Reviewer
            directive: |
              Your agent ID is ${AGENT_reviewer_ID}. Main coordinates assigned
              approval steps using the Processes skill and delivery contract.
              Processes provisions an isolated worker for every independent
              approval step, inheriting the agent's spawnable MCP servers and
              Processes coordination tools. Do not spawn a worker or call
              step_assign. The worker reads the frozen context, verifies
              evidence, records the explicit approval decision and reports
              once. Do not publish, create runs or execute another agent's
              work. Wait for Processes events.
directive: |
  You are the coordinator of an isolated test workflow. Your ID is
  ${PRIMARY_AGENT_ID}; writer is ${AGENT_writer_ID}; reviewer is ${AGENT_reviewer_ID}.
  Use Processes and Core thread tools (send and pace). There is no external publication in this test.
  Create exactly one procedure "Tier 3 collaborative briefing", initially unassigned,
  with required string parameter page with default
  photography. Shared instructions: prepare a verified beginner photography tip
  through assigned steps and record a simulated publication receipt. Completion
  criteria: all five steps complete and the final receipt matches the reviewed
  draft and the frozen page parameter. Define these steps:

  1. key=research, name=Research tip, role=researcher, kind=work, depends_on=[].
     Instructions: Read frozen page; output exactly `RESEARCH|page=<page>|tip=window-light`
     without backticks or trailing punctuation.
     Expected output: research evidence and page.
  2. key=audience, name=Check audience, role=writer, kind=work, depends_on=[].
     Instructions: Read frozen page; output exactly `AUDIENCE|page=<page>|level=beginner`
     without backticks or trailing punctuation.
     Expected output: audience evidence and page.
  3. key=draft, name=Write joined draft, role=writer, kind=work,
     depends_on=[research,audience].
     Instructions: Read BOTH dependency outputs, ensure their page equals the
     frozen parameter, and use their level and tip to produce exactly
     `DRAFT|<page>|<level>|<tip>` without backticks or trailing punctuation.
     If evidence is missing or conflicts, block with a reason.
     Expected output: draft derived from both inputs.
  4. key=review, name=Review joined draft, role=reviewer, kind=approval,
     depends_on=[draft].
     Instructions: Verify the draft is DRAFT|photography|beginner|window-light
     and agrees with both research and audience outputs and the frozen page.
     Approve only if all checks pass. Set decision=approved and output exactly
     `APPROVED|DRAFT|photography|beginner|window-light` without backticks or trailing
     punctuation. Otherwise reject with a reason.
     Expected output: explicit decision and evidence.
  5. key=publish, name=Record simulated receipt, role=publisher, kind=work,
     depends_on=[review].
     Instructions: Confirm the review approved this draft; use ancestor outputs
     and frozen page to record exactly `RECEIPT|photography|beginner|window-light`
     without backticks or trailing punctuation.
     This is only a local test receipt: do not call any external publishing tool.
     Expected output: simulated receipt for the approved draft.

  While the procedure is still draft, create an assignment named "Team",
  owned by you, follow_latest=true, no schedule,
  parameters={"page":"photography"}, with explicit agent role bindings: researcher and publisher to you, writer to
  ${AGENT_writer_ID}, reviewer to ${AGENT_reviewer_ID}. Do NOT leave review as human.
  You are authorized to create, bind and activate this test procedure. Activate
  it, activate the Team assignment, and start one occurrence with idempotency_key=team-day-1. Never create a
  second occurrence. Main coordinates assigned research and publish work using
  the Processes skill and delivery contract. Processes creates each independent
  worker and automatically inherits the executor agent's spawnable MCP servers.
  Do not spawn workers or call processes_step_assign; workers read the
  authoritative record and its dependencies, record the terminal outcome and
  report once. Main may read for visibility but must not duplicate evidence
  checks or rewrite the procedure. Use delivered Processes events rather than
  listing threads or forwarding work.
  Other agents receive their own work directly from Processes. Wait for these
  events; do not poll or manually dispatch downstream steps. Do not pace until
  activation and start have succeeded. After the publication worker reports
  success, call runs once to verify the completed five-step run, then stop.
  Repeated events must reuse the occurrence and not redo completed work.
outcome_assert:
  - http: GET /api/apps/processes/processes
    node: main
    expect_count_at: processes
    expect_count: 1
  - http: GET /api/apps/processes/processes
    node: main
    expect_count_at: processes.0.steps
    expect_count: 5
trajectory_assert:
  - tool_called_with:
      node: main
      agent: primary
      tool: processes_step_update
      args: {state: completed, output: "RESEARCH|page=photography|tip=window-light"}
      success: true
  - tool_called_with:
      node: main
      agent: writer
      tool: processes_step_get
      success: true
  - tool_called_with:
      node: main
      agent: writer
      tool: processes_step_update
      args: {state: completed, output: "AUDIENCE|page=photography|level=beginner"}
      success: true
  - tool_called_with:
      node: main
      agent: writer
      tool: processes_step_update
      args: {state: completed, output: "DRAFT|photography|beginner|window-light"}
      success: true
  - tool_called_with:
      node: main
      agent: reviewer
      tool: processes_step_get
      success: true
  - tool_called_with:
      node: main
      agent: reviewer
      tool: processes_step_update
      args: {state: completed, decision: approved, output: "APPROVED|DRAFT|photography|beginner|window-light"}
      success: true
  - tool_called_with:
      node: main
      agent: primary
      tool: processes_step_update
      args: {state: completed, output: "RECEIPT|photography|beginner|window-light"}
      success: true
  - tool_called_with:
      node: main
      agent: primary
      tool: processes_runs
      success: true
      result_contains: '"state":"completed"'
  - tool_not_called: processes_run_update
budget:
  total_tokens: 800000
  cost_usd: 5.00
