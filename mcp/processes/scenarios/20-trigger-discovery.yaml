name: processes-trigger-discovery
description: The agent finds which app event can start an assignment through trigger_sources, wires it from the suggested mappings, and only the qualifying real app-bus event starts a run.
timeout: 8m
settle_for: 5s
max_iterations: 48
setup:
  mode: autonomous
  app:
    path: ./
    bindings:
      test-pipeline: app
      test-signups: app
directive: |
  You are the operations agent for an isolated test. Your agent ID is
  ${APTEVA_TEST_AGENT_ID}. Use Processes. There is no external side effect.
  Do not call Processes start or trigger_test_run: the run must come from a real
  app event.

  Create exactly one procedure "Qualified lead follow-up", initially unassigned,
  with two required parameters: lead_email (string, label "Lead email") and
  lead_score (number, label "Lead score"). Shared instructions: prepare a
  follow-up note for a qualified lead. Completion criteria: the note names the
  frozen lead email and score. One step: key=followup, name=Prepare follow-up,
  role=owner, depends_on=[]. Instructions: output exactly
  FOLLOWUP|<lead_email>|<lead_score> using the frozen parameters (score as a
  whole number). Expected output: the follow-up line.

  While it is draft, create an assignment named "Sales", owned by you,
  follow_latest=true, no schedule, no fixed parameters, role owner bound to you.
  You are authorized to activate this test procedure and assignment.

  The operator's request: "Start Sales whenever a lead becomes qualified with a
  score of at least 80." You do not know which installed app sends that event or
  what it is called. Find it with processes_trigger_sources for the Sales
  assignment, with a query describing that request. Use the source install ID,
  topic and field paths it returns; never invent them. Create the trigger
  paused, with the suggested mappings and a filter so only scores of at least
  80 start runs. Preview one sample event that should match and one that should
  not, using the event's documented fields under data. Activate the procedure
  and assignment if they are not active yet, then the trigger, and check
  sync_pending=false (inspect trigger_get until it is live).

  Then call test-pipeline simulate exactly once. It publishes a burst of sales
  activity; only the right event should start Sales. Wait for the Processes step
  event, complete your step from its brief, then call processes_runs to confirm
  exactly one completed run and stop. Do not poll in a tight loop.
outcome_assert:
  - http: GET /api/apps/processes/processes
    node: main
    expect_count_at: processes
    expect_count: 1
trajectory_assert:
  - tool_called_with:
      tool: processes_trigger_sources
      success: true
      result_contains: '"suggested_mappings"'
      before: processes_trigger_create
  - tool_called_with:
      tool: processes_trigger_preview
      min_count: 2
      success: true
  - tool_called_with:
      tool: test-pipeline_simulate
      count: 1
      success: true
  - tool_called_with:
      tool: processes_step_update
      args: {state: completed}
      success: true
  - tool_not_called: processes_start
  - tool_not_called: processes_trigger_test_run
budget:
  total_tokens: 600000
  cost_usd: 5.00
