name: processes-run-ratings
description: An external reviewer agent answers Processes rating requests for a completed and a failed run and resolves the review queue; the run owner is refused when it tries to rate its own work.
timeout: 14m
settle_for: 45s
max_iterations: 120
setup:
  mode: autonomous
  app: {path: ./, spawnable: true}
  topology:
    nodes:
      - id: main
        primary: true
        agents:
          - id: reviewer
            name: Quality Reviewer
            directive: |
              Your agent ID is ${AGENT_reviewer_ID}. You are the external quality
              reviewer for Processes runs, like a manager reviewing other people's
              work. You never create procedures, start runs or execute steps.
              Wait for Processes rating requests with pace(clear_wake=true); do not
              poll. For each request, read that run once with processes_run_get,
              then rate the WHOLE run (no step_id) once with processes_run_rate and
              a distinct stable idempotency_key:
              - completed run whose check step output is DIGEST-OK: score 4,
                tags [Great], criteria {accuracy: 4, on_time: true},
                comment "Digest receipt verified".
              - failed run whose check step error is FIXTURE-FAIL: score 1,
                tags [Wrong output], criteria {accuracy: 1, on_time: false},
                comment "Check step failed".
              After you have rated TWO runs, call processes_review_queue once for
              that procedure. Claim each active item with processes_review_update
              (state claimed, its revision), then resolve it (state resolved, the
              new revision, resolution "Fixture failure confirmed").
              FINAL REQUIRED STEP: immediately after the last resolution, without
              calling pace first, call processes_quality_get once for the
              procedure. Then wait with pace(clear_wake=true).
directive: |
  Test Processes run ratings in this isolated project. Your agent ID is
  ${PRIMARY_AGENT_ID}; the external quality reviewer is ${AGENT_reviewer_ID}.
  Use only Processes and Core tools. No external actions; receipts are simulated.
  Create exactly ONE procedure named Rated digest, with a required string
  parameter mode and this quality block:
    scale stars; tags [Wrong output, Incomplete, Great];
    criteria [{key: accuracy, label: Accuracy, type: score},
              {key: on_time, label: On time, type: pass_fail}];
    reviewer {kind: agent, agent_id: ${AGENT_reviewer_ID}};
    request_rating true; review {failed_runs: true}.
  TWO required steps in order, both role executor:
  - draft, name Draft, depends_on [], instructions: Complete with output exactly
    DIGEST-DRAFT. Expected output: DIGEST-DRAFT.
  - check, name Check, depends_on [draft], instructions: Read the resolved mode
    parameter. If ok, complete with output exactly DIGEST-OK. If fail, fail this
    step with error exactly FIXTURE-FAIL and output exactly DIGEST-BROKEN. Do not
    retry: failure is the desired fixture outcome. Expected output: DIGEST-OK or
    the fixture failure.
  Shared instructions: Follow the Processes execution contract. Workers claim before
  executing. Completion criteria: both steps complete with their exact receipts.
  Create ONE assignment owned by yourself, worker_continuity=per_executor,
  follow_latest=true, parameter mode=ok, no schedule; activate the process and
  the assignment. You are authorized to execute this isolated test.
  Start exactly TWO runs without waiting between starts: idempotency_key rate-ok
  with parameter mode ok, and idempotency_key rate-fail with parameter mode fail.
  Processes provisions workers; main must not claim or execute steps, spawn or
  kill threads, or cancel runs. Do not poll; wait with pace(clear_wake=true).
  You own these runs, so rating them is the reviewer's job, not yours. To check
  that Processes enforces this, when the rate-ok run is terminal try ONCE to call
  processes_run_rate on it as yourself (whole run, score 5, tags [Great]).
  Processes must refuse it; do not retry and do not rate any run otherwise.
  Then keep waiting with pace(clear_wake=true) until the session ends.
  Do not start more runs or edit the procedure.
assert:
  - tool_called: processes_step_claim
  - tool_called_with:
      agent: primary
      tool: processes_run_rate
      args: {score: 5}
      count: 1
      success: false
      result_contains: external reviewer
  - tool_called_with:
      agent: reviewer
      tool: processes_run_rate
      args: {score: 4}
      count: 1
      success: true
  - tool_called_with:
      agent: reviewer
      tool: processes_run_rate
      args: {score: 1}
      count: 1
      success: true
  - tool_called_with:
      agent: reviewer
      tool: processes_review_update
      args: {state: resolved, resolution: Fixture failure confirmed}
      success: true
  - tool_called_with:
      agent: reviewer
      tool: processes_quality_get
      success: true
  - tool_not_called: kill
  - tool_not_called: processes_run_cancel
budget:
  total_tokens: 4000000
  cost_usd: 7.50
