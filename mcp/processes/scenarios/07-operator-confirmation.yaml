name: processes-operator-confirmation
description: A real LLM drafts, parks on a human confirmation step, and resumes to publish after the operator confirms mid-run.
timeout: 8m
settle_for: 5s
max_iterations: 40
setup:
  mode: autonomous
  app:
    path: ./
directive: |
  Test a workflow in this isolated project. Your agent ID is ${APTEVA_TEST_AGENT_ID}.
  Create exactly one procedure named "Tier 3 confirmed publication", initially
  unassigned. Shared instructions: draft a line, wait for the project operator to
  confirm it, then publish. Completion criteria: a published line that the
  operator confirmed. Define these three steps, all kind=work:
  - key=draft, name=Write draft, role=writer, kind=work, depends_on=[],
    instructions="Write a one-line draft: Golden hour flatters every portrait.",
    expected_output="The complete one-line draft".
  - key=confirm, name=Operator confirmation, role=confirmer, kind=work,
    depends_on=[draft],
    instructions="The project operator confirms the draft is cleared to publish.",
    expected_output="The operator's confirmation text".
  - key=publish, name=Publish confirmed draft, role=publisher, kind=work,
    depends_on=[confirm], instructions="Publish only the confirmed draft.",
    expected_output="Publication evidence".
  Create an assignment named "Confirmed", owned by you, execution_mode=agent,
  follow_latest=true, no schedule. Bind roles so that writer and publisher use
  you, and confirmer is {"kind":"human"}. The confirmer role must be human: you
  are not authorized to complete or confirm that step yourself.
  You are authorized to activate this test procedure and assignment, then start one
  occurrence with idempotency_key=confirm-day-1. Use run_get to discover step IDs,
  then step_get before acting. Complete the draft step with output exactly
  "Golden hour flatters every portrait." using step_update.
  Then stop acting and remain available. Do not call run_update for this
  structured run. Do not complete the confirm step, do not publish before the
  confirm step is completed, and do not poll or sleep in a loop.
  Processes will notify you when the publish step becomes ready after the
  operator confirms. When that notification arrives, call step_get for the
  publish step and complete it with output exactly
  "Published: Golden hour flatters every portrait." using step_update.
  Finish by calling runs to verify all three steps are completed. Then stop.
assert:
  - http: GET /api/apps/processes/processes
    expect_count_at: processes
    expect_count: 1
  - tool_called: processes_step_get
  - tool_called_with:
      tool: processes_step_update
      args: {state: completed, output: "Golden hour flatters every portrait."}
      count: 1
  - tool_called_with:
      tool: processes_step_update
      args: {state: completed, output: "Published: Golden hour flatters every portrait."}
      count: 1
  - tool_not_called: processes_run_update
  - tool_called: processes_runs
budget:
  total_tokens: 400000
  cost_usd: 3.00
