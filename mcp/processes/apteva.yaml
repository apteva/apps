schema: apteva-app/v1
name: processes
display_name: Processes
version: 0.16.21
description: Create and run company procedures. Processes automatically attaches its coordination tools to executing agents before dispatch. Executors must also have any apps required by their steps attached and configured.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/processes
icon: /ui/icon.svg
icon_style: monochrome
tags: [productivity, processes, agents, operations]
scopes: [project, global]
min_apteva_version: "0.52.0"
requires:
  permissions: [platform.events.subscribe, db.write.app, platform.apps.call, platform.instances.read, platform.instances.write, platform.threads.write, platform.mcp.attach]
  apps:
    - name: evals
      optional: true
      version: ">=0.5.9"
      reason: Optional isolated evaluation of immutable procedure revisions before activation.
provides:
  publishes:
    - name: process.created
      description: A procedure was created.
    - name: process.updated
      description: A procedure or its synchronization status changed.
    - name: process.state_changed
      description: A procedure was published, paused, returned to draft, or archived.
    - name: assignment.created
      description: An execution assignment was created.
    - name: assignment.updated
      description: Assignment configuration or schedule changed.
    - name: assignment.state_changed
      description: Assignment status changed.
    - name: run.summary_updated
      description: A durable agent-authored run checkpoint was saved.
    - name: run.memory_updated
      description: One scoped cross-run ledger entry was saved.
    - name: run.created
      description: A run was created.
    - name: run.updated
      description: Run progress or execution details changed.
    - name: run.state_changed
      description: Run state changed; filter to_state for completion or failure.
    - name: step.created
      description: A process step run was created.
    - name: step.updated
      description: Step progress, executor, or details changed.
    - name: step.state_changed
      description: Step state changed.
    - name: trigger.updated
      description: A trigger or its synchronization status changed.
    - name: trigger.event_processed
      description: An incoming trigger event was processed.
    - name: delivery.state_changed
      description: Agent dispatch entered retrying, suspended for repair, or recovered.
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: list, description: "Find procedure discovery metadata; follow reread references for full instructions." }
    - { name: get, description: "Read current content and version metadata, or one requested immutable definition." }
    - { name: validate_definition, description: Validate and normalize a semantic procedure without saving it. }
    - { name: create, description: Create an unassigned draft company procedure. }
    - { name: update, description: Replace the complete definition with an immutable draft revision. }
    - { name: patch, description: "Edit selected fields or steps/parameters by key; receive a compact immutable draft revision receipt." }
    - { name: activate, description: Activate a procedure for use by its assignments. }
    - { name: pause, description: Stop future scheduled runs without interrupting current work. }
    - { name: draft, description: Return a procedure to draft and stop new runs while preserving current work and history. }
    - { name: archive, description: Retire a procedure and stop future scheduled runs. }
    - { name: start, description: "Start one execution of an active assignment. Processes automatically attaches its coordination tools to executing agents before dispatch. Executors must also have any apps required by their steps attached and configured." }
    - { name: runs, description: Read compact paginated history with checkpoint summaries and exact detail references. }
    - { name: run_evidence, description: Recover exact oversized run sections in bounded JSON pages. }
    - { name: summary_get, description: Read a durable agent-authored run checkpoint. }
    - { name: summary_update, description: Save a bounded versioned semantic checkpoint with evidence references. }
    - { name: memory_list, description: Search scoped paginated cross-run knowledge. }
    - { name: memory_upsert, description: Save one idempotent scoped ledger entry with exact provenance. }
    - { name: run_get, description: "Read one bounded immutable run and step state; follow exact paged evidence references when incomplete." }
    - { name: run_update, description: "Save direct run progress or outcome; receive a compact receipt and exact reread reference." }
    - { name: assignments, description: List saved process assignments. }
    - { name: assignment_get, description: Read assignment settings. }
    - { name: assignment_create, description: "Configure a new assignment with agents, parameter values, and schedule. Processes automatically attaches its coordination tools to executing agents before dispatch. Executors must also have any apps required by their steps attached and configured." }
    - { name: assignment_update, description: "Revise a paused assignment. Processes automatically attaches its coordination tools to executing agents before dispatch. Executors must also have any apps required by their steps attached and configured." }
    - { name: assignment_activate, description: Enable an assignment. }
    - { name: assignment_pause, description: Pause one assignment. }
    - { name: assignment_archive, description: Archive one assignment. }
    - { name: step_claim, description: Claim an assigned step and reuse its persistent run worker. }
    - { name: step_get, description: "Read the assigned step, frozen policy and one exact dependency manifest; reuse retained context on later reads." }
    - { name: step_update, description: Save step progress or output; receive a compact acknowledgement and follow done and next_action. }
    - { name: run_advance, description: Release one eligible step in a step-by-step run as operator or coordinator. }
    - { name: run_cancel, description: Stop future handoffs in a structured run as coordinator or operator. }
    - { name: trigger_sources, description: "Configure, preview and inspect assignment event triggers." }
    - { name: triggers, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_get, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_create, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_update, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_activate, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_pause, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_preview, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_test_run, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_events, description: "Configure, preview and inspect assignment event triggers." }
    - { name: trigger_event_retry, description: "Retry a failed event against current trigger rules with a stable key." }
  ui_panels:
    - slot: project.page
      label: Processes
      icon: clipboard-list
      entry: /ui/ProcessesPanel.mjs
      suggested: true
  ui_components:
    - name: process-overview
      label: Processes
      description: Running, scheduled, and recent procedure executions.
      entry: /ui/ProcessOverviewWidget.mjs
      slots: [dashboard.home]
      suggested: true
      visibility: project
      supported_sizes: [half, full]
      default_size: half
      dashboard_scopes: [project, global]
      refresh_topics: [process.created, assignment.created, delivery.state_changed, process.updated, process.state_changed, assignment.updated, assignment.state_changed, run.created, run.updated, run.state_changed, step.created, step.updated, step.state_changed]
      settings_schema:
        type: object
        properties:
          show_active: {type: boolean, default: true}
          show_upcoming: {type: boolean, default: true}
          show_recent: {type: boolean, default: true}
          row_limit: {type: integer, title: Visible rows, default: 4, minimum: 1, maximum: 6}
      native:
        schema: apteva-native-surface/v1
        entry: /ui/surfaces/process-overview.json
  skills:
    - name: how-to-use-processes
      body_file: skills/how-to-use-processes.md
      description: Discover, maintain, evaluate, and execute company procedures with native run and step tracking.
      metadata:
        category: productivity
runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: processes/v0.16.21
    entry: mcp/processes
  port: 8080
  health_check: /health
  resources: { cpu: 0.1, memory: 128, cpu_limit: 1, memory_limit: 256 }
  storage:
    - { name: data, mount_path: /data }
  env:
    APTEVA_GATEWAY_URL: { from: platform }
    APTEVA_APP_TOKEN: { from: platform }
    APTEVA_INSTALL_ID: { from: platform }
    APTEVA_PROJECT_ID: { from: platform }
    APTEVA_APP_CONFIG: { from: platform }
db:
  driver: sqlite
  path: /data/processes.db
  migrations: migrations/
config_schema: []
upgrade_policy: auto-patch
