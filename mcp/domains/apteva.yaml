schema: apteva-app/v1

name: domains
display_name: Domains
version: 0.5.2
description: |
  DNS + domain inventory and registrar workflows for Apteva projects.
  Other apps that need to write DNS records (messaging for SES
  MX/DKIM, storage for CDN CNAMEs, future certs app for ACME
  challenges) call this app instead of speaking each registrar's API
  directly.

  Porkbun, IONOS, and Spaceship are supported for record CRUD. IONOS
  is zone-id oriented (the provider resolves a domain to its zone id
  via list_zones before each op) and its create endpoint takes a
  top-level JSON array, carried through the integration runner via
  body_root_param. Namecheap DNS uses XML read-modify-write semantics.
  Spaceship DNS uses batch save/delete tools and supports read-only
  availability checks. Registrar purchase flows are Porkbun-only in
  v0.5.0; Namecheap and Spaceship registration need safer purchase-flow
  support before they should be exposed here.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/domains
icon: /ui/icon.svg
icon_style: monochrome
tags: [domains, dns, infrastructure, registrar]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.connections.read
  integrations:
    - role: dns_provider
      kind: integration
      mode: multiple
      compatible_slugs: [porkbun, namecheap, ionos, spaceship]
      capabilities:
        - dns.list_records
        - dns.create_record
        - dns.edit_records_by_type
        - dns.delete_records_by_type
      tools:
        dns.list_records:        list_dns_records
        dns.create_record:       create_dns_record
        dns.edit_records_by_type: edit_dns_records_by_type
        dns.delete_records_by_type: delete_dns_records_by_type
      required: true
      label: "DNS providers (Porkbun, Namecheap, IONOS, Spaceship)"
      hint: "Connect every DNS account used by this project and choose a default. Each domain is pinned to its selected connection."
    - role: registrar_provider
      kind: integration
      mode: multiple
      compatible_slugs: [porkbun]
      capabilities:
        - domains.check_availability
        - domains.register
        - domains.pricing
      tools:
        domains.check_availability: check_availability
        domains.register:            register_domain
        domains.pricing:             get_pricing
      required: false
      label: "Registrar providers (Porkbun)"
      hint: "Connect every Porkbun registrar account used by this project and choose a default. If unset, registrar tools fall back to the default DNS provider when it is Porkbun, or to Spaceship for availability checks only."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    # local inventory
    - { name: domain_add,            description: "Register a domain with this app. By default the bound DNS provider is probed and pinned; pass skip_validation:true to bypass the probe, and use_default_connection:false to keep an external domain unbound. Args: name, connection_id?, registrar?, dns_provider?, notes?, skip_validation?, use_default_connection?." }
    - { name: domain_remove,         description: "Soft-delete a domain from this app's inventory. Doesn't touch the actual registration. Args: name." }
    - { name: domain_list,           description: "List domains registered with this app for the current project." }
    - { name: domain_get,            description: "Fetch one domain's local record. Args: name." }
    # registrar operations
    - { name: domain_availability_check, description: "Check if a domain is available for registration through the registrar provider. Safe/read-only. Args: domain, connection_id?." }
    - { name: domain_registration_prepare, description: "Prepare an expiring registration intent after a provider availability check. Present the returned quote to the user and obtain explicit confirmation before calling domain_register. Args: domain, years?, auto_renew?, whois_privacy?, coupon?, connection_id?, notes?." }
    - { name: domain_pricing_get,    description: "Fetch registrar pricing, optionally for one TLD. Args: tld?, connection_id?." }
    - { name: domain_register,       description: "Register a domain from a prepared intent. This spends real money. Requires confirmation_token from domain_registration_prepare after explicit user confirmation; completed-token retries are idempotent." }
    # DNS record CRUD via the bound provider
    - { name: domain_records_list,   description: "List DNS records on a domain via the bound dns_provider. Args: domain, type? (filter by record type)." }
    - { name: domain_records_set,    description: "Create or update a DNS record. Pass record_id for an exact update; ambiguous multi-record RRsets are rejected without it. Args: domain, name, type, value, ttl?, record_id?." }
    - { name: domain_records_delete, description: "Delete one record by record_id, or all records matching (domain, name, type) when record_id is omitted. Args: domain, name, type, record_id?." }
  ui_panels:
    - slot: project.page
      label: Domains
      icon: globe
      entry: /ui/DomainsPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/domains
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/domains.db
  migrations: migrations/

upgrade_policy: auto-patch
