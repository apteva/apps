schema: apteva-app/v1

name: domains
display_name: Domains
version: 0.4.1
description: |
  DNS + domain inventory and registrar workflows for Apteva projects.
  Other apps that need to write DNS records (messaging for SES
  MX/DKIM, storage for CDN CNAMEs, future certs app for ACME
  challenges) call this app instead of speaking each registrar's API
  directly.

  Porkbun and IONOS are supported end-to-end for record CRUD. IONOS
  is zone-id oriented (the provider resolves a domain to its zone id
  via list_zones before each op) and its create endpoint takes a
  top-level JSON array, carried through the integration runner via
  body_root_param. Namecheap DNS uses XML read-modify-write semantics.
  Registrar purchase flows are Porkbun-only in v0.4; Namecheap
  registration needs contact-profile support before it should be
  exposed here.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/domains
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/domains/icon.png
tags: [domains, dns, infrastructure, registrar]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.connections.read
  integrations:
    - role: dns_provider
      kind: integration
      compatible_slugs: [porkbun, namecheap, ionos]
      capabilities:
        - dns.list_records
        - dns.create_record
        - dns.edit_records_by_type
        - dns.delete_records_by_type
      tools:
        dns.list_records:        list_dns_records
        dns.create_record:       create_dns_record
        dns.edit_records_by_type: edit_dns_records_by_type
        dns.delete_records_by_type: delete_dns_records_by_type
      required: true
      label: "DNS provider (Porkbun, Namecheap, IONOS)"
      hint: "Connect a Porkbun, Namecheap, or IONOS account; the domains app uses that connection's API to read and write DNS records on the domains it manages."
    - role: registrar_provider
      kind: integration
      compatible_slugs: [porkbun]
      capabilities:
        - domains.check_availability
        - domains.register
        - domains.pricing
      tools:
        domains.check_availability: check_availability
        domains.register:            register_domain
        domains.pricing:             get_pricing
      required: false
      label: "Registrar provider (Porkbun)"
      hint: "Connect a Porkbun account to check availability and register new domains. If unset, registrar tools fall back to the DNS provider when it is Porkbun."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    # local inventory
    - { name: domain_add,            description: "Register a domain with this app. By default the bound DNS provider is probed to confirm the domain exists there before recording it locally — pass skip_validation:true to bypass. Args: name (e.g. acme.com), registrar?, dns_provider?, notes?, skip_validation?." }
    - { name: domain_remove,         description: "Soft-delete a domain from this app's inventory. Doesn't touch the actual registration. Args: name." }
    - { name: domain_list,           description: "List domains registered with this app for the current project." }
    - { name: domain_get,            description: "Fetch one domain's local record. Args: name." }
    # registrar operations
    - { name: domain_availability_check, description: "Check if a domain is available for registration through the registrar provider. Safe/read-only. Args: domain, connection_id?." }
    - { name: domain_pricing_get,    description: "Fetch registrar pricing, optionally for one TLD. Args: tld?, connection_id?." }
    - { name: domain_register,       description: "Register a new domain through the registrar provider. This spends real money. Args: domain, years?, auto_renew?, whois_privacy?, coupon?, connection_id?, notes?, skip_availability_check?." }
    # DNS record CRUD via the bound provider
    - { name: domain_records_list,   description: "List DNS records on a domain via the bound dns_provider. Args: domain, type? (filter by record type)." }
    - { name: domain_records_set,    description: "Upsert a DNS record. Composes list-then-create-or-edit since most providers' upsert is two-step. Args: domain, name (subdomain or @ for apex), type (A|AAAA|CNAME|MX|TXT|...), value, ttl?." }
    - { name: domain_records_delete, description: "Delete all records matching (domain, name, type). Args: domain, name, type." }
  ui_panels:
    - slot: project.page
      label: Domains
      icon: globe
      entry: /ui/DomainsPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/domains
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/domains.db
  migrations: migrations/

upgrade_policy: auto-patch
