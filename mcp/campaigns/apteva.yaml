schema: apteva-app/v1

name: campaigns
display_name: Campaigns
version: 0.2.15
description: |
  Bulk-send orchestrator. Compose a campaign, target a CRM segment (or
  a list — segments scoped to a list work too), schedule it, and the
  jobs app drives the materialise → tick loop while messaging does the
  actual sending. Per-recipient state, suppression respect, email
  unsubscribe links backed by persisted tokens, and basic stats.

  v0.2.9 ships authoring, scheduled sends, unsubscribe links, campaign
  recipient state tracking, a full-width operator panel, live CRM audience
  count / preview, project-aware Jobs targets for global installs, and
  live delivery/open stats reconciled from Messaging events with manual
  backfill for campaigns sent before the subscription was active.
  Click tracking, drip sequences, recurring schedules, and A/B variants
  remain future polish on top of the same schema.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/campaigns
icon: /ui/icon.svg
icon_style: monochrome
tags: [campaigns, marketing, broadcast, email, sms]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.instances.read
    - platform.apps.call
  apps:
    - name: messaging
      reason: Sends campaign recipients and receives message.event delivery/open/bounce updates.
      events:
        - message.event
  integrations:
    - role: crm
      kind: app
      compatible_app_names: [crm]
      capabilities: [contacts.list, segments.eval]
      required: true
      label: "CRM (audience source)"
      hint: "Audience is a segment (or a list — wrap it in a segment with in_list). CRM owns contacts, segments, and lists."
    - role: jobs
      kind: app
      compatible_app_names: [jobs]
      capabilities: [job.schedule]
      required: true
      label: "Jobs (scheduler)"
      hint: "Drives the materialise → tick → reconcile loop. Without it campaigns can't progress past 'scheduled'."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    # authoring
    - name: campaigns_create
      description: Create a new campaign in draft state. Email campaigns default open/click tracking on unless open_tracking/click_tracking are explicitly false.
    - name: campaigns_list
      description: List campaigns with filter on status / channel.
    - name: campaigns_get
      description: Fetch one campaign with current live stats and CRM audience count / preview. Use this for normal reporting.
    - name: campaigns_update
      description: Partial-patch a draft / paused campaign.
    - name: campaigns_clone
      description: Duplicate a campaign as a new draft.
    - name: campaigns_delete
      description: Archive a campaign (hard-delete only allowed when status=draft).
    - name: campaigns_send_test
      description: Send a single test message to a contact, logged but not threaded.
    # lifecycle
    - name: campaigns_schedule
      description: Move a draft to scheduled at a specific timestamp.
    - name: campaigns_start_now
      description: Move a draft / scheduled campaign straight to materialising.
    - name: campaigns_pause
      description: Pause a sending campaign — the tick loop stops claiming new recipients.
    - name: campaigns_resume
      description: Resume a paused campaign.
    - name: campaigns_cancel
      description: Cancel a campaign permanently. Pending recipients become 'skipped'.
    # read
    - name: campaigns_recipients
      description: List a campaign's recipients with filter on status.
    - name: campaigns_stats
      description: Read-only current recipient counts by status. Prefer this over reconcile for normal stats checks.
    - name: campaigns_reconcile
      description: Maintenance repair only. Backfill recipient delivery/open/click/bounce status from Messaging if events were missed. Mutates recipient statuses; do not use for normal stats checks.
    # Scheduler-only adapters. app_only keeps them out of agent tool catalogs
    # while allowing the bound Jobs app to invoke them through the platform.
    - name: campaigns_materialise
      exposure: app_only
      description: Internal Jobs target that materialises a scheduled campaign.
    - name: campaigns_tick
      exposure: app_only
      description: Internal Jobs target that advances a sending campaign by one batch.
  ui_panels:
    - slot: project.page
      label: Campaigns
      icon: send
      entry: /ui/CampaignsPanel.mjs
  publishes:
    - name: campaign.created
      description: A campaign draft was created.
    - name: campaign.updated
      description: A draft or paused campaign was edited.
    - name: campaign.archived
      description: A campaign was archived.
    - name: campaign.scheduled
      description: A campaign was scheduled for future materialisation.
    - name: campaign.sending
      description: A campaign materialised its audience and entered sending.
    - name: campaign.paused
      description: A sending campaign was paused.
    - name: campaign.resumed
      description: A paused campaign resumed sending.
    - name: campaign.cancelled
      description: A campaign was cancelled and pending recipients were skipped.
    - name: campaign.sent
      description: A campaign finished attempting all recipients.
    - name: campaign.recipient_updated
      description: A Messaging provider event changed one campaign recipient's status.
      payload:
        campaign_id: integer
        recipient_id: integer
        messaging_id: integer
        status: string
        event_kind: string
        address: string
    - name: campaign.reconciled
      description: Campaign recipient delivery stats were reconciled from Messaging.
      payload:
        campaign_id: integer
        checked: integer
        updated: integer
        failed: integer
        stats: object
    - name: campaign.unsubscribed
      description: A recipient used a campaign unsubscribe link and was added to Messaging suppression.
      payload:
        campaign_id: integer
        recipient_id: integer
        address: string

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/campaigns
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/campaigns.db
  migrations: migrations/

config_schema:
  - name: default_batch_size
    type: number
    default: 100
    label: Default tick batch size
    description: Number of recipients claimed per tick. Per-campaign override via campaign.batch_size.
  - name: default_tick_seconds
    type: number
    default: 60
    label: Default tick interval (seconds)
    description: How often the tick job runs while the campaign is sending. Per-campaign override.
  - name: default_open_tracking
    type: boolean
    default: true
    label: Track email opens by default
    description: Default open_tracking value for newly created email campaigns when the caller omits it.
  - name: default_click_tracking
    type: boolean
    default: true
    label: Track email clicks by default
    description: Default click_tracking value for newly created email campaigns when the caller omits it.
  - name: public_base_url
    type: text
    label: Public base URL for tracking links
    description: |
      Base URL the unsubscribe / tracking links point at. Defaults to the platform's reverse-proxy URL when blank.

upgrade_policy: auto-patch
