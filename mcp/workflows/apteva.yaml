schema: apteva-app/v1

name: workflows
display_name: Workflows
version: 0.4.7
description: |
  Deterministic, on-demand pipelines. A workflow is a YAML/JSON
  graph of steps (http, function, app, integration, emit, branch).
  Triggered manually, through HTTP, or by another app's event stream;
  pair with the Jobs app for cron schedules. Every run records a
  per-step audit log so you can inspect, retry, and replay.

  Strict separation from agents: workflows never call LLMs. If a
  step needs judgment, it sends an event to an agent and the
  workflow ends; the agent's reply triggers a downstream workflow.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/workflows
icon: /ui/icon.svg
icon_style: monochrome
tags: [workflows, automation, pipelines, deterministic, agent]

scopes: [project, global]
min_apteva_version: "0.18.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.apps.call
    - platform.connections.execute
  # workflows is a generic step runner — step.app / step.tool are
  # user-supplied at workflow-create time, not install time. These
  # opt the app into apteva-server's dynamic-access bypasses;
  # honoured only because workflows is identified as official
  # (apteva-org source).
  dynamic_app_calls: true
  dynamic_integration_access: true

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: workflows_create
      description: "Create a workflow. Args: name, source (YAML/JSON inline) OR (repo_id+repo_path), trigger?, status?."
    - name: workflows_update
      description: "Update a workflow's source, trigger, or status."
    - name: workflows_delete
      description: "Delete a workflow and cascade-drop its runs."
    - name: workflows_list
      description: "List workflows in the project. Optional filter by status, trigger_kind."
    - name: workflows_get
      description: "Fetch one workflow by id or name."
    - name: workflows_run
      description: "Synchronously execute a workflow. Args: name (or id), input (any JSON). Returns the run row + per-step trace."
    - name: workflows_runs
      description: "Recent runs for a workflow. Args: id (or name), limit (default 50, max 200)."
    - name: workflows_run_status
      description: "Full run + step trace. Args: run_id."
    - name: workflows_replay
      description: "Re-run a workflow against the same input. Args: run_id, from_step? (skip ahead to this step id)."
    - name: workflows_cancel
      description: "Cancel an in-flight run. Args: run_id."
  publishes:
    - { name: workflow.created, description: "A workflow was created." }
    - { name: workflow.updated, description: "A workflow was updated." }
    - { name: workflow.deleted, description: "A workflow was deleted." }
    - { name: workflow.step.started, description: "A workflow step started." }
    - { name: workflow.step.completed, description: "A workflow step completed." }
    - { name: workflow.run.finished, description: "A workflow run reached a terminal state." }
    - { name: workflow.run.cancelled, description: "Cancellation was requested for a workflow run." }
  ui_panels:
    - slot: project.page
      label: Workflows
      icon: git-branch
      entry: /ui/WorkflowsPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/workflows
  port: 8080
  health_check: /subscriber/health
  resources:
    cpu: 0.1
    memory: 96
    cpu_limit: 1
    memory_limit: 256
  storage:
    - name: data
      mount_path: /data
  env:
    APTEVA_GATEWAY_URL: { from: platform }
    APTEVA_APP_TOKEN:   { from: platform }
    APTEVA_INSTALL_ID:  { from: platform }
    APTEVA_PROJECT_ID:  { from: platform }
    APTEVA_APP_CONFIG:  { from: platform }

db:
  driver: sqlite
  path: /data/workflows.db
  migrations: migrations/

config_schema: []

upgrade_policy: auto-patch
