name: a2a-fleet-instance-to-main
description: An agent in a Fleet-style instance discovers and asks an agent on the main node.

timeout: 120s
max_iterations: 20

setup:
  mode: autonomous
  app:
    path: ./
  topology:
    nodes:
      - id: fleet_instance
        primary: true
        global: true
        config:
          public_url: ${NODE_fleet_instance_URL}
          peers_json: >-
            [{"id":"main","name":"Main","base_url":"${NODE_main_APP_URL}","token":"a2a-test-fleet-main-07","discover_agents":["*"],"invoke_agents":["*"]}]
      - id: main
        global: true
        config:
          public_url: ${NODE_main_URL}
          peers_json: >-
            [{"id":"fleet_instance","name":"Fleet Instance","base_url":"${NODE_fleet_instance_APP_URL}","token":"a2a-test-fleet-main-07","discover_agents":["Main Support"],"invoke_agents":["Main Support"]}]
        agents:
          - id: main_support
            name: Main Support
            directive: |
              Wait for an [a2a] request, then call agent_reply with status
              completed and exact message MAIN_SUPPORT_OK. Do not initiate tasks.

directive: |
  You are an agent inside a Fleet-provisioned instance. Call agents_discover
  exactly once with query "Main Support". Pass its returned address directly
  to agent_ask and ask for MAIN_SUPPORT_OK. Do not call agent_get. Stop after
  the completed reply arrives.

outcome_assert:
  - http: GET /api/apps/a2a/tasks
    node: fleet_instance
    expect_field_at: tasks.0.direction
    expect_field_eq: outbound
  - http: GET /api/apps/a2a/tasks
    node: fleet_instance
    expect_field_at: tasks.0.status
    expect_field_eq: completed
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.direction
    expect_field_eq: inbound
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.status
    expect_field_eq: completed

trajectory_assert:
  - tool_called_with:
      node: fleet_instance
      agent: primary
      tool: agents_discover
      result_contains: Main Support
      count: 1
  - tool_called_with:
      node: fleet_instance
      agent: primary
      tool: agent_ask
      success: true
      count: 1
  - tool_not_called_with:
      node: fleet_instance
      agent: primary
      tool: agent_get
  - tool_called_with:
      node: main
      agent: main_support
      tool: agent_reply
      args: { status: completed }
      success: true

budget:
  total_tokens: 60000
  cost_usd: 0.55
