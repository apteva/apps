name: a2a-immediate-handoff-events
description: The ask call returns a normal started result, then progress and terminal events complete the same task.

timeout: 120s
settle_for: 5s
max_iterations: 24

setup:
  mode: autonomous
  app:
    path: ./
  topology:
    nodes:
      - id: main
        primary: true
        agents:
          - id: recipient
            name: Event Recipient
            directive: |
              Wait for an [a2a] request. The request is small and can be handled
              here. First call agent_reply once with status working and exact
              message "I own this request and will report the result here.".
              Then call agent_reply once with status completed and exact message
              ASYNC_EVENT_OK. Do not initiate another task.

directive: |
  Ask Event Recipient (agent id ${AGENT_recipient_ID}) to return the exact
  marker ASYNC_EVENT_OK. When agent_ask returns, treat its normal result as an
  immediate started handoff: report the task ID to the requester, then wait for
  correlated progress and terminal events. Do not poll agent_tasks. Stop after
  the completed event arrives.

outcome_assert:
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.status
    expect_field_eq: completed
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.to_thread_id
    expect_field_eq: main

trajectory_assert:
  - tool_called_with:
      node: main
      agent: primary
      tool: agent_ask
      success: true
      result_contains: started
      count: 1
  - tool_called_with:
      node: main
      agent: primary
      tool: agent_ask
      result_contains: task_id
  - tool_called_with:
      node: main
      agent: primary
      tool: agent_ask
      result_contains: report_started_then_wait_for_events
  - tool_called_with:
      node: main
      agent: recipient
      tool: agent_reply
      args:
        status: working
        message: I own this request and will report the result here.
      success: true
      count: 1
  - tool_called_with:
      node: main
      agent: recipient
      tool: agent_reply
      args:
        status: completed
        message: ASYNC_EVENT_OK
      success: true
      count: 1
  - tool_not_called_with:
      node: main
      agent: primary
      tool: agent_tasks

budget:
  total_tokens: 120000
  cost_usd: 1.00

schema: apteva-app/v1
