name: a2a-recipient-focused-worker
description: A larger A2A request is claimed and completed by a focused spawned worker, not an unrelated idle conversation worker.

timeout: 120s
settle_for: 5s
max_iterations: 28

setup:
  mode: autonomous
  app:
    path: ./
    spawnable: true
  topology:
    nodes:
      - id: main
        primary: true
        agents:
          - id: recipient
            name: Delegating Recipient
            directive: |
              You are the recipient agent and the A2A main dispatcher. For a
              larger, multi-step request, do not answer from this thread and do
              not use the unrelated Generic Conversation Worker. Spawn exactly
              one paused focused worker with id a2a-focused-worker and a
              self-contained directive containing the incoming task id and the
              full request. Give it only the agent_reply capability it needs.
              Send that worker the complete request with Core send. The worker
              must immediately claim the original task with agent_reply status
              working and message "I own this request and will report the
              result here.", then immediately call agent_reply status completed
              with exact message FOCUSED_WORKER_OK. It must not use any other
              tool or perform extra analysis. Do not call agent_reply from this
              thread.
          - id: generic
            name: Generic Conversation Worker
            directive: |
              Stay idle. This thread is unrelated to A2A work. Do not receive,
              claim, or reply to the scenario request.

directive: |
  Ask Delegating Recipient (agent id ${AGENT_recipient_ID}) to perform a
  larger multi-step check and return the exact marker FOCUSED_WORKER_OK.
  Wait for the completed A2A event, then stop.

outcome_assert:
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.status
    expect_field_eq: completed
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.to_thread_id
    expect_field_eq: a2a-focused-worker

trajectory_assert:
  - tool_called_with:
      node: main
      agent: primary
      tool: agent_ask
      success: true
      count: 1
  - tool_called_with:
      node: main
      agent: recipient
      thread_id: main
      tool: spawn
      args:
        id: a2a-focused-worker
        paused: "true"
        tools: a2a_agent_reply
      success: true
      count: 1
  - tool_called_with:
      node: main
      agent: recipient
      thread_id: main
      tool: send
      args:
        id: a2a-focused-worker
      success: true
      count: 1
  - tool_called_with:
      node: main
      thread_id: a2a-focused-worker
      tool: agent_reply
      args:
        status: working
        message: I own this request and will report the result here.
      success: true
      count: 1
  - tool_called_with:
      node: main
      thread_id: a2a-focused-worker
      tool: agent_reply
      args:
        status: completed
        message: FOCUSED_WORKER_OK
      success: true
      count: 1
  - tool_not_called_with:
      node: main
      thread_id: main
      tool: agent_reply
  - tool_not_called_with:
      node: main
      agent: generic
      tool: agent_reply

budget:
  total_tokens: 180000
  cost_usd: 1.50

schema: apteva-app/v1
