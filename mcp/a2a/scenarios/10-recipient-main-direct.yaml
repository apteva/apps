name: a2a-recipient-main-direct
description: A small A2A request is completed by the recipient main thread without unnecessary delegation.

timeout: 120s
settle_for: 5s
max_iterations: 20

setup:
  mode: autonomous
  app:
    path: ./
  topology:
    nodes:
      - id: main
        primary: true
        agents:
          - id: recipient
            name: Direct Recipient
            directive: |
              You are the recipient agent. The A2A skill and incoming event are
              authoritative for dispatch. This test request is small and
              self-contained, so handle it in your receiving main thread.
              Do not spawn, send, or route it to another conversation worker.
              When the [a2a] request arrives, call agent_reply exactly once on
              its task with status completed and exact message DIRECT_MAIN_OK.
          - id: generic
            name: Generic Conversation Worker
            directive: |
              Stay idle. Do not initiate A2A work or reply to this scenario.

directive: |
  Ask Direct Recipient (agent id ${AGENT_recipient_ID}) to return the exact
  marker DIRECT_MAIN_OK. This is a small request. Wait for its completed A2A
  event, then stop.

outcome_assert:
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_count_at: tasks
    expect_count: 1
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.status
    expect_field_eq: completed
  - http: GET /api/apps/a2a/tasks
    node: main
    expect_field_at: tasks.0.to_thread_id
    expect_field_eq: main

trajectory_assert:
  - tool_called_with:
      node: main
      agent: primary
      tool: agent_ask
      success: true
      count: 1
  - tool_called_with:
      node: main
      agent: recipient
      tool: agent_reply
      args: { status: completed, message: DIRECT_MAIN_OK }
      success: true
      count: 1
  - tool_not_called_with:
      node: main
      agent: recipient
      tool: spawn
  - tool_not_called_with:
      node: main
      agent: recipient
      tool: send
  - tool_not_called_with:
      node: main
      agent: generic
      tool: agent_reply

budget:
  total_tokens: 90000
  cost_usd: 0.75

schema: apteva-app/v1
