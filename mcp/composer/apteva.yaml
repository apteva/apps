schema: apteva-app/v1

name: composer
display_name: Composer
version: 0.5.10
description: |
  Multi-clip video composition. Stitch generated or uploaded assets
  into a single video — layered visual tracks, timed audio tracks, optional
  soundtrack, and text overlays. Render runs locally via the sidecar's bundled ffmpeg by
  default, on a render host via instances when render_host_id is
  set, or against a SaaS render backend (Shotstack et al) when one
  is bound to the render_executor role.

  v0.5.10 makes V1 text rendering independent of fonts installed on the
  executor host. Composer supplies its bundled Go Mono TTF to both local and
  remote ffmpeg renders and uses an explicit fontfile in every drawtext
  filter, so legacy family values such as Courier New cannot fail through a
  missing Fontconfig catalog.

  v0.5.9 adds live Composer chat cards and a durable asynchronous render
  lifecycle. Composition cards update as agents build timelines; render cards
  follow AI generation, rendering, upload, and QA before becoming playable.
  Render rows are created before AI materialization, queued work resumes after
  sidecar restarts, and existing synchronous callers retain their wait behavior.

  v0.5.8 preserves reserved visual slots for fit_generated_keep_start:
  generated avatar/video actual duration is recorded without replacing the
  planned clip length. Base visual tracks now honor explicit start timestamps;
  gaps, overlaps, and out-of-order clips render on an absolute background
  canvas instead of collapsing through concat, while legacy implicit and
  explicitly contiguous tracks retain the efficient concat path. The panel
  uses the same keep-start semantics, and local and remote ffmpeg renders share
  the corrected timeline graph.

  v0.5.7 hardens multi-clip ElevenLabs narration. Composer now plans TTS
  continuity in timeline order, carries request IDs across silence and SFX,
  falls back to immediate neighboring text when an ID is unavailable, and
  uses stable text context rather than volatile provider IDs for cache
  identity. The panel and renderer share one server-side generation path;
  edits clear stale IDs, partial voice settings inherit conservative defaults,
  and generated TTS receives consistent loudness normalization.

  v0.5.6 adds Shotstack-style visual layering to the stable V1 renderer.
  The first visual track remains the fullscreen base track for backwards
  compatibility, while additional visual tracks render as timed image/video
  layers using clip-level fit, position, offset, width, height, scale,
  opacity, z_index, and Composer's layout alias. Overlay/PIP video audio is
  muted by default unless source_audio is explicitly set to keep.

  v0.5.5 keeps the experimental Composer V2 code in the repository but gates
  it behind COMPOSER_V2_ENABLED for internal development. Public installs go
  back to the stable V1 creation, validation, examples, and render surface.

  v0.5.4 added an opt-in browser Composer V2 renderer for richer motion-design
  experiments. It is not exposed by default in public installs.

  v0.5.3 improves native V2 polish: parented scale animations now scale text
  layout with the element to avoid reflow wobble, text auto-fits tight boxes
  with safer overflow margins, and the renderer adds faster rise/drop/zoom/pop
  animation presets for more modern scene motion.

  v0.5.2 adds Composer V2 component-style motion and design-size scaling.
  Native scene elements can now inherit a parent element's enter/animate
  transform for grouped card/text motion, and specs authored at one design
  size can render at smaller dimensions without oversized text or geometry.

  v0.5.1 fixes native V2 animation rendering: delayed typewriter/word reveal
  text now starts after its delay without layout jumps, CSS rgba colors are
  parsed with correct premultiplied alpha, and frame rendering avoids repeated
  font loading plus full-frame compositing for small elements.

  v0.5.0 adds the first native Composer V2 renderer. V2 scene graphs with
  image, shape, and text elements now render directly with percent/pixel
  layout, cover/contain image fitting, rounded/stroked shapes, opacity,
  enter/exit animation presets, typewriter/word reveal text, and x/y/scale/
  opacity keyframes. ffmpeg remains the encoder and audio mixer.

  v0.4.1 keeps Composer V2 specs intact during render: the ffmpeg
  compatibility timeline is now used only as a render snapshot, so scenes,
  elements, and animation metadata are not overwritten by materialization.

  v0.4.0 introduces the Composer V2 JSON foundation: a renderer-neutral
  scene/asset/audio schema, validation tools, canonical examples for agents,
  and a compatibility path that renders simple V2 scene/timeline specs through
  the existing ffmpeg executor while advanced animated layouts are explicitly
  marked for the upcoming web renderer.

  v0.3.45 adds first-class overlay/text tracks with rich text styling,
  timeline/UI editing, animation presets, and ffmpeg rendering after
  visual concatenation while preserving legacy per-clip text overlays.
  v0.3.46 renders typewriter and word-by-word text overlays as real
  time-gated reveal steps instead of treating them as simple fades.
  v0.3.47 adds provider-neutral multi-reference AI clips through
  source_images, including Composer UI editing, cache keys, Media Studio
  generation calls, render-time draft materialization, and history
  enrichment for image/video/avatar references.

  v0.3.44 makes remote instance renders upload Composer outputs through
  Storage's direct/chunked upload flow before falling back to single multipart
  POST, matching Media's large-render behavior.

  v0.3.43 fixes duplicate preview playback by stopping live preview media
  when compositions switch, removing nested media controls from the render
  opener, and making the full-size render viewer wait for an explicit play.

  v0.3.42 makes the Composer panel load composition history as lightweight
  summaries and fetches full timeline/render JSON only for the selected
  composition.

  v0.3.41 fixes portrait and square video previews in the Composer panel by
  rendering live and latest-render videos inside aspect-aware bounded frames.

  v0.3.40 keeps explicit loop/trim_or_loop AI video clips reusable instead
  of regenerating longer source videos when they are fitted to audio.

  v0.3.39 adds explicit visual video loop timing, so short generated
  visual clips can repeat to fill matched audio slots without clone-padding.
  The clip editor also exposes timing mode, source, reflow, and behavior.

  v0.3.38 stores ElevenLabs provider request IDs on generated TTS
  clips and automatically chains previous/next request IDs between
  compatible timeline voice clips when Media Studio returns them.

  v0.3.37 keeps ElevenLabs continuity context for supported TTS models
  while skipping it for eleven_v3, which currently rejects previous_text
  and next_text. It also surfaces Media Studio MCP error text directly
  during AI asset generation.

  v0.3.36 automatically passes ElevenLabs previous_text and next_text
  continuity context between sequential AI voice clips that share the same
  voice/model, and raises cloned-voice defaults to stability 0.85 and
  similarity 0.95.

  v0.3.35 gives new ElevenLabs AI voice clips conservative cloned-voice
  defaults (higher stability/similarity, style 0) while preserving explicit
  per-clip voice settings.

  v0.3.34 makes remote renders portable across Linux and macOS-style
  checksum tools by preferring sha256sum with a shasum fallback, and
  scopes Composer's Media Studio model, voice, and avatar lookups to
  the active project.

  v0.3.24 adds first-class AI image size metadata in Composer, passing
  portrait and landscape dimensions through to Media Studio so generated
  stills match the composition aspect instead of defaulting to provider
  dimensions.

  v0.3.23 renders timeline clips, gaps, lanes, and the playhead with
  explicit inline pixel layout so host CSS cannot collapse audio-only
  timelines in production panels.

  v0.3.22 gives the timeline a stable editing width in narrow app
  frames, preventing audio clips and silence gaps from visually
  collapsing when the inspector or host viewport squeezes the panel.

  v0.3.21 fixes the timeline surface markup so audio-only clips,
  silence clips, and short assets render across the full timeline
  instead of collapsing in browsers that repair nested buttons.

  v0.3.16 fixes audio-only timeline lane sizing so timed audio clips
  remain visible regardless of generated CSS class coverage.

  v0.3.15 makes audio-only compositions display as audio timelines
  instead of empty visual timelines, with a clear audio-only preview state.

  v0.3.14 fixes the Composer panel list so it closes the composition
  query before loading latest render metadata and passes the active
  project id through panel HTTP calls.

  v0.3.13 makes local renders read Storage assets from local blob files
  when available, avoiding fragile signed/public URL fetches for local
  ffmpeg and ffprobe while keeping signed URLs for remote renderers.

  v0.3.12 applies default trim and loudness normalization to generated
  sound-effect clips, so quiet AI SFX assets remain audible in audio-only
  and mixed renders without manual JSON audio settings.

  v0.3.11 probes generated Storage assets in Composer for actual
  audio/video/avatar duration before fit/reflow timing, keeping Media
  Studio focused on provider orchestration and estimates.

  v0.3.9 keeps local ffmpeg render outputs available until Composer
  has uploaded them to Storage or moved them into the fallback cache,
  fixing complete render rows with no downloadable output.

  v0.3.8 makes AI-generated background music a first-class quick-add
  path in the timeline and inspector, matching AI image/video/avatar
  clip creation while keeping timed AI audio clips separate.

  v0.3.5 promotes AI avatar clips to the same panel workflow as
  generated image/video/audio clips, including timeline quick-add and
  modal editing/generation.

  v0.3.4 makes the panel timeline universal: visual and audio rows
  share generated-asset creation, and timeline clips open a modal for
  editing Storage/URL source, AI prompt/settings, timing, generation,
  and deletion.

  v0.3.3 adds first-class panel controls for timed AI audio clips:
  prompt entry, model/voice controls, Storage browse, generate-in-place,
  and render from the same Composer view.

  v0.3.2 adds audio-only compositions and mp3/wav/m4a/aac render
  outputs, including timed silence gaps between audio clips.

  v0.3.1 adds generic timed audio tracks and generated asset shorthand
  for Media Studio-backed clips, music, voice, and sound effects.

  v0.3.0 adds AI-backed clip and soundtrack sources. Composer stores
  the generation intent on the timeline, calls Media Studio to
  materialize it, reuses Media Studio cache keys, and renders from the
  resulting Storage files.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/composer
tags: [video, composition, render, ffmpeg, timeline]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.apps.call
  apps:
    - name: storage
      version: ">=0.9.0"
      reason: source bytes via signed URLs, rendered output written back as a new file
    - name: instances
      version: ">=0.2.0"
      optional: true
      reason: when render_host_id config > 0, renders SSH-execute on that instance (auto-installs ffmpeg on first use)
    - name: media-studio
      version: ">=0.10.14"
      optional: true
      reason: panel can browse generations and materialize AI clip/soundtrack sources
  integrations:
    - role: render_executor
      kind: integration
      compatible_slugs: [shotstack, creatomate, json2video]
      capabilities: [video.compose]
      tools:
        video.compose: queue_render
      required: false
      label: "Render backend (optional)"
      hint: "When unbound, renders run locally via the sidecar's bundled ffmpeg (or remote via instances if render_host_id is set). SaaS executors are reserved for a later release."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: composition_create, description: "Create a v1 timeline composition or a composer/v2 composition via spec." }
    - { name: composition_update, description: "Patch a composition. V2 compositions accept patch.spec or a full composer/v2 payload." }
    - { name: composition_validate, description: "Validate composer/v1 or composer/v2 JSON and report renderer compatibility." }
    - { name: composition_examples, description: "Return canonical composer/v2 examples for agents to adapt." }
    - { name: composition_get,    description: "Fetch one composition with its latest render row. Args: id." }
    - { name: composition_list,   description: "List compositions for this project. Args: limit? (default 50)." }
    - { name: composition_delete, description: "Delete a composition (cascades renders). Args: id." }
    - name: composition_render
      description: "Submit a composition for rendering. Args: id, executor? ('local'|'remote'), wait? (default true for compatibility; false returns render_id immediately and continues durably in the background)."
      async_result:
        id_field: render_id
        notify:
          target: caller
          mode: once
          events: [composition.rendered, composition.failed, render.cancelled]
          match:
            render_id: "$result.render_id"
          expires_after: 24h
    - { name: render_status,      description: "Poll one render row. Args: render_id." }
    - { name: render_cancel,      description: "Cancel a queued render. Args: render_id." }
    - { name: asset_inspect,      description: "Probe an asset via ffprobe. Args: src (storage:N | https://… | mediastudio:N). Returns {kind, duration, dimensions, codec, fps}." }
    - { name: asset_search,       description: "Search reusable Storage assets for composition. Args: q?, kind?, tags?, folder?, recursive?, limit?, inspect?, include_generated?. Excludes generated/system assets by default and returns composition-ready src values like storage:N." }
  ui_panels:
    - slot: project.page
      label: Composer
      icon: film
      entry: /ui/ComposerPanel.mjs
  ui_components:
    - name: composition-card
      entry: /ui/CompositionCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [composition_id]
        properties:
          composition_id: { type: integer }
      preview_props: { preview: true, composition_id: 1 }
    - name: render-card
      entry: /ui/RenderCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [render_id]
        properties:
          render_id: { type: integer }
      preview_props: { preview: true, render_id: 1 }
  publishes:
    - { name: composition.created, description: "A composition was created." }
    - { name: composition.updated, description: "A composition timeline or metadata changed." }
    - { name: composition.deleted, description: "A composition was deleted." }
    - { name: render.queued, description: "A render was queued for durable background processing." }
    - { name: render.progress, description: "A render changed phase or progress." }
    - { name: composition.rendered, description: "A composition render completed." }
    - { name: composition.failed, description: "A composition render failed." }
    - { name: render.cancelled, description: "A queued render was cancelled." }

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/composer
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/composer.db
  migrations: migrations/

config_schema:
  - name: render_host_id
    type: select_from_app
    app: instances
    discovery:
      route: /api/instances
      response_path: instances
      value_field: id
      label_field: name
    fallback: text
    default: "0"
    label: Remote render host
    description: |
      Pick a host from the Instances app inventory to offload Composer
      ffmpeg renders. 0 means local sidecar rendering. Remote renders
      download signed input URLs on the selected host and upload the
      finished composition back to Storage.
  - name: ffmpeg_path
    type: text
    default: "ffmpeg"
    label: ffmpeg binary
    description: PATH lookup by default for local renders. Remote renders bootstrap a static ffmpeg on the selected host when needed.
  - name: ffprobe_path
    type: text
    default: "ffprobe"
    label: ffprobe binary

upgrade_policy: auto-patch
