schema: apteva-app/v1

name: trips
display_name: Trips
version: 0.8.4
description: |
  Plan trips end-to-end: destinations, transport, accommodation,
  activities, packing, budget. Calendar-synced — each trip owns a
  dedicated calendar that mirrors its itinerary, kept in step as
  items are added / moved / removed. Optional Duffel and Google Places
  integrations power flight and place search. Trip ideas can now hold
  candidate destinations, stays, transport, and activities before dates
  are known; adding dates schedules them and starts calendar mirroring.
  Flight searches feed long-lived route/deal intelligence with global
  scans, Duffel airport autocomplete, and route/date heatmaps.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/trips
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/trips/icon.png
tags: [trips, travel, itinerary, planning]

scopes: [project]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call               # talks to calendar
    - platform.connections.execute     # search via duffel + google-places
    - platform.connections.manage      # list available connections in settings UI
  apps:
    - name: calendar
      optional: false
      reason: "Mirror itinerary into a dedicated per-trip calendar"
  integrations:
    - role: duffel
      kind: integration
      required: false
      compatible_slugs: [duffel]
    - role: google-places
      kind: integration
      required: false
      compatible_slugs: [google-places]

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: trips_list,                 description: "List trips with derived planned/actual totals + days-until." }
    - { name: trips_get,                  description: "Read one trip with its child items + budget summary." }
    - { name: trips_create,               description: "Create a scheduled trip or undated trip idea. Dates are optional; calendar blocks are created only when both start_at and end_at are set." }
    - { name: trips_update,               description: "Update a trip's name/dates/status/color/sync_calendar/notes. Set start_at/end_at to null to turn it back into an idea." }
    - { name: trips_delete,               description: "Delete a trip and its child rows. Cascade-deletes the linked calendar." }

    - { name: destinations_add,           description: "Add a destination or destination idea. Args: trip_id, place_name, country?, arrive_at?, depart_at?, lat?, lng?, notes?." }
    - { name: destinations_update,        description: "Update a destination; upserts its calendar block." }
    - { name: destinations_delete,        description: "Delete a destination + its calendar block." }
    - { name: destinations_reorder,       description: "Reorder destinations. Args: trip_id, order (array of destination ids in new order)." }

    - { name: transport_legs_add,         description: "Add a transport leg or route idea. Args: trip_id, kind (flight|train|car|bus|ferry|other), depart_at?, arrive_at?, provider?, reference?, depart_location?, arrive_location?, cost_estimated?, currency?, confirmation_number?, from_destination_id?, to_destination_id?, notes?." }
    - { name: transport_legs_update,      description: "Update a transport leg. Upserts the calendar event." }
    - { name: transport_legs_delete,      description: "Delete a transport leg. Removes the calendar event." }
    - { name: transport_legs_mark_booked, description: "Convenience: flip booked=1 and optionally set cost_actual + confirmation_number. Args: id, cost_actual?, confirmation_number?." }

    - { name: accommodations_add,         description: "Add an accommodation or stay idea. check_in_at/check_out_at are optional; budget estimates still count while undated." }
    - { name: accommodations_update,      description: "Update an accommodation. Upserts the calendar event." }
    - { name: accommodations_delete,      description: "Delete an accommodation." }
    - { name: accommodations_mark_booked, description: "Mark booked + optionally set cost_actual + confirmation_number." }

    - { name: activities_add,             description: "Add an activity. Mirrors into the calendar when start_at is set. Args: trip_id, name, category (food|activity|shopping|transport_local|other), start_at?, end_at?, location?, cost_estimated?, currency?, destination_id?, notes?." }
    - { name: activities_update,          description: "Update an activity. Upserts the calendar event." }
    - { name: activities_delete,          description: "Delete an activity." }
    - { name: activities_mark_booked,     description: "Mark booked + optional cost_actual." }

    - { name: todos_list,                 description: "List todos for a trip. Args: trip_id, include_done?." }
    - { name: todos_add,                  description: "Add a todo. Args: trip_id, label, due_at?." }
    - { name: todos_toggle,               description: "Toggle done / not-done. Args: id." }
    - { name: todos_delete,               description: "Delete a todo." }

    - { name: budget_set,                 description: "Set a per-category cap on a trip. Args: trip_id, category (transport|lodging|food|activities|shopping|other), amount (minor units, trip.home_currency). Pass amount=0 to clear the cap." }
    - { name: budget_summary,             description: "Per-category planned (sum of estimates) + actual (sum of cost_actual) + cap + delta, plus a totals row. Args: trip_id." }

    - { name: dashboard,                  description: "One mega-payload for the trip detail page: trip row + destinations + transport_legs + accommodations + activities + todos + budget summary. Args: trip_id." }

    - { name: settings_get,               description: "Read trips project settings (home_airport, default_passengers, duffel + places connection ids, daily search budget)." }
    - { name: settings_set,               description: "Update trips project settings. Pass any subset of: home_airport, default_passengers, duffel_connection_id, places_connection_id, daily_search_budget_cents." }
    - { name: available_connections,      description: "List integration connections this project has access to. Args: provider? (e.g. 'duffel' or 'google-places'). Used by the settings dialog to pick which key to wire in." }
    - { name: search_places,              description: "Search Google Places. One generic tool with three modes: kind=destination + query → autocomplete; query + optional kind/coords → text search; kind + (lat/lng or destination_id) without query → nearby search. Cached 24h." }
    - { name: place_details,              description: "Full details for one place (phone, website, hours, photos, rating). Args: place_id. Cached 7d." }
    - { name: search_airports,            description: "Search Duffel airports for flight planning. Args: query? (IATA code, country code, city, or airport name), limit?. Cached 30d." }
    - { name: search_flights,             description: "Search flights via Duffel. Args: from (IATA, default home_airport), to, depart_date, return_date?, passengers?, cabin?. Returns offers ranked cheapest first." }

  ui_panels:
    - slot: project.page
      label: Trips
      icon: map
      entry: /ui/TripsPanel.mjs

  publishes:
    - { name: trip.created, description: "A trip or trip idea was created." }
    - { name: trip.updated, description: "A trip's details, dates, status, sync, archive state, or budget changed." }
    - { name: trip.deleted, description: "A trip was deleted." }
    - { name: destination.created, description: "A destination was added to a trip." }
    - { name: destination.added, description: "Compatibility alias for destination.created." }
    - { name: destination.updated, description: "A destination was updated." }
    - { name: destination.deleted, description: "A destination was deleted." }
    - { name: destination.reordered, description: "A trip's destinations were reordered." }
    - { name: transport.created, description: "A transport leg or route idea was added." }
    - { name: transport.added, description: "Compatibility alias for transport.created." }
    - { name: transport.updated, description: "A transport leg was updated." }
    - { name: transport.deleted, description: "A transport leg was deleted." }
    - { name: transport.booked, description: "A transport leg was marked booked." }
    - { name: accommodation.created, description: "An accommodation or stay idea was added." }
    - { name: accommodation.added, description: "Compatibility alias for accommodation.created." }
    - { name: accommodation.updated, description: "An accommodation was updated." }
    - { name: accommodation.deleted, description: "An accommodation was deleted." }
    - { name: accommodation.booked, description: "An accommodation was marked booked." }
    - { name: activity.created, description: "An activity was added." }
    - { name: activity.added, description: "Compatibility alias for activity.created." }
    - { name: activity.updated, description: "An activity was updated." }
    - { name: activity.deleted, description: "An activity was deleted." }
    - { name: activity.booked, description: "An activity was marked booked." }
    - { name: todo.created, description: "A trip todo was added." }
    - { name: todo.updated, description: "A trip todo was toggled or updated." }
    - { name: todo.deleted, description: "A trip todo was deleted." }
    - { name: budget.updated, description: "A trip budget cap was set or cleared." }
    - { name: settings.updated, description: "Trips project settings were updated." }
    - { name: price_observations.created, description: "Flight price observations were persisted from Duffel search." }

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/trips
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/trips.db
  migrations: migrations/

upgrade_policy: auto-patch
