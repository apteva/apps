schema: apteva-app/v1

name: fleet
display_name: Fleet
version: 0.10.5
description: |
  Control plane for a fleet of client apteva instances. Spawns every
  tenant as a local apteva process on the parent host with admin-
  driven setup: fleet mints a setup token and returns it via
  tenant_create; the operator finishes admin registration in the
  browser; tenant_attach_key completes the link.

  Fleet can attach tenant hostnames through the parent server-native
  ingress/cert manager, delegate tenant-owned DNS zones through the
  Domains app, and share parent integration connections into tenants
  as constrained provider grants.

  Each tenant is a fully independent apteva install: own DB, own
  users, own dashboard. The parent goes away → tenants are auto-
  restarted; the box reboots → reconcileOnBoot re-adopts surviving
  tenants and respawns dead ones.

  v0.9.0 optionally installs and pairs the A2A app across Fleet-managed
  tenants so attached tenant agents and attached parent agents can discover
  and communicate directly.

  v0.9.1 isolates tenant process environments from Fleet's parent-app
  credentials so tenant-owned apps always use tenant-minted callback tokens.

  v0.10.0 reads project templates through the platform SDK and can import and
  apply them to new or existing Fleet-managed tenants.

  v0.10.1 makes hosted clone transfers source-disk safe: ordinary files stream
  directly with resumable rsync, live SQLite databases use sqlite3_rsync, and
  clones stay domainless and stopped until a quarantine rehearsal succeeds.

  v0.10.2 fixes SQLite replica relative-path expansion in hosted clone scripts.

  v0.10.3 launches the exact versioned CLI/server/core binaries, validates the
  running health version, and preserves stopped tenants during updates.

  v0.10.4 skips intentionally offline hosted tenants during startup
  reconciliation, so a removed rehearsal VPS cannot prevent Fleet from mounting.

  v0.10.5 makes hosted updates fail closed: Fleet stops all validated tenant
  session processes, verifies ambiguous SSH results, and persists an update
  lease across restarts to prevent duplicate auto-respawns.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/fleet
icon: /ui/icon.svg
icon_style: monochrome
tags: [fleet, tenants, multi-instance, control-plane, ops]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.apps.call
    - platform.connections.execute
    - platform.ingress.write
    - platform.templates.read
  apps:
    - name: a2a
      version: ">=0.4.0"
      optional: true
      reason: Automatically install and pair A2A across managed tenants when the parent A2A app is bound.
  integrations:
    - role: domains
      kind: app
      required: false
      compatible_app_names: [domains]
      label: Domains app
      hint: Install the Domains app to attach custom hostnames to tenants.
    - role: host_provider
      kind: app
      required: false
      compatible_app_names: [instances]
      label: Instances app
      hint: Install the Instances app to host tenants on remote VPSes. Without it, all tenants live on the parent host (the existing behavior).
    - role: backup
      kind: app
      required: false
      compatible_app_names: [backup]
      label: Backup app
      hint: Install the Backup app to schedule and retain per-tenant snapshots.

provides:
  http_routes:
    - prefix: /
    - prefix: /dns/
      no_auth: true
    - prefix: /transfers/
      no_auth: true
    - prefix: /provider-grants/
      no_auth: true
  mcp_tools:
    # Descriptions are double-quoted because YAML disallows ": "
    # inside unquoted scalars — every "Args: …" suffix would trip the
    # parser otherwise (see fleet/v0.2.0's install bug).
    - name: tenant_create
      description: "Spawn a new apteva tenant and optionally import/apply a parent project template. Default (instance_id=0): local process on the parent host; pass instance_id>0 for an Instances VPS. Args: slug, owner_email, template_id?, project_description?, source_project_id?, instance_id?, port?, apteva_version?, apteva_bin?."
    - name: tenant_template_list
      description: "List parent-project setup templates Fleet may copy into tenants. Built-ins are included by default. Args: source_project_id?, include_system?."
    - name: tenant_apply_template
      description: "Read a parent-project template, import an exact snapshot into an active tenant project, and apply its apps, agents, and dashboard. Args: tenant_id, template_id, project_description?, source_project_id?, target_project_id?."
    - name: tenant_clone
      description: "Clone a Fleet-managed tenant without stopping or modifying the source. Hosted-to-hosted copies stream ordinary files directly with resumable rsync and live SQLite databases with sqlite3_rsync, without a full source-side staging directory. The clone has no domains and is stopped by default. Its first tenant_start runs a quarantine-only rehearsal and leaves it stopped; call tenant_start again to activate after validation. Args: source_tenant_id, slug, owner_email?, instance_id? (default source host; 0 = local parent, >0 = Instances VPS), port?, start? (default false; true runs the rehearsal immediately)."
    - name: tenant_attach_key
      description: "Finish admin-driven setup by attaching the tenant's api_key (created via the tenant dashboard after admin registration). Flips status to active. Args: tenant_id, api_key."
    - name: tenant_connect
      description: "Register an existing apteva-server (local or remote) as a tenant without spawning it. Args: base_url, api_key, owner_email, slug?."
    - name: tenant_list
      description: "List managed tenants."
    - name: tenant_get
      description: "Full record for one tenant + recent events. Args: tenant_id."
    - name: tenant_start
      description: "Start a stopped local tenant. For an unvalidated clone, the first call runs a quarantine-only rehearsal and leaves it stopped; call again to activate. Args: tenant_id."
    - name: tenant_stop
      description: "Stop a running local tenant (process SIGTERM → SIGKILL). Registry only for remote-connected tenants. Args: tenant_id."
    - name: tenant_delete
      description: "Stop and remove a tenant. For local tenants also wipes the data dir (only with confirm=true). Args: tenant_id, confirm? (required for data wipe)."
    - name: tenant_support_login
      description: "Mint a short-lived super-admin URL on the tenant. Args: tenant_id, reason."
    - name: tenant_run_remote
      description: "Proxy an MCP tool call to a tenant's gateway using its api_key. Args: tenant_id, app, tool, input."
    - name: tenant_inventory
      description: "Read tenant-local platform inventory through the tenant API. Returns tenant metadata, Fleet grants, and best-effort tenant projects/apps/agents/connections/MCP servers. Args: tenant_id, project_id?, include_users?, include_catalog?."
    - name: tenant_platform_call
      description: "Generic allowlisted tenant platform operation. Resources: apps, agents, projects, users, integrations, connections, mcp_servers. Args: tenant_id, resource, action, arguments?. Destructive actions require confirm=true."
    - name: tenant_app_tools
      description: "List MCP tools exposed by an installed tenant app. Args: tenant_id, app?, install_id?, project_id?."
    - name: tenant_app_call
      description: "Call an MCP tool exposed by an installed tenant app. Args: tenant_id, app, tool, arguments?, input?, install_id?, project_id?."
    - name: tenant_attach_domain
      description: "Attach a public hostname to a tenant. Managed DNS writes the record through Domains; routing and exact-host certs are registered through server-native ingress. For manage_dns=false, Fleet assumes the client already pointed DNS at this machine and only registers ingress. Args: tenant_id, fqdn, manage_dns? (default true), target?, type?, ttl?."
    - name: tenant_detach_domain
      description: "Clear a tenant's domain link — DNS delete when Fleet owns the record, ingress unregister, local clear. Local clear runs even on remote failure. Args: tenant_id."
    - name: tenant_domain_grant
      description: "Delegate a base domain to a tenant for tenant-local apps. Fleet writes base + wildcard DNS; application hostnames are registered individually with tenant_host_attach. Args: tenant_id, domain, target?, type? (A|CNAME), ttl?."
    - name: tenant_domain_list
      description: "List Fleet domain grants. Args: tenant_id? (optional filter)."
    - name: tenant_domain_revoke
      description: "Revoke a Fleet domain grant: remove linked exact-host ingress, delete DNS records, and remove the grant. Args: tenant_id, domain."
    - name: tenant_host_attach
      description: "Register one exact application hostname against a tenant's current ingress target. DNS is not modified. Args: tenant_id, hostname, domain_grant_id?."
    - name: tenant_host_list
      description: "List exact tenant host mappings and reconciliation status. Args: tenant_id? (optional filter)."
    - name: tenant_host_remove
      description: "Remove one exact tenant hostname from ingress and Fleet persistence without changing DNS or tenant data. Args: tenant_id, hostname."
    - name: tenant_ingress_prepare_direct
      description: "Prepare a hosted tenant to serve its primary and application hostnames directly on the Instances host. Parent routes remain available during transition. Args: tenant_id."
    - name: tenant_ingress_verify
      description: "Verify remote listeners, DNS, public HTTPS, and tenant-local routes before direct ingress is finalized. Args: tenant_id."
    - name: tenant_ingress_finalize
      description: "Finalize verified hosted direct ingress and remove the parent routes. Args: tenant_id."
    - name: tenant_ingress_rollback
      description: "Restore parent routes and managed DNS, then optionally disable remote ingress after DNS propagation. Args: tenant_id, confirm_disable?."
    - name: tenant_domain_record_set
      description: "Proxy a DNS upsert for a tenant-owned inherited domain. Intended for the tenant Domains facade. Args: tenant_id, domain, name, type, value, ttl?."
    - name: tenant_domain_record_delete
      description: "Proxy a DNS delete for a tenant-owned inherited domain. Intended for the tenant Domains facade. Args: tenant_id, domain, name, type."
    - name: tenant_provider_grant
      description: "Expose a parent integration connection inside a tenant as a tenant-local virtual connection. Generic provider delegation with optional tenant app binding and constraints. Args: tenant_id, project_id, app_slug, parent_connection_id, grant_id?, name?, tenant_install_id?, tenant_role?, allowed_tools?, allowed_domains?, allowed_from?, metadata?."
    - name: tenant_provider_grant_list
      description: "List delegated provider/integration grants. Args: tenant_id? (optional filter)."
    - name: tenant_provider_grant_revoke
      description: "Revoke a delegated provider/integration grant, unbind the tenant app role when known, and delete the tenant virtual connection. Args: tenant_id, grant_id."
    - name: tenant_migrate
      description: "Move a Fleet-managed tenant between the local parent host and Instances VPS hosts. Cross-host moves require Apteva 0.25.4+. Cold migration: inventory source apps, stop source, transfer data, boot target, require every previously running app at the same installed version to be healthy, then re-point the route and commit location. Set retain_source=true to keep the stopped source until tenant_migrate_finalize. Auto-rollback restarts the source on any pre-commit failure. Args: tenant_id, instance_id (0 = local parent, >0 = Instances row id), port?, retain_source?."
    - name: tenant_migrate_finalize
      description: "Inspect or permanently remove a stopped source retained by tenant_migrate. Omit confirm for a read-only preview; confirm=true deletes only the recorded old host/path after verifying it is not current. Args: tenant_id, confirm?."
    - name: tenant_update
      description: "Per-tenant apteva version update. Installs and validates the requested CLI/server/core binaries in Fleet's version cache and records target_version. Active tenants restart and must report the exact requested health version; stopped tenants remain stopped until tenant_start. Other tenants are unaffected. Args: tenant_id, version? (empty → npm latest)."
    - name: tenant_check_updates
      description: "Read-only: return npm's apteva@latest plus every local tenant whose current_version is behind. Args: (none)."
    - name: tenant_set_target_version
      description: "Pin a tenant's desired apteva version without applying — the panel surfaces drift between current and target. Args: tenant_id, version (empty to clear)."
    - name: tenant_reveal_api_key
      description: "Return the tenant's api_key. Fleet keeps the key sealed (AES-GCM); this tool unseals + returns. Sensitive — records an api_key_revealed event on the tenant. Args: tenant_id."
    - name: tenant_reset_admin_password
      description: "Rotate the tenant admin user's password to a fresh random value via PATCH /api/users/<id>/password (auth'd with the stored api_key). Revokes every existing session for that user. Returns admin_email + admin_password. Use when the operator needs admin credentials again — fleet does not persist the original password. Args: tenant_id."
    - name: fleet_tenant_backup_plan
      description: "Report backup coverage and Backup-app scope arguments for one tenant. Args: tenant_id."
    - name: fleet_tenant_snapshot
      description: "Provider hook used by Backup. Streams a snapshot of one local tenant."
    - name: fleet_tenant_restore
      description: "Provider hook used by Backup. Streams and restores one local tenant snapshot."
  ui_panels:
    - slot: project.page
      label: Fleet
      icon: server
      entry: /ui/FleetPanel.mjs

db:
  driver: sqlite
  path: /data/fleet.db
  migrations: migrations/

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: fleet/v0.10.5
    entry: mcp/fleet
  image: ghcr.io/apteva/fleet:0.1.0
  port: 8080
  health_check: /health
  resources:
    cpu: 0.05
    memory: 64
    cpu_limit: 1

config_schema:
  - name: a2a_main_agents_json
    label: Parent agents allowed over A2A
    type: text
    description: JSON list of attached parent agent names, IDs, card IDs, or "*". Defaults to all parent agents deliberately attached to A2A.
    default: '["*"]'
    required: false
  - name: a2a_tenant_agents_json
    label: Tenant agents allowed over A2A
    type: text
    description: JSON list of attached tenant agent names, IDs, card IDs, or "*". Defaults to all tenant agents, which Fleet attaches to their tenant A2A install.
    default: '["*"]'
    required: false

upgrade_policy: auto-patch
