schema: apteva-app/v1
name: evals
display_name: Evals
version: 0.3.2
description: Behavioral, voice, and continuous evaluation of agents inside isolated Environments.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/evals
tags: [evals, testing, agents, quality, regression]
scopes: [project]
min_apteva_version: "0.26.1"
requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.runtime_catalog.read
    - platform.agents.directive.write
  apps:
    - { name: environments, version: ">=0.4.4" }
    - { name: llm, version: ">=0.3.0" }
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: eval_suite_list, description: "List evaluation suites and their cases." }
    - { name: eval_suite_get, description: "Get one evaluation suite and its cases." }
    - { name: eval_suite_create, description: "Create an evaluation suite." }
    - { name: eval_suite_update, description: "Update an evaluation suite." }
    - { name: eval_suite_delete, description: "Delete an evaluation suite." }
    - { name: eval_case_create, description: "Add a behavioral case to a suite." }
    - { name: eval_case_update, description: "Update a behavioral case." }
    - { name: eval_case_delete, description: "Delete a behavioral case." }
    - { name: eval_experiment_create, description: "Queue a suite against one or more agent and model targets." }
    - { name: eval_experiment_list, description: "List evaluation experiments." }
    - { name: eval_experiment_get, description: "Get an experiment with its individual runs." }
    - { name: eval_experiment_cancel, description: "Cancel queued runs in an experiment." }
    - { name: eval_run_get, description: "Inspect one run, including trace, metrics, assertions, and judge verdict." }
    - { name: eval_run_retry, description: "Queue a fresh retry of one run." }
    - { name: eval_compare, description: "Compare target performance within an experiment." }
    - { name: eval_catalog, description: "List available agents, models, and Environments." }
    - { name: eval_suggestion_apply, description: "Apply an accepted directive suggestion with optimistic concurrency." }
  publishes:
    - { name: eval.experiment.created, description: "An evaluation experiment was queued." }
    - { name: eval.run.started, description: "An individual evaluation run started." }
    - { name: eval.run.stage.changed, description: "An evaluation run moved to another execution stage." }
    - { name: eval.run.completed, description: "An individual evaluation run completed." }
    - { name: eval.run.invalid, description: "A voice run ended without a valid two-sided simulation and was not scored." }
    - { name: eval.run.failed, description: "An individual evaluation run failed to execute." }
    - { name: eval.experiment.completed, description: "Every run in an evaluation experiment finished." }
    - { name: eval.regression.detected, description: "A continuous suite fell below its required pass rate." }
  ui_panels:
    - { slot: project.page, label: "Evals", icon: flask-conical, entry: /ui/EvalsPanel.mjs }
  workers:
    - { name: runner, schedule: "@every 2s" }
    - { name: scheduler, schedule: "@every 1m" }
runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: evals/v0.3.2
    entry: mcp/evals
  port: 8080
  health_check: /health
db:
  driver: sqlite
  path: /data/evals.db
  migrations: migrations/
upgrade_policy: auto-patch
