schema: apteva-app/v1

name: prospecting
display_name: Prospecting
version: 0.3.0
description: |
  A standalone lead workspace for Apteva. Seed companies manually or in bulk,
  organize them with target profiles, explore and update the catalog, record
  decisions, and export portable CSV or JSON without installing another app.

  Optional Web integration adds bounded company discovery, first-party page
  extraction, deterministic qualification, and cited research. Optional CRM
  integration adds duplicate-safe contact linking plus explicitly confirmed
  one-to-one email, SMS, and WhatsApp outreach through CRM's Messaging binding.
  Prospecting never runs campaigns, makes calls, creates opportunities, or
  calls paid lead-data providers.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/prospecting
icon: /ui/icon.svg
icon_style: monochrome
tags: [prospecting, leads, sales, research, crm, growth]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
  apps:
    - name: web
      version: ">=0.2.7"
      optional: true
      reason: Optional browser-backed company discovery and enrichment. Manual seed, import, exploration, and export work without it.
    - name: crm
      optional: true
      reason: Optional duplicate-safe contact linking and explicitly confirmed one-to-one outreach through CRM and its Messaging binding. Prospecting retains its own working catalog without CRM.

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: prospecting_overview, description: "Summarize target profiles, runs, and candidate statuses for the current project." }
    - { name: prospecting_capabilities, description: "Report whether optional Web discovery and CRM-backed outreach are connected." }
    - { name: prospecting_profiles_create, description: "Create a target profile. Args: name, description?, industries?, locations?, employee_min?, employee_max?, target_titles?, keywords?." }
    - { name: prospecting_profiles_list, description: "List target profiles. Args: status? (active|archived|all)." }
    - { name: prospecting_profiles_get, description: "Get one target profile. Args: id." }
    - { name: prospecting_profiles_update, description: "Patch a target profile. Args: id and any editable profile fields." }
    - { name: prospecting_profiles_archive, description: "Archive a target profile. Args: id." }
    - { name: prospecting_search_run, description: "Run a bounded Web search with provider fallback and deterministic noise filtering. Args: profile_id, query?, limit? (1-50), engine?, fallback_engine?." }
    - { name: prospecting_runs_list, description: "List discovery runs. Args: profile_id?, limit?." }
    - { name: prospecting_candidates_create, description: "Create a candidate manually. Args: company_name, profile_id? (an Imported leads profile is created when omitted), website?, person fields?, email?, phone?, summary?, source_url?." }
    - { name: prospecting_candidates_import, description: "Bulk seed up to 1000 candidates from CSV, JSON, or candidate objects without Web or CRM." }
    - { name: prospecting_candidates_export, description: "Export a portable JSON candidate set without CRM." }
    - { name: prospecting_candidates_search, description: "Search candidates. Args: profile_id?, status?, q?, limit?, offset?." }
    - { name: prospecting_candidates_get, description: "Get one candidate with evidence and optional CRM handoff state. Args: id." }
    - { name: prospecting_candidates_update, description: "Patch a candidate's company or person details and recalculate its explainable scores. Args: id and editable fields." }
    - { name: prospecting_candidates_research, description: "Research one candidate through Web and persist cited evidence. Args: id, question?." }
    - { name: prospecting_candidates_qualify, description: "Deterministically qualify one candidate from first-party pages without AI. Args: id, max_pages? (1-5)." }
    - { name: prospecting_candidates_qualify_batch, description: "Deterministically qualify a bounded candidate batch without AI. Args: profile_id?, status?, limit? (1-25), max_pages? (1-5)." }
    - { name: prospecting_candidates_defer, description: "Defer a candidate without rejecting it. Args: id, reason?." }
    - { name: prospecting_candidates_reject, description: "Reject a candidate. Args: id, reason?, exclude_company? (default false)." }
    - { name: prospecting_candidates_purge_rejected, description: "PERMANENT DELETE: remove every rejected candidate and its Prospecting evidence from the current project. Requires confirm=true." }
    - { name: prospecting_candidates_accept, description: "OPTIONAL REAL CRM WRITE: send a candidate to connected CRM and idempotently upsert it. Requires CRM plus email or phone. Args: id, list_ids?. Does not send a message or create an opportunity." }
    - { name: prospecting_candidate_outreach_start, description: "OPTIONAL REAL CRM WRITE: create or link the CRM contact so one-to-one outreach can begin while the lead stays in Prospecting's active queue. Requires email or phone. Does not send a message. Args: id, list_ids?." }
    - { name: prospecting_candidate_outreach_get, description: "Read the linked CRM contact's recent activities, conversations, opportunities, verified Messaging senders, and WhatsApp session/template state. Args: id. Read-only." }
    - { name: prospecting_candidate_outreach_send, description: "REAL EXTERNAL SEND through CRM and its bound Messaging app. Sends email, SMS, or WhatsApp and records the CRM conversation. Requires confirm=true. Args: id, channel, body? or template_id, subject?, conversation_id?, from?, template_vars?, idempotency_key?, confirm." }
    - { name: prospecting_exclusions_list, description: "List excluded companies, domains, or people. Args: kind?, limit?." }
    - { name: prospecting_exclusions_remove, description: "Remove one exclusion. Args: id." }
  ui_panels:
    - slot: project.page
      label: Prospecting
      icon: search
      entry: /ui/ProspectingPanel.mjs
  skills:
    - name: prospecting
      command: /prospecting
      body_file: skills/how-to-use-prospecting.md
      description: |
        Teaches agents to seed, import, explore, update, and export a standalone
        lead catalog, with optional Web discovery and explicitly confirmed
        one-to-one outreach through CRM.
      metadata:
        category: sales
  publishes:
    - { name: prospecting.profile.created, description: "A target profile was created." }
    - { name: prospecting.search.completed, description: "A bounded Web discovery run completed." }
    - { name: prospecting.candidate.created, description: "A candidate was discovered or created manually." }
    - { name: prospecting.candidate.researched, description: "A candidate received new Web research evidence." }
    - { name: prospecting.candidate.qualified, description: "A candidate was deterministically qualified from first-party Web evidence." }
    - { name: prospecting.candidate.accepted, description: "A candidate was handed to CRM." }
    - { name: prospecting.candidate.outreach_started, description: "A candidate was linked to CRM for one-to-one outreach; no message was sent by this event." }
    - { name: prospecting.candidate.contacted, description: "An explicitly confirmed email, SMS, or WhatsApp message was sent through CRM." }
    - { name: prospecting.candidate.rejected, description: "A candidate was rejected." }

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: prospecting/v0.3.0
    entry: mcp/prospecting
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/prospecting.db
  migrations: migrations/

upgrade_policy: auto-patch
