schema: apteva-app/v1
name: database
display_name: Database
version: 0.5.2
description: Independent local databases with collections, typed records, generic indexes and aggregation. SQLite, Pebble and embedded AptevaDB adapters share one contract.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/database
icon: /ui/icon.svg
icon_style: monochrome
tags: [database, data, storage]
scopes: [project, global]
requires:
  permissions: [db.write.app]
provides:
  http_routes:
    - prefix: /
  resources:
    - name: database
      label: Database
      matcher: glob
  permissions:
    - {name: database.watch, resource: database, description: Watch collection changes.}
    - {name: database.read, resource: database, description: Read collections and records.}
    - {name: database.write, resource: database, description: Insert and modify records.}
    - {name: database.manage, resource: database, description: "Create and delete databases, collections and indexes."}
  mcp_tools:
    - {name: db_realtime_configure, description: Enable or disable native realtime capture.}
    - {name: db_realtime_describe, description: Inspect realtime support and usage.}
    - {name: db_changes, description: Wait for resumable collection invalidations.}
    - {name: db_databases_list, description: List available databases.}
    - {name: db_database_create, description: "Create a local SQLite, Pebble or AptevaDB database."}
    - {name: db_database_describe, description: Describe a database.}
    - {name: db_database_drop, description: Delete a database with explicit confirmation.}
    - {name: db_collections_list, description: List collections in a database.}
    - {name: db_collection_create, description: Create a typed collection.}
    - {name: db_collection_describe, description: Describe a collection schema.}
    - {name: db_collection_drop, description: Delete a collection with explicit confirmation.}
    - {name: db_indexes_list, description: List generic indexes.}
    - {name: db_index_create, description: Create an ordered compound or unique index.}
    - {name: db_index_drop, description: Delete a secondary index.}
    - {name: db_get, description: Get a record by primary key.}
    - {name: db_find, description: "Filter, order, project and paginate records."}
    - {name: db_insert, description: Atomically insert records.}
    - {name: db_update, description: Atomically patch matching records.}
    - {name: db_delete, description: Atomically delete matching records.}
    - {name: db_upsert, description: Atomically insert or patch by a unique key.}
    - {name: db_count, description: Count matching records exactly.}
    - {name: db_aggregate, description: "Group records and compute count, sum, avg, min and max."}
    - {name: db_batch, description: Atomic writes across collections within one database.}
    - {name: db_explain, description: Inspect query index use and sorting.}
  ui_panels:
    - slot: project.page
      label: Database
      icon: database
      entry: /ui/DatabasePanel.mjs
  skills:
    - name: database
      description: Use local databases, collections, indexes, records and aggregates.
      body_file: skills/how-to-use-database.md
runtime:
  kind: source
  source: {repo: github.com/apteva/apps, ref: database/v0.5.2, entry: mcp/database}
  port: 8080
  health_check: /health
db:
  driver: sqlite
  path: /data/database-app.db
  migrations: migrations/
config_schema:
  - name: durability_profile
    type: select
    options: [durable, balanced]
    default: durable
    label: SQLite durability profile
    description: Durable uses synchronous FULL. Balanced uses synchronous NORMAL for Tables-like write latency with a wider crash-loss window.
  - name: aptevadb_sync_mode
    type: select
    options: [full, barrier, os]
    default: full
    label: AptevaDB write flush mode
    description: Full flushes the drive cache. OS uses ordinary fsync, like SQLite's default on macOS. Barrier orders writes without forcing the drive cache. OS and barrier give weaker power-loss protection on macOS. Writes remain synchronous.
  - name: aptevadb_cache_mib
    type: select
    options: ["0", "32", "64", "128", "256", "512"]
    default: "64"
    label: AptevaDB cache target (MiB)
    description: Per-database logical cache target. Zero explicitly opts out of cache-target admission. This is not a process memory cap.
  - name: aptevadb_mapped_cache_mib
    type: select
    options: ["0", "32", "64", "128", "256", "512"]
    default: "64"
    label: AptevaDB cold mapped cache target (MiB)
    description: Periodically reclaim cold file translations. Zero disables reclamation. Hot pages, private buffers and runtime memory may exceed this soft target.
  - name: aptevadb_managed_memory_mib
    type: select
    options: ["0", "64", "128", "256", "512", "1024"]
    default: "0"
    label: AptevaDB managed buffer target (MiB)
    description: Optional per-database soft admission for native owned buffers and query reservations. Zero disables it. Pinned storage can cause resource_limit; this is not a process RSS cap.
  - name: aptevadb_aggregate_disk_mib
    type: select
    options: ["0", "64", "256", "1024", "4096", "8192"]
    default: "1024"
    label: AptevaDB aggregate scratch quota (MiB)
    description: Per-query temporary disk allowance for budget-limited aggregates. Zero disables spilling. Files stay in the owned database directory and are cleaned on completion or cancellation.
  - name: aptevadb_max_groups
    type: select
    options: ["65536", "1048576", "4194304", "16777216"]
    default: "1048576"
    label: AptevaDB aggregate group guard
    description: Maximum groups visited by native aggregate execution, including groups discarded from the result. Increasing this keeps memory, scratch, response and deadline limits in force.
  - name: aptevadb_total_cache_mib
    type: select
    options: ["0", "128", "256", "512", "1024", "2048"]
    default: "0"
    label: AptevaDB total cache targets (MiB)
    description: Zero selects the larger of 256 MiB or one database cache. Idle native handles close and reopen automatically; active queries and watches keep their handles. This is not an RSS limit. Uncapped per-database caches explicitly opt out.
  - name: aptevadb_memtable_mib
    type: select
    options: ["0", "8", "16", "32", "64", "128", "256"]
    default: "0"
    label: AptevaDB write buffer (MiB)
    description: Zero disables write buffering. Positive values opt into native buffering independently of the cache target. Writes keep the selected synchronous durability.
  - name: aptevadb_max_concurrent_queries
    type: select
    options: ["1", "2", "4", "8"]
    default: "2"
    label: Concurrent AptevaDB queries
    description: App-wide slots for find, count, aggregate and watch initial snapshots. Waiting uses the request deadline without retaining a native snapshot. Point gets are not queued here.
  - name: aptevadb_aggregate_workers
    type: select
    options: ["1", "2", "4", "8"]
    default: "4"
    label: AptevaDB aggregate workers
    description: Workers for broad native aggregates. Uncertain integer sums retain their checked fallback.
  - name: aptevadb_query_memory_mib
    type: select
    options: ["8", "16", "32", "64", "128", "256"]
    default: "16"
    label: AptevaDB query memory budget (MiB)
    description: Per-query retained work budget. Budget-limited aggregates retry through bounded streaming and optional disk spill. Result and deadline limits still apply.
upgrade_policy: auto-patch
