schema: apteva-app/v1
name: mobile
display_name: Mobile
version: 0.10.0
description: |
  v0.10.0 adds password references: secure_text takes secret_ref, a name from the encrypted mobile_secrets setting bound to a package and optionally a field and device, so agents never see the password; allow_literal_secure_text=false refuses literal passwords.
  v0.9.1 restarts live video when its phone link breaks during a short USB drop, treats a new adb transport as a reconnect, and reports a stopped action as session_stopped.
  v0.9.0 adds an immediate stop for sessions, session/action/device events, phone health with automatic reconnect, live H.264 video with touch input, long-press, drag, any keycode, Unicode replace and wait_for, and baseline/clean for shared phones.
  v0.8.0 reports Android selection state (checkable, checked, selected, scrollable) in UI source and advertises the selection_state capability on the ADB driver.
  v0.7.0 adds Android password entry through a private stdin pipe and accessibility ACTION_SET_TEXT, with exact screen guards, confirmation and recording exclusion.
  v0.6.0 collects bounded Android UI trees without waiting for animations
  to stop, and verifies focused-field text replacement and clearing by readback.
  Retains iOS/Android keep-awake controls, recording fixes and embedded panels.
  Operate physical Android and iOS devices through exclusive sessions.
  Navigate websites, install and launch apps, inspect screens and UI trees,
  and run repeatable smoke tests with screenshots and durable results.
  Record device screens to video (with audio on supported setups), mark
  moments, and export clips for App Store previews, Play promo videos or
  social posts. Install builds from the App Store, Play Store or TestFlight.
  On a Mac with Xcode, iPhones, iPads and booted iOS Simulators are found and
  controlled natively, without Appium.
  Runs beside devices or connects to an authenticated Mobile runner.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/mobile
icon: /ui/icon.svg
icon_style: monochrome
tags: [mobile, android, ios, automation, testing, devices, recording, video]
scopes: [project]
min_apteva_version: "0.11.0"
requires:
  permissions: [db.write.app, net.egress, platform.apps.call]
  apps:
    - name: storage
      version: ">=0.10.13"
      optional: true
      reason: finished recordings and exports are copied to /.mobile/ in Storage
  binaries:
    - name: adb
      executables: [adb]
      required: false
      hint: "Install Android Platform Tools and authorize USB or wireless debugging. Optional when using Appium or a remote Mobile runner."
      sources: {}
    - name: ffmpeg
      executables: [ffmpeg, ffprobe]
      required: false
      hint: "ffmpeg and ffprobe are needed for accurate Android recording timelines, video metadata, and exports."
      sources: {}
    - name: xcode
      executables: [xcrun]
      required: false
      hint: "Xcode 15 or newer on the Mac running Mobile enables native iOS control (devices and Simulators) and USB capture."
      sources: {}
    - name: scrcpy
      executables: [scrcpy]
      required: false
      hint: "scrcpy 2.1+ enables high-quality Android recording with audio (Android 11+) and live video (mobile_stream mode=video)."
      sources: {}
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: mobile_power, description: "Read or set persistent keep awake through an active exclusive session. Args: session_id, action? (status|set), enabled? (required for set). Returns keep_awake and scope: Android ADB while_charging, native iOS always (Auto-Lock Never, including on battery). iOS visits Settings; stop recording first. Disabling restores the saved iOS timeout or 30 seconds if none was saved. Closing Mobile keeps the preference." }
    - { name: mobile_setup, description: "Inspect and complete native iPhone signing setup. Args: action? (status|select_team|open_xcode), team_id?; no existing certificate is needed. Apple sign-in, phone trust and Developer Mode require operator interaction." }
    - { name: mobile_devices, description: "List discovered/configured devices and host setup diagnostics. Android ADB phones include a health snapshot (battery, temperature, charging, thermal, Wi-Fi, signal, screen, storage, uptime, alerts) and last_seen_at. Args: platform?, physical?." }
    - { name: mobile_session, description: "Open, list, get, renew, close or stop an exclusive device session. open takes caller_ref? (copied onto the session's events). stop ends at once (session_id, device_id or all=true; reason?): cancels the running action, lifts any finger, ends streams and recordings, records end_reason=stopped. A session whose phone drops off is paused and resumes when it returns, or ends as device_lost after offline_grace_seconds. Recover releases an unknown Appium creation outcome after manual cleanup and confirm=true. Args: action, device_id? or platform?, physical?, session_id?, ttl_seconds?, mode? (screen|structured), caller_ref?, all?, reason?, confirm?. Close preserves app data." }
    - { name: mobile_observe, description: "Inspect a session. Returns screenshot image content and optional UI source. Args: session_id, source? (default false), image? (default true). image=false with source=true gives Android ADB source without capturing an image; unsupported drivers fail without fallback." }
    - { name: mobile_action, description: "Operate a session. Args: session_id, action (navigate|tap|swipe|long_press|drag|text|secure_text|key|tap_element|context|wait_for), url?, x?, y?, to_x?, to_y?, path?, duration_ms?, text?, key?, keycode?, element?, timeout_ms?, using?, value?, context?. Coordinates are normalized 0..1. key accepts names or any Android keycode except the operator's blocked_keycodes. replace=true sets any Unicode text through accessibility, verified before and after. wait_for returns found or timed_out. Android secure_text takes password, expected_package, expected_resource_id, expected_bounds, native_required and native_values; requires an empty focused password field and no active or finalizing recording. Returns secure_input=true and verified=true only after private verification." }
    - { name: mobile_app, description: "Install, launch, stop, uninstall or check an app. Args: session_id, action (install|launch|stop|uninstall|status), source? (artifact|store|beta), app_id?, app_name?, store_id?, artifact?, flow?. Artifact installs take an APK or device IPA from the artifact directory; store/beta installs drive the Play Store, App Store or TestFlight. Uninstall requires confirm=true." }
    - { name: mobile_stream, description: "Live view of a session. mode=poll (default) gives screenshot polling details; mode=video (Android ADB with scrcpy) gives a WebSocket url with a 5-minute renewable token for H.264 frames (scrcpy 12-byte headers) and touch/key/text input. Args: session_id, mode?, token? (renew), max_size?, bit_rate_kbps?, show_touches?." }
    - { name: mobile_device, description: "Baseline and clean a shared Android phone. Args: session_id, action (baseline_capture|baseline_get|clean|verify_clean), confirm? (clean requires true), clear_data? (baseline apps whose data to clear). clean uninstalls apps added since the baseline, clears the clipboard, deletes downloads and screenshots added since the baseline and closes apps. No factory reset." }
    - { name: mobile_record, description: "Record a session's screen to video and manage recordings. Args: action (start|stop|mark|get|list|delete|presets|upload), session_id?, recording_id?, quality? (auto|standard|high), audio?, max_seconds?, name?, status?, run_id?, kind?, confirm?. Ready recordings include file_url and their Storage upload state." }
    - { name: mobile_record_export, description: "Export a ready recording with a preset (raw, app_store_preview, play_promo, social_vertical, social_square, or a project preset) or a custom preset. Args: recording_id, preset? or custom?, variant?, orientation?, fit?, from?, to?, from_mark?, to_mark?. Runs in the background and validates the output against the preset." }
    - name: mobile_test_run
      description: "Start a bounded deterministic smoke test on a device. Args: device_id, steps (max 50), name?, build_ref?, mode?, record? (true or {quality, audio}). Each step has action and optional label, params; assert_text/wait_for_text use params.text, wait uses params.ms, record_mark params.name, wait_for_app params.app_id. A recorded run gets one video with a marker per step. Returns a durable run_id."
      async_result:
        id_field: run_id
        notify:
          target: caller
          mode: once
          events: [mobile.test.completed]
          match: { run_id: "$result.run_id" }
          expires_after: 15m
    - { name: mobile_test_get, description: "Get a test report or list recent runs. Args: run_id?; report includes failure_kind, per-step evidence and build_ref." }
    - { name: mobile_test_cancel, description: "Cancel a queued or running test. Args: run_id." }
  ui_panels:
    - slot: project.page
      label: Mobile
      icon: smartphone
      entry: /ui/MobilePanel.mjs
  skills:
    - name: mobile
      command: /mobile
      body_file: skills/how-to-use-mobile.md
      description: Discover phones, reserve a session, operate mobile browsers/apps, record screen videos, export store previews and execute smoke tests.
      metadata: { category: development }
  publishes:
    - { name: mobile.test.completed, description: "A test reached a terminal state; includes run_id, status and failure_kind." }
    - { name: mobile.recording.uploaded, description: "A recording or export was copied to Storage; includes recording_id, storage_file_id, kind and preset." }
    - { name: mobile.session.started, description: "A session opened; session_id, device_id, caller_ref, started_at." }
    - { name: mobile.session.ended, description: "A session ended; session_id, device_id, caller_ref, started_at, ended_at, duration_ms, end_reason (closed, stopped, expired, device_lost, interrupted), stop_reason." }
    - { name: mobile.action.performed, description: "Sent only when action_events=all. One session tool call or live-video gesture; session_id, device_id, caller_ref, tool, action, redacted args (text as length, secrets as [secret]), result, duration_ms." }
    - { name: mobile.device.online, description: "An Android phone reconnected; device_id, time." }
    - { name: mobile.device.offline, description: "An Android phone dropped off; device_id, time. Its session is paused." }
  workers:
    - { name: test_notifications, schedule: "@every 5s" }
    - { name: recording_uploads, schedule: "@every 15s" }
    - { name: events, schedule: "@every 2s" }
runtime:
  kind: source
  source:
    repo: https://github.com/apteva/apps.git
    ref: mobile/v0.10.0
    entry: mcp/mobile
  port: 8080
  health_check: /health
  storage:
    - { name: artifacts, mount_path: /data }
db:
  driver: sqlite
  path: /data/mobile.db
  migrations: migrations/
config_schema:
  - { name: runner_url, type: text, label: Remote Mobile runner URL, description: "Empty runs locally. Remote runners require HTTPS; loopback HTTP is allowed." }
  - { name: runner_token, type: secret, label: Remote runner token }
  - { name: appium_url, type: text, label: Appium server URL, description: "Optional local runner backend, usually http://127.0.0.1:4723. Keep Appium on a trusted private network." }
  - { name: devices_json, type: text, label: Device inventory JSON, description: 'Optional array: [{"id":"iphone","name":"Test iPhone","platform":"ios","udid":"...","browser":"Safari","physical":true}]. Required for devices attached to a separate Appium host. Add "capture_id" if USB capture lists the device under a different ID than its UDID.' }
  - { name: android_driver, type: text, default: adb, label: Android driver, description: "adb for screen input; appium for structured native/browser automation." }
  - { name: ios_driver, type: text, default: native, label: iOS driver, description: "native: Mobile controls iPhones, iPads and booted Simulators itself through Xcode on this Mac (a small signed test runner is built and installed automatically). appium: use appium_url and devices_json instead." }
  - { name: ios_team_id, type: text, label: Apple team ID (advanced), description: "Optional 10-character signing team override. Mobile discovers teams from Xcode even before a certificate exists; choose between multiple teams in Mobile > Setup. Sign into Xcode once; certificates and profiles are created automatically." }
  - { name: artifact_dir, type: text, label: Install artifact directory, description: "Runner-local directory containing APK/IPA files. Defaults to the Mobile data directory's uploads subdirectory." }
  - { name: export_presets_json, type: text, label: Export presets JSON, description: 'Optional array of extra export presets, e.g. [{"name":"store_landscape","container":"mp4","video_codec":"h264","sizes":{"tv":{"w":1080,"h":1920}},"orientations":["landscape"],"max_fps":30,"max_seconds":30,"video_bitrate_kbps":11000,"audio":"aac"}]. Same fields as the built-in presets listed by mobile_record(action=presets).' }
  - { name: lock_dir, type: text, label: Shared device lock directory, description: "All local Mobile processes controlling the same devices must share this directory. Defaults to ~/.apteva/mobile-locks." }
  - { name: action_events, type: text, default: "off", label: Action events, description: "off (default) or all: publish mobile.action.performed for every session tool call and live-video gesture, for audit. Session and device events are always published." }
  - { name: offline_grace_seconds, type: text, default: "300", label: Offline grace (seconds), description: "How long a session stays paused waiting for its phone to come back before it ends as device_lost. 0 waits until the session expires." }
  - { name: max_stream_viewers, type: text, default: "4", label: Live video viewers per session, description: "1..20." }
  - { name: blocked_keycodes, type: text, default: "26,223,276", label: Blocked Android keycodes, description: "Comma-separated keycodes that key actions refuse. Default: power, sleep, soft sleep. Use none to allow all." }
  - { name: mobile_secrets, type: secret, label: Password references, description: 'Encrypted JSON map of project IDs to references for secure_text: {"<project_id>":{"bank-login":{"value":"...","package":"com.example.bank","resource_id":"com.example.bank:id/password","device_id":"R5GYC4D9S5M","expires_at":"2027-01-01T00:00:00Z"}}}. value, package and expires_at (RFC3339) are required; resource_id and device_id (inventory ID or serial) narrow where the value may be typed. Agents pass secret_ref and never see the value.' }
  - { name: allow_literal_secure_text, type: bool, default: true, label: Allow literal passwords, description: "When off, secure_text refuses password and accepts only secret_ref, so no password can pass through an agent's context or logs." }
upgrade_policy: auto-patch
