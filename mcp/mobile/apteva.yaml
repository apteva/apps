schema: apteva-app/v1
name: mobile
display_name: Mobile
version: 0.6.0
description: |
  v0.6.0 collects bounded Android UI trees without waiting for animations
  to stop, and verifies focused-field text replacement and clearing by readback.
  Retains iOS/Android keep-awake controls, recording fixes and embedded panels.
  Operate physical Android and iOS devices through exclusive sessions.
  Navigate websites, install and launch apps, inspect screens and UI trees,
  and run repeatable smoke tests with screenshots and durable results.
  Record device screens to video (with audio on supported setups), mark
  moments, and export clips for App Store previews, Play promo videos or
  social posts. Install builds from the App Store, Play Store or TestFlight.
  On a Mac with Xcode, iPhones, iPads and booted iOS Simulators are found and
  controlled natively, without Appium.
  Runs beside devices or connects to an authenticated Mobile runner.
author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/mobile
icon: /ui/icon.svg
icon_style: monochrome
tags: [mobile, android, ios, automation, testing, devices, recording, video]
scopes: [project]
min_apteva_version: "0.11.0"
requires:
  permissions: [db.write.app, net.egress, platform.apps.call]
  apps:
    - name: storage
      version: ">=0.10.13"
      optional: true
      reason: finished recordings and exports are copied to /.mobile/ in Storage
  binaries:
    - name: adb
      executables: [adb]
      required: false
      hint: "Install Android Platform Tools and authorize USB or wireless debugging. Optional when using Appium or a remote Mobile runner."
      sources: {}
    - name: ffmpeg
      executables: [ffmpeg, ffprobe]
      required: false
      hint: "ffmpeg and ffprobe are needed for accurate Android recording timelines, video metadata, and exports."
      sources: {}
    - name: xcode
      executables: [xcrun]
      required: false
      hint: "Xcode 15 or newer on the Mac running Mobile enables native iOS control (devices and Simulators) and USB capture."
      sources: {}
    - name: scrcpy
      executables: [scrcpy]
      required: false
      hint: "scrcpy 2.1+ enables high-quality Android recording with audio (Android 11+)."
      sources: {}
provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: mobile_power, description: "Read or set persistent keep awake through an active exclusive session. Args: session_id, action? (status|set), enabled? (required for set). Returns keep_awake and scope: Android ADB while_charging, native iOS always (Auto-Lock Never, including on battery). iOS visits Settings; stop recording first. Disabling restores the saved iOS timeout or 30 seconds if none was saved. Closing Mobile keeps the preference." }
    - { name: mobile_setup, description: "Inspect and complete native iPhone signing setup. Args: action? (status|select_team|open_xcode), team_id?; no existing certificate is needed. Apple sign-in, phone trust and Developer Mode require operator interaction." }
    - { name: mobile_devices, description: "List discovered/configured devices and host setup diagnostics. Args: platform?, physical?." }
    - { name: mobile_session, description: "Open, list, get, renew or close an exclusive device session. Recover releases an unknown Appium creation outcome after manual cleanup and confirm=true. Args: action, device_id? or platform?, physical?, session_id?, ttl_seconds?, mode? (screen|structured), confirm?. Close preserves app data." }
    - { name: mobile_observe, description: "Inspect a session. Returns screenshot image content and optional UI source. Args: session_id, source? (default false)." }
    - { name: mobile_action, description: "Operate a session. Args: session_id, action (navigate|tap|swipe|text|key|tap_element|context), url?, x?, y?, to_x?, to_y?, text?, key?, using?, value?, context?. Coordinates are normalized 0..1." }
    - { name: mobile_app, description: "Install, launch, stop, uninstall or check an app. Args: session_id, action (install|launch|stop|uninstall|status), source? (artifact|store|beta), app_id?, app_name?, store_id?, artifact?, flow?. Artifact installs take an APK or device IPA from the artifact directory; store/beta installs drive the Play Store, App Store or TestFlight. Uninstall requires confirm=true." }
    - { name: mobile_stream, description: "Get authenticated screenshot polling details for a live session. Use mobile_record for video. Args: session_id." }
    - { name: mobile_record, description: "Record a session's screen to video and manage recordings. Args: action (start|stop|mark|get|list|delete|presets|upload), session_id?, recording_id?, quality? (auto|standard|high), audio?, max_seconds?, name?, status?, run_id?, kind?, confirm?. Ready recordings include file_url and their Storage upload state." }
    - { name: mobile_record_export, description: "Export a ready recording with a preset (raw, app_store_preview, play_promo, social_vertical, social_square, or a project preset) or a custom preset. Args: recording_id, preset? or custom?, variant?, orientation?, fit?, from?, to?, from_mark?, to_mark?. Runs in the background and validates the output against the preset." }
    - name: mobile_test_run
      description: "Start a bounded deterministic smoke test on a device. Args: device_id, steps (max 50), name?, build_ref?, mode?, record? (true or {quality, audio}). Each step has action and optional label, params; assert_text/wait_for_text use params.text, wait uses params.ms, record_mark params.name, wait_for_app params.app_id. A recorded run gets one video with a marker per step. Returns a durable run_id."
      async_result:
        id_field: run_id
        notify:
          target: caller
          mode: once
          events: [mobile.test.completed]
          match: { run_id: "$result.run_id" }
          expires_after: 15m
    - { name: mobile_test_get, description: "Get a test report or list recent runs. Args: run_id?; report includes failure_kind, per-step evidence and build_ref." }
    - { name: mobile_test_cancel, description: "Cancel a queued or running test. Args: run_id." }
  ui_panels:
    - slot: project.page
      label: Mobile
      icon: smartphone
      entry: /ui/MobilePanel.mjs
  skills:
    - name: mobile
      command: /mobile
      body_file: skills/how-to-use-mobile.md
      description: Discover phones, reserve a session, operate mobile browsers/apps, record screen videos, export store previews and execute smoke tests.
      metadata: { category: development }
  publishes:
    - { name: mobile.test.completed, description: "A test reached a terminal state; includes run_id, status and failure_kind." }
    - { name: mobile.recording.uploaded, description: "A recording or export was copied to Storage; includes recording_id, storage_file_id, kind and preset." }
  workers:
    - { name: test_notifications, schedule: "@every 5s" }
    - { name: recording_uploads, schedule: "@every 15s" }
runtime:
  kind: source
  source:
    repo: https://github.com/apteva/apps.git
    ref: mobile/v0.6.0
    entry: mcp/mobile
  port: 8080
  health_check: /health
  storage:
    - { name: artifacts, mount_path: /data }
db:
  driver: sqlite
  path: /data/mobile.db
  migrations: migrations/
config_schema:
  - { name: runner_url, type: text, label: Remote Mobile runner URL, description: "Empty runs locally. Remote runners require HTTPS; loopback HTTP is allowed." }
  - { name: runner_token, type: secret, label: Remote runner token }
  - { name: appium_url, type: text, label: Appium server URL, description: "Optional local runner backend, usually http://127.0.0.1:4723. Keep Appium on a trusted private network." }
  - { name: devices_json, type: text, label: Device inventory JSON, description: 'Optional array: [{"id":"iphone","name":"Test iPhone","platform":"ios","udid":"...","browser":"Safari","physical":true}]. Required for devices attached to a separate Appium host. Add "capture_id" if USB capture lists the device under a different ID than its UDID.' }
  - { name: android_driver, type: text, default: adb, label: Android driver, description: "adb for screen input; appium for structured native/browser automation." }
  - { name: ios_driver, type: text, default: native, label: iOS driver, description: "native: Mobile controls iPhones, iPads and booted Simulators itself through Xcode on this Mac (a small signed test runner is built and installed automatically). appium: use appium_url and devices_json instead." }
  - { name: ios_team_id, type: text, label: Apple team ID (advanced), description: "Optional 10-character signing team override. Mobile discovers teams from Xcode even before a certificate exists; choose between multiple teams in Mobile > Setup. Sign into Xcode once; certificates and profiles are created automatically." }
  - { name: artifact_dir, type: text, label: Install artifact directory, description: "Runner-local directory containing APK/IPA files. Defaults to the Mobile data directory's uploads subdirectory." }
  - { name: export_presets_json, type: text, label: Export presets JSON, description: 'Optional array of extra export presets, e.g. [{"name":"store_landscape","container":"mp4","video_codec":"h264","sizes":{"tv":{"w":1080,"h":1920}},"orientations":["landscape"],"max_fps":30,"max_seconds":30,"video_bitrate_kbps":11000,"audio":"aac"}]. Same fields as the built-in presets listed by mobile_record(action=presets).' }
  - { name: lock_dir, type: text, label: Shared device lock directory, description: "All local Mobile processes controlling the same devices must share this directory. Defaults to ~/.apteva/mobile-locks." }
upgrade_policy: auto-patch
