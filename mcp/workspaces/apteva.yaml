schema: apteva-app/v1

name: workspaces
display_name: Workspaces
version: 0.11.2
description: |
  Control room for durable development environments. Workspaces owns
  lifecycle, assignment, TTL, command history, activity, and the operator
  UI. Each workspace runs on one of two drivers:
  - local (no other app needed): a folder on the machine running Apteva,
    with commands in the OS sandbox (Seatbelt on macOS, bubblewrap on Linux)
    using the machine's own toolchains. Used by default when the Containers
    app is not installed.
  - containers (optional Containers app): a Docker container per workspace,
    with a persistent shell, container images and Instances hosts. Used by
    default when Containers is installed. Test workspaces always need it.
  Containers is not required to install or use Workspaces.
  History: v0.4.0 adds a generic, app-only source
  round trip: producers can refresh managed files without deleting caches,
  export a filtered source snapshot, and acknowledge an applied revision.
  v0.6.2 lets operators and originating apps select an allowlisted custom
  container image per workspace while retaining approved runtime profiles.
  v0.7.0 makes the workspace usable as an agent computer: text file read,
  write, list and exact-string edits with SHA-256 preconditions, archive
  import, a blocking command wait with cursor-based output, and HTTP
  previews that agents can start and stop themselves.
  v0.8.0 adds app-only test workspaces (kind test): one hardened container
  per workspace with a builder user that owns source and dependency cache and
  a runner user that can only write results, per-command user and network,
  a source digest computed outside the container, a results export that
  destroys the workspace, and per-project dependency caches keyed by
  lockfile. Commands in regular workspaces now create files readable by
  others (umask 022).
  v0.8.1: a create that fails releases the workspace name, and
  workspace_create_for_resource returns the caller's existing workspace for
  the same resource instead of failing on the name.
  v0.9.0 runs workspaces on Instances hosts: workspaces_create takes an
  optional instance_id, commands on remote hosts run one at a time (no shell
  session), and remote previews are reached through an Instances tunnel.
  v0.10.0 adds two dashboard widgets: a Home overview of workspaces with a
  compact project-wide activity feed, and an agent/thread widget with the
  running command, last output and recent commands.
  v0.11.0 adds runtime drivers. Each workspace records its driver:
  containers (Docker, as before) or local, a folder on the machine running
  Apteva with commands in the OS sandbox (Seatbelt on macOS, bubblewrap on
  Linux) and the machine's own toolchains, no Docker needed.
  v0.11.1 makes Containers optional, and Docker calls without it say that
  Containers is missing.
  v0.11.2 turns the local driver on by default (local_driver_enabled), so a
  project without Containers can create workspaces, and the panel offers only
  the drivers that are available. Workspaces
  report their capabilities (isolation, hardened, sessions, preview, images).
  v0.3.0 gives each workspace a persistent
  PTY shell session inside its durable container, so current directory, exported
  variables, installed tools, writable files, and background services remain
  available to later commands.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/workspaces
icon: /ui/icon.svg
icon_style: monochrome
tags: [workspaces, development, agents, containers, infrastructure]

scopes: [project]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
  apps:
    - name: containers
      version: ">=0.8.0"
      optional: true
      reason: Optional. Runs Docker workspaces and all test workspaces; without it, workspaces run as sandboxed folders on this machine (local driver). Owns each persistent Docker workspace, named and standalone volumes, stateful PTY shell execution, hardened workloads, per-command user, umask and network, cancellation, and bounded logs used by Workspaces. 0.8.0 adds command runs and volume copies on Instances hosts.
    - name: instances
      version: ">=0.4.18"
      optional: true
      reason: Opens a loopback SSH tunnel to a preview running on an Instances host. Only needed for remote previews.

provides:
  permissions:
    - name: workspaces.read
      description: Read workspace metadata, commands, logs, usage, and activity.
    - name: workspaces.write
      description: Create and operate workspaces and their commands.
  http_routes:
    - prefix: /
  mcp_tools:
    - name: workspace_preview_start
      description: "Start a persistent HTTP preview on a workspace created with preview_port; argv must bind 0.0.0.0. Args: workspace_id, argv, env?."
      requires: workspaces.write
    - name: workspace_preview_get
      description: "Fetch preview readiness and its published loopback URL. Args: workspace_id."
      requires: workspaces.read
    - name: workspace_preview_logs
      description: "Tail bounded preview logs. Args: workspace_id, tail?."
      requires: workspaces.read
    - name: workspace_preview_stop
      description: "Stop a preview. keep_workspace_running defaults to true for agents (preview process only) and false for app callers (container stops, volumes retained). Args: workspace_id, keep_workspace_running?."
      requires: workspaces.write
    - name: workspaces_create
      description: "Create a development workspace from an approved runtime profile on local Docker or an Instances host, optionally overriding it with an allowlisted digest-pinned image, or (driver local) as a sandboxed folder on the Apteva machine using its own toolchains. Args: name, purpose?, profile? (go|bun|python|apteva), image?, ttl_minutes?, preview_port?, instance_id?, driver? (containers|local), owner_label?, repo_label?, branch_label?, origin_label?, origin_href?."
      requires: workspaces.write
    - name: workspaces_list
      description: "List current-project workspaces. Args: status?, include_destroyed?, limit?."
      requires: workspaces.read
    - name: workspaces_get
      description: "Fetch one workspace with its commands and recent activity. Args: workspace_id."
      requires: workspaces.read
    - name: workspace_command_start
      description: "Run one asynchronous command through the workspace's persistent PTY shell. Current directory, exported variables, installed packages, system files, volumes, and background processes persist across commands. Prefer argv for standalone programs and shell_command for shell state or syntax. New files are readable by others (umask 022). Test workspaces take argv only (no shell) plus user (builder|runner, default runner) and network (none|registry_only|default, default none). Args: workspace_id, argv? or shell_command?, working_directory?, timeout_s?, user?, network?."
      requires: workspaces.write
    - name: workspace_command_get
      description: "Refresh and fetch one command. Args: workspace_id, command_id."
      requires: workspaces.read
    - name: workspace_command_logs
      description: "Tail bounded logs for one command. Args: workspace_id, command_id, tail?."
      requires: workspaces.read
    - name: workspace_command_cancel
      description: "Cancel one queued or running command. Args: workspace_id, command_id."
      requires: workspaces.write
    - name: workspace_command_wait
      description: "Wait up to wait_ms (default 15000, max 20000) for a command to finish; returns status, output since cursor (published when the command finishes), and the next cursor. Args: workspace_id, command_id, cursor?, wait_ms?."
      requires: workspaces.read
    - name: workspace_command_output
      description: "Read output produced since cursor from a 64 KB window; gap=true means older output was missed. Args: workspace_id, command_id, cursor?."
      requires: workspaces.read
    - name: workspace_file_read
      description: "Read a text file of at most 2 MB under /workspace by 1-based line range; returns content, start/end/total lines and sha256. Args: workspace_id, path, offset?, limit?."
      requires: workspaces.read
    - name: workspace_file_write
      description: "Create or replace a text file of at most 2 MB under /workspace, creating parent directories. Refuses to replace binary, oversized or directory paths. Args: workspace_id, path, content, expected_sha256?, create_only?."
      requires: workspaces.write
    - name: workspace_apply_edits
      description: "Apply ordered exact-string replacements to one text file under /workspace; each old_string must match once unless replace_all. Args: workspace_id, path, edits[{old_string,new_string,replace_all?}], expected_sha256?."
      requires: workspaces.write
    - name: workspace_file_list
      description: "List files and directories under a /workspace path (running workspace). Prunes .git, node_modules and .home by default. Args: workspace_id, path?, max_depth?, name_pattern?, exclude?, limit?."
      requires: workspaces.read
    - name: workspace_source_import
      description: "Extract a tar.gz archive of at most 8 MB into a /workspace path. Requires no active command. Args: workspace_id, archive_base64, path?."
      requires: workspaces.write
    - name: workspace_stop
      description: "Cancel any active command and stop the persistent workspace container while preserving its writable layer and volumes. Args: workspace_id."
      requires: workspaces.write
    - name: workspace_resume
      description: "Resume a stopped workspace whose TTL has not expired. Args: workspace_id."
      requires: workspaces.write
    - name: workspace_extend
      description: "Extend a workspace TTL from now. Expired workspaces become suspended and can then be resumed. Args: workspace_id, ttl_minutes."
      requires: workspaces.write
    - name: workspace_destroy
      description: "Permanently destroy a workspace and its volumes. Requires confirm=true. Git safety is only authoritative when the originating app supplied dirty/unpushed state. Args: workspace_id, confirm."
      requires: workspaces.write
    - name: workspace_create_for_resource
      description: "Create a workspace for a caller-owned resource with an optional allowlisted digest-pinned image override and bounded tar.gz source archive. One workspace per caller and resource_kind+resource_id: a repeat call returns the existing workspace (reused=true), resuming it if it was stopped, expired or failed after it had run. Authenticated app callers only."
      exposure: app_only
    - name: workspace_context_update
      description: "Update origin labels, navigation, and consumer-reported dirty/unpushed safety state. Authenticated originating app only."
      exposure: app_only
    - name: workspace_source_export
      description: "Export a bounded tar.gz snapshot for the authenticated originating app. managed=true filters workspace state and build/dependency caches. Args: workspace_id, path?, managed?, exclude_paths?."
      exposure: app_only
    - name: workspace_source_sync
      description: "Refresh caller-managed source files while preserving workspace caches and unrelated files. Authenticated originating app only."
      exposure: app_only
    - name: workspace_test_create
      description: "Create a locked-down test workspace for an app: one hardened container (no capabilities, read-only root, numeric non-root users, 256 processes), no shell, previews or file tools, local host only. Source is imported into /workspace/src owned by builder; runner can write only /workspace/out ($TESTS_OUT). Expires after ttl_minutes (default 30, max 120) and is destroyed then, with no retention. Args: name, source_archive_base64, profile? (bun-test), ttl_minutes?, use_cache?, idempotency_key?, owner_label?, resource_kind?, resource_id?, repo_label?, branch_label?, origin_label?, origin_href?."
      exposure: app_only
    - name: workspace_results_export
      description: "Export /workspace/out of a test workspace as tar.gz (8 MB compressed limit) and destroy the workspace unless destroy=false. Requires no active command. Args: workspace_id, destroy?."
      exposure: app_only
    - name: workspace_source_digest
      description: "Return the tree digest (method workspaces-tree-v1) Workspaces computed from the archive it imported into a test workspace, plus cache_key and image. Args: workspace_id."
      exposure: app_only
    - name: workspace_source_accept
      description: "Record the source revision accepted by the originating app after it applies exported changes. Authenticated originating app only."
      exposure: app_only
  publishes:
    - name: workspace.created
      description: A development workspace became ready.
    - name: workspace.command.started
      description: A command was accepted for execution.
    - name: workspace.command.completed
      description: A workspace command reached a terminal state.
    - name: workspace.suspended
      description: A workspace container was stopped with its writable layer and volumes preserved.
    - name: workspace.stopped
      description: An operator or app stopped a workspace; container and volumes are preserved.
    - name: workspace.resumed
      description: A stopped workspace was started again.
    - name: workspace.preview.changed
      description: A workspace preview started, went live, crashed or stopped. Payload has workspace_id, status and url.
    - name: workspace.expired
      description: A workspace TTL elapsed and the workspace was suspended.
    - name: workspace.destroyed
      description: A workspace and its attached volumes were permanently destroyed.
  workers:
    - name: workspace-reconcile
      schedule: "@every 5s"
    - name: workspace-expiry
      schedule: "@every 1m"
  ui_panels:
    - slot: project.page
      label: Workspaces
      icon: square-terminal
      entry: /ui/WorkspacesPanel.mjs
  ui_components:
    - name: workspaces-overview
      label: Workspaces
      description: Running and stopped workspaces, who owns them, what they are running, when they expire, and recent activity across them.
      entry: /ui/WorkspacesOverviewWidget.mjs
      slots: [dashboard.home]
      suggested: true
      visibility: project
      supported_sizes: [half, full]
      default_size: half
      refresh_topics: [workspace.created, workspace.stopped, workspace.suspended, workspace.expired, workspace.resumed, workspace.destroyed, workspace.command.started, workspace.command.completed, workspace.preview.changed]
      preview_props: {preview: true}
      settings_schema:
        type: object
        properties:
          show:
            type: string
            title: Show
            enum: [active, attention, all]
            enum_names: [Running and busy, Needs attention, All]
            default: active
          host:
            type: string
            title: Host
            enum: ["", local, remote, machine]
            enum_names: [All hosts, Local Docker, Instances hosts, This machine (sandbox)]
            default: ""
          include_test:
            type: boolean
            title: Include test workspaces
            default: false
          max_rows:
            type: integer
            title: Maximum workspaces
            default: 6
            minimum: 3
            maximum: 15
          show_activity:
            type: boolean
            title: Recent activity
            default: true
          activity_kinds:
            type: string
            title: Activity
            enum: [all, commands, changes]
            enum_names: [Everything, Commands only, Commands and file changes]
            default: all
          activity_limit:
            type: integer
            title: Activity lines
            default: 5
            minimum: 3
            maximum: 15
    - name: agent-workspace
      label: Agent workspace
      description: The workspace an agent or thread is using, its running command, last output and recent commands, and its live preview.
      entry: /ui/AgentWorkspaceWidget.mjs
      slots: [dashboard.agent_detail, dashboard.thread_sidebar]
      suggested: true
      visibility: attached
      supported_sizes: [half, full]
      default_size: half
      refresh_topics: [workspace.created, workspace.stopped, workspace.suspended, workspace.expired, workspace.resumed, workspace.destroyed, workspace.command.started, workspace.command.completed, workspace.preview.changed]
      preview_props: {preview: true}
      settings_schema:
        type: object
        properties:
          output_lines:
            type: integer
            title: Output lines
            description: Lines of the last finished command's output. Zero hides it.
            default: 12
            minimum: 0
            maximum: 40
          recent_limit:
            type: integer
            title: Recent commands
            default: 5
            minimum: 0
            maximum: 15
  skills:
    - name: how-to-use-workspaces
      command: /workspaces
      body_file: skills/how-to-use-workspaces.md
      description: |
        Operating protocol for durable development workspaces: create from an
        approved profile, run one attributed command at a time, inspect bounded
        logs and exit state, preserve container and volume state across commands,
        extend TTL before expiry, and confirm destructive cleanup.
      metadata:
        category: development
        icon: 🧰

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: workspaces/v0.11.2
    entry: mcp/workspaces
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/workspaces.db
  migrations: migrations/

config_schema:
  - name: default_profile
    type: text
    default: go
    label: Default runtime profile
    description: Approved profile used when workspace creation omits profile (go, bun, python, or apteva).
  - name: go_image
    type: text
    default: golang:1.25-bookworm
    label: Go workspace image
    description: Container image for the approved Go profile.
  - name: bun_image
    type: text
    default: oven/bun:1-debian
    label: Bun workspace image
    description: Container image for the approved Bun profile.
  - name: python_image
    type: text
    default: python:3.13-bookworm
    label: Python workspace image
    description: Container image for the approved Python profile.
  - name: apteva_image
    type: text
    default: ""
    label: Apteva workspace image
    description: Optional combined Go, Bun, and Python image for the approved Apteva profile.
  - name: custom_image_prefixes
    type: text
    default: "ghcr.io/apteva/"
    label: Allowed custom image prefixes
    description: Comma or whitespace-separated prefixes accepted for per-workspace image overrides.
  - name: custom_image_require_digest
    type: boolean
    default: true
    label: Require immutable custom images
    description: Require per-workspace image overrides to use an @sha256 digest.
  - name: local_driver_enabled
    type: boolean
    default: true
    label: Allow sandboxed folders on this machine
    description: Lets workspaces use the local driver, a folder on the machine running Apteva with commands in the OS sandbox (sandbox-exec on macOS, bubblewrap on Linux). On by default. Commands run as the Apteva user and share its kernel, so turn this off on a shared machine where agents should not run code on the host. Test workspaces always use Docker.
  - name: default_driver
    type: text
    default: containers
    label: Preferred runtime driver
    description: Preferred driver when workspace creation omits driver. containers uses Docker when the Containers app is installed and the local driver otherwise; local always uses the local driver (needs the setting above).
  - name: local_network
    type: text
    default: open
    label: Local driver network
    description: open, or none to limit sandboxed commands to loopback.
  - name: local_root
    type: text
    default: ""
    label: Local driver folder
    description: Absolute folder for local workspaces. Defaults to ~/apteva-workspaces/install-<id>. Must not contain spaces or sit inside ~/.apteva, ~/.ssh or another folder the sandbox hides.
  - name: default_cpu
    type: text
    default: "2"
    label: Default CPUs
    description: CPU limit applied to newly created persistent workspace containers.
  - name: default_memory_mb
    type: text
    default: "4096"
    label: Default memory
    description: Memory limit in MB for newly created workspaces.
  - name: default_ttl_minutes
    type: text
    default: "120"
    label: Default TTL
    description: Minutes before an active workspace is automatically suspended.
  - name: max_ttl_minutes
    type: text
    default: "480"
    label: Maximum TTL
    description: Maximum TTL accepted per creation or extension.
  - name: expired_retention_minutes
    type: text
    default: "1440"
    label: Expired retention
    description: Minutes an expired workspace remains recoverable before its volumes are destroyed.
  - name: default_command_timeout_seconds
    type: text
    default: "1800"
    label: Command timeout
    description: Default asynchronous command deadline in seconds.
  - name: test_workspace_apps
    type: text
    default: ""
    label: Apps allowed to create test workspaces
    description: Comma-separated app names allowed to call workspace_test_create. Empty allows any installed app.
  - name: bun_test_image
    type: text
    default: "oven/bun:1-debian@sha256:93d5032fe06d163427822dc1598f420363759bb18155c9cc90eb1be05a64a19e"
    label: Bun test image
    description: Digest-pinned image for the bun-test profile. Must end in @sha256.
  - name: test_default_ttl_minutes
    type: text
    default: "30"
    label: Test workspace TTL
    description: Minutes before a test workspace is destroyed when the caller does not set ttl_minutes.
  - name: test_max_ttl_minutes
    type: text
    default: "120"
    label: Maximum test workspace TTL
    description: Maximum ttl_minutes for creating or extending a test workspace.
  - name: test_cpu
    type: text
    default: "2"
    label: Test workspace CPUs
    description: CPU limit for the whole test workspace (Docker cannot limit one command).
  - name: test_memory_mb
    type: text
    default: "4096"
    label: Test workspace memory
    description: Memory limit in MB for the whole test workspace.
  - name: test_tmp_mb
    type: text
    default: "512"
    label: Test workspace /tmp size
    description: Size in MB of the writable /tmp tmpfs (HOME lives there).
  - name: test_egress_allow
    type: text
    default: "registry.npmjs.org"
    label: Test registry hosts
    description: Hosts reachable when a test command uses network registry_only.
  - name: test_cache_retention_days
    type: text
    default: "7"
    label: Test cache retention
    description: Days an unused per-project dependency cache is kept before deletion.

upgrade_policy: auto-patch
