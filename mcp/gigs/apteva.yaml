schema: apteva-app/v1

name: gigs
display_name: Gigs
version: 0.3.1
description: |
  Generic work marketplace and execution engine. Define standard offers,
  service packages, worker pay grades and effective rate cards; negotiate
  jobs into contracts and milestones; then dispatch immutable gigs to CRM
  contacts. Catalog owns sell-side prices and Bills owns worker payables.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/gigs
icon: /ui/icon.svg
icon_style: monochrome
tags: [gigs, workers, delegation, productivity]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.instances.read
    - platform.apps.call
    - platform.ingress.write
  apps:
    - name: catalog
      version: ">=0.3.0"
      optional: false
      reason: Customer-facing standard offers publish service products and immutable prices into Catalog.
    - name: bills
      version: ">=0.1.33"
      optional: true
      reason: Approved external-worker compensation can become an accounts-payable bill.
    - name: orders
      version: ">=0.3.0"
      optional: true
      reason: Paid service orders can reference Gigs contracts and fulfillment work without coupling Gigs to Checkout.
  integrations:
    - role: contacts
      kind: app
      compatible_app_names: [crm]
      capabilities: [contact.read, contact.message]
      required: true
      label: "CRM"
      hint: "Workers are CRM contacts. Notifications use crm.contacts_send_message and gig touches auto-log to each contact's timeline."
    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.read, files.write, files.delete]
      required: true
      label: "Storage"
      hint: "Instruction media (audio/video) and worker submissions are stored here under /.gigs/."
    - role: domains
      kind: app
      compatible_app_names: [domains]
      capabilities: [dns.list_records, dns.create_record, dns.delete_records]
      required: false
      label: "Domains (public gig links)"
      hint: "Optional. Publish branded worker-link hostnames through Domains-managed DNS and server-native ingress."

provides:
  http_routes:
    - prefix: /worker/
      no_auth: true
    - prefix: /
  mcp_tools:
    # ─── Workers ─────────────────────────────────────────────────────
    - name: workers_create
      description: Create a worker by name + email/phone — upserts the CRM contact in one shot, then promotes it to a worker. Returns {worker, contact, was_created}.
    - name: workers_promote_contact
      description: Promote an existing CRM contact to a worker. Idempotent.
    - name: workers_list
      description: List workers with stats (filterable by status, skill).
    - name: workers_get
      description: Fetch a worker with the resolved CRM contact details + skills + open assignment count.
    - name: workers_search
      description: Filtered worker search (skill, availability, rating, recent activity).
    - name: workers_set_availability
      description: Pause or resume a worker.
    - name: workers_set_skills
      description: Replace a worker's skill set.
    - name: skills_create
      description: Define a new skill.
    - name: skills_list
      description: List all skills in the project.
    # ─── Instruction library ─────────────────────────────────────────
    - name: instructions_create
      description: Create a versioned instruction. Read-only kinds can define body.response with independent note and files rules; files can restrict accepted types, counts, and size. Omitting response means no worker upload or note. Returns the head row + v1.
    - name: instructions_list
      description: Filter the library by kind or search.
    - name: instructions_get
      description: Instruction + current version + derived result_field schema fragment.
    - name: instructions_update
      description: Forks a new version while previous versions remain queryable. body.response independently configures worker notes and files; legacy body.response_mode remains readable.
    - name: instructions_publish
      description: Move the current draft version to active.
    - name: instructions_archive
      description: Soft-delete.
    - name: instructions_used_in
      description: Templates referencing this instruction — impact view before an edit.
    # ─── Templates (compositions) ────────────────────────────────────
    - name: templates_create
      description: New template, empty composition (draft).
    - name: templates_list
      description: Active templates in the project.
    - name: templates_get
      description: Full template incl. composition + derived result_schema + media_manifest + variables.
    - name: templates_set_instructions
      description: Replace the composition. Per-use overrides may replace body.response for that template. Returns the derived result_schema, media_manifest, variables.
    - name: templates_insert_instruction
      description: Insert one instruction at sort_order n; per-use overrides may replace body.response (granular edit on the draft version).
    - name: templates_remove_instruction
      description: Remove one instruction from the draft version.
    - name: templates_reorder_instructions
      description: Permute the draft version's composition.
    - name: templates_publish
      description: Move the current draft version to active.
    - name: templates_archive
      description: Soft-delete.
    - name: templates_check_updates
      description: Which pinned instruction versions have newer active versions available?
    - name: templates_render_preview
      description: Render title + each instruction with sample variables. No gig created.
    # ─── Gigs ────────────────────────────────────────────────────────
    - name: gigs_create_from_template
      description: Primary dispatch path. Template slug/id + vars + optional worker_id, notify_worker=false, and public_domain_id. Returns the gig + assignment.
    - name: gigs_create_from_instructions
      description: Ad-hoc dispatch — list of instruction refs + vars, no template required. Optional worker_id, notify_worker=false, and public_domain_id.
    - name: gigs_create
      description: Fully inline composition (raw instruction bodies, no library refs). Optional worker_id, notify_worker=false, and public_domain_id.
    - name: gigs_assign
      description: Assign or re-assign an open gig (mode= direct|broadcast|first-come, notify_worker=false, public_domain_id optional).
    - name: gigs_status
      description: Pre-flight read — gig + composition + assignments + submission.
    - name: gigs_list_open
      description: >-
        Filtered lightweight queue read (status, worker, template, deadline); use gigs_status for full details.
        status takes a comma-separated subset of open, offered, accepted, submitted, reviewed, cancelled, expired
        (default 'open,offered,accepted'). There is no 'completed' status — accepted work is 'reviewed', and
        'completed' is accepted as an alias. Unknown values return an error rather than an empty list.
    - name: gigs_cancel
      description: Cancel an open, offered, or accepted gig; only workers originally notified are messaged.
    - name: gigs_extend_deadline
      description: Push the deadline.
    - name: gigs_delete
      description: >-
        Permanently delete a gig and its assignments, submissions, events and upload sessions. Irreversible —
        there is no archive and no undo, so prefer gigs_cancel unless the gig was created by mistake. Finished
        gigs delete directly; a live one needs force=true and strands the worker's link. Storage files are left
        in place because instruction media is shared with the instruction library.
    - name: gigs_update
      description: >-
        Correct a live gig's title and/or vars. Pair with gigs_extend_deadline so a reschedule cannot leave
        the title and vars stating the original date. vars is a patch (supplied keys win, untouched keys
        survive, explicit null drops a key). The title is shown to the worker, so keep it worker-facing.
        Refused once the gig is reviewed, cancelled or expired, and it does not re-render an already
        dispatched composition.
    - name: gigs_accept_result
      description: Accept a selected submission. Bumps that worker's accepted_count and logs to the contact's CRM timeline.
    - name: gigs_reject_result
      description: Reject a selected submission with a reason. Re-opens the gig or keeps the same worker for a redo.
    # ─── Commercial catalog and marketplace ──────────────────────────
    - name: pay_grades_create
      description: Create a configurable worker pay grade, separate from skill proficiency.
    - name: pay_grades_list
      description: List active or historical worker pay grades.
    - name: pay_grades_update
      description: Update a worker pay grade and its optional general default rate.
    - name: workers_set_pay_grade
      description: Assign a commercial pay grade to a worker.
    - name: rates_set
      description: Add a versioned effective worker-pay rate scoped by worker or grade and optionally template or package.
    - name: rates_list
      description: Inspect current and historical worker-pay rate cards.
    - name: rates_resolve
      description: Deterministically explain the standard worker compensation for a worker and work context.
    - name: offers_create
      description: Create a standard service offer around a Gigs template.
    - name: offers_list
      description: List standard offers and their packages.
    - name: offers_get
      description: Fetch a standard offer and packages.
    - name: offers_update
      description: Update offer metadata while preserving version history on snapshots.
    - name: offer_packages_set
      description: Set Basic, Standard, Premium, or custom commercial packages for an offer.
    - name: offers_publish
      description: Publish an offer and synchronize its customer-facing product and prices into Catalog.
    - name: offers_recommend
      description: Explain the matching standard offer, customer price, worker compensation, rate source, and estimated margin.
    - name: gigs_create_from_offer
      description: Dispatch a published offer package and snapshot the resolved commercial terms onto the gig.
    - name: job_posts_create
      description: Create or publish a project-first marketplace job post.
    - name: job_posts_list
      description: List marketplace job posts.
    - name: proposals_submit
      description: Submit or replace a worker proposal on an open job.
    - name: proposals_list
      description: List proposals for a job post.
    - name: proposals_accept
      description: Award a job, reject competing proposals, and create the accepted contract and milestones.
    - name: contracts_create
      description: Create a direct, package, order, or subscription contract with immutable commercial terms.
    - name: contracts_get
      description: Fetch a contract and milestones.
    - name: contracts_list
      description: List contracts by lifecycle or worker.
    - name: contracts_add_milestone
      description: Add a priced deliverable milestone to a contract.
    - name: contracts_dispatch_milestone
      description: Dispatch a pending contract milestone into a compensated worker gig and track it through review.
    - name: gigs_create_payable
      description: Create or retry the Bills payable for reviewed work, idempotently.
  ui_panels:
    - slot: project.page
      label: Gigs
      icon: clipboard
      entry: /ui/GigsPanel.mjs
  ui_components:
    - name: gig-queue
      label: Gigs
      description: Submissions awaiting review, work in flight, and deadlines at risk.
      entry: /ui/GigQueueWidget.mjs
      slots: [dashboard.home]
      suggested: true
      visibility: project
      supported_sizes: [half, full]
      default_size: half
      refresh_topics: [gig.created, gig.offered, gig.accepted, gig.declined, gig.submitted, gig.reviewed, gig.rejected, gig.cancelled, gig.expired]
      settings_schema:
        type: object
        properties:
          show_review:
            type: boolean
            title: Needs review
            default: true
          show_inflight:
            type: boolean
            title: In flight
            default: true
          show_recent:
            type: boolean
            title: Recent outcomes
            default: false
          recent_limit:
            type: integer
            title: Recent limit
            description: Maximum recent outcomes displayed in this widget.
            default: 4
            minimum: 1
            maximum: 12
  workers:
    - name: lifecycle
      schedule: "@every 5m"

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/gigs
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/gigs.db
  migrations: migrations/

config_schema:
  - name: default_deadline_hours
    type: number
    default: 24
    label: Default deadline (hours)
    description: When a gig is created without an explicit deadline, this is the offset from now.
  - name: auto_remind_after_hours
    type: number
    default: 4
    label: Auto-remind workers after (hours)
    description: Hours after an offer was sent without a response before the worker is reminded. 0 disables reminders.
  - name: max_open_per_worker
    type: number
    default: 5
    label: Max open assignments per worker
    description: Reject new offers to a worker whose open queue is already this deep. 0 disables the cap.
  - name: signed_url_ttl_seconds
    type: number
    default: 3600
    label: Signed URL TTL (seconds)
    description: Lifetime of storage signed URLs embedded in the worker page.
  - name: lenient_inbound_parsing
    type: bool
    default: true
    label: Lenient inbound reply parsing
    description: For yes/no result schemas, accept "y/yes/ok/sure/👍" etc. from reply-based submissions.
  - name: storage_root_folder
    type: text
    default: "/.gigs"
    label: Storage root folder
    description: Storage folder prefix for gig media + submissions. Dotted by convention so it stays out of dashboards.
  - name: max_submission_file_mb
    type: number
    default: 2048
    label: Maximum submission file size (MB)
    description: Per-file limit applied before a worker upload session is created.
  - name: auto_create_worker_payables
    type: bool
    default: false
    label: Automatically create worker payables
    description: After a compensated gig is reviewed, create a received vendor bill in the optional Bills app. Disabled by default so employee/payroll work is never treated as contractor AP accidentally.

upgrade_policy: auto-patch
