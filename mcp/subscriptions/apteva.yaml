schema: apteva-app/v1

name: subscriptions
display_name: Subscriptions
version: 0.5.0
description: |
  Generic recurring-commerce lifecycle for SaaS, physical product
  subscriptions, and services. Subscriptions owns recurrence, status,
  current periods, renewal cycles, and references to the invoice,
  order, or entitlement produced by each cycle. Status updates emit
  specific lifecycle events such as subscription.active and
  subscription.past_due for dependent apps. v0.2.0 adds generic flat
  and metered subscription items, idempotent usage records, usage
  summaries, and subscription-period invoice preparation/creation.
  v0.3.1 adds project-scoped, durable trial-end processing that creates
  pending subscription cycles and publishes subscription.cycle_due for
  an external commerce workflow to collect.
  v0.4.0 stores immutable discount applications from external eligibility
  engines and applies once, repeating, or forever pricing by billing cycle.
  v0.5.0 adds durable immediate and next-cycle item changes with cycle-safe
  history and generic proration calculations for external orchestrators.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/subscriptions
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/subscriptions/icon.svg
tags: [subscriptions, recurring, commerce, saas, memberships]

scopes: [project, global]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
  apps:
    - name: catalog
      optional: false
      version: ">=0.2.0"
    - name: billing
      optional: true
    - name: orders
      optional: true
    - name: entitlements
      optional: true

provides:
  http_routes:
    - prefix: /
  ui_panels:
    - slot: project.page
      label: Subscriptions
      icon: repeat
      entry: /ui/SubscriptionsPanel.mjs
  publishes:
    - name: subscription.active
      description: Subscription entered active status.
    - name: subscription.trialing
      description: Subscription entered trialing status.
    - name: subscription.past_due
      description: Subscription entered past_due status.
    - name: subscription.cancelled
      description: Subscription was cancelled.
    - name: subscription.paused
      description: Subscription entered paused status.
    - name: subscription.ended
      description: Subscription ended.
    - name: subscription.item.created
      description: A subscription item was created.
    - name: subscription.discount.created
      description: An immutable discount application was attached to a subscription item.
    - name: subscription.discount.cancelled
      description: A discount application was stopped for future cycles.
    - name: subscription.usage.recorded
      description: Metered subscription usage was recorded.
    - name: subscription.invoice.requested
      description: A subscription period invoice was requested.
    - name: subscription.cycle_due
      description: A subscription cycle is due for external collection or fulfillment orchestration.
    - name: subscription.change.applied
      description: A durable subscription item change became effective.
  mcp_tools:
    - name: subscriptions_create
      description: Create a SaaS, physical, or service subscription with catalog-backed items.
    - name: subscriptions_get
      description: Fetch one subscription with items, cycles, and events.
    - name: subscriptions_search
      description: Search subscriptions by customer, kind, status, and q.
    - name: subscriptions_metrics_get
      description: Return recurring subscription metrics such as MRR by currency.
    - name: subscriptions_update_status
      description: Update subscription status and period fields.
    - name: subscriptions_cancel
      description: Cancel a subscription immediately or at period end.
    - name: subscription_items_create
      description: Add a flat or metered item to a subscription.
    - name: subscription_items_list
      description: List subscription items.
    - name: subscription_items_update
      description: Patch item metadata/status or unbilled pricing; use subscription changes once a cycle is billed.
    - name: subscription_items_cancel
      description: Cancel a subscription item.
    - name: subscription_discounts_create
      description: Attach an immutable discount application from an external eligibility source to a subscription item.
    - name: subscription_discounts_list
      description: List discount applications attached to a subscription.
    - name: subscription_discounts_cancel
      description: Stop a discount from applying to future cycles while preserving historical invoice retries.
    - name: subscriptions_usage_record
      description: Record idempotent metered usage against a subscription item.
    - name: subscriptions_usage_summary
      description: Summarize metered usage and billable overage for a subscription item and period.
    - name: subscriptions_invoice_prepare
      description: Prepare generic Billing line items for a subscription period.
    - name: subscriptions_invoice_create
      description: Legacy convenience wrapper that sends prepared period lines to Billing; new orchestrators should call subscriptions_invoice_prepare and Billing separately.
    - name: subscription_cycles_create
      description: Record a renewal cycle and link invoice/order/entitlement outputs.
    - name: subscription_cycles_update
      description: Update a cycle's payment status or linked outputs.
    - name: subscription_cycles_list
      description: List cycles for a subscription.
    - name: subscription_events_list
      description: List subscription audit events.
    - name: subscription_changes_create
      description: Create an idempotent immediate or next-cycle replacement of subscription items; deferred immediate changes await explicit approval.
    - name: subscription_changes_get
      description: Fetch a durable subscription item change.
    - name: subscription_changes_apply
      description: Apply a due pending subscription item change idempotently.
  skills:
    - name: how-to-use-subscriptions
      command: /subscriptions
      body_file: skills/how-to-use-subscriptions.md
      description: |
        Recurring commerce lifecycle conventions. Load when working
        with subscriptions, renewals, recurring plans, or membership cycles.
      metadata:
        category: commerce

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/subscriptions
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/subscriptions.db
  migrations: migrations/

config_schema:
  - name: default_currency
    type: text
    default: "USD"
    label: Default currency
    description: ISO 4217 code used when subscription items omit currency.

upgrade_policy: auto-patch
