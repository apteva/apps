schema: apteva-app/v1

name: instances
display_name: Instances
version: 0.4.43
description: |
  Compute-host inventory + lifecycle for Apteva. The local Apteva
  machine is always available as a built-in instance (id 0); remote
  instances are provisioned through a generic VPS provider binding.
  The install can bind Hetzner Cloud, DigitalOcean, Vultr, AWS EC2,
  Contabo, Scaleway (virtual instances, Elastic Metal, Dedibox, and Apple silicon Mac minis), Huawei Cloud,
  Linode, OVHcloud, or RunPod; provider-specific
  adapters normalize into the same Instances contract.

  Foundation layer for higher-level apps that run workloads
  somewhere — Live Link's self-vps tunnel, Deploy's planned
  SSHRuntime, Backup off-host targets, Containers, future Database
  / MQTT / game-server apps. Consumers bind Instances as a
  kind=app integration and call instance_run_command /
  instance_upload_file / instance_download_file / instance_metrics
  with a host_id, instead of binding a VPS provider directly.

  Note: "instance" here = compute machine (AWS-style). Apteva-core's
  existing "instance" concept (a thinking loop per project) is a
  separate, internal-only model. Same word, different scope. A
  future apteva-server release renames core's concept to "agent"
  and removes the linguistic collision.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/instances
icon: /ui/icon.svg
icon_style: monochrome
tags: [instances, hosts, vps, compute, infrastructure, object-storage, s3]

scopes: [global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.connections.execute
    - platform.connections.read_public_config
  integrations:
    - role: provider
      kind: integration
      mode: multiple
      required: false
      compatible_slugs: [hetzner, digitalocean, contabo, vultr, aws-ec2, scaleway, huawei-cloud, linode, ovhcloud, runpod]
      label: VPS providers
      hint: |
        Optional — local instance always available. Bind one or more VPS
        integrations to provision remote instances through the generic
        Instances interface. Every compatible provider has catalog,
        provisioning, readiness, and recovery adapters. Immediate
        destroy is available except on Contabo, whose API only schedules
        contract cancellation. Scaleway Dedibox orders physical hardware and
        installs Linux after delivery; macOS hosts have Apple's mandatory
        24-hour minimum allocation before Destroy becomes available.

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: instance_list_providers
      description: List the VPS provider connections bound to this Instances install and identify the default provider.
    - name: instance_create
      description: Provision a new instance via a bound VPS provider. The provider argument selects a binding; when omitted, the configured default is used.
    - name: instance_storage_capabilities
      description: Describe provider support for configurable boot disks and managed data volumes.
    - name: instance_list_storage_types
      description: List provider-neutral storage classes and tiers with native provider mappings.
    - name: instance_volume_create
      description: Create a managed data volume and optionally attach and prepare it inside the guest.
    - name: instance_volume_get
      description: Fetch one managed volume.
    - name: instance_volume_list
      description: List volumes tracked by Instances.
    - name: instance_volume_attach
      description: Attach an available managed volume to an existing instance and optionally prepare it inside the guest.
    - name: instance_volume_prepare
      description: Safely format-if-blank, persist, mount, and verify an attached Linux data volume over SSH.
    - name: instance_volume_detach
      description: Detach a managed data volume without deleting it.
    - name: instance_volume_resize
      description: Increase a managed volume size; shrinking is refused.
    - name: instance_volume_delete
      description: Permanently delete a detached app-managed data volume with explicit confirmation.
    - name: object_storage_list_providers
      description: List bound provider accounts capable of provisioning object storage.
    - name: object_storage_list_plans
      description: List object-storage regions/clusters and plans/tiers for a provider.
    - name: object_storage_preflight
      description: Read-only credential, project, IAM, region, and optional bucket-name availability checks before creation.
    - name: object_storage_create
      description: Provision object storage and return its S3 credentials once without creating a Connection or persisting the secret.
    - name: object_storage_get
      description: Fetch one provisioned object-storage resource without its secret.
    - name: object_storage_list
      description: List object-storage resources tracked by Instances.
    - name: object_storage_rotate_credentials
      description: Rotate object-storage credentials and return the new secret once.
    - name: object_storage_destroy
      description: Permanently delete a managed object-storage resource with explicit confirmation.
    - name: instance_register
      description: Register an externally managed SSH host such as a Mac. Generates a dedicated SSH key and returns the public key to authorize on that host.
    - name: instance_get
      description: Fetch one instance by id (0 for local).
    - name: instance_list
      description: List instances, optionally filtered by provider or status.
    - name: instance_destroy
      description: Terminate a managed upstream resource and remove its row, or forget an externally registered host without modifying it. Refused for local (id 0) and Contabo.
    - name: instance_compare_provider
      description: Compare tracked server, IP, status, and volume state with the provider without making changes.
    - name: instance_provider_inventory
      description: Read provider resources, including Scaleway virtual Instances, Elastic Metal servers, and Flexible IPs.
    - name: instance_storage_benchmark
      description: Run an optional bounded 256 MiB storage benchmark and save its result.
    - name: instance_upgrade
      description: In-place resize of a remote instance where the provider adapter supports it. Hetzner is implemented today and the operation always waits for SSH readiness.
    - name: instance_run_command
      description: Execute a shell command (local exec or remote SSH). Output capped at 1 MB.
    - name: instance_upload_file
      description: Write file content (local filesystem or remote SCP-equivalent over SSH).
    - name: instance_download_file
      description: Read file content (local filesystem or remote SSH) as base64.
    - name: instance_open_tunnel
      description: Open or reuse a loopback-only TCP tunnel through remote SSH.
    - name: instance_close_tunnel
      description: Close a loopback TCP tunnel for an instance target port.
    - name: instance_wait_ready
      description: Poll the instance until SSH accepts the key and can run a non-interactive command.
    - name: instance_metrics
      description: CPU / memory / disk / network / load / uptime (local gopsutil, remote Linux or macOS collector). 5s cache.
    - name: instance_list_server_types
      description: |
        Live list of VPS server types (sizes) from the bound provider, pulled from upstream at call time.
        Returns active, non-deprecated types only, including virtual machines and provider-supported bare metal:
        name + cores + memory_gb + disk_gb + platform + resource_class + price + available_in.
        Discovery surface for instance_create's `size` arg. Args:
        provider? (default: bound provider).
    - name: instance_list_locations
      description: |
        Live list of VPS regions from the bound provider. Returns name + city + country + network_zone.
        Discovery surface for instance_create's `region` arg. Args: provider? (default: bound provider).
    - name: instance_list_images
      description: |
        Live list of bootable OS images from the bound provider (system images only — snapshots/backups/apps excluded).
        Returns name + os_flavor + os_version + architecture + platform + resource_class + compatibility.
        Discovery surface for instance_create's `image` arg.
        Args: provider? (default: bound provider).
  publishes:
    - name: instance.created
      description: A new instance row was created in Instances.
      payload:
        id: integer
        name: string
        provider: string
        status: string
    - name: instance.provisioning
      description: A remote instance entered provisioning.
      payload:
        id: integer
        name: string
        provider: string
        status: string
        region: string
        size: string
        image: string
    - name: instance.ready
      description: An instance became ready for SSH-backed operations.
      payload:
        id: integer
        name: string
        provider: string
        status: string
        public_ipv4: string
        public_ipv6: string
        ready_at: string
    - name: instance.upgrading
      description: An instance entered an in-place server type upgrade.
      payload:
        id: integer
        name: string
        provider: string
        status: string
        size: string
    - name: instance.upgraded
      description: An instance completed an in-place server type upgrade.
      payload:
        id: integer
        name: string
        provider: string
        status: string
        old_size: string
        new_size: string
        upgrade_disk: boolean
    - name: instance.error
      description: An instance entered an error state.
      payload:
        id: integer
        name: string
        provider: string
        status: string
        error: string
    - name: instance.destroyed
      description: An instance was destroyed and removed from Instances.
      payload:
        id: integer
        name: string
        provider: string
        status: string
        provider_id: string
        destroyed_at: string
  ui_panels:
    - slot: project.page
      label: Instances
      icon: server
      entry: /ui/InstancesPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: instances/v0.4.43
    entry: mcp/instances
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/instances.db
  migrations: migrations/

upgrade_policy: auto-patch
