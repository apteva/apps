schema: apteva-app/v1

name: pcb
display_name: PCB Studio
version: 0.2.0
description: |
  Native, agent-first electronics design for Apteva. PCB Studio owns its
  canonical circuit and board model, revision engine, validation, rendering,
  pad/footprint geometry, manufacturing validation, Gerber/Excellon writers,
  and release packaging. External services are optional data, sourcing, and
  manufacturing providers—not geometry or ECAD engines.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/pcb
icon: /ui/icon.svg
icon_style: monochrome
tags: [pcb, electronics, ecad, hardware, manufacturing]

scopes: [project]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.connections.execute
  integrations:
    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.write]
      required: true
      label: "Storage"
      hint: "Stores native source packages, previews, BOMs, and manufacturing releases. Bind the project or global Storage app install that should own PCB artifacts."
    - role: component_data
      kind: integration
      compatible_slugs: [nexar]
      capabilities:
        - components.search
        - components.match_bom
        - components.pricing
        - components.availability
      tools:
        components.search: search_parts
        components.match_bom: multi_match
        components.pricing: get_pricing
        components.availability: get_availability
      required: false
      label: "Electronic component data"
      hint: Optional. Bind Nexar/Octopart for live component search, authorized distributor offers, stock, and BOM matching.
    - role: pcb_fabricator
      kind: integration
      compatible_slugs: [jlcpcb]
      capabilities: [pcb.provider_discovery]
      tools:
        pcb.provider_discovery: get_api_platform_overview
      required: false
      label: "PCB fabrication provider"
      hint: Optional provider binding. v0.2 exposes provider readiness only; quote/order calls stay disabled until documented partner endpoints are available.

provides:
  http_routes:
    - prefix: /
  resources:
    - name: pcb_design
      label: PCB design
      list_endpoint: /api/designs
      matcher: exact
      picker: list
  permissions:
    - { name: pcb.read, resource: pcb_design, description: "Read PCB designs, revisions, validation, and artifacts." }
    - { name: pcb.write, resource: pcb_design, description: "Create and revise PCB designs." }
    - { name: pcb.validate, resource: pcb_design, description: "Run native ERC and DRC checks." }
    - { name: pcb.export, resource: pcb_design, description: "Create previews, BOMs, and release packages." }
  mcp_tools:
    - { name: pcb_examples, description: Return canonical apteva-pcb/v1 examples and supported typed operations., requires: pcb.read }
    - { name: pcb_designs_create, description: "Create a PCB design and immutable first revision. Args: name, definition?, note?.", requires: pcb.write }
    - { name: pcb_designs_list, description: "List project PCB designs. Args: q?, status?, limit?.", requires: pcb.read }
    - { name: pcb_designs_get, description: "Fetch a design with current revision, validation, and artifacts. Args: id.", requires: pcb.read, resource_from: "pcb_design/{arg.id}" }
    - { name: pcb_designs_archive, description: "Archive or restore a design. Args: id, archived?.", requires: pcb.write, resource_from: "pcb_design/{arg.id}" }
    - { name: pcb_revisions_create, description: "Create a full-definition child revision with optimistic concurrency. Args: design_id, expected_parent_id, definition, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_revisions_get, description: "Fetch one immutable revision. Args: id.", requires: pcb.read }
    - { name: pcb_revisions_diff, description: "Compare two native PCB revisions. Args: from_revision_id, to_revision_id.", requires: pcb.read }
    - { name: pcb_operations_apply, description: "Atomically apply typed native operations and create a revision. Args: design_id, expected_parent_id, operations, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_validate, description: "Run the native ERC/DRC validator. Args: design_id, revision_id?.", requires: pcb.validate, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_render, description: "Create a deterministic SVG board preview. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_bom_generate, description: "Create a deterministic BOM CSV. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_manufacturing_generate, description: "Validate and create deterministic Gerber X2 plus Excellon manufacturing files. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_artifacts_list, description: "List artifacts for a design or revision. Args: design_id, revision_id?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_release_create, description: "Validate and create a traceable native release ZIP. Failed validation blocks release. Args: design_id, revision_id?, note?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_components_search, description: "Search the optional component-data provider. Args: query, country?, currency?, limit?.", requires: pcb.read }
    - { name: pcb_bom_source, description: "Match a revision BOM through the optional component-data provider. Args: design_id, revision_id?, country?, currency?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_providers_status, description: Return native app and provider integration binding/readiness status., requires: pcb.read }
  ui_panels:
    - { slot: project.page, label: PCB, icon: cpu, entry: /ui/PCBPanel.mjs }
  ui_components:
    - name: pcb-design-card
      entry: /ui/PCBDesignCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [design_id]
        properties:
          design_id: { type: integer }
          revision_id: { type: integer }
      preview_props: { preview: true }
  skills:
    - name: how-to-use-pcb
      command: /pcb
      body_file: skills/how-to-use-pcb.md
      description: Design and validate native Apteva circuit boards, source components, and create releases.
      metadata: { category: design, icon: "⚡" }
  publishes:
    - { name: pcb.design.created, description: A PCB design and its first immutable revision were created. }
    - { name: pcb.revision.created, description: A native PCB revision was created. }
    - { name: pcb.validation.completed, description: Native ERC/DRC validation completed. }
    - { name: pcb.artifact.created, description: "A preview, BOM, or package was persisted." }
    - { name: pcb.release.created, description: A validated release package was created. }

runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: pcb/v0.2.0, entry: mcp/pcb }
  port: 8080
  health_check: /health
  resources: { cpu: 0.1, memory: 128, cpu_limit: 1, memory_limit: 512 }
  storage:
    - { name: data, mount_path: /data }
  env:
    APTEVA_GATEWAY_URL: { from: platform }
    APTEVA_APP_TOKEN: { from: platform }
    APTEVA_INSTALL_ID: { from: platform }
    APTEVA_PROJECT_ID: { from: platform }

db:
  driver: sqlite
  path: /data/pcb.db
  migrations: migrations/

config_schema:
  - { name: artifact_dir, type: text, default: "/data/artifacts", label: Local artifact cache }
  - { name: default_country, type: text, default: "US", label: Sourcing country }
  - { name: default_currency, type: text, default: "USD", label: Sourcing currency }

upgrade_policy: auto-patch
