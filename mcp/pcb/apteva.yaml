schema: apteva-app/v1

name: pcb
display_name: PCB Studio
version: 0.11.1
description: |
  Native, agent-first electronics design for Apteva. Version 0.11 adds
  JLCPCB assembly files with LCSC part matching, a parts library with KiCad
  footprint import, solder mask and paste layers, PTH/NPTH drill split with
  slots, true pad shapes, inner layers, panelization, 45-degree routing with
  rip-up, I2C address conflict checks, design copies and templates, and ESP32
  firmware functions. PCB Studio owns its
  canonical circuit and board model, revision engine, interactive layout editor,
  validation, rendering, pad/footprint geometry, manufacturing validation,
  independent Gerber/Excellon verification, Gerber/Excellon writers,
  deterministic autorouting, electrical simulation, Arduino-compatible virtual
  hardware, native breadboard/wiring illustrations, 3D mechanical envelopes,
  native component models, rotation-aware collision checks, tolerances, cutouts,
  AP242 STEP assemblies, reference STL/3MF solids and DXF profiles, verified
  footprint provenance, KiCad import/export, production-readiness gates,
  mounting and connector interfaces, named-pin compatibility
  validation, tutorial exports, and release packaging. External services are optional data,
  sourcing, manufacturing, and isolated compilation providers—not geometry,
  routing, simulation, or ECAD engines.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/pcb
icon: /ui/icon.svg
icon_style: monochrome
tags: [pcb, electronics, ecad, hardware, mechanical, enclosure, manufacturing, arduino, breadboard, tutorials]

scopes: [project]
min_apteva_version: "0.11.0"

requires:
  permissions:
    - db.write.app
    - net.egress
    - platform.apps.call
    - platform.connections.execute
  integrations:
    - role: storage
      kind: app
      compatible_app_names: [storage]
      capabilities: [files.write]
      required: true
      label: "Storage"
      hint: "Stores native source packages, previews, BOMs, and manufacturing releases. Bind the project or global Storage app install that should own PCB artifacts."
    - role: component_data
      kind: integration
      compatible_slugs: [nexar]
      capabilities:
        - components.search
        - components.match_bom
        - components.pricing
        - components.availability
      tools:
        components.search: search_parts
        components.match_bom: multi_match
        components.pricing: get_pricing
        components.availability: get_availability
      required: false
      label: "Electronic component data"
      hint: Optional. Bind Nexar/Octopart for live component search, authorized distributor offers, stock, and BOM matching.
    - role: firmware_executor
      kind: app
      compatible_app_names: [functions]
      capabilities: [functions.invoke]
      required: false
      label: "Firmware execution sandbox"
      hint: Optional. Bind Functions to invoke a project-owned Arduino compiler/runtime adapter. PCB Studio's deterministic behavioral GPIO, serial, I2C, and sensor runtime works without it.
    - role: pcb_fabricator
      kind: integration
      compatible_slugs: [jlcpcb]
      capabilities: [pcb.provider_discovery]
      tools:
        pcb.provider_discovery: get_api_platform_overview
      required: false
      label: "PCB fabrication provider"
      hint: Optional provider binding for discovery. No fab in the catalog publishes a quote or order API yet, so PCB Studio prepares the order package and records the fab's quote and order number via pcb_order_update.

provides:
  http_routes:
    - prefix: /
  resources:
    - name: pcb_design
      label: PCB design
      list_endpoint: /api/designs
      matcher: exact
      picker: list
  permissions:
    - { name: pcb.read, resource: pcb_design, description: "Read PCB designs, revisions, validation, and artifacts." }
    - { name: pcb.write, resource: pcb_design, description: "Create and revise PCB designs." }
    - { name: pcb.validate, resource: pcb_design, description: "Run native ERC and DRC checks." }
    - { name: pcb.export, resource: pcb_design, description: "Create previews, BOMs, and release packages." }
    - { name: pcb.route, resource: pcb_design, description: "Analyze, suggest, apply, optimize, and remove native PCB routing." }
    - { name: pcb.simulate, resource: pcb_design, description: "Configure and run native electrical simulations and inspect results." }
    - { name: pcb.firmware, resource: pcb_design, description: "Execute Arduino-compatible firmware against virtual PCB hardware." }
    - { name: pcb.mechanical.read, resource: pcb_design, description: "Read validated PCB mechanical envelopes for enclosure and product-design handoff." }
  mcp_tools:
    - { name: pcb_examples, description: Return canonical apteva-pcb/v1 examples and supported typed operations., requires: pcb.read }
    - { name: pcb_wiring_library, description: "List native wiring reference parts and named electrical pins.", requires: pcb.read }
    - { name: pcb_wiring_example_create, description: "Create an editable Arduino Uno, breadboard, resistor, and LED tutorial.", requires: pcb.write }
    - { name: pcb_wiring_validate, description: "Validate physical wiring endpoints, electrical compatibility, and tutorial references.", requires: pcb.validate, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_wiring_export, description: "Create SVG, PNG, tutorial JSON, or tutorial ZIP wiring artifacts.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_wiring_simulate, description: "Run Arduino firmware and map GPIO state onto the physical wiring illustration.", requires: pcb.firmware, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_mechanical_example_create, description: "Create the native Raspberry Pi 4 mechanical-reference design.", requires: pcb.write }
    - { name: pcb_dht22_example_create, description: "Create a routed USB-C ESP32-C3 DHT22 sensor node with mechanical geometry.", requires: pcb.write }
    - { name: pcb_kicad_import, description: "Import KiCad .kicad_pcb content into a new native design. Args: name, content, note?", requires: pcb.write }
    - { name: pcb_kicad_export, description: "Export a native revision as a deterministic KiCad .kicad_pcb artifact.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_kicad_verify, description: "Parse and reconcile generated KiCad exchange data against the native revision.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_schematic_get, description: "Read the schematic (sheets, resolved symbols and pins, wires, labels) plus schematic ERC. Args: design_id, revision_id?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_schematic_generate, description: "Generate a schematic from the net list and create a revision. Args: design_id, expected_parent_id, replace_existing?, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_schematic_render, description: "Create a deterministic SVG of a schematic sheet. Args: design_id, revision_id?, sheet_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_kicad_schematic_import, description: "Attach a single-sheet .kicad_sch to a design and return a net comparison report. Args: design_id, expected_parent_id, content, replace_nets?, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_production_readiness, description: "Run the footprint, DRC, fabrication, KiCad, STEP, test-fixture, and physical-validation readiness gate.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_mechanical_get, description: "Read a deterministic apteva-mechanical-envelope/v1 payload without creating an artifact.", requires: pcb.mechanical.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_mechanical_validate, description: "Validate PCB outline, thickness, mounting holes, component solids, openings, and clearance volumes.", requires: pcb.mechanical.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_mechanical_preview, description: "Create a native 3D mechanical-envelope preview.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_mechanical_export, description: "Create an immutable apteva-mechanical-envelope/v1 artifact.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_mechanical_solid_export, description: "Export STEP AP242, STL/3MF reference solids, or an authoritative DXF profile.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_designs_create, description: "Create a PCB design and immutable first revision. Args: name, definition?, note?.", requires: pcb.write }
    - { name: pcb_designs_list, description: "List project PCB designs. Args: q?, status?, limit?.", requires: pcb.read }
    - { name: pcb_designs_get, description: "Fetch a design with current revision, validation, and artifacts. Args: id.", requires: pcb.read, resource_from: "pcb_design/{arg.id}" }
    - { name: pcb_designs_archive, description: "Archive or restore a design. Args: id, archived?.", requires: pcb.write, resource_from: "pcb_design/{arg.id}" }
    - { name: pcb_revisions_create, description: "Create a full-definition child revision with optimistic concurrency. Args: design_id, expected_parent_id, definition, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_revisions_get, description: "Fetch one immutable revision. Args: id.", requires: pcb.read }
    - { name: pcb_revisions_diff, description: "Compare two native PCB revisions. Args: from_revision_id, to_revision_id.", requires: pcb.read }
    - { name: pcb_operations_apply, description: "Atomically apply typed native operations and create a revision. Args: design_id, expected_parent_id, operations, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_route_analyze, description: "Analyze routability and return a deterministic reviewable route plan (45-degree grid routing with rip-up and retry). Args: design_id, revision_id?, options?.", requires: pcb.route, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_route_suggest, description: "Suggest clearance-safe native traces and vias with 45-degree bends and rip-up and retry, without changing the design. Args: design_id, revision_id?, options? (allow_diagonal, max_ripup_iterations, ...).", requires: pcb.route, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_route_apply, description: "Apply a native route plan (45-degree routing with rip-up and retry) as an immutable revision. Args: design_id, revision_id?, options?, allow_partial?, note?.", requires: pcb.route, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_route_selected, description: "Route selected net_ids in options and create a revision.", requires: pcb.route, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_route_all, description: "Route every incomplete net with 45-degree routing and rip-up and retry, and create a revision.", requires: pcb.route, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_route_optimize, description: "Replace selected existing routing with a deterministic optimized route revision.", requires: pcb.route, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_route_remove, description: "Remove PCB Studio-generated autoroutes and create a revision.", requires: pcb.route, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_placement_analyze, description: "Report placement overlaps, keepout/edge/hole violations, panel-opening edge alignment, and ratsnest length. Args: design_id, revision_id?, options?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_placement_suggest, description: "Suggest a deterministic automatic placement as typed operations with before/after analysis, without changing the design. Args: design_id, revision_id?, options?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_placement_apply, description: "Apply a deterministic automatic placement as an immutable revision. Args: design_id, revision_id?, options?, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_simulation_create, description: "Save revisioned native simulation sources, probes, and virtual devices.", requires: pcb.simulate, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_simulation_run, description: "Run DC, transient RC, regulator load-step, and event-driven digital simulation and persist waveforms.", requires: pcb.simulate, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_simulation_probe, description: "Run the electrical model with temporary probes.", requires: pcb.simulate, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_simulation_fault_set, description: "Run simulation with open-component or short-net fault injection.", requires: pcb.simulate, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_simulation_results_get, description: "Load a persisted native simulation result artifact.", requires: pcb.simulate }
    - { name: pcb_simulation_compare, description: "Compare final states from two simulation artifacts.", requires: pcb.simulate }
    - { name: pcb_firmware_run, description: "Run Arduino-compatible firmware against virtual GPIO, serial, I2C, and sensor models.", requires: pcb.firmware, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_validate, description: "Run the native ERC/DRC validator. Args: design_id, revision_id?.", requires: pcb.validate, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_render, description: "Create a deterministic SVG board preview. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_bom_generate, description: "Create a deterministic BOM CSV. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_manufacturing_generate, description: "Validate and create deterministic Gerber X2 plus Excellon manufacturing files. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_manufacturing_verify, description: "Independently parse and reconcile generated Gerber, Excellon, and Gerber-job files. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_artifacts_list, description: "List artifacts for a design or revision. Args: design_id, revision_id?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_release_create, description: "Validate and create a traceable native release ZIP. Failed validation blocks release. Args: design_id, revision_id?, note?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_components_search, description: "Search the optional component-data provider. Args: query, country?, currency?, limit?.", requires: pcb.read }
    - { name: pcb_bom_source, description: "Check stock and price for every revision MPN and store a sourcing summary and priced BOM. Args: design_id, revision_id?, country?, currency?, build_quantity?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_providers_status, description: Return native app and provider integration binding/readiness status., requires: pcb.read }
    - { name: pcb_fab_profiles, description: "List built-in fab rule profiles plus the design's own and active profile. Args: design_id?, revision_id?.", requires: pcb.read }
    - { name: pcb_assembly_generate, description: "Create the verified pick-and-place CSV and assembly BOM package. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_firmware_header, description: "Generate board_pins.h mapping nets to MCU GPIO numbers. Args: design_id, revision_id?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_bringup_plan, description: "Return measurable bring-up checks with expected ranges. Args: design_id, revision_id?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_bringup_record, description: "Record bring-up measurements for one manufactured board. Args: design_id, revision_id?, board_serial, measurements.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_bringup_status, description: "Return per-board bring-up results and physical-validation status. Args: design_id, revision_id?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_order_prepare, description: "Validate and package a fabrication order and track it. Args: design_id, revision_id?, fabricator, quantity, assembly?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_order_update, description: "Record a fab quote, order number, status or tracking. Args: order_id, status?, external_order_id?, quote_amount?, quote_currency?, tracking?, note?.", requires: pcb.write }
    - { name: pcb_orders_list, description: "List fabrication orders for a design. Args: design_id.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_panelize, description: "Panelize a revision (rows x columns, rails with fiducials and tooling holes, V-score or mouse-bite tabs) into a verified panel manufacturing ZIP artifact. Args: design_id, revision_id?, rows, columns, spacing_nm?, rail_width_nm?, rail_sides?, separation?, tab_width_nm?.", requires: pcb.export, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_release_overview, description: "Return readiness gates, package contents, sourcing, bring-up, fab profile and orders. Args: design_id, revision_id?.", requires: pcb.read, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_designs_copy, description: "Create a design from another design's revision; include picks sections (board, mechanical, fixed_components, components, keepouts, zones, routing, schematic, firmware, simulation, wiring, all). Args: source_design_id, revision_id?, name, include?, template?, note?.", requires: pcb.write }
    - { name: pcb_templates_list, description: "List designs marked as templates.", requires: pcb.read }
    - { name: pcb_template_apply, description: "Replace a design's board, mechanical and fixed components (or chosen sections) with a template's as a new revision. Args: design_id, expected_parent_id, template_design_id, template_revision_id?, include?, note?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_template_sync, description: "Push a template's current revision to every design derived from it. Args: template_design_id, dry_run?.", requires: pcb.write }
    - { name: pcb_i2c_bus_check, description: "Check I2C address conflicts across blocks sharing one bus and within each block. Args: design_ids.", requires: pcb.read }
    - { name: pcb_lcsc_search, description: "Search the LCSC/JLCPCB assembly parts catalog. Args: query, package?, limit?.", requires: pcb.read }
    - { name: pcb_lcsc_match, description: "Match every placed BOM line to an LCSC part with stock and price; apply writes exact MPN matches as a new revision. Args: design_id, revision_id?, expected_parent_id?, build_quantity?, apply?, overwrite?, accept_parametric?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
    - { name: pcb_library_list, description: "List built-in and project library parts (real land patterns, MPN, LCSC). Args: query?, category?, limit?.", requires: pcb.read }
    - { name: pcb_library_get, description: "Return one library part with pads, courtyard, pins, sourcing, datasheet and provenance. Args: part_id.", requires: pcb.read }
    - { name: pcb_footprint_import_kicad, description: "Import a KiCad .kicad_mod footprint into the project library. Args: content, name?, category?, mpn?, manufacturer?, lcsc?, datasheet_url?.", requires: pcb.write }
    - { name: pcb_component_place_from_library, description: "Place a library part into a design (component.add_from_library revision). Args: design_id, part_id, x_nm, y_nm, rotation_udeg?, side?, designator?, expected_parent_id?.", requires: pcb.write, resource_from: "pcb_design/{arg.design_id}" }
  ui_panels:
    - { slot: project.page, label: PCB, icon: cpu, entry: /ui/PCBPanel.mjs }
  ui_components:
    - name: pcb-design-card
      entry: /ui/PCBDesignCard.mjs
      slots: [chat.message_attachment]
      props_schema:
        type: object
        required: [design_id]
        properties:
          design_id: { type: integer }
          revision_id: { type: integer }
      preview_props: { preview: true }
  skills:
    - name: how-to-use-pcb
      command: /pcb
      body_file: skills/how-to-use-pcb.md
      description: Design, wire, illustrate, edit, route, simulate, verify, and fabricate native Apteva electronics, including Arduino and breadboard tutorials.
      metadata: { category: design, icon: "⚡" }
  publishes:
    - { name: pcb.design.created, description: A PCB design and its first immutable revision were created. }
    - { name: pcb.revision.created, description: A native PCB revision was created. }
    - { name: pcb.validation.completed, description: Native ERC/DRC validation completed. }
    - { name: pcb.routing.completed, description: Native autorouting completed and a route revision was created. }
    - { name: pcb.placement.completed, description: Automatic component placement completed and a placement revision was created. }
    - { name: pcb.simulation.completed, description: Native electrical simulation completed. }
    - { name: pcb.firmware.completed, description: Arduino-compatible virtual firmware execution completed. }
    - { name: pcb.wiring.simulation.completed, description: Arduino firmware state was mapped onto a physical wiring tutorial. }
    - { name: pcb.fabrication.verified, description: Independent Gerber and Excellon parser verification completed. }
    - { name: pcb.artifact.created, description: "A preview, BOM, or package was persisted." }
    - { name: pcb.release.created, description: A validated release package was created. }
    - { name: pcb.bringup.recorded, description: Bring-up measurements were recorded for a manufactured board. }
    - { name: pcb.order.updated, description: A fabrication order was prepared or its status changed. }

runtime:
  kind: source
  source: { repo: github.com/apteva/apps, ref: pcb/v0.11.1, entry: mcp/pcb }
  port: 8080
  health_check: /health
  resources: { cpu: 0.1, memory: 128, cpu_limit: 1, memory_limit: 512 }
  storage:
    - { name: data, mount_path: /data }
  env:
    APTEVA_GATEWAY_URL: { from: platform }
    APTEVA_APP_TOKEN: { from: platform }
    APTEVA_INSTALL_ID: { from: platform }
    APTEVA_PROJECT_ID: { from: platform }

db:
  driver: sqlite
  path: /data/pcb.db
  migrations: migrations/

config_schema:
  - { name: artifact_dir, type: text, default: "/data/artifacts", label: Local artifact cache }
  - { name: default_country, type: text, default: "US", label: Sourcing country }
  - { name: default_currency, type: text, default: "USD", label: Sourcing currency }
  - { name: lcsc_catalog_url, type: text, default: "https://jlcsearch.tscircuit.com", label: LCSC parts catalog URL (off to disable) }

upgrade_policy: auto-patch
