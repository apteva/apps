schema: apteva-app/v1

name: seo
display_name: SEO
version: 0.7.0
description: |
  Generic SEO research workbench. Track domains, keywords, rankings,
  and backlinks; pull metrics from any provider behind one pluggable
  integration role (DataForSEO / YepAPI). Schema is grounded in
  the convergent shape across the major SEO APIs: per-(entity,
  provider, ts) snapshot rows for metrics, dedicated time-series for
  keyword volume history, and per-link rows for backlinks.

  v0.1: schema + domain/keyword CRUD.
  v0.2: read-only MCP tools for cached data + HTTP refresh routes
        that call the bound provider integration. Refresh is NOT
        exposed as MCP — paid actions stay human/UI-triggered, the
        agent only reads cached rows and surfaces last_refreshed_at
        as a staleness signal.
  v0.3: locale-aware tracking, DataForSEO location sync, and an
        operator panel for interactive seeding and paid refreshes.
  v0.3.1: fixes DataForSEO live refresh request shape.
  v0.3.2: fixes DataForSEO keyword search-volume response parsing.
  v0.3.3: adds a domain page/ranking drill-down in the panel.
  v0.3.4: persists DataForSEO ranked keywords into pages and rankings
        during domain refresh.
  v0.3.5: makes ranking refresh idempotent so the same page/keyword
        is updated instead of duplicated.
  v0.3.6: keeps ranking history in the rankings table with one
        observation per page/keyword/day.
  v0.3.7: fixes DataForSEO domain refresh payloads for the current
        Google domain_rank_overview API.
  v0.4.0: adds search-engine-aware entities and SERP snapshots for
        Google and YouTube, with Google as the default search engine.
  v0.4.1: makes DataForSEO location sync tolerate per-engine failures
        and fixes generic SERP entity IDs after upserts.
  v0.4.2: parses DataForSEO Labs location rows with nested
        available_languages entries.
  v0.4.3: seeds YouTube locales from DataForSEO Google locations when
        the full YouTube location catalog is unavailable, and adds a
        YouTube keyword SERP refresh action in the panel.
  v0.4.4: maps the generic SERP depth option to DataForSEO YouTube's
        block_depth parameter so YouTube refreshes work with the same
        app-level interface as Google.
  v0.4.5: classifies YouTube SERP videos, channels, and playlists
        separately, and defaults YouTube content ideas/opportunities to
        video results so channel names are not treated as video topics.
  v0.4.6: stores and returns YouTube SERP video results only, so normal
        SEO views do not include channels or playlists.
  v0.4.7: backfills existing installs into the uniform search-engine keyword
        model and cleans legacy YouTube channel/playlist SERP rows.
  v0.4.8: unifies Google and YouTube keyword SERP reads, replaces stale
        current-ranking observations atomically, scores only latest SERP
        snapshots, batches UI ranking reads, validates engine locales, and
        adds bounded SERP retention.
  v0.4.9: fixes duplicate keyword and domain additions so conflict-tolerant
        inserts always return the canonical tracked record.
  v0.4.10: adds the adaptive app icon used by the app registry.
  v0.4.11: batches Google keyword volume and difficulty refreshes, checks
        DataForSEO credit before paid work, persists resumable progress, and
        returns provider payment and rate-limit errors as HTTP 402/429.
  v0.5.0: adds a provider-neutral adapter with DataForSEO and YepAPI support,
        multiple provider bindings with a selectable default, provider-scoped
        locations, and uniform Google/YouTube SERP persistence.
  v0.5.1: makes omitted-provider reads use the configured default, adds an
        explicit all-provider read mode, infers keyword engines from locations,
        enriches ambiguous YepAPI difficulty, preserves upstream HTTP errors,
        and falls back to video-only YepAPI YouTube search when its SERP
        endpoint has a retryable server failure.
  v0.6.0: adds budgeted daily Google rank tracking through app-sdk workers and
        DataForSEO's cheaper Standard Queue. Compact observations retain both
        ranks and explicit not-found checks for long-term history while full
        SERP snapshots remain bounded.
  v0.6.1: adds per-tracker daily, weekly, and monthly refresh choices while
        preserving existing history and the daily policy's deeper Sunday scan.
  v0.6.2: adds cached backlink movement analytics and panel views derived from
        provider first-seen, last-seen, and lost status fields without adding
        snapshots or making extra provider requests.
  v0.6.3: adds a paginated backlink detail view with cached search, status and
        follow filters, full source/target details, attributes, authority, and
        provider timestamps without adding paid requests.
  v0.7.0: reorganizes the panel around an overview, searchable domain explorer,
        keywords, research, and settings. Refresh providers and search engines
        now appear only where they affect the selected workflow.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/seo
icon: /ui/icon.svg
icon_style: monochrome
tags: [seo, marketing, keywords, rankings, backlinks]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    # Owns its own DB (domains, keywords, snapshots, rankings, backlinks).
    - db.write.app
    # The bound provider integration runner makes outbound HTTP calls
    # on the platform's behalf — seo doesn't open sockets directly,
    # but we declare net.egress so the platform allows it transitively
    # if the runner ever runs in-process.
    - net.egress
    # Lets seo invoke tools on bound SEO data providers via
    # PlatformAPI().ExecuteIntegrationTool. Credentials never
    # leave the platform proxy.
    - platform.connections.execute
  integrations:
    # Optional multi-binding. Without it, refresh routes return 503 with a
    # "bind a provider" hint; read-only MCP tools still work against
    # whatever has been cached.
    - role: seo_data_provider
      kind: integration
      mode: multiple
      compatible_slugs: [dataforseo, yepapi]
      capabilities: []
      required: false
      label: "SEO data providers (optional)"
      hint: "Bind DataForSEO, YepAPI, or both. The default binding is used unless a provider is requested."

provides:
  http_routes:
    - prefix: /
  workers:
    - name: rank_tracking_scheduler
      schedule: "@every 15m"
    - name: rank_tracking_collector
      schedule: "@every 1m"
  mcp_tools:
    - { name: search_engines_list, description: "List supported search engines and generic SEO capabilities. Google is the default." }
    - { name: providers_list, description: "List bound SEO providers and the default provider." }
    - { name: entities_add, description: "Add a tracked search entity. Args: search_engine? (google default, youtube), entity_type, identifier, label?, url?, location_id? or country_iso+language_code?." }
    - { name: entities_list, description: "List tracked search entities. Args: search_engine?, entity_type?, limit?." }
    - { name: entities_get, description: "Read one tracked search entity. Args: id." }
    - { name: entities_remove, description: "Remove one tracked search entity. Args: id." }
    - { name: serp_search, description: "Run a paid provider SERP search and cache ranked results. Args: provider?, search_engine? (google default or youtube), keyword or keyword_id, location_id or country_iso+language_code, depth?. YouTube stores video results only." }
    - { name: keyword_ideas, description: "Find keyword/content ideas. Args: provider?, search_engine? (google default or youtube), seed_keywords or keywords, location_id or country_iso+language_code, limit?, refresh?." }
    - { name: rankings_for_entity, description: "List cached ranking rows for a generic search entity. Args: entity_id, provider? (default binding; all for every provider), since?, limit?." }
    - { name: rankings_for_keywords, description: "List cached SERP rankings for multiple keywords. Args: keyword_ids, provider? (default binding; all for every provider), since?, limit?, history?." }
    - { name: rank_trackers_list, description: "List automatic rank trackers, refresh frequency, and status. Args: keyword_id?." }
    - { name: rank_history, description: "Read durable scheduled rank/not-found observations. Args: tracker_id, limit?." }
    - { name: content_opportunities, description: "Summarize latest cached SERP snapshots into content opportunities. Args: provider? (default binding; all for every provider), search_engine? (google default), limit?. YouTube uses video results only." }
    - { name: locations_list, description: "List active SEO provider locations. Args: provider? (default binding; all for every provider), search_engine?, country_iso?, language_code?, q?, limit?. Sync locations from the SEO panel first." }
    # ── domain CRUD (v0.1) ──────────────────────────────────────────
    - { name: domains_add,    description: "Add a domain (hostname) to track. Args: host (required), label?, location_id? or country_iso+language_code? for the default locale." }
    - { name: domains_list,   description: "List tracked domains in this scope." }
    - { name: domains_get,    description: "Read one domain plus its latest metrics snapshot. Args: id, provider? (default binding; all for newest across providers)." }
    - { name: domains_remove, description: "Remove a domain. Cascades to its pages, metrics, rankings, backlinks. Args: id." }
    # ── keyword CRUD (v0.1) ─────────────────────────────────────────
    - { name: keywords_add,    description: "Add a keyword to track. Args: text (required), location_id or country_iso+language_code. No implicit locale fallback is applied." }
    - { name: keywords_list,   description: "List keywords in this scope. Args: provider? (default binding; all for every provider), search_engine?, country_iso?, limit? (default 200)." }
    - { name: keywords_get,    description: "Read one keyword plus its latest metrics snapshot. Args: id, provider? (default binding; all for newest across providers)." }
    - { name: keywords_remove, description: "Remove a keyword. Cascades to its metrics, volume history, rankings. Args: id." }
    # ── read-only views (v0.2) ──────────────────────────────────────
    # Refresh tools are deliberately NOT exposed as MCP. The agent
    # reads cached rows here and uses last_refreshed_at to flag
    # staleness; the human triggers refresh via the panel.
    - { name: rankings_for_domain,   description: "List a domain's current rankings by default, or daily observations with history=true. Args: domain_id (required), provider? (default binding; all for every provider), since? (unix), limit? (default 200), history?." }
    - { name: rankings_for_keyword,  description: "List cached SERP rankings for a keyword with one uniform Google/YouTube result shape. Args: keyword_id (required), provider? (default binding; all for every provider), since? (unix), limit? (default 200), history?." }
    - { name: backlinks_list,        description: "List backlinks pointing at a domain (cached). Args: domain_id (required), provider? (default binding; all for every provider), lost? (bool, default false), dofollow? (bool, optional filter), limit? (default 200)." }
    - { name: backlinks_browse,      description: "Browse cached backlinks with pagination and search. Args: domain_id (required), provider? (default binding; all for every provider), status? (all, active, lost), query?, dofollow?, limit?, offset?." }
    - { name: backlink_movement,     description: "Summarize cached backlink gains and losses from provider first_seen/last_seen timestamps without a refresh or snapshot. Args: domain_id (required), provider? (default binding; all for every provider), days? (default 90, max 730)." }
    - { name: keyword_volume_history, description: "Monthly search-volume series for a keyword (cached). Args: keyword_id (required), provider? (default binding; all for every provider)." }
  ui_panels:
    - slot: project.page
      label: SEO
      icon: trending-up
      entry: /ui/SeoPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/seo
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/seo.db
  migrations: migrations/

upgrade_policy: manual
