schema: apteva-app/v1

name: seo
display_name: SEO
version: 0.4.3
description: |
  Generic SEO research workbench. Track domains, keywords, rankings,
  and backlinks; pull metrics from any provider behind one pluggable
  integration role (DataForSEO / Ahrefs / Moz). Schema is grounded in
  the convergent shape across the major SEO APIs: per-(entity,
  provider, ts) snapshot rows for metrics, dedicated time-series for
  keyword volume history, and per-link rows for backlinks.

  v0.1: schema + domain/keyword CRUD.
  v0.2: read-only MCP tools for cached data + HTTP refresh routes
        that call the bound provider integration. Refresh is NOT
        exposed as MCP — paid actions stay human/UI-triggered, the
        agent only reads cached rows and surfaces last_refreshed_at
        as a staleness signal.
  v0.3: locale-aware tracking, DataForSEO location sync, and an
        operator panel for interactive seeding and paid refreshes.
  v0.3.1: fixes DataForSEO live refresh request shape.
  v0.3.2: fixes DataForSEO keyword search-volume response parsing.
  v0.3.3: adds a domain page/ranking drill-down in the panel.
  v0.3.4: persists DataForSEO ranked keywords into pages and rankings
        during domain refresh.
  v0.3.5: makes ranking refresh idempotent so the same page/keyword
        is updated instead of duplicated.
  v0.3.6: keeps ranking history in the rankings table with one
        observation per page/keyword/day.
  v0.3.7: fixes DataForSEO domain refresh payloads for the current
        Google domain_rank_overview API.
  v0.4.0: adds search-engine-aware entities and SERP snapshots for
        Google and YouTube, with Google as the default search engine.
  v0.4.1: makes DataForSEO location sync tolerate per-engine failures
        and fixes generic SERP entity IDs after upserts.
  v0.4.2: parses DataForSEO Labs location rows with nested
        available_languages entries.
  v0.4.3: seeds YouTube locales from DataForSEO Google locations when
        the full YouTube location catalog is unavailable, and adds a
        YouTube keyword SERP refresh action in the panel.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/seo
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/seo/icon.svg
tags: [seo, marketing, keywords, rankings, backlinks]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    # Owns its own DB (domains, keywords, snapshots, rankings, backlinks).
    - db.write.app
    # The bound provider integration runner makes outbound HTTP calls
    # on the platform's behalf — seo doesn't open sockets directly,
    # but we declare net.egress so the platform allows it transitively
    # if the runner ever runs in-process.
    - net.egress
    # Lets seo invoke tools on the bound SEO data provider (DataForSEO
    # etc.) via PlatformAPI().ExecuteIntegrationTool. Credentials never
    # leave the platform proxy.
    - platform.connections.execute
  integrations:
    # Optional binding. Without it, refresh routes return 503 with a
    # "bind a provider" hint; read-only MCP tools still work against
    # whatever has been cached.
    - role: seo_data_provider
      kind: integration
      compatible_slugs: [dataforseo, ahrefs, moz]
      capabilities: []
      required: false
      label: "SEO data provider (optional)"
      hint: "Bind a DataForSEO, Ahrefs, or Moz connection to populate metrics, rankings, and backlinks. Without a binding, the schema and tools work against whatever's already cached."

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: search_engines_list, description: "List supported search engines and generic SEO capabilities. Google is the default." }
    - { name: entities_add, description: "Add a tracked search entity. Args: search_engine? (google default, youtube), entity_type, identifier, label?, url?, location_id? or country_iso+language_code?." }
    - { name: entities_list, description: "List tracked search entities. Args: search_engine?, entity_type?, limit?." }
    - { name: entities_get, description: "Read one tracked search entity. Args: id." }
    - { name: entities_remove, description: "Remove one tracked search entity. Args: id." }
    - { name: serp_search, description: "Run a paid provider SERP search and cache ranked results. Args: search_engine? (google default or youtube), keyword or keyword_id, location_id or country_iso+language_code, depth?." }
    - { name: keyword_ideas, description: "Find keyword/content ideas. Args: search_engine? (google default or youtube), seed_keywords or keywords, location_id or country_iso+language_code, limit?, refresh?." }
    - { name: rankings_for_entity, description: "List cached ranking rows for a generic search entity. Args: entity_id, since?, limit?." }
    - { name: content_opportunities, description: "Summarize cached SERP snapshots into content opportunities. Args: search_engine? (youtube default), limit?." }
    - { name: locations_list, description: "List active SEO provider locations. Args: provider?, search_engine?, country_iso?, language_code?, q?, limit?. Sync locations from the SEO panel first." }
    # ── domain CRUD (v0.1) ──────────────────────────────────────────
    - { name: domains_add,    description: "Add a domain (hostname) to track. Args: host (required), label?, location_id? or country_iso+language_code? for the default locale." }
    - { name: domains_list,   description: "List tracked domains in this scope." }
    - { name: domains_get,    description: "Read one domain plus its latest metrics snapshot. Args: id." }
    - { name: domains_remove, description: "Remove a domain. Cascades to its pages, metrics, rankings, backlinks. Args: id." }
    # ── keyword CRUD (v0.1) ─────────────────────────────────────────
    - { name: keywords_add,    description: "Add a keyword to track. Args: text (required), location_id or country_iso+language_code. No implicit locale fallback is applied." }
    - { name: keywords_list,   description: "List keywords in this scope. Args: search_engine?, country_iso?, limit? (default 200)." }
    - { name: keywords_get,    description: "Read one keyword plus its latest metrics snapshot. Args: id." }
    - { name: keywords_remove, description: "Remove a keyword. Cascades to its metrics, volume history, rankings. Args: id." }
    # ── read-only views (v0.2) ──────────────────────────────────────
    # Refresh tools are deliberately NOT exposed as MCP. The agent
    # reads cached rows here and uses last_refreshed_at to flag
    # staleness; the human triggers refresh via the panel.
    - { name: rankings_for_domain,   description: "List a domain's current rankings by default, or daily observations with history=true. Args: domain_id (required), since? (unix), limit? (default 200), history?." }
    - { name: rankings_for_keyword,  description: "List current tracked-domain rankings for a keyword by default, or daily observations with history=true. Args: keyword_id (required), since? (unix), limit? (default 200), history?." }
    - { name: backlinks_list,        description: "List backlinks pointing at a domain (cached). Args: domain_id (required), lost? (bool, default false), dofollow? (bool, optional filter), limit? (default 200)." }
    - { name: keyword_volume_history, description: "Monthly search-volume series for a keyword (cached). Args: keyword_id (required)." }
  ui_panels:
    - slot: project.page
      label: SEO
      icon: trending-up
      entry: /ui/SeoPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/seo
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/seo.db
  migrations: migrations/

upgrade_policy: manual
