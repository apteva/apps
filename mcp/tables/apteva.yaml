schema: apteva-app/v1

name: tables
display_name: Tables
version: 0.1.9
description: |
  Typed-row database for Apteva agents and human teams. The row-shaped
  sibling to the storage app: define typed tables, insert rows, query
  with typed predicates, paginate. Strict schemas — every row's keys
  and value types are validated against the table's column definitions
  before insert. Columns can reference storage files via the file_id
  type. Project-scoped by default; opt-in global tables for shared
  lookup data.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/tables
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/tables/icon.png
tags: [database, storage, records, sql]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - name: tables_create
      description: 'Create a new table with typed columns. Args: name, columns (array of {name, type, nullable?, default?}). Returns the created table''s id + name.'
    - name: tables_list
      description: 'List tables visible to this install. No args. Returns [{id, name, scope, columns, row_count, created_at}].'
    - name: tables_describe
      description: 'Full schema + row count for one table. Args: name. Returns {id, name, scope, columns, row_count}.'
    - name: tables_alter
      description: 'Add, rename, or drop columns. Args: name, add? / rename? / drop?. Adding a non-nullable column requires a default. Returns the new schema.'
    - name: tables_drop
      description: 'Delete a table and all its rows. Args: name, confirm. Idempotent only when confirm=true.'
    - name: rows_insert
      description: 'Insert one or many rows. Args: table, rows (array of objects keyed by column name). Atomic — first failing row aborts the whole call. Returns {ids, inserted}.'
    - name: rows_upsert
      description: 'Insert or update rows by a caller-supplied key. Args: table, key (array of column names), rows. Existing rows matching the key are patched; missing rows are inserted. Returns {ids, inserted, updated}.'
    - name: rows_get
      description: 'Fetch one row by id. Args: table, id, hydrate_files? (resolve file_id columns to signed URLs via the storage app). Returns {row, found}.'
    - name: rows_update
      description: 'Patch fields on a row. Args: table, id, fields (object). Touches updated_at. Returns the new row.'
    - name: rows_delete
      description: 'Delete by id, or by filter when filter is supplied + confirm=true. Returns {deleted}.'
    - name: rows_search
      description: 'Filter, sort, paginate. Args: table, where? (array of {col, op, value}), order_by?, limit?, offset?. Ops: eq, neq, lt, lte, gt, gte, contains, in, between, is_null, is_not_null. Returns {rows, total}.'
    - name: rows_count
      description: 'Count rows matching a filter. Args: table, where?. Returns {count}.'
    - name: rows_aggregate
      description: 'Single-table grouped aggregations. Args: table, where?, group_by? (column names or {col, bucket: day|week|month|year, name?}), metrics ([{name, op, col?, distinct?, numerator?, denominator?}]), order_by?, limit?. Ops: count, sum, avg, min, max, avg_ratio. Returns {rows, truncated}.'
    - name: tables_query
      description: 'Read-only SELECT escape hatch. Args: sql, params? (array of bound values). Refused on any non-SELECT keyword; row + bytes caps enforced. Returns {columns, rows, truncated}.'
  ui_panels:
    - slot: project.page
      label: Tables
      icon: database
      entry: /ui/TablesPanel.mjs
  skills:
    - name: how-to-use-tables
      command: /tables
      body_file: skills/how-to-use-tables.md
      description: |
        Tables' mental model — when to pick tables vs storage vs the
        domain-specific apps (crm, todo, tasks). Schema discipline,
        the file_id ↔ storage bridge, query predicates.
      metadata:
        category: storage
        icon: 🗃️

  publishes:
    - name: table.created
      description: A table was created.
      payload:
        id: integer
        name: string
        scope: string
        columns: array
    - name: table.altered
      description: A table schema changed.
      payload:
        name: string
        columns: array
    - name: table.dropped
      description: A table was dropped.
      payload:
        name: string
    - name: row.inserted
      description: Rows were inserted into a table.
      payload:
        table: string
        ids: array
        count: integer
    - name: row.updated
      description: Rows were updated in a table.
      payload:
        table: string
        id: integer
        count: integer
    - name: row.deleted
      description: Rows were deleted from a table.
      payload:
        table: string
        id: integer
        deleted: integer

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/tables
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/tables.db
  migrations: migrations/

config_schema:
  - name: max_rows_per_table
    type: text
    default: "1000000"
    label: Max rows per table
    description: Hard ceiling per user-table. Insert is refused once a table reaches this many live rows. Set to 0 to disable the cap.
  - name: max_query_rows
    type: text
    default: "1000"
    label: Max rows returned by tables_query
    description: Read-only SELECT escape hatch row cap. Results past this point are truncated and the response sets truncated=true.
  - name: max_query_ms
    type: text
    default: "2000"
    label: Max tables_query duration (ms)
    description: tables_query timeout. The query is cancelled and an error returned if it runs longer.

imports:
  sources:
    - id: airtable_whole_connection
      label: Airtable connection
      description: Import every base and table visible to an Airtable connection into Tables.
      kind: integration
      integration: airtable
      scope: whole_connection

      discover:
        bases:
          tool: list_bases
          result_path: bases
          pagination:
            cursor_arg: offset
            cursor_result_path: offset
        tables:
          tool: get_base_schema
          args:
            base_id: "${base.id}"
          result_path: tables

      read:
        records:
          tool: list_records
          args:
            base_id: "${base.id}"
            table_id: "${table.id}"
            pageSize: 100
          result_path: records
          pagination:
            cursor_arg: offset
            cursor_result_path: offset

      record:
        id_path: id
        created_at_path: createdTime
        fields_path: fields

      create:
        strategy: table_per_source_table
        table_name: "airtable_${base.name}_${table.name}"

      schema:
        mode: infer_from_source_schema
        field_source: get_base_schema
        include_source_metadata: true
        metadata_columns:
          - name: source_connection_id
            type: text
          - name: source_base_id
            type: text
          - name: source_base_name
            type: text
          - name: source_table_id
            type: text
          - name: source_table_name
            type: text
          - name: source_record_id
            type: text
          - name: source_synced_at
            type: datetime
          - name: source_deleted
            type: bool
          - name: source_hash
            type: text

      write:
        tool: rows_upsert
        key:
          - source_connection_id
          - source_base_id
          - source_table_id
          - source_record_id

      sync:
        default_mode: upsert
        default_schedule: 15m
        deletes: soft_delete

upgrade_policy: auto-patch
