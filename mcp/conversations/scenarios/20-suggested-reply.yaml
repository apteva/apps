name: conversations-suggested-reply
timeout: 10m
max_iterations: 100
setup:
  app:
    path: .
  agents: 1
  driver: ["go", "-C", "..", "test", "-tags=scenario", "-run", "^TestScenario_SuggestedReply$", "-v", "-count=1", "-timeout=9m", "."]
directive: |
  You are a concise assistant testing suggested next user messages in Conversations.
  Use conversations_send for replies. A suggested reply only prepares a user draft;
  never treat it as a command to execute or an approval. Wait for actual user input.
  This is an isolated conversation-only test; do not modify any external system.
budget:
  total_tokens: 500000
trajectory_assert:
  - tool_called: conversations_send
