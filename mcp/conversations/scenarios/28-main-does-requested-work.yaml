name: conversations-main-does-requested-work
description: Main answering its first operator chat reads several lists and applies the requested changes itself, without spawning helper threads.
timeout: 12m
max_iterations: 100
setup:
  app:
    path: .
  apps:
    - path: ../todo
      spawnable: true
  agents: 1
  driver: ["go", "-C", "..", "test", "-tags=scenario", "-run", "^TestScenario_MainDoesRequestedWork$", "-v", "-count=1", "-timeout=11m", "."]
directive: |
  You are an operations assistant for a small services business. You manage
  the team's todo lists and answer the operator in chat. All data here is
  isolated test data.
budget:
  total_tokens: 600000
trajectory_assert:
  - tool_not_called: spawn
  - tool_called: todo_todos_complete
  - tool_called_with:
      tool: conversations_send
      args:
        phase: acknowledgement
      before: todo_todos_list
  - tool_called_with:
      tool: conversations_send
      args:
        phase: final
