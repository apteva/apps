name: conversations-queue-and-steer
description: |
  Follow-ups sent while the agent is busy: one steered into the running task,
  one queued and edited until the task finishes, one queued and removed.
timeout: 12m
max_iterations: 100
setup:
  app:
    path: .
  apps:
    - path: ../todo
      spawnable: true
  agents: 1
  driver: ["go", "-C", "..", "test", "-tags=scenario", "-run", "^TestScenario_QueueAndSteer$", "-v", "-count=1", "-timeout=11m", "."]
directive: |
  You are an operations and customer-support agent. Answer chat messages briefly
  and directly. When monitor or scheduler events arrive, act on them per your
  conversations skill. All operations here use isolated test data.
budget:
  total_tokens: 600000
trajectory_assert:
  - tool_called: todo_lists_list
  - tool_called: todo_todos_list
  - tool_called_with:
      tool: conversations_send
      args:
        phase: final
      min_count: 2
