name: conversations-coding-unprompted-suggestion
description: Opt-in measurement. Scenario 21 without the directive line, so the model chooses on its own whether to suggest a next step.
timeout: 12m
max_iterations: 100
setup:
  app:
    path: .
  apps:
    - path: ../code
      spawnable: true
      config:
        trusted_local_execution: "true"
  agents: 1
  # Opt-in: suggestions are optional in the shipped guidance, so this passes
  # only as often as the model volunteers one (about half the time or less).
  # Run it repeatedly to measure that rate, e.g. after changing the guidance,
  # with APTEVA_RUN_CONVERSATIONS_UNPROMPTED_SUGGESTION_TIER3=1.
  required_env:
    - APTEVA_RUN_CONVERSATIONS_UNPROMPTED_SUGGESTION_TIER3
  driver: ["go", "-C", "..", "test", "-tags=scenario", "-run", "^TestScenario_CodingUnpromptedSuggestion$", "-v", "-count=1", "-timeout=11m", "."]
directive: |
  You are a concise coding assistant. Use Code to inspect and edit the isolated
  test repository and Conversations to reply to the user. Use Bun for JavaScript
  checks. Local command execution is enabled for this disposable Code install;
  use repos_run_command with runtime=local when running repository tests.
  Do not contact external services or modify any other repository.
  Work only on what the user asks in the conversation; until then, do nothing.
budget:
  total_tokens: 750000
trajectory_assert:
  - tool_called: repos_run_command|code_read_file
  - tool_called: conversations_send
