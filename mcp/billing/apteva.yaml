schema: apteva-app/v1

name: billing
display_name: Billing
version: 0.8.14
description: |
  Customers, invoices, and payments for Apteva agents and human teams.
  Per-invoice provider — local for internal/wire/cash records, stripe
  for card-payable hosted invoices — chosen at create time and frozen
  for the invoice's lifetime. v0.1.0 ships local-only; v0.1.1 adds the
  Stripe provider via the integrations catalog. Lifecycle is explicit
  (draft → open → paid/void/uncollectible) with an append-only audit
  log per invoice.
  v0.8.14 adds generic reusable payment methods and provider-hosted
  setup sessions for card and bank-debit collection. Billing remains
  product-agnostic.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/billing
icon: https://raw.githubusercontent.com/apteva/apps/main/mcp/billing/icon.png
tags: [billing, invoices, payments, finance]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress                              # direct Stripe API calls when stripe_secret_key is configured
    - platform.apps.call                       # billing calls catalog when line items reference price_id
    - platform.connections.execute             # run Stripe integration tools when payment_processor is bound
    - platform.connections.read_credentials    # for the Stripe webhook signature verification path
  apps:
    - name: catalog
      optional: true                           # free-form line items keep working without catalog
  integrations:
    - role: payment_processor                  # Stripe (or any future processor) for card-payable invoices
      kind: integration
      compatible_slugs: [stripe]
      capabilities: [customers.create, checkout_sessions.create, refunds.create, webhooks.receive]
      tools:
        customers.create:         create_customer
        customers.search:         search_customers
        checkout_sessions.create: create_checkout_session
        refunds.create:           create_refund
        webhooks.process:         process_webhook
      required: false                          # billing still works without it — manual payments only
      label: "Payment processor (Stripe)"
      hint: "Legacy fallback for card payment links. Prefer setting stripe_secret_key directly in Billing config; without either, payments_record handles wire / cash / check / other only."

provides:
  http_routes:
    - prefix: /
    - prefix: /webhooks/stripe
      no_auth: true
  mcp_tools:
    - name: customers_search
      description: Filtered customer search by name / email / external_id / metadata.
    - name: customers_get
      description: Fetch one customer (snapshot only).
    - name: customers_get_context
      description: Snapshot + open invoices + recent payments + lifetime totals — pre-flight read before drafting an invoice.
    - name: customers_upsert_by_email
      description: Find-or-create by email. Returns was_created. Right-by-default primitive.
    - name: customers_update
      description: Partial-patch a customer.
    - name: customers_merge
      description: Merge one customer into another. Reassigns invoices + payments.
    - name: invoices_create
      description: Create a DRAFT invoice with optional initial line items. Provider arg ('local' | 'stripe') falls back to install default. Provider is frozen after create.
    - name: invoices_create_from_prepared_lines
      description: Create an invoice from generic prepared line items produced by another app, optionally finalizing it.
    - name: invoices_add_line_item
      description: Append a line item to a DRAFT invoice. Errors on non-draft invoices.
    - name: invoices_finalize
      description: Transition draft → open. Mints invoice number. v0.1.0 supports provider=local only.
    - name: invoices_update
      description: Patch an invoice. Always-allowed fields (any status) — notes, due_date, metadata. Draft-only fields — customer_id, currency, line_items (replaces array).
    - name: invoices_void
      description: Void an open invoice. Cannot void paid invoices.
    - name: invoices_get
      description: Fetch one invoice with line items, payment history, and audit log.
    - name: invoices_search
      description: Filter by status / customer / provider / date range / total range / currency.
    - name: invoices_render_pdf
      description: |
        Render the invoice as a PDF. Default returns the bytes as base64; set
        save_to_storage=true to write the PDF into the storage app and get back
        a file_id + URL the agent can attach to chat or email.
    - name: invoices_send_payment_link
      description: |
        Generate a Stripe-hosted payment URL for an open invoice. Returns
        {url, expires_at}. Uses stripe_secret_key from Billing config
        and auto-creates the Stripe webhook endpoint; legacy installs can
        still use a bound payment_processor integration. URL is a Stripe
        Checkout Session, valid for 24h. On payment success, the webhook
        records the payment + transitions the invoice to 'paid' automatically.
    - name: payment_method_setup_create
      description: Create a provider-hosted setup session so a customer can save a reusable payment method. Supports card and bank-debit types such as sepa_debit where the processor supports them.
    - name: payment_methods_list
      description: List stored customer payment methods by customer, status, or type.
    - name: payment_method_default_set
      description: Mark one active payment method as the customer's default.
    - name: payment_method_detach
      description: Detach a stored payment method locally and at Stripe when direct Stripe config is available.
    - name: payments_record
      description: Record a non-Stripe payment (wire / cash / check / other). Updates invoice status when fully covered.
    - name: payments_list
      description: List payments for a customer or invoice, optionally filtered by method or date range.
    - name: issuer_get
      description: Fetch this install's billing identity (the entity that emits invoices). Singleton.
    - name: issuer_set
      description: Upsert this install's billing identity — display/legal name, address, tax IDs, bank coordinates.
  ui_panels:
    - slot: project.page
      label: Billing
      icon: receipt
      entry: /ui/BillingPanel.mjs
  ui_components:
    # Inline invoice tile the agent attaches to chat messages via
    # respond(components=[{app:"billing", name:"invoice-card", props:{invoice_id:N}}]).
    # Renders status pill + amount + customer + open/pay link.
    - name: invoice-card
      entry: /ui/InvoiceCard.mjs
      slots:
        - chat.message_attachment
      props_schema:
        type: object
        required: [invoice_id]
        properties:
          invoice_id:
            type: integer
      preview_props:
        preview: true
    - name: customer-card
      entry: /ui/CustomerCard.mjs
      slots:
        - chat.message_attachment
      props_schema:
        type: object
        required: [customer_id]
        properties:
          customer_id:
            type: integer
      preview_props:
        preview: true
  publishes:
    - name: customer.added
      description: A billing customer was created.
      payload:
        id: integer
        name: string
        email: string
    - name: customer.updated
      description: A billing customer's fields changed.
      payload:
        id: integer
        name: string
        email: string
    - name: customer.merged
      description: Two billing customers were merged and invoices/payments were reassigned to the winner.
      payload:
        winner_id: integer
        loser_id: integer
    - name: customer.deleted
      description: A billing customer was deleted.
      payload:
        id: integer
    - name: invoice.added
      description: A billing invoice was created.
      payload:
        id: integer
        customer_id: integer
        number: string
        status: string
        total_cents: integer
        currency: string
    - name: invoice.updated
      description: A billing invoice changed, including draft edits or line-item changes.
      payload:
        id: integer
        customer_id: integer
        number: string
        status: string
        total_cents: integer
        currency: string
    - name: invoice.finalized
      description: A draft billing invoice was finalized and opened.
      payload:
        id: integer
        customer_id: integer
        number: string
        status: string
        total_cents: integer
        currency: string
    - name: invoice.voided
      description: A billing invoice was voided.
      payload:
        id: integer
        customer_id: integer
        number: string
        status: string
        total_cents: integer
        currency: string
    - name: invoice.paid
      description: A billing invoice received a payment event; listeners should inspect status for fully paid invoices.
      payload:
        id: integer
        customer_id: integer
        number: string
        status: string
        total_cents: integer
        currency: string
    - name: invoice.refunded
      description: A Stripe refund was recorded against a billing invoice.
      payload:
        id: integer
        customer_id: integer
        number: string
        status: string
        total_cents: integer
        currency: string
    - name: payment_method.attached
      description: A reusable customer payment method was attached after a successful setup flow.
      payload:
        id: integer
        customer_id: integer
        provider: string
        provider_payment_method_id: string
        type: string
        status: string
        is_default: boolean
    - name: payment_method.default_changed
      description: A customer's default payment method changed.
      payload:
        id: integer
        customer_id: integer
        provider: string
        provider_payment_method_id: string
        type: string
        status: string
        is_default: boolean
    - name: payment_method.detached
      description: A reusable customer payment method was detached or revoked.
      payload:
        id: integer
        customer_id: integer
        provider: string
        provider_payment_method_id: string
        type: string
        status: string
        is_default: boolean
  skills:
    # Foundational "how this app thinks" skill loaded whenever the
    # agent touches billing. Lifecycle, picking provider at create
    # time, currency conventions, void confirmation, payment-link
    # safety. body_file is canonical SKILL.md; the manifest fields
    # are kept as a sanity check / preview for the dashboard.
    - name: how-to-use-billing
      command: /billing
      body_file: skills/how-to-use-billing.md
      description: |
        Billing's mental model + conventions. Load when working
        with customers, invoices, or payments. Triggers on:
        "invoice", "bill", "charge", "customer balance",
        "payment link", or any billing tool call.
      metadata:
        category: finance
        icon: 💰

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/billing
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/billing.db
  migrations: migrations/

config_schema:
  - name: stripe_secret_key
    type: password
    default: ""
    label: Stripe secret key
    description: |
      Optional. Set an sk_test_ or sk_live_ key to enable Stripe Checkout
      payment links directly from Billing. Billing will create its own
      Stripe webhook endpoint and store the returned signing secret, so
      you do not need to paste a whsec_ value.
  - name: stripe_webhook_url
    type: text
    default: ""
    label: Stripe webhook URL override
    description: |
      Optional. Leave blank to use the platform public URL plus
      /webhooks/stripe. For local testing, set this to a public tunnel URL
      that forwards to the Billing webhook route.
  - name: stripe_success_url
    type: text
    default: ""
    label: Stripe success URL
    description: Optional Checkout success redirect. Leave blank for Billing's dashboard deep link.
  - name: stripe_cancel_url
    type: text
    default: ""
    label: Stripe cancel URL
    description: Optional Checkout cancel redirect. Leave blank for Billing's dashboard deep link.
  - name: default_provider
    type: select
    options: [local]
    default: local
    label: Default invoice provider
    description: |
      Invoice issuance provider. v0.8.0 only emits 'local' invoices —
      Stripe is consumed as a payment method via the
      payment_processor integration, not as an invoice issuer.
      Future versions may add Stripe-hosted invoice mirroring.
  - name: default_currency
    type: text
    default: "USD"
    label: Default currency
    description: ISO 4217 code used for new invoices when not specified.
  - name: invoice_number_format
    type: text
    default: "INV-{yyyy}-{seq:04}"
    label: Invoice number format
    description: |
      Tokens — {yyyy}/{yy}/{mm}/{dd} (UTC), {seq} (project-scoped sequence;
      :04 zero-pads to four digits). Minted on finalize.
  - name: invoice_seq_start
    type: text
    default: "1001"
    label: First invoice number
    description: |
      The starting value for {seq} each year. Default 1001 — your first
      invoice looks like INV-2026-1001, not INV-2026-0001 (the latter
      announces "this is my very first invoice"). Set to 1 if you want
      strict 1,2,3 numbering; or pick any non-round value (1042, 1058)
      to look more established.
  - name: tax_default_rate_bps
    type: text
    default: "0"
    label: Default tax rate (basis points)
    description: |
      1000 = 10.00%. Applied when invoices_create / invoices_add_line_item don't
      specify a per-line rate. Set 0 to require explicit per-line tax.

upgrade_policy: auto-patch
