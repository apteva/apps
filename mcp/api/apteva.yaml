schema: apteva-app/v1

name: api
display_name: API Gateway
version: 0.6.0
description: |
  Lightweight API gateway for Apteva SaaS projects. Owns public API
  hostnames, method/path routes, simple API keys, CORS policy, request
  logs, dispatch to Functions, installed app HTTP surfaces, or plain
  HTTP origins, and expose safe authenticated AppBus invalidation feeds.

  v0.2.0 streams Function-target responses through the platform's bound-app
  proxy, including incremental SSE, response headers, status, cancellation,
  and backward-compatible structured non-streaming responses.

  v0.3.0 adds authenticated app_events routes that filter, sanitize, coalesce,
  and stream safe invalidations from any project's AppBus source app.

  v0.3.1 preserves native EventSource query-key authentication through the
  platform app proxy, which supplies its own internal Authorization token.

  v0.4.0 adds bounded in-list event matching, projections of explicitly
  constrained data fields, and per-projection coalescing so one stream can
  safely invalidate several precise resources without losing concurrent changes.

  v0.5.0 adds platform-managed browser-origin registration with delegated,
  route-aware preflight and exact origin enforcement for actual requests.

  v0.6.0 hardens project isolation, authentication, streaming, proxying,
  configuration reconciliation, and bounds resource usage with compiled routing.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/api
icon: /ui/icon.svg
icon_style: monochrome
tags: [api, gateway, rest, graphql, routing, saas]

scopes: [project, global]
min_apteva_version: "0.42.3"

requires:
  permissions:
    - db.write.app
    - platform.apps.call
    - platform.ingress.write
    - net.egress
  integrations:
    - role: upstream
      kind: app
      required: false
      label: HTTP upstream app
      hint: Bind an installed app before creating routes that target its HTTP endpoints.
  apps:
    - name: functions
      optional: true
      reason: Used when an API route targets a serverless function.
    - name: domains
      optional: true
      reason: Used to write DNS records when attaching a public hostname.
    - name: auth
      optional: true
      reason: Used to verify Auth-issued JWTs for protected SaaS routes.

provides:
  http_routes:
    - prefix: /
    - prefix: /gw/
      no_auth: true
  mcp_tools:
    - name: api_create
      description: "Create an API and optionally expose a hostname. CORS requires explicit HTTP(S) origins and is registered with Apteva using delegated app preflight. Args: slug, name?, description?, hostname?, dns_mode? (manual|domains|skipped), allow_http?, cors?, auth?."
    - name: api_get
      description: "Fetch one API by id or slug."
    - name: api_list
      description: "List APIs in this project."
    - name: api_update
      description: "Update API metadata, hostname state, default CORS/auth, or status."
    - name: api_delete
      description: "Delete an API, routes, keys, and logs."
    - name: api_route_add
      description: "Add or update a route. target_kind may be function, app, http, or app_events. app_events routes support exact/bounded-in matching and projections only from explicitly constrained data fields."
    - name: api_route_list
      description: "List routes for an API."
    - name: api_route_delete
      description: "Delete a route by id."
    - name: api_key_create
      description: "Create an API key. Returns the plaintext key once. Args: api_id or api_slug, name."
    - name: api_key_list
      description: "List API keys for an API, excluding key hashes."
    - name: api_key_revoke
      description: "Revoke an API key by id."
    - name: api_logs
      description: "List recent request logs for an API."
  ui_panels:
    - slot: project.page
      label: API Gateway
      icon: network
      entry: /ui/ApiPanel.mjs

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/api
  port: 8080
  health_check: /health

db:
  driver: sqlite
  path: /data/api.db
  migrations: migrations/

config_schema:
  - name: public_host
    type: text
    default: ""
    label: Public host
    description: Hostname or IP that DNS records should point at when dns_mode=domains.

upgrade_policy: auto-patch
