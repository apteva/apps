schema: apteva-app/v1

name: mqtt
display_name: MQTT Broker
version: 0.5.0
description: |
  Embedded MQTT broker for Apteva. Acts as the LAN message bus for
  smart-home devices (ESP32, Zigbee2MQTT, Tasmota, anything that
  speaks MQTT 3.1.1 or 5.0). Every published message is mirrored
  onto the platform event bus as `mqtt.message` so sibling apps
  (messaging, jobs, calendar) can react without speaking MQTT
  themselves; per-pattern subscriptions promote interesting topics
  to named bus events (e.g. `mqtt.motion.frontdoor`).

  Runs mochi-mqtt under the hood — pure-Go broker, MIT licensed,
  retained-message persistence, explicit ingress overload rejection, and MQTT 5 properties.
  TLS is the default transport, using renewable certificate files or automatic
  ACME TLS-ALPN-01 issuance/renewal. Enrollment advertises a validated public
  host and port independently of the internal listener.
  Auth is username/password against this app's own DB. Credentials belong
  to an opaque ownership scope, use a scope-qualified wire username, and
  require explicit publish/subscribe ACLs under the scope's topic root.
  Client IDs are durably bound to credential identities. Management data
  and events are isolated by the authenticated ownership scope.

  Auto-discovers Home Assistant-convention devices by parsing
  `homeassistant/+/+/config` so any sensor that already speaks the
  HA discovery convention shows up in the Devices tab without
  hand-config.

author: Apteva
homepage: https://github.com/apteva/apps/tree/main/mcp/mqtt
icon: /ui/icon.svg
icon_style: monochrome
tags: [mqtt, iot, home-automation, broker, infrastructure]

scopes: [project, global]
min_apteva_version: "0.10.0"

requires:
  permissions:
    - db.write.app
    - net.egress
  integrations: []
  apps: []

provides:
  http_routes:
    - prefix: /
  mcp_tools:
    - { name: mqtt_publish,            description: "Publish one message. Payload may be a string or JSON value; non-strings are JSON-encoded. Args: topic, payload, retain?, qos?." }
    - { name: mqtt_topics_recent,      description: "Last N topics seen by the broker. Args: limit? (default 50)." }
    - { name: mqtt_clients_list,       description: "List currently connected network MQTT clients with authenticated identity and protocol metadata." }
    - { name: mqtt_subscribe,          description: "Persist a subscription pattern that re-emits matches as `mqtt.<bus_topic>` on the platform bus. Args: topic_pattern, bus_topic." }
    - { name: mqtt_subscribe_ensure,   description: "Idempotently ensure a subscription bridge exists. Repeated calls return the same row. Args: topic_pattern, bus_topic." }
    - { name: mqtt_subscribe_list,     description: "List persisted bus subscriptions." }
    - { name: mqtt_subscribe_delete,   description: "Delete a bus subscription. Args: id." }
    - { name: mqtt_users_add,          description: "Legacy create-only alias; existing credentials are never replaced." }
    - { name: mqtt_users_create,       description: "Create a new MQTT user without replacing an existing credential. Args: username, allow_publish, allow_subscribe, password? (omit to generate and return once). ACLs must use the scope topic root; [] denies access." }
    - { name: mqtt_users_update_acl,   description: "Update a user's publish and/or subscribe ACL without changing its password." }
    - { name: mqtt_users_rotate_password, description: "Rotate a user's password without changing ACLs; disconnects active sessions for that user." }
    - { name: mqtt_users_list,         description: "List users (no passwords)." }
    - { name: mqtt_users_delete,       description: "Delete a user. Args: username." }
    - { name: mqtt_users_set_enabled,  description: "Enable / disable a user. Args: username, enabled (bool)." }
    - { name: mqtt_retained_list,      description: "List retained MQTT state. Args: topic_pattern?, limit?." }
    - { name: mqtt_retained_get,       description: "Get one retained MQTT message. Args: topic." }
    - { name: mqtt_retained_delete,    description: "Delete one retained MQTT message from memory and durable storage. Args: topic." }
    - { name: mqtt_devices,            description: "List HA-discovered devices. Args: filter? (substring on slug or model)." }
    - { name: mqtt_status,             description: "Broker endpoint, uptime, client/retained counts, traffic counters, rejection/drop metrics, and active safety limits." }
  ui_panels:
    - slot: project.page
      label: MQTT
      icon: radio
      entry: /ui/MQTTPanel.mjs
  publishes:
    - name: mqtt.message
      description: An MQTT message was published; includes topic, payload, qos, retain, client_id, and authenticated username.
    - name: mqtt.client.connected
      description: An authenticated MQTT client established a session; includes identity, network, protocol, and session metadata.
    - name: mqtt.client.disconnected
      description: An MQTT client disconnected; includes identity, timestamps, session expiry, and reason.
    - name: mqtt.devices.message
      description: Stable filtered device event emitted when a devices/+/+ bridge is ensured with bus_topic devices.message.

runtime:
  kind: source
  source:
    repo: github.com/apteva/apps
    ref: main
    entry: mcp/mqtt
  port: 8080
  ports:
    - name: mqtt
      container_port: 1883
      host_port: 1883
      protocol: tcp
    - name: mqtts
      container_port: 8883
      host_port: 8883
      protocol: tcp
  health_check: /health

db:
  driver: sqlite
  path: /data/mqtt.db
  migrations: migrations/

config_schema:
  - name: transport_mode
    type: select
    options: ["tls", "local"]
    default: "tls"
    label: MQTT transport
    description: TLS is required for public enrollment. Local plaintext is an explicit opt-in and accepts only loopback/private bind and advertised IPs. Only the selected listener is started.
  - name: tls_listen_port
    type: text
    default: "8883"
    label: Internal TLS listener port
    description: Fixed 8883 for managed installs, or 0 for tests. Configure external port forwarding separately and advertise its public port.
  - name: tls_provider
    type: select
    options: ["files", "acme"]
    default: "files"
    label: TLS certificate provider
    description: Files hot-reloads renewed PEM certificates; ACME automatically issues and renews using TLS-ALPN-01 on public TCP 443. No plaintext fallback.
  - name: tls_cert_file
    type: text
    default: ""
    label: Certificate chain PEM path
    description: Full leaf/intermediate certificate chain for files mode. Must match advertised_host and be currently valid. Replace atomically when renewed.
  - name: tls_key_file
    type: text
    default: ""
    label: Private key PEM path
    description: Matching private key for files mode. Keep it readable only by the service identity; it is never returned in management responses.
  - name: tls_reload_seconds
    type: text
    default: "30"
    label: Certificate refresh interval
    description: Seconds between file reloads or ACME enrollment-status refreshes (1 to 3600). Invalid replacements preserve the last valid certificate; expired certificates reject new handshakes.
  - name: tls_renew_before_days
    type: text
    default: "30"
    label: Certificate renewal window
    description: ACME renews automatically before expiry within this 1 to 30 day window. Files mode reports renewal_due; its certificate issuer must renew the source files.
  - name: tls_handshake_timeout_seconds
    type: text
    default: "15"
    label: TLS handshake and CONNECT timeout
    description: Maximum unauthenticated handshake/CONNECT wait, from 1 to 120 seconds.
  - name: tls_max_pending_handshakes
    type: text
    default: "128"
    label: Maximum pending TLS handshakes
    description: Bounded concurrent TLS handshakes. Additional TCP peers are closed before MQTT acceptance.
  - name: acme_accept_terms
    type: select
    options: ["false", "true"]
    default: "false"
    label: Accept ACME issuer terms
    description: Must explicitly be true before ACME account registration or certificate issuance.
  - name: acme_email
    type: text
    default: ""
    label: ACME account contact email
  - name: acme_directory_url
    type: text
    default: "https://acme-v02.api.letsencrypt.org/directory"
    label: ACME directory URL
    description: HTTPS ACME v2 directory. Use an issuer staging directory while validating routing.
  - name: acme_cache_dir
    type: text
    default: ""
    label: Durable ACME cache directory
    description: Empty uses mqtt-acme under the SDK per-install data directory. Persistent mode-0700 directory holding account keys and renewed certificates. Back it up. ACME needs advertised_port 443 and public TCP 443 forwarded unchanged to this app's TLS listener, including ALPN.
  - name: advertised_port
    type: text
    default: ""
    label: Client-facing port
    description: External forwarded MQTT port, independent of the bound port. Default 8883 for TLS, 1883 for local. ACME requires 443. Port 0 is accepted only with an ephemeral test listener.
  - name: listen_port
    type: text
    default: "1883"
    label: Local plaintext listener port
    description: Used only in explicit local mode. Fixed 1883 for managed installs or 0 for tests; TLS mode does not start a plaintext listener.
  - name: bind_interface
    type: text
    default: ""
    label: Bind interface (advanced)
    description: Pin the listener to an IP address (for example 192.168.1.20). Empty binds all interfaces for TLS and loopback for local mode. Interface names such as en0 are not accepted.
  - name: advertised_host
    type: text
    default: ""
    label: Client-facing hostname
    description: Required DNS hostname or IP for TLS enrollment and certificate validation. No container-hostname fallback. Local mode defaults to its private bind IP. Do not include a scheme or port.
  - name: allow_anonymous
    type: select
    options: ["false"]
    default: "false"
    label: Anonymous clients (disabled)
    description: Anonymous access is incompatible with ownership isolation. Legacy installs configured true must disable it before upgrading.
  - name: legacy_scope_id
    type: text
    default: ""
    label: Legacy ownership assignment
    description: For a global install, explicitly assign unowned pre-0.4 data to this opaque scope. Project installs use their fixed scope. Migration prefixes topic names and wire usernames and disables migrated credentials until ACL review and re-enablement. Empty leaves ambiguous records quarantined. Remove after migration; ownership is never reassigned.
  - name: ha_discovery_enabled
    type: select
    options: ["true", "false"]
    default: "true"
    label: Parse Home Assistant discovery
    description: When true, messages on homeassistant/+/+/config populate the Devices tab. Disable on installs that don't speak the HA convention to skip the parsing overhead.
  - name: retain_max_count
    type: text
    default: "10000"
    label: Max retained messages per scope
    description: Oldest retained messages beyond this count are pruned within each ownership scope; one scope cannot evict another scope's state.
  - name: max_payload_bytes
    type: text
    default: "1048576"
    label: Maximum MQTT packet size
    description: Reject client packets and app-originated payloads larger than this many bytes. Default 1 MiB.
  - name: max_clients
    type: text
    default: "1000"
    label: Maximum connected clients
    description: Hard ceiling on simultaneous network MQTT clients.
  - name: max_inflight_per_client
    type: text
    default: "128"
    label: Maximum inflight messages per client
    description: Maximum concurrent QoS messages retained for a client.
  - name: max_pending_writes_per_client
    type: text
    default: "1024"
    label: Maximum pending writes per client
    description: Bounds each client's outbound queue so slow consumers cannot grow memory without limit.
  - name: max_publish_per_scope_per_second
    type: text
    default: "1000"
    label: Publish rate per ownership scope
    description: Shared ingress rate across every credential, connection, and HTTP/MCP publish in a scope. 0 disables this limiter. Rejected work receives no successful acceptance acknowledgment.
  - name: max_publish_per_scope_burst
    type: text
    default: "2000"
    label: Publish burst per ownership scope
    description: Shared burst capacity. Reconnecting does not reset the scope bucket; counters and buckets remain process-local in this release.
  - name: max_publish_per_second
    type: text
    default: "100"
    label: Publish rate per client
    description: Sustained admitted publishes per second per network client. 0 disables this client limiter. Overload closes MQTT 3.1.1 connections or sends MQTT 5 quota-exceeded DISCONNECT before any publish acknowledgment. Retry with exponential backoff and jitter.
  - name: max_publish_burst
    type: text
    default: "200"
    label: Publish burst per client
    description: Short burst capacity for the per-client publish limiter.
  - name: max_event_per_second
    type: text
    default: "1000"
    label: Platform event rate
    description: Sustained MQTT-derived platform events per second. Excess events are counted and dropped without blocking MQTT delivery. 0 disables the limiter.
  - name: max_event_burst
    type: text
    default: "2000"
    label: Platform event burst
    description: Short burst capacity for MQTT-derived platform events.
  - name: max_event_payload_bytes
    type: text
    default: "131072"
    label: Maximum event payload preview
    description: Maximum MQTT payload bytes copied into a platform event. Larger values are represented by a bounded preview and original size.
  - name: max_log_payload_bytes
    type: text
    default: "65536"
    label: Maximum logged payload preview
    description: Maximum MQTT payload bytes retained in each audit row. Larger values keep their original size and a truncated preview.
  - name: message_log_retention_hours
    type: text
    default: "168"
    label: Message and ACL log retention (hours)
    description: How long to keep rows in mqtt_message_log and mqtt_acl_log. 168 = 7 days.

upgrade_policy: auto-patch
