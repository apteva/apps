name: Tests widgets
on:
  pull_request:
    paths: ["mcp/tests/**", "scripts/build-panels.ts", ".github/workflows/tests-widgets.yml"]
  push:
    branches: [main]
    paths: ["mcp/tests/**", "scripts/build-panels.ts", ".github/workflows/tests-widgets.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: mcp/tests/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bunx --no-install tsc -p mcp/tests/tsconfig.widgets.json
      - run: bun test mcp/tests/ui/dashboard.test.ts
      - run: bun run scripts/build-panels.ts --app tests
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Enable Chromium's namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bunx --no-install playwright test --config mcp/tests/playwright.config.ts
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tests-widget-browser-results
          path: /tmp/tests-widget-browser-results
