name: Auth checks
on:
  pull_request:
    paths: ['mcp/auth/**', 'scripts/build-panels.ts', '.github/workflows/auth.yml']
  push:
    paths: ['mcp/auth/**', 'scripts/build-panels.ts', '.github/workflows/auth.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/auth/go.mod
          cache-dependency-path: mcp/auth/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: go test -race -tags integration ./...
        working-directory: mcp/auth
      - run: go vet ./...
        working-directory: mcp/auth
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: mcp/auth
      - run: bun install --frozen-lockfile
        working-directory: mcp/auth/ui
      - run: bun run typecheck && bun test
        working-directory: mcp/auth/ui
      - run: bun run scripts/build-panels.ts --app auth
      - run: git diff --exit-code -- mcp/auth/ui/AuthPanel.mjs mcp/auth/ui/AuthPanel.mjs.map
