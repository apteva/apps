name: Auth checks
on:
  pull_request:
    paths: ['mcp/auth/**', 'scripts/build-panels.ts', 'scripts/verify-panels.ts', 'scripts/panel-react-surface.json', '.github/workflows/auth.yml']
  push:
    paths: ['mcp/auth/**', 'scripts/build-panels.ts', 'scripts/verify-panels.ts', 'scripts/panel-react-surface.json', '.github/workflows/auth.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/auth/go.mod
          cache-dependency-path: mcp/auth/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: go test -race -tags integration ./...
        working-directory: mcp/auth
      - run: go vet ./...
        working-directory: mcp/auth
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: mcp/auth
      - run: bun install --frozen-lockfile
        working-directory: mcp/auth/ui
      - run: bun run typecheck && bun test
        working-directory: mcp/auth/ui
      - run: bun run scripts/build-panels.ts --app auth
      - name: Verify committed frontend artifacts
        # Bun debug IDs can vary between identical builds.
        run: |
          python3 - <<'PYTHON'
          import json, re, subprocess
          from pathlib import Path
          path = "mcp/auth/ui/AuthPanel.mjs"
          committed = lambda p: subprocess.check_output(["git", "show", "HEAD:" + p], text=True)
          normalize = lambda s: re.sub(r"^//# debugId=.*$", "", s, flags=re.M).strip()
          assert normalize(committed(path)) == normalize(Path(path).read_text()), "Generated code differs"
          original = json.loads(committed(path + ".map"))
          rebuilt = json.loads(Path(path + ".map").read_text())
          original.pop("debugId", None)
          rebuilt.pop("debugId", None)
          assert original == rebuilt, "Generated source map differs"
          print("Auth bundle and source map match committed artifacts (excluding debug IDs).")
          PYTHON
