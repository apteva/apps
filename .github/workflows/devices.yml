name: Devices checks
on:
  push:
    branches: [main]
    tags: ['devices/v*']
    paths: ['mcp/devices/**', 'mcp/mqtt/**', '.github/workflows/devices.yml']
  pull_request:
    paths: ['mcp/devices/**', 'mcp/mqtt/**', '.github/workflows/devices.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: mcp/devices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/devices/go.mod
          cache-dependency-path: |
            mcp/devices/go.sum
            mcp/mqtt/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/devices .
      - run: python3 -m unittest discover -s examples/python -p 'test_*.py'
      - name: Build and typecheck panel
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun test mcp/devices/ui/DevicesPanel.test.tsx
          bunx tsc --noEmit --jsx react-jsx --lib ES2022,DOM --moduleResolution bundler --module ESNext --target ES2022 --skipLibCheck mcp/devices/ui/DevicesPanel.tsx
          bun run scripts/build-panels.ts --app devices
          git diff --exit-code -- mcp/devices/ui/DevicesPanel.mjs mcp/devices/ui/DevicesPanel.mjs.map
