name: Telephony Linux listener probe
on:
  pull_request:
    paths: ['mcp/telephony/headless_browser_integration_test.go', 'mcp/telephony/frontend/src/listener-audio.ts', 'mcp/telephony/frontend/tests/softphone.browser.ts', 'mcp/telephony/ui/listener-worklet.js', '.github/workflows/telephony-listener-probe.yml']
permissions:
  contents: read
jobs:
  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/telephony/go.mod
          cache-dependency-path: mcp/telephony/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
        working-directory: mcp/telephony
      - run: bunx --no-install playwright install --with-deps chromium
        working-directory: mcp/telephony
      - run: bun run scripts/build-panels.ts --app telephony
      - run: go test -tags integration -run '^TestTier2HeadlessBrowser/headless$' -count=1 -timeout 4m -v . > /tmp/listener-probe.log 2>&1
        working-directory: mcp/telephony
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telephony-linux-listener-probe
          path: /tmp/listener-probe.log
